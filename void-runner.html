// ===== SYSTEMS =====

// Impact feedback. Kept separate from game state so nothing here can change
// the outcome of a run — it only changes how the run feels.
const FX = {
  hitStopFrames: 0,
  shake: 0, shakeX: 0, shakeY: 0,
  slowMoFrames: 0, slowMoFactor: 1, slowAcc: 0,
  rings: [], glows: [],
  MAX_RINGS: 24, MAX_GLOWS: 24,

  reset() {
    FX.hitStopFrames = 0; FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0;
    FX.slowMoFrames = 0; FX.slowMoFactor = 1; FX.slowAcc = 0;
    FX.rings = []; FX.glows = [];
  },

  // Freezing the simulation for a few frames while the explosion stays on
  // screen is the cheapest way to make a kill feel like it landed.
  hitStop(f) { FX.hitStopFrames = Math.max(FX.hitStopFrames, f); },
  addShake(a) { FX.shake = Math.max(FX.shake, a); },
  slowMo(frames, factor) { FX.slowMoFrames = frames; FX.slowMoFactor = factor; FX.slowAcc = 0; },

  explode(x, y, size, color) {
    FX.rings.push({ x, y, r: size*0.25, maxR: size*2.1, life: 24, maxLife: 24, color });
    FX.glows.push({ x, y, r: size*1.5, life: 9, maxLife: 9, color });
    const chunks = Math.max(4, Math.round(size*0.5));
    for (let i = 0; i < chunks; i++) {
      const a = Math.random()*Math.PI*2;
      const sp = 1 + Math.random()*size*0.14;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 26 + Math.random()*28, maxLife: 54,
        r: 1.5 + Math.random()*size*0.10,
        color, type: 'chunk',
        rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.35
      });
    }
    spawnParticles(x, y, color, Math.max(4, Math.round(size*0.45)));
    if (FX.rings.length > FX.MAX_RINGS) FX.rings.splice(0, FX.rings.length - FX.MAX_RINGS);
    if (FX.glows.length > FX.MAX_GLOWS) FX.glows.splice(0, FX.glows.length - FX.MAX_GLOWS);
  },

  step() {
    FX.rings.forEach(r => { r.life--; r.r += (r.maxR - r.r) * 0.18; });
    FX.rings = FX.rings.filter(r => r.life > 0);
    FX.glows.forEach(g => { g.life--; });
    FX.glows = FX.glows.filter(g => g.life > 0);
    if (FX.shake > 0) {
      FX.shake -= 1.2;
      FX.shakeX = (Math.random()-0.5)*FX.shake;
      FX.shakeY = (Math.random()-0.5)*FX.shake;
    } else { FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0; }
  }
};

// Keep array lengths bounded so a chaotic screen can't sink the frame rate.
function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
  return arr;
}
function capAll() {
  capArray(particles, CFG.caps.particles);
  capArray(bullets, CFG.caps.bullets);
  capArray(enemyBullets, CFG.caps.enemyBullets);
  capArray(enemies, CFG.caps.enemies);
}

// ---- UI HIT TESTING ----
// Screen-space rects, tested against pointer positions converted to canvas coords.
const MUTE_RECT_START = { x: W - 48, y: 14, w: 34, h: 34 };
const MUTE_RECT_PLAY  = { x: W - 40, y: H - 42, w: 30, h: 30 };
const CHEV_L   = { x: 62,      y: 148, w: 46, h: 48 };
const CHEV_R   = { x: W - 108, y: 148, w: 46, h: 48 };
const BUY_RECT = { x: W/2 - 78, y: 322, w: 156, h: 30 };
function muteRect() { return state === 'play' ? MUTE_RECT_PLAY : MUTE_RECT_START; }
function pointInRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function canvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) * (W / rect.width), y: (clientY - rect.top) * (H / rect.height) };
}
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  Music.setMuted(Sound.muted);
  Save.data.muted = Sound.muted;
  Save.write();
}

function cycleShip(dir) {
  selIndex = (selIndex + dir + CFG.ships.length) % CFG.ships.length;
  const def = CFG.ships[selIndex];
  // Selecting an owned ship makes it the one you fly.
  if (shipOwned(def.id)) { Save.data.selectedShip = def.id; Save.write(); }
  Sound.play('uiMove');
}

function tryBuyShip() {
  const def = CFG.ships[selIndex];
  if (shipOwned(def.id) || Save.data.credits < def.cost) return false;
  Save.data.credits -= def.cost;
  Save.data.unlocked.push(def.id);
  Save.data.selectedShip = def.id;
  Save.write();
  Sound.play('uiBuy');
  return true;
}

// Launch is only legal on a ship you own.
function tryLaunch() {
  if (!shipOwned(CFG.ships[selIndex].id)) return false;
  startGame();
  return true;
}

// ---- INPUT ----
const keys = {};
document.addEventListener('keydown', e => {
  Sound.unlock();
  keys[e.key] = true;
  if (state === 'start') {
    if (e.key === 'ArrowLeft')  cycleShip(-1);
    if (e.key === 'ArrowRight') cycleShip(1);
    if (e.key === 'b' || e.key === 'B') tryBuyShip();
    if (e.key === ' ' || e.key === 'Enter') tryLaunch();
  } else if (state === 'dead') {
    if (e.key === ' ' || e.key === 'Enter') state = 'start';
  } else if (state === 'shop') {
    const n = shopSlots.length;
    if (n > 0) {
      if (e.key === 'ArrowLeft')  { shopSel = (shopSel - 1 + n) % n; Sound.play('uiMove'); }
      if (e.key === 'ArrowRight') { shopSel = (shopSel + 1) % n; Sound.play('uiMove'); }
    }
    if (e.key === ' ' || e.key === 'Enter') tryBuySlot(shopSel);
    if (e.key === 'r' || e.key === 'R') tryReroll();
    if (e.key === 'd' || e.key === 'D' || e.key === 'Escape') closeShop();
    // SKIP and DEPART do the same thing; both exist because at depth you are
    // often saving for a tier this shop cannot show you, and clicking past
    // three cards you do not want is friction rather than a decision.
    if (e.key === 's' || e.key === 'S') { Sound.play('uiMove'); closeShop(); }
  }
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// A tap on a control acts on that control; a tap anywhere else launches.
function handlePointer(p) {
  if (pointInRect(p, muteRect())) { toggleMute(); return true; }
  if (state === 'shop') {
    const rects = slotRects(shopSlots.length);
    for (let i = 0; i < shopSlots.length; i++) {
      if (pointInRect(p, rects[i])) { shopSel = i; tryBuySlot(i); return true; }
    }
    if (pointInRect(p, REROLL_RECT)) { tryReroll(); return true; }
    if (pointInRect(p, DEPART_RECT)) { closeShop(); return true; }
    if (pointInRect(p, SKIP_RECT))   { Sound.play('uiMove'); closeShop(); return true; }
    return true;
  }
  // The voidbirth sequence owns the screen; a stray tap must not skip it.
  if (state === 'voidbirth') return true;
  if (state === 'start') {
    if (pointInRect(p, CHEV_L)) { cycleShip(-1); return true; }
    if (pointInRect(p, CHEV_R)) { cycleShip(1); return true; }
    if (!shipOwned(CFG.ships[selIndex].id) && pointInRect(p, BUY_RECT)) { tryBuyShip(); return true; }
    tryLaunch();
    return true;
  }
  if (state === 'dead') { state = 'start'; return true; }
  return false;
}

canvas.addEventListener('touchstart', e => {
  Sound.unlock();
  const t = e.touches[0];
  if (handlePointer(canvasPos(t.clientX, t.clientY))) return;
  touchX = t.clientX;
}, {passive:true});
canvas.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', () => { touchX = null; });

// Mouse equivalent so every control is clickable on desktop too.
canvas.addEventListener('mousedown', e => {
  Sound.unlock();
  handlePointer(canvasPos(e.clientX, e.clientY));
});

function currentShip() {
  return CFG.ships.find(s => s.id === Save.data.selectedShip) || CFG.ships[0];
}

function shipOwned(id) { return Save.data.unlocked.includes(id); }

// Ships differ only in these handling stats — no ship changes any other system.
function applyShip(def) {
  player.speed = def.speed;
  player.w = def.hitW;
  player.h = def.hitH;
  player.canPhase = def.phase;
  player.phaseReady = def.phase;
  lives = def.lives;
  // Bulwark's starting shield charge is added in startGame, after
  // player.shieldCharges is set from stats — applyShip runs first and would
  // otherwise have its bonus wiped out by that assignment.
}

function startGame() {
  const ship = currentShip();
  state = 'play';
  score = 0; level = 1; frame = 0; runKills = 0;
  player.x = W/2; player.y = H - 120; player.invincible = 0; player.shieldCharges = 0; player.shieldRegenTimer = 0; player.trail = [];
  player.phaseCharge = 0; player.phaseDriveTimer = 0;
  applyShip(ship);
  bullets = []; enemyBullets = []; asteroids = []; enemies = []; particles = []; flashText = [];
  drones = []; singularity = null;
  spawnTimer = 0; asteroidTimer = 0; levelTimer = 0; spawnCycle = 0; combo = 0; comboTimer = 0; levelBanner = null;
  player.muzzle = 0;
  shootTimer = 0;
  dyingTimer = 0;
  boss = null; bossActive = false; bossWarning = 0;
  runUpgrades = []; scrap = 0; scrapSpent = 0; scrapOnUpgrades = 0;
  // Ascension is per-run, like the upgrades it governs. A new run starts at
  // the bottom of the ladder however deep the last one got.
  voidbirths = 0;
  vbInfo = null; vbCards = []; vbTick = 0;
  runUpgradesVersion++;
  overchargeCount = 0; killsSinceLife = 0; killsSinceShield = 0;
  verdictSpent = false; revivedThisRun = false; scrapDrip = 0;
  recomputeStats();
  lives += stats.extraLives;
  player.shieldCharges = stats.shieldCharges;
  // Bulwark starts each run with one shield charge already up. Added here,
  // after the stats-based assignment above, so it isn't wiped out by it.
  if (ship.id === 'bulwark') player.shieldCharges += 1;
  FX.reset();
  Music.setBoss(false);
  Music.setIntensity(1);
  Music.start();
}

const LEVEL_CLEAR_SCRAP = 500;

function levelUp() {
  // Spec: kills pay scrap, and clearing a level pays a flat bonus on top.
  // Awarded here because levelUp is the single point every level completion
  // passes through, boss levels included (the boss dying clears bossActive,
  // which lets levelTimer run out and call this).
  // Flat, deliberately: SCRAP MAGNET and SALVAGE RIG are both worded "+% scrap
  // from kills", and a level clear is not a kill.
  // Clearing a level pays a flat bonus that grows with depth, plus whatever
  // SCRAP HOPPER contributes. Flat rather than multiplied, deliberately:
  // SCRAP MAGNET and SALVAGE RIG are both worded "+% scrap from kills", and a
  // level clear is not a kill.
  const clearPay = LEVEL_CLEAR_SCRAP + Math.round(LEVEL_CLEAR_SCRAP * Math.pow(level, 0.55) - LEVEL_CLEAR_SCRAP)
                 + (stats ? stats.scrapPerLevel : 0);
  scrap += clearPay;
  const cleared = level;
  levelTimer = 0; level++;
  Music.setIntensity(level);
  if (player.canPhase) player.phaseReady = true;   // Phantom recharges each level

  // Ascension takes priority over shopping: clearing a voidbirth level ends
  // the segment, and there is nothing to spend scrap on when it is about to
  // be burned anyway.
  const vb = RLCore.voidbirthAfterClearing(cleared, voidbirths);
  if (vb) { beginVoidbirth(vb); return; }

  // The boss spawn and level banner fire from closeShop, once play resumes,
  // so they are never drawn behind the shop panel.
  if (RLCore.shopOpensAfter(cleared, voidbirths)) openShop();
  else closeShop();
}

// ===== VOIDBIRTH =====
// The run does not continue past a voidbirth level — it ascends. You keep your
// score, credits and ships; you lose every upgrade and all unspent scrap; and
// the entire rarity ladder shifts up one rung, permanently, for the rest of
// the run.

let vbTick = 0, vbInfo = null, vbCards = [];
const VB_CARD_FRAMES = 12;
const VB_BURN_START = 50;
const VB_FLASH_HOLD = 26;

function vbBurnEnd() { return VB_BURN_START + vbCards.length * VB_CARD_FRAMES; }
function vbTotal() { return vbBurnEnd() + VB_FLASH_HOLD + 170; }

function beginVoidbirth(info) {
  vbInfo = info;
  vbTick = 0;
  // Snapshot the build at its CURRENT depth so the sequence burns the cards
  // the player actually earned, not their promoted successors.
  vbCards = runUpgrades.map(o => {
    const u = RLCore.byId(o.id);
    if (!u) return null;
    const r = RLCore.resolve(u, voidbirths);
    return { name: r.name, color: RLCore.tierOf(r.tier).color, stacks: o.stacks, burned: false };
  }).filter(Boolean);
  enemies = []; enemyBullets = []; bullets = []; boss = null; bossActive = false;
  levelBanner = null;
  state = 'voidbirth';
  Music.setBoss(false);
  Sound.play('voidbirth');
}

// Committed exactly once, on the flash frame. Split out from the animation so
// a dropped frame or a backgrounded tab can never apply it twice or skip it.
function commitVoidbirth() {
  voidbirths = RLCore.clampVoidbirth(vbInfo.to);
  runUpgrades = [];
  runUpgradesVersion++;
  scrap = 0;
  Save.data.voidbirths = voidbirths;
  Save.data.bestVoidbirth = Math.max(Save.data.bestVoidbirth || 0, voidbirths);
  // Only unlock a ship that actually exists in the roster. Handing out an id
  // with no CFG.ships entry would strand the player on an unrenderable hull.
  if (voidbirths >= 3 && CFG.ships.some(s => s.id === 'ascendant') &&
      Save.data.unlocked.indexOf('ascendant') === -1) {
    Save.data.unlocked.push('ascendant');
  }
  Save.write();
  recomputeStats();
  // A fresh hull for the new segment: shields are gone with the upgrades that
  // granted them, so leaving stale charges behind would be a free ride.
  player.shieldCharges = 0;
  player.invincible = 90;
  FX.addShake(26);
}

function updateVoidbirth() {
  vbTick++;
  const idx = Math.floor((vbTick - VB_BURN_START) / VB_CARD_FRAMES);
  if (idx >= 0 && idx < vbCards.length && !vbCards[idx].burned) {
    vbCards[idx].burned = true;
    spawnParticles(W/2, 250 + (idx % 6) * 22, vbCards[idx].color, 12);
    Sound.play('strip');
  }
  if (vbTick === vbBurnEnd() + 1) commitVoidbirth();
  if (vbTick >= vbTotal()) {
    vbInfo = null; vbCards = [];
    state = 'play';
    levelBanner = { text: 'LEVEL ' + level, life: 120 };
    Music.setIntensity(level);
    Sound.play('levelUp');
  }
}

function drawVoidbirth() {
  drawBg();
  const burnEnd = vbBurnEnd();
  const flashT = vbTick - burnEnd;

  // 1. the build comes apart, card by card
  if (vbTick <= burnEnd + 4) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('THE VOID TAKES WHAT YOU BUILT', W/2, 200);
    vbCards.forEach((c, i) => {
      if (c.burned) return;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = c.color;
      ctx.font = 'bold 12px monospace';
      ctx.fillText(c.name + (c.stacks > 1 ? ' ×' + c.stacks : ''), W/2, 250 + (i % 6) * 22 + Math.floor(i / 6) * 0);
      ctx.globalAlpha = 1;
    });
  }

  // 2. the flash and the title
  if (flashT >= 0 && flashT < VB_FLASH_HOLD) {
    ctx.fillStyle = `rgba(255,255,255,${1 - flashT / VB_FLASH_HOLD})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (flashT >= 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px monospace';
    ctx.fillText('VOIDBIRTH', W/2, H/2 - 40);
    ctx.fillStyle = '#00ffee';
    ctx.font = 'bold 56px monospace';
    ctx.fillText(vbInfo ? vbInfo.numeral : '', W/2, H/2 + 20);

    // 3. the ladder redraws with its new floor and its new summit
    const floor = RLCore.TIERS[RLCore.floorTierIndex(voidbirths)];
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('THE LADDER RISES', W/2, H/2 + 70);
    ctx.fillStyle = floor.color;
    ctx.fillText('FLOOR  ' + floor.name, W/2, H/2 + 94);
    const unlocked = RLCore.tierUnlockedAt(voidbirths);
    if (unlocked) {
      const t = RLCore.tierOf(unlocked);
      const pulse = 0.6 + 0.4 * Math.sin(vbTick * 0.15);
      ctx.fillStyle = pulse > 0.8 ? t.color2 : t.color;
      ctx.font = 'bold 15px monospace';
      ctx.fillText('UNLOCKED  ' + t.name, W/2, H/2 + 120);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('EVERY UPGRADE YOU FIND FROM NOW ON IS ONE TIER STRONGER', W/2, H/2 + 150);
  }
}

function endRun() {
  // 'dying' holds the camera on the wreck for a slow-motion beat before the
  // game-over screen takes over.
  state = 'dying';
  dyingTimer = 75;
  hiScore = Math.max(hiScore, score);
  Save.data.hiScore = hiScore;
  Save.data.bestLevel = Math.max(Save.data.bestLevel, level);
  Save.data.totalRuns += 1;
  Save.data.totalKills += runKills;
  runCredits = RLCore.creditsForScore(score);
  Save.data.bestScrapSpent = Math.max(Save.data.bestScrapSpent, scrapSpent);
  creditsShown = 0;
  Save.data.credits += runCredits;
  Save.write();
  FX.explode(player.x, player.y, 46, '#ff8800');
  FX.explode(player.x - 12, player.y + 8, 26, '#ffdd44');
  FX.addShake(26);
  FX.hitStop(6);
  FX.slowMo(75, 0.3);
  boss = null; bossActive = false; bossWarning = 0;
  Music.stop();
  Music.setBoss(false);
  Sound.play('bigExplode');
  Sound.play('death');
}

// ===== ENTITIES =====

function drawShip(x, y, invincible, shield, t, muzzle, shipDef) {
  const def = shipDef || currentShip();
  const [c0, c1, c2] = def.hull;
  const trim = def.trim;
  ctx.save();
  ctx.translate(x, y);
  if (invincible && Math.floor(t/4)%2 === 0) { ctx.restore(); return; }

  // Engine flames
  const flameLen = 16, flameW = 7;
  ctx.save();
  let gL = ctx.createLinearGradient(0,0,0,flameLen);
  gL.addColorStop(0,'rgba(0,200,255,0.9)'); gL.addColorStop(0.4,'rgba(255,140,0,0.7)'); gL.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.ellipse(-9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  let gR = ctx.createLinearGradient(0,0,0,flameLen);
  gR.addColorStop(0,'rgba(0,200,255,0.9)'); gR.addColorStop(0.4,'rgba(255,140,0,0.7)'); gR.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gR;
  ctx.beginPath(); ctx.ellipse(9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Hull
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(10, 10); ctx.lineTo(10, 18);
  ctx.lineTo(-10, 18); ctx.lineTo(-10, 10); ctx.lineTo(-14, 14); ctx.closePath();
  let hullG = ctx.createLinearGradient(-14, -18, 14, 18);
  hullG.addColorStop(0, c0); hullG.addColorStop(0.5, c1); hullG.addColorStop(1, c2);
  ctx.fillStyle = hullG;
  ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  // Cockpit
  ctx.beginPath(); ctx.ellipse(0, -4, 6, 8, 0, 0, Math.PI*2);
  let cg = ctx.createRadialGradient(0,-6,1,0,-4,8);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.4, c0); cg.addColorStop(1, c2);
  ctx.fillStyle = cg; ctx.fill();

  // Wings
  ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(-22, 18); ctx.lineTo(-10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = trim; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 6); ctx.lineTo(22, 18); ctx.lineTo(10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();

  // Cannons
  ctx.fillStyle = c0;
  ctx.fillRect(-13, -4, 4, 14); ctx.fillRect(9, -4, 4, 14);

  // Phase charge indicator
  if (def.phase && player.phaseReady && !shipDef) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(t*0.12);
    ctx.strokeStyle = '#cc88ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Muzzle flash
  if (muzzle > 0) {
    const a = muzzle / 3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    [-11, 11].forEach(mx => {
      const mg = ctx.createRadialGradient(mx, -6, 0, mx, -6, 9);
      mg.addColorStop(0, `rgba(255,255,255,${0.9*a})`);
      mg.addColorStop(0.4, `rgba(120,230,255,${0.6*a})`);
      mg.addColorStop(1, 'rgba(0,150,255,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, -6, 9, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // Shield charges — `shield` is now a charge count, not a frame timer.
  // One ring per charge, capped at 3 so it can't visually run away.
  if (shield > 0) {
    let alpha = 0.3 + 0.2*Math.sin(t*0.2);
    const rings = Math.min(shield, 3);
    for (let i = 0; i < rings; i++) {
      ctx.beginPath(); ctx.arc(0, 0, 26 + i*5, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,255,255,${alpha})`; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.fillStyle = `rgba(0,200,255,${alpha*0.15})`;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    let v = a.verts[i];
    i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  let ag = ctx.createRadialGradient(0,0,2,0,0,a.r);
  ag.addColorStop(0,'#aaa'); ag.addColorStop(1,'#444');
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5; ctx.stroke();
  if (a.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.28*a.flash})`; ctx.fill(); }
  ctx.restore();
}

// A lit engine bell, used by every hull that has one. Drawn behind the body
// (enemies fly downward, so their engines face up).
function drawEngine(x, y, w, h, hot) {
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(x - w/2, y - h, w, h);
  const g = ctx.createLinearGradient(0, y - h, 0, y - h - 14);
  g.addColorStop(0, hot); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w/2, y - h); ctx.lineTo(x, y - h - 12 - Math.random()*4); ctx.lineTo(x + w/2, y - h);
  ctx.closePath(); ctx.fill();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  // Enemies grow as you descend, so a level-2000 grunt reads as a real ship
  // rather than the same sprite with a bigger number behind it.
  if (e.scale && e.scale !== 1) ctx.scale(e.scale, e.scale);
  const flashFill = () => { if (e.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.30*e.flash})`; ctx.fill(); } };

  switch (e.kind) {
    case 'elite': {
      // Broad gunship: armoured canopy, side weapon pods, four engines.
      drawEngine(-9, -12, 7, 5, 'rgba(255,170,40,0.85)');
      drawEngine( 9, -12, 7, 5, 'rgba(255,170,40,0.85)');
      ctx.fillStyle = '#5a2a10';
      ctx.fillRect(-22, -6, 8, 18);          // port pod
      ctx.fillRect( 14, -6, 8, 18);          // starboard pod
      ctx.strokeStyle = '#ff7722'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-22, -6, 8, 18); ctx.strokeRect(14, -6, 8, 18);
      ctx.fillStyle = '#ffcc44';
      ctx.fillRect(-20, 11, 4, 5); ctx.fillRect(16, 11, 4, 5);   // pod muzzles

      ctx.beginPath();
      ctx.moveTo(0, 20); ctx.lineTo(13, 8); ctx.lineTo(16, -8);
      ctx.lineTo(8, -14); ctx.lineTo(-8, -14); ctx.lineTo(-16, -8);
      ctx.lineTo(-13, 8); ctx.closePath();
      const eg = ctx.createLinearGradient(0, -14, 0, 20);
      eg.addColorStop(0, '#ffcc55'); eg.addColorStop(0.5, '#dd6600'); eg.addColorStop(1, '#771100');
      ctx.fillStyle = eg; ctx.fill();
      ctx.strokeStyle = '#ff5500'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();

      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-11, 2); ctx.lineTo(11, 2); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(0, 6, 5, 4, 0, 0, Math.PI*2);
      ctx.fillStyle = '#ffee99'; ctx.fill();
      ctx.strokeStyle = '#442200'; ctx.lineWidth = 1.2; ctx.stroke();
      break;
    }

    case 'lancer': {
      // Long, thin, one big barrel. Everything about it points down.
      drawEngine(0, -18, 8, 6, 'rgba(120,220,255,0.9)');
      ctx.beginPath();
      ctx.moveTo(0, 24); ctx.lineTo(5, 4); ctx.lineTo(7, -16);
      ctx.lineTo(-7, -16); ctx.lineTo(-5, 4); ctx.closePath();
      const lg = ctx.createLinearGradient(0, -16, 0, 24);
      lg.addColorStop(0, '#bfefff'); lg.addColorStop(1, '#0d4a66');
      ctx.fillStyle = lg; ctx.fill();
      ctx.strokeStyle = '#66ddff'; ctx.lineWidth = 1.6; ctx.stroke();
      flashFill();
      // swept fins
      ctx.fillStyle = '#0d4a66';
      ctx.beginPath(); ctx.moveTo(-7,-14); ctx.lineTo(-17,-4); ctx.lineTo(-6,-2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo( 7,-14); ctx.lineTo( 17,-4); ctx.lineTo( 6,-2); ctx.closePath(); ctx.fill();
      // the barrel, glowing when it has a shot ready
      const ready = e.shootTimer >= 60;
      ctx.fillStyle = ready ? '#ffffff' : '#2a6a88';
      ctx.fillRect(-2.5, 18, 5, 10);
      if (ready) {
        ctx.fillStyle = 'rgba(120,220,255,0.45)';
        ctx.beginPath(); ctx.arc(0, 28, 5 + Math.sin(frame*0.4)*1.5, 0, Math.PI*2); ctx.fill();
      }
      break;
    }

    case 'weaver': {
      // Twin-boom frame that visibly banks into its strafe.
      ctx.save();
      ctx.rotate(Math.max(-0.5, Math.min(0.5, (e.bank || 0) * 0.35)));
      drawEngine(-11, -10, 6, 5, 'rgba(210,120,255,0.9)');
      drawEngine( 11, -10, 6, 5, 'rgba(210,120,255,0.9)');
      ctx.fillStyle = '#3a1155';
      ctx.fillRect(-14, -10, 5, 22);
      ctx.fillRect(  9, -10, 5, 22);
      ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 1.4;
      ctx.strokeRect(-14, -10, 5, 22); ctx.strokeRect(9, -10, 5, 22);
      ctx.beginPath();
      ctx.moveTo(0, 16); ctx.lineTo(8, 2); ctx.lineTo(8, -8); ctx.lineTo(-8, -8); ctx.lineTo(-8, 2); ctx.closePath();
      const wg = ctx.createLinearGradient(0, -8, 0, 16);
      wg.addColorStop(0, '#e9c4ff'); wg.addColorStop(1, '#5a1188');
      ctx.fillStyle = wg; ctx.fill();
      ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 1.6; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0, 2, 3.5, 0, Math.PI*2);
      ctx.fillStyle = '#ffddff'; ctx.fill();
      ctx.restore();
      break;
    }

    case 'bulwark': {
      // Heavy wedge with a physical shield plate across its underside.
      drawEngine(-12, -16, 8, 6, 'rgba(120,255,170,0.85)');
      drawEngine( 12, -16, 8, 6, 'rgba(120,255,170,0.85)');
      ctx.beginPath();
      ctx.moveTo(0, 10); ctx.lineTo(26, 0); ctx.lineTo(22, -14);
      ctx.lineTo(-22, -14); ctx.lineTo(-26, 0); ctx.closePath();
      const bwg = ctx.createLinearGradient(0, -14, 0, 10);
      bwg.addColorStop(0, '#d8ffe6'); bwg.addColorStop(1, '#14603a');
      ctx.fillStyle = bwg; ctx.fill();
      ctx.strokeStyle = '#88ffaa'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i*9, -13); ctx.lineTo(i*9, 6); ctx.stroke(); }

      if (e.plate > 0) {
        const frac = e.plate / e.plateMax;
        ctx.strokeStyle = `rgba(140,255,190,${0.4 + 0.5*frac})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 6, 25, 0.18*Math.PI, 0.82*Math.PI); ctx.stroke();
        // the plate cracks as it takes damage, so its state is readable
        if (frac < 0.66) {
          ctx.strokeStyle = 'rgba(10,40,25,0.9)'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(-8, 28); ctx.lineTo(-2, 22); ctx.stroke();
        }
        if (frac < 0.33) {
          ctx.beginPath(); ctx.moveTo(10, 27); ctx.lineTo(4, 21); ctx.stroke();
        }
      }
      break;
    }

    case 'swarmling': {
      const p = 0.75 + 0.25*Math.sin(frame*0.3 + (e.jitter || 0));
      ctx.beginPath();
      ctx.moveTo(0, 8); ctx.lineTo(5, -2); ctx.lineTo(0, -6); ctx.lineTo(-5, -2); ctx.closePath();
      ctx.fillStyle = '#ffee66'; ctx.fill();
      ctx.strokeStyle = '#ffaa22'; ctx.lineWidth = 1; ctx.stroke();
      flashFill();
      ctx.globalAlpha = 0.35 * p;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2);
      ctx.fillStyle = '#ffee66'; ctx.fill();
      ctx.globalAlpha = 1;
      break;
    }

    case 'harbinger': {
      // A small mothership: layered plating, a lit hangar mouth, four engines.
      [-24, -8, 8, 24].forEach(x => drawEngine(x, -22, 8, 6, 'rgba(255,80,140,0.85)'));
      ctx.beginPath();
      ctx.moveTo(-38, -18); ctx.lineTo(38, -18); ctx.lineTo(30, 6);
      ctx.lineTo(14, 18); ctx.lineTo(-14, 18); ctx.lineTo(-30, 6); ctx.closePath();
      const hb = ctx.createLinearGradient(0, -18, 0, 18);
      hb.addColorStop(0, '#ffc0d8'); hb.addColorStop(0.55, '#c01a55'); hb.addColorStop(1, '#4a0020');
      ctx.fillStyle = hb; ctx.fill();
      ctx.strokeStyle = '#ff4488'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
      [-10, 0, 10].forEach(y => { ctx.beginPath(); ctx.moveTo(-34, y); ctx.lineTo(34, y); ctx.stroke(); });
      // hangar mouth — brightens just before it releases a brood
      const soon = e.broodTimer < 30;
      ctx.fillStyle = soon ? 'rgba(255,240,120,0.9)' : 'rgba(255,120,170,0.45)';
      ctx.fillRect(-13, 12, 26, 6);
      break;
    }

    case 'kamikaze': {
      // Narrow dart with a burning trail — reads as "this one is coming for you".
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const tg = ctx.createLinearGradient(0,-22,0,-4);
      tg.addColorStop(0,'rgba(255,60,80,0)'); tg.addColorStop(1,'rgba(255,120,60,0.75)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.ellipse(0,-13,4,10,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(0,16); ctx.lineTo(9,-6); ctx.lineTo(3,-2); ctx.lineTo(0,-12);
      ctx.lineTo(-3,-2); ctx.lineTo(-9,-6); ctx.closePath();
      const kg = ctx.createLinearGradient(0,-12,0,16);
      kg.addColorStop(0,'#ff88aa'); kg.addColorStop(1,'#aa0022');
      ctx.fillStyle = kg; ctx.fill();
      ctx.strokeStyle = '#ff2255'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    case 'turret': {
      // Barrel first so the platform sits on top of it.
      ctx.save();
      ctx.rotate(e.aim - Math.PI/2);
      ctx.fillStyle = '#667788';
      ctx.fillRect(-4, 0, 8, 22);
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 1; ctx.strokeRect(-4, 0, 8, 22);
      ctx.restore();
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2 + Math.PI/6;
        const px = Math.cos(a)*18, py = Math.sin(a)*15;
        i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      const hg = ctx.createLinearGradient(0,-15,0,15);
      hg.addColorStop(0,'#c3d8ee'); hg.addColorStop(1,'#3a4a5c');
      ctx.fillStyle = hg; ctx.fill();
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fillStyle = e.phase === 'hold' ? '#ff5533' : '#335577'; ctx.fill();
      ctx.strokeStyle = '#001122'; ctx.lineWidth = 1; ctx.stroke();
      // Health pips so its 8 HP doesn't feel arbitrary.
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(-14, -22, 28*Math.max(0, e.hp/e.maxHp), 2.5);
      break;
    }

    case 'mine': {
      const arming = e.arming > 0;
      const pulse = arming ? 1 + 0.5*Math.sin((30-e.arming)*0.9) : 1;
      if (arming) {
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.35*Math.sin((30-e.arming)*0.9);
        ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 60*(1 - e.arming/30), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      ctx.strokeStyle = arming ? '#ff5533' : '#8a7a33'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 + frame*0.01;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*8, Math.sin(a)*8);
        ctx.lineTo(Math.cos(a)*15*pulse, Math.sin(a)*15*pulse);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2);
      const mg = ctx.createRadialGradient(-3,-3,1,0,0,10);
      mg.addColorStop(0, arming ? '#ffdd88' : '#8a8a6a');
      mg.addColorStop(1, arming ? '#992200' : '#33332a');
      ctx.fillStyle = mg; ctx.fill();
      ctx.strokeStyle = arming ? '#ff7744' : '#ffcc00'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    default: { // grunt — stubby four-fin interceptor, twin engines
      drawEngine(-6, -10, 6, 4, 'rgba(255,140,40,0.85)');
      drawEngine( 6, -10, 6, 4, 'rgba(255,140,40,0.85)');
      ctx.fillStyle = '#7a1d00';
      ctx.beginPath(); ctx.moveTo(-9,-8); ctx.lineTo(-18,2); ctx.lineTo(-8,4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo( 9,-8); ctx.lineTo( 18,2); ctx.lineTo( 8,4); ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 18); ctx.lineTo(9, 6); ctx.lineTo(10, -8);
      ctx.lineTo(4, -12); ctx.lineTo(-4, -12); ctx.lineTo(-10, -8);
      ctx.lineTo(-9, 6); ctx.closePath();
      const bg = ctx.createLinearGradient(0, -12, 0, 18);
      bg.addColorStop(0, '#ffb066'); bg.addColorStop(0.5, '#ee5500'); bg.addColorStop(1, '#8a0d00');
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#ff5522'; ctx.lineWidth = 1.6; ctx.stroke();
      flashFill();

      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 5, 3.5, 3, 0, 0, Math.PI*2);
      ctx.fillStyle = '#ffdd66'; ctx.fill();
      ctx.strokeStyle = '#552200'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  ctx.restore();

  // Health bar for anything tanky enough that "how close am I?" is a real
  // question. Drawn outside the scale transform so it stays legible at depth.
  drawEnemyHealth(e);
}

const BAR_KINDS = ['elite', 'turret', 'lancer', 'bulwark', 'harbinger'];

function drawEnemyHealth(e) {
  if (!e.maxHp || e.hp >= e.maxHp) return;
  if (BAR_KINDS.indexOf(e.kind) === -1) return;
  const w = e.kind === 'harbinger' ? 66 : 34;
  const y = e.y - (ENEMY[e.kind].r * (e.scale || 1)) - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(e.x - w/2, y, w, 3.5);
  ctx.fillStyle = ENEMY[e.kind].color;
  ctx.fillRect(e.x - w/2, y, w * Math.max(0, e.hp / e.maxHp), 3.5);
}

function drawBoss(b) {
  const def = bossDef(b);
  const dying = b.dying > 0;
  ctx.save();
  ctx.translate(b.x, b.y);
  // The death flicker is applied here rather than per-boss so every hull
  // dies the same readable way.
  if (dying && Math.floor(b.deathTick/3) % 2 === 0) ctx.globalAlpha = 0.55;
  ctx.save();
  def.paint(b);
  ctx.restore();
  ctx.restore();
  // A second pass in world space, for anything that has to escape the hull:
  // beams, tethers, arena grids, the pull of a devouring mothership.
  if (def.paintWorld) {
    ctx.save();
    if (dying && Math.floor(b.deathTick/3) % 2 === 0) ctx.globalAlpha = 0.55;
    def.paintWorld(b);
    ctx.restore();
  }
}

function drawBossBar(b) {
  const pad = 14, barW = W - pad*2, y = 52;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,20,0.65)';
  ctx.fillRect(pad, y, barW, 10);
  const frac = Math.max(0, b.hp / b.maxHp);
  const col = bossTint(b, '#33ccff', '#ffaa22', '#ff3322');
  ctx.fillStyle = col;
  ctx.fillRect(pad, y, barW*frac, 10);
  // A tick per phase boundary, however many phases this boss has — the
  // seven-phase Mothership and the two-phase Scrapjaw both read honestly.
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
  const n = Math.max(1, b.maxPhases || 3);
  for (let i = 1; i < n; i++) {
    const f = i / n;
    ctx.beginPath(); ctx.moveTo(pad + barW*f, y); ctx.lineTo(pad + barW*f, y+10); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, y, barW, 10);

  // The boss's own name, and under it whatever it wants you to know right now
  // (plates remaining, heads alive, bays open). Long names shrink to fit
  // rather than running off the canvas.
  ctx.fillStyle = col;
  ctx.textAlign = 'left';
  ctx.font = 'bold 10px monospace';
  const name = b.name || 'UNKNOWN CONTACT';
  if (name.length > 34) ctx.font = 'bold 8px monospace';
  ctx.fillText(name, pad, y - 4);
  ctx.textAlign = 'right';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('PHASE ' + b.phase + '/' + n, W - pad, y - 4);

  const def = bossDef(b);
  if (def.title) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(def.title(b), W/2, y + 22);
  }
  ctx.restore();
}

function drawBossWarning() {
  const t = bossWarning / 110;
  ctx.save();
  // Red pulse around the screen edge.
  ctx.globalAlpha = 0.35 + 0.35*Math.sin(frame*0.35);
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.72);
  vg.addColorStop(0, 'rgba(255,0,0,0)');
  vg.addColorStop(1, 'rgba(255,20,20,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(1, t*2.2);
  ctx.fillStyle = 'rgba(30,0,0,0.72)';
  ctx.fillRect(0, H/2 - 44, W, 88);
  ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H/2-44); ctx.lineTo(W, H/2-44);
  ctx.moveTo(0, H/2+44); ctx.lineTo(W, H/2+44); ctx.stroke();
  ctx.fillStyle = Math.floor(frame/6) % 2 ? '#ff5544' : '#ffdd88';
  ctx.font = 'bold 38px monospace'; ctx.textAlign = 'center';
  ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 24;
  ctx.fillText('WARNING', W/2, H/2 - 4);
  // Name the thing. A boss you can name is a boss you can talk about
  // afterwards, which is most of why the roster is hand-built at all.
  const info = RLCore.bossFor(level);
  const nm = info ? info.name : 'CAPITAL SHIP INBOUND';
  ctx.fillStyle = '#ffaa88'; ctx.shadowBlur = 0;
  ctx.font = 'bold ' + (nm.length > 30 ? 11 : nm.length > 18 ? 14 : 17) + 'px monospace';
  ctx.fillText(nm, W/2, H/2 + 24);
  ctx.restore();
}

function makeAsteroid(big) {
  let r = big ? 22+Math.random()*14 : 10+Math.random()*8;
  let verts = [];
  let n = 7 + Math.floor(Math.random()*4);
  for (let i = 0; i < n; i++) {
    let angle = (i/n)*Math.PI*2;
    let dist = r * (0.7 + Math.random()*0.5);
    verts.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
  }
  return {
    x: r + Math.random()*(W-2*r), y: -r-10,
    vx: (Math.random()-0.5)*1.2,
    vy: (difficulty().enemySpeed * (big ? 1.2 : 0.8)),
    r, verts, rot: 0, rotSpeed: (Math.random()-0.5)*0.04, big, hp: big ? 3 : 1, flash: 0
  };
}

// Per-kind stats. Everything that differs between enemy types lives here so
// the update and render paths only branch on behaviour, not on numbers.
// Health now comes from RLCore.enemyHp(kind, level) — the `hp` field that used
// to live here was a flat number that could not scale to level 2500.
const ENEMY = {
  grunt:     { points: 100, r: 22, color: '#ff5500', boom: 24, shake: 5,  hitStop: 0 },
  elite:     { points: 200, r: 24, color: '#ffaa00', boom: 40, shake: 12, hitStop: 3 },
  kamikaze:  { points: 120, r: 18, color: '#ff2255', boom: 28, shake: 8,  hitStop: 0 },
  turret:    { points: 300, r: 26, color: '#99bbdd', boom: 44, shake: 12, hitStop: 3 },
  mine:      { points:  80, r: 20, color: '#ffcc00', boom: 46, shake: 14, hitStop: 0 },
  lancer:    { points: 260, r: 22, color: '#66ddff', boom: 34, shake: 9,  hitStop: 2 },
  weaver:    { points: 220, r: 20, color: '#cc66ff', boom: 30, shake: 8,  hitStop: 1 },
  bulwark:   { points: 480, r: 30, color: '#88ffaa', boom: 52, shake: 16, hitStop: 4 },
  swarmling: { points:  40, r: 11, color: '#ffee66', boom: 14, shake: 2,  hitStop: 0 },
  harbinger: { points: 900, r: 40, color: '#ff4488', boom: 70, shake: 22, hitStop: 6 }
};

// Which kinds can appear, and how often, at a given level. New kinds phase in
// as you descend so the roster keeps changing rather than settling.
function enemyWeights() {
  const from = (lv, cap, div) => level >= lv ? Math.min(cap, (level - lv + 2) / (div || 1)) : 0;
  return [
    ['grunt',     Math.max(3, 12 - level)],
    ['elite',     level >= 3 ? Math.min(8, level - 1) : 0],
    ['kamikaze',  level >= 3 ? Math.min(7, level)     : 0],
    ['mine',      level >= 4 ? Math.min(5, level - 2) : 0],
    ['turret',    level >= 6 ? Math.min(5, level - 4) : 0],
    ['lancer',    from(15,  7, 2)],
    ['weaver',    from(22,  6, 3)],
    ['swarmling', from(30,  9, 2)],
    ['bulwark',   from(60,  5, 8)],
    ['harbinger', from(200, 2, 100)]
  ];
}

function pickEnemyKind() {
  const w = enemyWeights();
  const total = w.reduce((s, e) => s + e[1], 0);
  let r = Math.random() * total;
  for (const [kind, weight] of w) { r -= weight; if (r <= 0) return kind; }
  return 'grunt';
}

function makeEnemy(kind) {
  const d = difficulty();
  const e = {
    kind, x: 30 + Math.random()*(W-60), y: -30,
    vx: 0, vy: d.enemySpeed * 0.8,
    hp: RLCore.enemyHp(kind, level), maxHp: RLCore.enemyHp(kind, level),
    scale: RLCore.enemyScale(level), flash: 0, dead: false,
    shootTimer: 0, zigzag: 0, zigzagDir: 1,
    formationId: 0, sweep: false, baseX: 0
  };
  switch (kind) {
    case 'grunt':
    case 'elite':
      e.vx = (Math.random()-0.5)*2;
      e.shootTimer = Math.floor(Math.random()*80);
      break;
    case 'kamikaze':
      // Locks a target column at spawn, then commits to it.
      e.vy = d.enemySpeed * 2.6;
      e.targetX = player.x;
      break;
    case 'turret':
      e.vy = d.enemySpeed * 0.9;
      e.holdY = 120 + Math.random()*50;
      e.holdTimer = 480;
      e.phase = 'descend';
      e.aim = Math.PI/2;
      e.burstLeft = 0; e.burstTimer = 0;
      break;
    case 'mine':
      e.vy = 0.6;
      e.vx = (Math.random()-0.5)*0.4;
      e.arming = 0;
      break;
    case 'lancer':
      // Fires straight down and only straight down. It has to line itself up
      // with you, which is a telegraph you can read and get out of.
      e.vy = d.enemySpeed * 0.6;
      e.vx = 0;
      e.shootTimer = Math.floor(Math.random()*60);
      e.chargeUp = 0;
      break;
    case 'weaver':
      // Wide, fast strafing — the one that punishes standing still.
      e.vy = d.enemySpeed * 0.5;
      e.weavePhase = Math.random()*Math.PI*2;
      e.weaveAmp = 60 + Math.random()*50;
      e.baseX = e.x;
      e.bank = 0;
      e.shootTimer = Math.floor(Math.random()*70);
      break;
    case 'bulwark':
      // A shield plate covers its underside. Shoot it from the flank — which
      // is the answer to "how do I hit the thing that is off to the side".
      e.vy = d.enemySpeed * 0.34;
      e.vx = (Math.random()-0.5)*0.8;
      e.plate = RLCore.enemyHp('bulwark', level) * 0.45;
      e.plateMax = e.plate;
      break;
    case 'swarmling':
      e.vy = d.enemySpeed * 1.5;
      e.vx = (Math.random()-0.5)*3;
      e.jitter = Math.random()*Math.PI*2;
      break;
    case 'harbinger':
      // A small mothership with its own bar. Escorts itself.
      e.vy = d.enemySpeed * 0.3;
      e.vx = (Math.random()-0.5)*1.2;
      e.broodTimer = 90;
      e.shootTimer = 0;
      break;
  }
  return e;
}

// ---- BOSS ----

// ===== BOSSES =====
// One entry in BOSS per `key` in RLCore.BOSS_TABLE. Each is a self-contained
// fight: its own state, its own attacks, its own hull, and one mechanic that
// appears nowhere else. They deliberately share no attack code — only the
// chrome (entrance, health bar, phase flash, death cascade) is common, and
// that lives in updateBoss/drawBoss rather than in any boss.
//
// Contract. Every field is optional except think and paint:
//   w, h            hitbox half-extents source (defaults BOSS_W x BOSS_H)
//   init(b)         once at spawn; set up bespoke state on b
//   onPhase(b, ph)  once whenever the phase changes
//   think(b, ph)    every frame once in position; ph is 1..b.maxPhases
//   damage(b, bl, dmg) -> number   how much of a hit actually lands.
//                   Return 0 to block it. Default: all of it.
//   move(b)         every frame; default drifts toward the player
//   paint(b)        draw the hull. Already translated to the boss; +y is down.
//   paintWorld(b)   optional second pass in world space (beams, tethers)
//   title(b)        the label above the health bar
//
// Everything in the game is in scope: player, enemies, enemyBullets, W, H,
// frame, level, stats, FX, Sound, hitPlayer(), spawnParticles(), makeEnemy().

const BOSS = {};

// ---- shared firing helpers -------------------------------------------------
// These exist so a boss can say what it wants rather than restating the
// velocity maths. TIME DILATION applies through every one of them.

function bossSpeed(mul) { return difficulty().bulletSpeed * (mul === undefined ? 1 : mul) * stats.enemyBulletMul; }

function bossShot(x, y, angle, speedMul, r, elite) {
  if (enemyBullets.length >= CFG.caps.enemyBullets) return;
  const s = bossSpeed(speedMul);
  enemyBullets.push({
    x, y, vx: Math.cos(angle) * s, vy: Math.sin(angle) * s,
    r: r || 5, elite: elite !== false, dead: false
  });
}

function bossRing(x, y, n, speedMul, offset, r) {
  for (let i = 0; i < n; i++) bossShot(x, y, (offset || 0) + (i / n) * Math.PI * 2, speedMul, r);
}

function bossAimed(x, y, spreads, speedMul, r) {
  const a = Math.atan2(player.y - y, player.x - x);
  (spreads || [0]).forEach(o => bossShot(x, y, a + o, speedMul, r));
}

function bossMinion(kind, x, y) {
  if (enemies.length >= CFG.caps.enemies) return null;
  const m = makeEnemy(kind);
  m.x = x; m.y = y;
  enemies.push(m);
  return m;
}

// Hull whiteout on a hit. Called by a boss's paint() right after it fills its
// silhouette, so the flash follows the shape rather than a bounding box.
function bossFlash(b) {
  if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, 0.10 * b.flash)})`; ctx.fill(); }
}

// A phase-tinted colour ramp, so every boss escalates visually without all of
// them escalating the same way.
function bossTint(b, cool, warm, hot) {
  const t = (b.phase - 1) / Math.max(1, b.maxPhases - 1);
  return t < 0.34 ? cool : t < 0.7 ? warm : hot;
}

function bossHalfW(b) { const d = BOSS[b.key]; return (d && d.w) ? d.w / 2 : BOSS_W / 2; }
function bossHalfH(b) { const d = BOSS[b.key]; return (d && d.h) ? d.h / 2 : BOSS_H / 2; }

// ---------------------------------------------------------------------------
// The fallback. Used only if a boss key has no entry yet, so a partially
// populated registry still produces a playable, honest fight rather than a
// crash or an inert sitting duck.
// ---------------------------------------------------------------------------
BOSS.generic = {
  think(b, ph) {
    if (b.attackTimer >= 120 - ph * 8) {
      b.attackTimer = 0;
      if (ph % 2 === 1) bossRing(b.x, b.y, 10 + ph * 2, 0.85, frame * 0.01);
      else bossAimed(b.x, b.y + 20, [-0.22, 0, 0.22], 1);
      Sound.play('hit');
    }
  },
  paint(b) {
    ctx.beginPath();
    ctx.moveTo(-BOSS_W/2, -6); ctx.lineTo(-BOSS_W/2 + 18, -BOSS_H/2);
    ctx.lineTo(BOSS_W/2 - 18, -BOSS_H/2); ctx.lineTo(BOSS_W/2, -6);
    ctx.lineTo(BOSS_W/2 - 26, BOSS_H/2); ctx.lineTo(0, BOSS_H/2 + 10);
    ctx.lineTo(-BOSS_W/2 + 26, BOSS_H/2);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -BOSS_H/2, 0, BOSS_H/2);
    g.addColorStop(0, '#4a5a72'); g.addColorStop(1, '#0d1119');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = bossTint(b, '#66aaff', '#ffaa33', '#ff4433');
    ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);
    [-32, 0, 32].forEach((cx, i) => {
      ctx.beginPath(); ctx.arc(cx, 4, i === 1 ? 8 : 6, 0, Math.PI*2);
      ctx.fillStyle = bossTint(b, '#33ccff', '#ffaa00', '#ff3311'); ctx.fill();
    });
  }
};

// ---------------------------------------------------------------------------
// L10 — SCRAPJAW
// Mechanic: four bolt-on armour plates absorb ALL damage. Break them off to
// expose the core. This is the game's first lesson in "find the weak point",
// so it is deliberately unmissable: the plates are huge, they crack visibly,
// and nothing you do to the hull registers until they are gone.
// ---------------------------------------------------------------------------
BOSS.scrapjaw = {
  w: 130, h: 62,
  init(b) {
    b.plates = [-48, -16, 16, 48].map(x => ({ x, hp: b.maxHp * 0.11, max: b.maxHp * 0.11, gone: false }));
    b.chomp = 0;
  },
  damage(b, bl, dmg) {
    // A plate covers roughly a quarter of the hull. Whichever one the shot
    // lands over eats it; only a gap lets damage through to the core.
    const local = bl.x - b.x;
    const plate = b.plates.find(p => !p.gone && Math.abs(local - p.x) < 17);
    if (!plate) return dmg;
    plate.hp -= dmg;
    if (plate.hp <= 0) {
      plate.gone = true;
      spawnParticles(b.x + plate.x, b.y + 10, '#cc9955', 20);
      FX.addShake(12);
      Sound.play('shieldBreak');
      addFlashText('PLATE OFF', b.x + plate.x, b.y, '#ffcc66');
    }
    return 0;
  },
  onPhase(b) { b.chomp = 26; },
  think(b, ph) {
    const open = b.plates.filter(p => p.gone).length;
    // It gets angrier as it is stripped, which rewards breaking plates fast.
    if (b.attackTimer >= 96 - open * 12) {
      b.attackTimer = 0;
      b.chomp = 18;
      if (ph === 1) bossAimed(b.x, b.y + 24, [-0.28, -0.09, 0.09, 0.28], 0.95, 5);
      else { bossRing(b.x, b.y, 9, 0.8, frame * 0.02, 5); bossAimed(b.x, b.y + 24, [0], 1.25, 6); }
      Sound.play('hit');
    }
    // Spits scrap-hulks it has chewed up.
    if (ph === 2 && b.attackTimer === 40 && frame % 3 === 0) bossMinion('swarmling', b.x, b.y + 30);
    if (b.chomp > 0) b.chomp--;
  },
  paint(b) {
    const bite = b.chomp > 0 ? Math.sin(b.chomp * 0.35) * 7 : 0;
    // lower jaw
    ctx.beginPath();
    ctx.moveTo(-58, 6); ctx.lineTo(58, 6);
    ctx.lineTo(46, 26 + bite); ctx.lineTo(-46, 26 + bite);
    ctx.closePath();
    ctx.fillStyle = '#3a2c1c'; ctx.fill();
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2; ctx.stroke();
    // teeth
    ctx.fillStyle = '#d8cbb0';
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 11 - 4, 8 + bite); ctx.lineTo(i * 11, 20 + bite); ctx.lineTo(i * 11 + 4, 8 + bite);
      ctx.closePath(); ctx.fill();
    }
    // hull
    ctx.beginPath();
    ctx.moveTo(-65, 6); ctx.lineTo(-52, -28); ctx.lineTo(52, -28); ctx.lineTo(65, 6);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -28, 0, 6);
    g.addColorStop(0, '#7b6a4e'); g.addColorStop(1, '#2a2118');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#a98c55'; ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);
    // eye — only lights once the plates are off, so "now it is vulnerable"
    // is something you see rather than something you infer.
    const exposed = b.plates.every(p => p.gone);
    ctx.beginPath(); ctx.arc(0, -12, exposed ? 9 : 6, 0, Math.PI*2);
    ctx.fillStyle = exposed ? '#ff3322' : '#553322'; ctx.fill();
    if (exposed) {
      ctx.strokeStyle = 'rgba(255,80,50,' + (0.4 + 0.4*Math.sin(frame*0.15)) + ')';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -12, 14, 0, Math.PI*2); ctx.stroke();
    }
    // the plates themselves
    b.plates.forEach(p => {
      if (p.gone) return;
      const frac = p.hp / p.max;
      ctx.fillStyle = '#5d5347';
      ctx.fillRect(p.x - 16, -26, 32, 30);
      ctx.strokeStyle = '#cbb27e'; ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 16, -26, 32, 30);
      ctx.fillStyle = 'rgba(255,220,150,0.16)';
      ctx.fillRect(p.x - 16, -26, 32, 30 * (1 - frac));
      ctx.fillStyle = '#8a7a55';
      [-9, 9].forEach(o => { ctx.beginPath(); ctx.arc(p.x + o, -21, 2.5, 0, Math.PI*2); ctx.fill(); });
      if (frac < 0.6) {
        ctx.strokeStyle = 'rgba(20,14,8,0.9)'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(p.x - 10, -22); ctx.lineTo(p.x + 2, -8); ctx.stroke();
      }
      if (frac < 0.3) {
        ctx.beginPath(); ctx.moveTo(p.x + 11, -24); ctx.lineTo(p.x - 1, -4); ctx.stroke();
      }
    });
  },
  title(b) {
    const left = b.plates.filter(p => !p.gone).length;
    return left ? 'ARMOUR PLATES ' + left : 'CORE EXPOSED';
  }
};

// ---------------------------------------------------------------------------
// L20 — HALO WARDEN
// Mechanic: a rotating shield ring with a single gap. Damage only lands when
// the gap is between you and the hull, so the fight is about reading rotation
// and moving to where the opening will be, not where it is.
// ---------------------------------------------------------------------------
BOSS.halowarden = {
  w: 96, h: 96,
  // The ring is a damage GATE, not a wall. A hard block was tried first and
  // made the fight nine times too long: with a narrow gap only ~9% of shots
  // ever landed, turning a 28-second boss into a three-minute one. The ring
  // now soaks most of a blocked shot instead, so timing your burst into the
  // gap is a large reward rather than the only way to make any progress.
  RING_SOAK: 0.72,
  init(b) { b.ringAngle = 0; b.ringSpeed = 0.028; b.gapWidth = 2.0; b.spin = 0; },
  onPhase(b, ph) {
    b.ringSpeed = (0.028 + ph * 0.007) * (ph % 2 === 0 ? -1 : 1);   // reverses
    b.gapWidth = Math.max(1.25, 2.0 - ph * 0.25);                    // narrows
  },
  damage(b, bl, dmg) {
    // Angle from the boss to the shot, measured against the gap's centre.
    const a = Math.atan2(bl.y - b.y, bl.x - b.x);
    let d = a - b.ringAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    if (Math.abs(d) < b.gapWidth / 2) return dmg;
    // Through the ring: mostly absorbed, and visibly so.
    spawnParticles(bl.x, bl.y, '#66ccff', 3);
    b.spin = 6;
    return dmg * (1 - BOSS.halowarden.RING_SOAK);
  },
  think(b, ph) {
    b.ringAngle += b.ringSpeed;
    if (b.spin > 0) b.spin--;
    if (b.attackTimer >= 108 - ph * 14) {
      b.attackTimer = 0;
      // Fires OUT OF THE GAP, so the opening is both the way in and the
      // direction the danger comes from.
      bossShot(b.x + Math.cos(b.ringAngle) * 44, b.y + Math.sin(b.ringAngle) * 44, b.ringAngle, 1.35, 6);
      bossRing(b.x, b.y, 4 + ph * 2, 0.7, b.ringAngle, 4);
      Sound.play('hit');
    }
  },
  paint(b) {
    // core
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2);
    const g = ctx.createRadialGradient(-6, -8, 3, 0, 0, 28);
    g.addColorStop(0, '#e6f4ff'); g.addColorStop(1, '#123a5c');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#66ccff'; ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2);
    ctx.fillStyle = bossTint(b, '#aef0ff', '#ffdd88', '#ff8866'); ctx.fill();

    // the ring, drawn as an arc that stops at the gap
    ctx.save();
    ctx.rotate(b.ringAngle);
    ctx.lineCap = 'round';
    ctx.strokeStyle = b.spin > 0 ? '#ffffff' : 'rgba(110,200,255,0.9)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(0, 0, 44, b.gapWidth / 2, Math.PI * 2 - b.gapWidth / 2);
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(200,240,255,0.55)';
    ctx.beginPath();
    ctx.arc(0, 0, 44, b.gapWidth / 2, Math.PI * 2 - b.gapWidth / 2);
    ctx.stroke();
    // gap mouth markers, so the opening reads at a glance
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#ffee66'; ctx.lineWidth = 3;
    [b.gapWidth / 2, -b.gapWidth / 2].forEach(a => {
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 36, Math.sin(a) * 36);
      ctx.lineTo(Math.cos(a) * 52, Math.sin(a) * 52);
      ctx.stroke();
    });
    ctx.restore();
  },
  title() { return 'SHIELD RING — FIRE THROUGH THE GAP'; }
};

// ---------------------------------------------------------------------------
// L30 — THE CHOIR
// Mechanic: three linked heads sharing one health pool. Damage to any head
// drains the shared pool, but each head you silence makes the survivors
// faster and angrier — so the order and timing are the puzzle, and burning
// one down early is a real (punishable) choice.
// ---------------------------------------------------------------------------
BOSS.choir = {
  w: 150, h: 70,
  init(b) {
    b.heads = [-52, 0, 52].map((x, i) => ({ ox: x, x: b.x + x, y: b.y, dead: false, t: i * 2.1, sing: 0 }));
    b.silenced = 0;
  },
  damage(b, bl, dmg) {
    const h = b.heads.find(h => !h.dead && Math.abs(bl.x - h.x) < 26 && Math.abs(bl.y - h.y) < 26);
    if (!h) return 0;                       // the gaps between heads are empty air
    h.sing = 6;
    // Silence a head once the shared pool passes its share of the total.
    const alive = b.heads.filter(x => !x.dead).length;
    const threshold = b.maxHp * (alive - 1) / 3;
    if (b.hp - dmg <= threshold && alive > 1) {
      h.dead = true;
      b.silenced++;
      spawnParticles(h.x, h.y, '#aa88ff', 26);
      FX.addShake(16);
      Sound.play('explode');
      addFlashText('SILENCED', h.x, h.y, '#cc99ff');
    }
    return dmg;
  },
  move(b) {
    b.x += Math.sign(player.x - b.x) * Math.min(0.9 + b.silenced * 0.5, Math.abs(player.x - b.x));
    b.x = Math.max(80, Math.min(W - 80, b.x));
  },
  think(b, ph) {
    const rate = 1 + b.silenced * 0.9;      // survivors take up the slack
    b.heads.forEach((h, i) => {
      if (h.dead) return;
      h.t += 0.03 * rate;
      h.x = b.x + h.ox + Math.sin(h.t) * 16;
      h.y = b.y + Math.cos(h.t * 0.7) * 12;
      if (h.sing > 0) h.sing--;
      h.timer = (h.timer || i * 30) + rate;
      if (h.timer >= 110) {
        h.timer = 0;
        h.sing = 10;
        if (ph >= 2) bossAimed(h.x, h.y + 16, [-0.2, 0.2], 0.95, 5);
        else bossAimed(h.x, h.y + 16, [0], 0.9, 5);
        Sound.play('hit');
      }
    });
    // In the last phase the survivors sing together — a wall you must gap.
    if (ph >= 3 && b.attackTimer >= 150) {
      b.attackTimer = 0;
      const live = b.heads.filter(h => !h.dead);
      live.forEach(h => bossRing(h.x, h.y, 7, 0.65, frame * 0.02));
      Sound.play('warning');
    }
  },
  paint(b) {
    // Painted in world space via the translate already applied: heads are
    // stored in world coords, so undo the translate for them.
    ctx.save();
    ctx.translate(-b.x, -b.y);
    // linking filaments
    const live = b.heads.filter(h => !h.dead);
    ctx.strokeStyle = 'rgba(170,120,255,0.35)'; ctx.lineWidth = 2;
    for (let i = 0; i < live.length - 1; i++) {
      ctx.beginPath(); ctx.moveTo(live[i].x, live[i].y); ctx.lineTo(live[i+1].x, live[i+1].y); ctx.stroke();
    }
    b.heads.forEach(h => {
      if (h.dead) {
        ctx.strokeStyle = 'rgba(90,70,120,0.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, 14, 0, Math.PI*2); ctx.stroke();

      }
      ctx.beginPath(); ctx.arc(h.x, h.y, 24, 0, Math.PI*2);
      const g = ctx.createRadialGradient(h.x - 6, h.y - 8, 2, h.x, h.y, 26);
      g.addColorStop(0, '#e9d8ff'); g.addColorStop(1, '#3a1170');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = h.sing > 0 ? '#ffffff' : '#aa77ff';
      ctx.lineWidth = 2.5; ctx.stroke();
      // an open mouth when it sings
      ctx.beginPath();
      ctx.ellipse(h.x, h.y + 8, 7, h.sing > 0 ? 9 : 3, 0, 0, Math.PI*2);
      ctx.fillStyle = '#180030'; ctx.fill();
      ctx.beginPath(); ctx.arc(h.x - 8, h.y - 5, 3, 0, Math.PI*2);
      ctx.arc(h.x + 8, h.y - 5, 3, 0, Math.PI*2);
      ctx.fillStyle = bossTint(b, '#88ddff', '#ffcc66', '#ff6655'); ctx.fill();
      if (h.sing > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(h.x, h.y, 30 + (10 - h.sing) * 2, 0, Math.PI*2); ctx.stroke();
      }
    });
    ctx.restore();
    if (b.flash > 0) { /* per-head flash is drawn above */ }
  },
  title(b) { return 'HEADS ' + b.heads.filter(h => !h.dead).length + ' / 3'; }
};

// ---- boss pack: boss_c ----
// ===========================================================================
// VOID RUNNER — boss set C
//   L300  SEVEN ANGLES        a polygon that gains a side, and a gun, a phase
//   L350  THE WIDOW           a tether that hurts while taut
//   L400  ASHEN CHOIRMASTER   everything lands on an audible four-beat bar
//   L500  THE THRESHOLD       copies your build and fights you with it
//
// Every helper below is prefixed with its boss key so nothing in this file can
// collide with another boss file spliced into the same script.
// ===========================================================================


// ---------------------------------------------------------------------------
// L300 — SEVEN ANGLES
// Mechanic: the hull IS the weapon. It is a rotating regular polygon whose
// side count rises with the phase — a triangle at phase 1, a heptagon at
// phase 5 — and every side is an independent turret firing along its own
// outward normal. So the shot pattern is a rotating star that gains a point
// every phase, and rotation reverses direction each time, which means the
// safe wedge you learned last phase sweeps the other way in this one.
//
// Two firing modes share the same geometry:
//   SEQUENCER  one face at a time, lit for the full interval before it fires,
//              walking around the polygon. That lit face IS the wind-up.
//   VOLLEY     every face at once, after a 36-frame charge where all muzzles
//              glow and the hull pulses. Punctuation, not chip damage.
//
// Damage: a face that just fired is glowing hot and takes 60% more. It never
// blocks — the shape is a target, not a shield.
// ---------------------------------------------------------------------------

function sevenanglesSideCount(ph) { return Math.max(3, Math.min(7, 2 + ph)); }

// Outward normal of face i on an n-gon rotated by rot.
function sevenanglesFaceAngle(rot, n, i) { return rot + (i + 0.5) * Math.PI * 2 / n; }

// Distance from centre to the midpoint of a face (the apothem).
function sevenanglesApothem(n, R) { return R * Math.cos(Math.PI / n); }

// Which face is a world point sitting over?
function sevenanglesFaceAt(b, wx, wy) {
  var n = b.sevN;
  // Face i spans the arc [rot + i*step, rot + (i+1)*step].
  var step = Math.PI * 2 / n;
  var a = Math.atan2(wy - b.y, wx - b.x) - b.sevRot;
  var i = Math.floor(a / step) % n;
  while (i < 0) i += n;
  return i;
}

function sevenanglesFireFace(b, i, ph, heavy) {
  var R = b.sevR;
  var ang = sevenanglesFaceAngle(b.sevRot, b.sevN, i);
  var ap = sevenanglesApothem(b.sevN, R);
  var mx = b.x + Math.cos(ang) * (ap + 6);
  var my = b.y + Math.sin(ang) * (ap + 6);
  var f = b.sevFaces[i];
  if (f) { f.heat = 60; f.muzzle = 9; }
  if (heavy) {
    // volley shot: a tight three-lance out of every muzzle
    bossShot(mx, my, ang - 0.13, 1.05, 5);
    bossShot(mx, my, ang, 1.20, 6);
    bossShot(mx, my, ang + 0.13, 1.05, 5);
  } else {
    bossShot(mx, my, ang, 1.05, 5);
    if (ph >= 4) bossShot(mx, my, ang + (ph === 5 ? 0.22 : 0.16) * (i % 2 ? 1 : -1), 0.9, 4);
  }
  spawnParticles(mx, my, '#ffd27a', 3);
}

BOSS.sevenangles = {
  w: 122, h: 116,
  init: function (b) {
    b.sevR = 58;
    b.sevRot = -Math.PI / 2;
    b.sevSpeed = 0.011;
    b.sevN = 3;
    b.sevFaces = [];
    b.sevSeq = 0;          // index of the face currently lit / about to fire
    b.sevSeqT = 0;
    b.sevVolley = 0;       // charge counter for the all-faces volley
    b.sevPulse = 0;
    for (var i = 0; i < 7; i++) b.sevFaces.push({ heat: 0, muzzle: 0 });
  },

  onPhase: function (b, ph) {
    b.sevN = sevenanglesSideCount(ph);
    // Rotation reverses and quickens every phase, so a learned safe wedge
    // does not survive the transition.
    b.sevSpeed = (0.010 + ph * 0.0045) * (ph % 2 === 0 ? -1 : 1);
    b.sevSeq = b.sevSeq % b.sevN;
    b.sevSeqT = 0;
    b.sevVolley = 0;
    b.sevPulse = 26;
    addFlashText(b.sevN + ' ANGLES', b.x, b.y - 74, '#ffcc55');
    FX.addShake(10);
  },

  damage: function (b, bl, dmg) {
    var i = sevenanglesFaceAt(b, bl.x, bl.y);
    var f = b.sevFaces[i];
    if (f && f.heat > 0) {
      spawnParticles(bl.x, bl.y, '#ff8833', 4);
      return dmg * 1.6;                       // a vented face is soft
    }
    return dmg;
  },

  think: function (b, ph) {
    b.sevRot += b.sevSpeed;
    if (b.sevPulse > 0) b.sevPulse--;
    var i;
    for (i = 0; i < b.sevFaces.length; i++) {
      if (b.sevFaces[i].heat > 0) b.sevFaces[i].heat--;
      if (b.sevFaces[i].muzzle > 0) b.sevFaces[i].muzzle--;
    }

    // ---- sequencer: one face, lit for its whole interval, then it fires ----
    var interval = Math.max(30, 46 - ph * 3);
    b.sevSeqT++;
    if (b.sevSeqT >= interval) {
      b.sevSeqT = 0;
      sevenanglesFireFace(b, b.sevSeq, ph, false);
      Sound.play('hit');
      // walk two faces on, so the lit muzzle skips around the shape rather
      // than crawling in lockstep with the spin
      b.sevSeq = (b.sevSeq + (ph >= 3 ? 2 : 1)) % b.sevN;
    }

    // ---- volley: all faces at once, after a 36-frame visible charge ----
    var cycle = 175 - ph * 12;
    if (b.attackTimer >= cycle) {
      b.sevVolley++;
      if (b.sevVolley === 1) Sound.play('warning');
      if (b.sevVolley >= 36) {
        for (i = 0; i < b.sevN; i++) sevenanglesFireFace(b, i, ph, true);
        Sound.play('laser');
        FX.addShake(9);
        b.sevPulse = 18;
        b.sevVolley = 0;
        b.attackTimer = 0;
      }
    }
  },

  paint: function (b) {
    var n = b.sevN, R = b.sevR + (b.sevPulse > 0 ? Math.sin(b.sevPulse * 0.5) * 4 : 0);
    var charging = b.sevVolley > 0 ? b.sevVolley / 36 : 0;
    var edge = bossTint(b, '#6fe0ff', '#ffbb44', '#ff5533');
    var i, a0, a1, k;

    ctx.save();

    // --- plated faces: each side is its own trapezoid segment ---
    for (i = 0; i < n; i++) {
      a0 = b.sevRot + i * Math.PI * 2 / n;
      a1 = b.sevRot + (i + 1) * Math.PI * 2 / n;
      var f = b.sevFaces[i];
      var lit = (i === b.sevSeq) ? (0.35 + 0.35 * Math.sin(frame * 0.25)) : 0;
      var hot = f.heat > 0 ? f.heat / 60 : 0;

      ctx.beginPath();
      ctx.moveTo(Math.cos(a0) * R, Math.sin(a0) * R);
      ctx.lineTo(Math.cos(a1) * R, Math.sin(a1) * R);
      ctx.lineTo(Math.cos(a1) * R * 0.42, Math.sin(a1) * R * 0.42);
      ctx.lineTo(Math.cos(a0) * R * 0.42, Math.sin(a0) * R * 0.42);
      ctx.closePath();
      // alternating plate tone so the facets read as separate armour, and a
      // face that has just vented glows through it
      ctx.fillStyle = i % 2 ? '#1d2634' : '#141b26';
      ctx.fill();
      if (hot > 0) { ctx.fillStyle = 'rgba(255,110,40,' + (0.42 * hot) + ')'; ctx.fill(); }
      if (lit > 0) { ctx.fillStyle = 'rgba(255,230,120,' + (0.30 * lit) + ')'; ctx.fill(); }
      if (charging > 0) { ctx.fillStyle = 'rgba(255,90,60,' + (0.30 * charging) + ')'; ctx.fill(); }
      ctx.strokeStyle = 'rgba(120,160,200,0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // --- the outer silhouette, stroked hard so the shape reads as geometry ---
    ctx.beginPath();
    for (i = 0; i <= n; i++) {
      a0 = b.sevRot + i * Math.PI * 2 / n;
      k = (i === 0 ? 'moveTo' : 'lineTo');
      ctx[k](Math.cos(a0) * R, Math.sin(a0) * R);
    }
    ctx.closePath();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 3;
    ctx.stroke();
    bossFlash(b);

    // --- muzzles at every face midpoint ---
    var ap = sevenanglesApothem(n, R);
    for (i = 0; i < n; i++) {
      var ang = sevenanglesFaceAngle(b.sevRot, n, i);
      var mx = Math.cos(ang) * ap, my = Math.sin(ang) * ap;
      var f2 = b.sevFaces[i];
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(ang);
      // barrel block
      ctx.fillStyle = '#39485c';
      ctx.fillRect(-2, -6, 13, 12);
      ctx.strokeStyle = edge; ctx.lineWidth = 1.4;
      ctx.strokeRect(-2, -6, 13, 12);
      // bore: dark, unless lit / charging / just fired
      var bore = '#05070b';
      if (f2.muzzle > 0) bore = '#ffffff';
      else if (i === b.sevSeq) bore = 'rgba(255,235,120,' + (0.5 + 0.5 * Math.sin(frame * 0.3)) + ')';
      else if (charging > 0) bore = 'rgba(255,90,50,' + charging + ')';
      ctx.fillStyle = bore;
      ctx.fillRect(9, -3.2, 5, 6.4);
      if (f2.muzzle > 0) {
        ctx.globalAlpha = f2.muzzle / 9;
        ctx.fillStyle = '#ffe8a0';
        ctx.beginPath();
        ctx.moveTo(12, -7); ctx.lineTo(30, 0); ctx.lineTo(12, 7);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    // --- core: a counter-rotating inner polygon, one side fewer ---
    ctx.save();
    ctx.rotate(-b.sevRot * 1.7);
    ctx.beginPath();
    var m = Math.max(3, n - 1);
    for (i = 0; i <= m; i++) {
      a0 = i * Math.PI * 2 / m;
      k = (i === 0 ? 'moveTo' : 'lineTo');
      ctx[k](Math.cos(a0) * 19, Math.sin(a0) * 19);
    }
    ctx.closePath();
    ctx.fillStyle = charging > 0 ? 'rgba(255,120,60,' + (0.4 + 0.6 * charging) + ')' : '#0b1018';
    ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    ctx.restore();
  },

  title: function (b) {
    return b.sevN + ' SIDES · ' + b.sevN + ' GUNS · SPIN ' + (b.sevSpeed < 0 ? 'CCW' : 'CW');
  }
};


// ---------------------------------------------------------------------------
// L350 — THE WIDOW
// Mechanic: she spins a filament onto your hull. Past a threshold distance the
// tether goes TAUT and burns you every 45 frames; inside it, it hangs slack
// and does nothing. The only way to make it slack is to fly AT her, which is
// the exact opposite of what every other fight has taught you. She also
// braces while taut — she takes 45% damage — so running away is both the
// thing that hurts you and the thing that stops you killing her.
//
// She fires far more while the tether is slack, so closing in is not free:
// the fight is a rhythm of dive in, eat the bullet fan, drift out, take the
// burn, dive in again.
//
// The filament is drawn in world space: a drooping catenary when slack, a
// straight vibrating white-hot line when taut.
// ---------------------------------------------------------------------------

function widowThreshold(ph) { return [275, 245, 218, 192][Math.max(0, Math.min(3, ph - 1))]; }

function widowSpinneret(b) { return { x: b.x, y: b.y + 26 }; }

function widowDist(b) {
  var s = widowSpinneret(b);
  var dx = player.x - s.x, dy = player.y - s.y;
  return Math.sqrt(dx * dx + dy * dy);
}

BOSS.widow = {
  w: 148, h: 66,
  init: function (b) {
    b.wState = 'wait';     // wait -> aim -> on -> wait
    b.wT = 90;             // frames left in the current state
    b.wTaut = false;
    b.wTautT = 0;
    b.wHurtCd = 0;
    b.wLegT = 0;
    b.wSpin = 0;           // spinneret glow
    b.wShot = 0;
    b.wBrood = 0;
    b.wWarned = false;
  },

  onPhase: function (b, ph) {
    // Every phase she cuts and re-casts, so the threshold change is announced

    b.wState = 'wait'; b.wT = 70; b.wTaut = false; b.wTautT = 0; b.wWarned = false;
    b.wSpin = 30;
    addFlashText('SHE RE-SPINS', b.x, b.y - 54, '#ff88cc');
  },

  // Braced against the line: while it is taut she is anchored and hard, while
  // it is slack she is a spider with her weight on one leg.
  damage: function (b, bl, dmg) {
    if (b.wState === 'on' && b.wTaut) {
      spawnParticles(bl.x, bl.y, '#cc88ff', 2);
      return dmg * 0.45;
    }
    return dmg;
  },

  move: function (b) {
    // She sidles rather than tracking, so the tether length is something you

  },

  think: function (b, ph) {
    b.wLegT += 0.04;
    if (b.wSpin > 0) b.wSpin--;
    if (b.wHurtCd > 0) b.wHurtCd--;

    // ---- tether state machine ----
    b.wT--;
    if (b.wState === 'wait') {
      if (b.wT <= 0) {
        b.wState = 'aim';

        b.wTaut = false; b.wTautT = 0; b.wWarned = false;

      }
    } else if (b.wState === 'on') {
      var d = widowDist(b);
      var thr = widowThreshold(ph);
      var taut = d > thr;
      if (taut !== b.wTaut) {
        b.wTaut = taut;
        b.wTautT = 0;
        if (taut) {
          Sound.play('warning');

        } else {

        // webbing: a wide fan you have to thread while you are up close
        bossAimed(s.x, s.y, [-0.46, -0.23, 0, 0.23, 0.46], 0.85, 5);
        if (ph >= 3) bossRing(b.x, b.y, 6 + ph, 0.6, frame * 0.02, 4);

      }

    if (ph >= 2 && b.wBrood >= 300 - ph * 30) {

        bossMinion(ph >= 3 ? 'weaver' : 'swarmling', b.x + 30, b.y + 30);

  paint: function (b) {
    var edge = bossTint(b, '#cc77ff', '#ff77bb', '#ff4466');
    var i, t = b.wLegT;

    ctx.strokeStyle = 'rgba(60,20,55,0.95)';

      var side = i < 4 ? -1 : 1;

    ctx.moveTo(-8, 4); ctx.lineTo(8, 4); ctx.lineTo(-8, 22); ctx.lineTo(8, 22);
    ctx.closePath();
    ctx.fillStyle = b.wTaut ? '#ffffff' : edge;
    ctx.fill();

    // --- cephalothorax ---
    ctx.beginPath();
    ctx.moveTo(-30, -8); ctx.lineTo(-18, -28); ctx.lineTo(18, -28);
    ctx.lineTo(30, -8); ctx.lineTo(16, 4); ctx.lineTo(-16, 4);
    ctx.closePath();
    var hg = ctx.createLinearGradient(0, -28, 0, 4);
    hg.addColorStop(0, '#3b1030'); hg.addColorStop(1, '#0d040a');
    ctx.fillStyle = hg; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);

    ctx.fillStyle = b.wState === 'on' ? '#ff3366' : '#883355';
    for (i = 0; i < 6; i++) {
      var ex = -15 + (i % 3) * 15;

    }

      ctx.beginPath();

      ctx.fillStyle = glow > 0 ? 'rgba(255,220,255,' + (0.35 + 0.65 * glow) + ')' : '#2a0c22';
      ctx.fill();
      ctx.strokeStyle = edge; ctx.lineWidth = 1.4; ctx.stroke();
    }
    if (glow > 0) {
      ctx.strokeStyle = 'rgba(255,150,220,' + (0.5 * glow) + ')';
      ctx.lineWidth = 2;

  // The filament has to escape the hull, so it is drawn in world space.
  paintWorld: function (b) {

    if (b.wState === 'wait') return;
    var s = widowSpinneret(b);
    var px = player.x, py = player.y;
    var i;

    ctx.save();
    ctx.lineCap = 'round';

    if (b.wState === 'aim') {
      // a thin dashed line reaching for you, growing over the 70-frame cast
      var g = 1 - Math.max(0, b.wT) / 70;
      ctx.globalAlpha = 0.35 + 0.4 * g;
      ctx.strokeStyle = '#ff88cc';

      for (i = 0; i < steps; i += 2) {

      }

    var d = widowDist(b);
    var thr = widowThreshold(b.phase);

    if (!b.wTaut) {

      ctx.strokeStyle = 'rgba(190,150,220,0.55)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.quadraticCurveTo(mx, my, px, py);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,220,255,0.75)';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.quadraticCurveTo(mx, my, px, py);
      ctx.stroke();
      // beads of silk hanging on the curve
      ctx.fillStyle = 'rgba(255,225,255,0.5)';
      for (i = 1; i < 5; i++) {
        var u = i / 5, iu = 1 - u;
        var bx = iu * iu * s.x + 2 * iu * u * mx + u * u * px;
        var by = iu * iu * s.y + 2 * iu * u * my + u * u * py;
        ctx.beginPath(); ctx.arc(bx, by, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    } else {
      // TAUT — straight, bright, vibrating, with the burn charge running down
      // it. Unmistakably a different object from the slack rope.
      var amp = 5 + 3 * Math.sin(frame * 0.9);
      var nx = -(py - s.y), ny = (px - s.x);
      var nl = Math.sqrt(nx * nx + ny * ny) || 1;
      nx /= nl; ny /= nl;
      var segs = 14;
      ctx.strokeStyle = 'rgba(255,60,110,0.9)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      for (i = 0; i <= segs; i++) {
        var u2 = i / segs;
        var j = Math.sin(u2 * Math.PI) * Math.sin(frame * 0.75 + u2 * 12) * amp;
        var x2 = s.x + (px - s.x) * u2 + nx * j;
        var y2 = s.y + (py - s.y) * u2 + ny * j;
        if (i === 0) ctx.moveTo(x2, y2); else ctx.lineTo(x2, y2);
      }
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      // the charge crawling toward your hull tells you the tick is coming
      var prog = b.wTautT < 60 ? b.wTautT / 60 : ((45 - b.wHurtCd) / 45);
      prog = Math.max(0, Math.min(1, prog));
      var cx = s.x + (px - s.x) * prog, cy = s.y + (py - s.y) * prog;
      ctx.fillStyle = '#ffee88';
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,230,120,0.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.stroke();
      // and an arrow telling you which way is safety
      ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
      var a = Math.atan2(s.y - py, s.x - px);
      ctx.beginPath();
      ctx.moveTo(px + Math.cos(a) * 26, py + Math.sin(a) * 26);
      ctx.lineTo(px + Math.cos(a) * 44, py + Math.sin(a) * 44);
      ctx.stroke();
    }
    ctx.restore();
  },

  title: function (b) {
    if (b.wState === 'wait') return 'LINE CUT — SHE IS RE-SPINNING';
    if (b.wState === 'aim') return 'CASTING FILAMENT';
    if (b.wTaut) return 'TAUT — FLY TOWARD HER (SHE IS BRACED, 45% DMG)';
    return 'SLACK — SAFE, BUT SHE FIRES FASTER THIS CLOSE';
  }
};


// ---------------------------------------------------------------------------
// L400 — ASHEN CHOIRMASTER
// Mechanic: a metronome you can learn. A beat every 34 frames, four beats to
// the bar, forever — it never speeds up, never stutters, never syncopates.
// What changes per phase is only WHICH beats of the bar are the loud ones:
//
//   phase 1   . . . X        the fourth beat
//   phase 2   . X . X        two and four
//   phase 3   X . X .        one and three
//   phase 4   . X X X        everything but the downbeat
//   phase 5   X X X X        the whole bar
//
// Quiet beats tick, flash the robe and swing the baton and do nothing else.
// Loud beats fire. The baton rises through the entire 34-frame beat before a
// loud one and a red charge grows at its tip — that is the wind-up, and it is
// the same wind-up every single time, which is the point.
// ---------------------------------------------------------------------------

var CHOIRMASTER_BEAT = 34;

function choirmasterPattern(ph) {
  return [
    [false, false, false, true],
    [false, true, false, true],
    [true, false, true, false],
    [false, true, true, true],
    [true, true, true, true]
  ][Math.max(0, Math.min(4, ph - 1))];
}

function choirmasterAsh(b) {
  var i, m;
  for (i = 0; i < b.cmAsh.length; i++) {
    m = b.cmAsh[i];
    m.y += m.v;
    m.x += Math.sin((frame + m.p) * 0.02) * 0.5;
    m.r += m.s;
    if (m.y > H + 12) { m.y = -12; m.x = Math.random() * W; }
  }
}

// One of five voices. Kept in a helper so the beat handler reads as a score.
function choirmasterVoice(b, ph, name) {
  var hx = b.x, hy = b.y + 34;
  if (name === 'chord') {
    bossAimed(hx, hy, [-0.4, -0.2, 0, 0.2, 0.4], 0.85, 5);
  } else if (name === 'swell') {
    bossRing(b.x, b.y, 10 + ph * 2, 0.7, frame * 0.013, 5);
  } else if (name === 'descant') {
    // a wall of six voices stepping down out of the dark above her
    for (var i = 0; i < 6; i++) {
      bossShot(40 + i * 80, 26, Math.PI / 2 + (i - 2.5) * 0.045, 0.8, 5);
    }
  } else if (name === 'coda') {
    bossRing(b.x, b.y, 14 + ph, 0.62, frame * 0.02, 5);
    bossAimed(hx, hy, [-0.16, 0, 0.16], 1.15, 6);
  }
  Sound.play('laser');
  FX.addShake(6);
}

BOSS.choirmaster = {
  w: 104, h: 128,
  init: function (b) {
    b.cmBar = 0;
    b.cmBeat = -1;
    b.cmBars = 0;
    b.cmHit = 0;          // frames since the last beat landed, for the flash
    b.cmBaton = 0;        // 0..1 baton raise
    b.cmAsh = [];
    for (var i = 0; i < 46; i++) {
      b.cmAsh.push({
        x: Math.random() * W, y: Math.random() * H,
        v: 0.35 + Math.random() * 0.9, r: Math.random() * 6.28,
        s: (Math.random() - 0.5) * 0.05, z: 1 + Math.random() * 2,
        p: Math.random() * 600
      });
    }
  },

  onPhase: function (b, ph) {
    // The bar is never reset by a phase change — the metronome is the one
    // thing in the fight that does not react to you.
    addFlashText('NEW MOVEMENT', b.x, b.y - 82, '#ffeecc');
  },

  think: function (b, ph) {
    choirmasterAsh(b);
    if (b.cmHit > 0) b.cmHit--;

    b.cmBar++;
    var within = b.cmBar % CHOIRMASTER_BEAT;
    var idx = Math.floor(b.cmBar / CHOIRMASTER_BEAT) % 4;
    var pat = choirmasterPattern(ph);

    // Baton: falls onto the beat, then rises again over the rest of it. The
    // rise is steeper (and the tip charges) when the next beat is loud.
    var u = within / CHOIRMASTER_BEAT;
    b.cmBaton = 1 - Math.cos(u * Math.PI * 0.5);

    if (idx !== b.cmBeat) {
      b.cmBeat = idx;
      b.cmHit = 10;
      if (idx === 0) b.cmBars++;
      if (pat[idx]) {
        // LOUD. Which voice sings is a property of the beat and the phase, so
        // the same bar position always means the same attack within a phase.
        if (ph <= 1) choirmasterVoice(b, ph, 'chord');
        else if (ph === 2) choirmasterVoice(b, ph, idx === 1 ? 'swell' : 'chord');
        else if (ph === 3) choirmasterVoice(b, ph, idx === 0 ? 'descant' : 'swell');
