            bossAimed(b.x + v.c, b.y + 60, [-0.18, 0.18], 1.0, 5);
          }
        }
        Sound.play('explode');
      }
      b.volley = { key: 'bridge', c: s.c, n: 3 + ph, t: 10, gap: 14 };
    }
  },

  paint(b) {
    const accent = bossTint(b, '#7fb6ff', '#ffc266', '#ff6a4a');
    const lo = -b.x - 120, hi = -b.x + W + 120;    // visible local-x window

    // ---- hull slab --------------------------------------------------------
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-600, -20);
    ctx.lineTo(-560, -62);
    ctx.lineTo(520, -70);
    ctx.lineTo(600, -30);
    ctx.lineTo(600, 40);
    ctx.lineTo(520, 72);
    ctx.lineTo(-540, 66);
    ctx.lineTo(-600, 20);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -70, 0, 72);
    g.addColorStop(0, '#7a8496');
    g.addColorStop(0.4, '#3d4652');
    g.addColorStop(0.75, '#232a34');
    g.addColorStop(1, '#0e1218');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.stroke();
    bossFlash(b);

    // panel lines — only the ones on screen
    ctx.save();
    ctx.beginPath();
    ctx.rect(-600, -70, 1200, 142);
    ctx.clip();
    ctx.strokeStyle = 'rgba(8,11,16,0.55)';
    ctx.lineWidth = 1.2;
    const startX = Math.floor(lo / 40) * 40;
    for (let x = startX; x < hi; x += 40) {
      if (x < -600 || x > 600) continue;
      ctx.beginPath(); ctx.moveTo(x, -66); ctx.lineTo(x - 8, 68); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(190,220,255,0.10)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-590, -34); ctx.lineTo(590, -40); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-580, 12); ctx.lineTo(580, 6); ctx.stroke();
    ctx.restore();
    ctx.restore();

    // ---- running lights: a marching litany along the flank -----------------
    const li0 = Math.floor((lo + 600) / 34);
    const li1 = Math.ceil((hi + 600) / 34);
    for (let i = Math.max(0, li0); i < Math.min(35, li1); i++) {
      const x = -590 + i * 34;
      const on = ((frame * 0.05 - i * 0.35) % 6.283 + 6.283) % 6.283 < 1.6;
      ctx.fillStyle = on ? 'rgba(255,246,214,0.95)' : 'rgba(110,130,160,0.22)';
      ctx.fillRect(x, -52, 4, 4);
      ctx.fillStyle = on ? 'rgba(255,150,90,0.5)' : 'rgba(90,105,130,0.18)';
      ctx.fillRect(x, 52, 4, 3);
    }

    // ---- per-section superstructure (culled) -------------------------------
    for (let i = 0; i < LITANY_SECTIONS.length; i++) {
      const s = LITANY_SECTIONS[i];
      if (s.c + s.hw < lo || s.c - s.hw > hi) continue;
      litanyPaintSection(b, s, accent);
    }
  },

  paintWorld(b) {
    ctx.save();
    // prow lance
    if (b.beam) {
      const bx = b.x + LITANY_SECTIONS[0].c;
      if (b.beam.state === 'charge') {
        const t = 1 - b.beam.t / 52;
        ctx.strokeStyle = 'rgba(255,120,90,' + (0.15 + 0.45 * t) + ')';
        ctx.lineWidth = 2 + 5 * t;
        ctx.setLineDash([14, 10]);
        ctx.beginPath(); ctx.moveTo(bx, b.y + 70); ctx.lineTo(bx, H); ctx.stroke();
        ctx.setLineDash([]);
      } else {
        const gg = ctx.createLinearGradient(bx - 28, 0, bx + 28, 0);
        gg.addColorStop(0, 'rgba(255,90,50,0)');
        gg.addColorStop(0.5, 'rgba(255,235,200,0.9)');
        gg.addColorStop(1, 'rgba(255,90,50,0)');
        ctx.fillStyle = gg;
        ctx.fillRect(bx - 28, b.y + 60, 56, H);
      }
    }
    // shield bubble over the emitter
    if (b.shield.state !== 'off') {
      const ex = b.x + LITANY_SECTIONS[4].c;
      const up = b.shield.state === 'up';
      const r = up ? 120 : 40 + (90 - b.shield.t) * 0.85;
      ctx.globalAlpha = up ? 0.35 + 0.12 * Math.sin(frame * 0.16) : 0.22;
      ctx.beginPath();
      ctx.arc(ex, b.y + 10, Math.max(10, r), 0, Math.PI * 2);
      ctx.fillStyle = up ? 'rgba(90,255,225,0.35)' : 'rgba(90,255,225,0.18)';
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = up ? 'rgba(160,255,240,0.85)' : 'rgba(160,255,240,0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  },

  title(b) {
    // Whatever is currently overhead is what the player must deal with.
    let best = null, bd = 1e9;
    for (let i = 0; i < LITANY_SECTIONS.length; i++) {
      const s = LITANY_SECTIONS[i];
      const d = Math.abs(b.x + s.c - W / 2);
      if (d < bd) { bd = d; best = s; }
    }
    const dir = b.vx > 0.05 ? '»' : (b.vx < -0.05 ? '«' : '=');
    let tag = best ? best.name : 'HULL';
    if (best && best.key === 'bridge') tag += ' — SOFT';
    if (best && best.key === 'emitter' && b.shield.state === 'up') tag += ' — SHIELDED';
    return dir + ' OVERHEAD: ' + tag + ' ' + dir;
  }
};

function litanyPaintSection(b, s, accent) {
  const x = s.c;
  ctx.save();
  ctx.translate(x, 0);

  if (s.key === 'prow') {
    ctx.beginPath();
    ctx.moveTo(-80, -20); ctx.lineTo(-98, 20); ctx.lineTo(-40, 66); ctx.lineTo(-30, 10);
    ctx.closePath();
    ctx.fillStyle = '#4b5462'; ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 60, b.beam ? 12 : 7, 0, Math.PI * 2);
    ctx.fillStyle = b.beam ? '#ffddaa' : '#5b2a20'; ctx.fill();

  } else if (s.key === 'gunA' || s.key === 'gunB') {
    ctx.fillStyle = '#333c48';
    ctx.fillRect(-70, 30, 140, 22);
    ctx.strokeStyle = 'rgba(200,225,255,0.4)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-70, 30, 140, 22);
    for (let i = -2; i <= 2; i++) {
      ctx.fillStyle = '#1d2530';
      ctx.fillRect(i * 26 - 5, 50, 10, 22);
      ctx.fillStyle = 'rgba(255,180,90,' + (0.2 + 0.5 * Math.abs(Math.sin(frame * 0.09 + i))) + ')';
      ctx.fillRect(i * 26 - 3, 68, 6, 4);
    }
    ctx.fillStyle = accent;
    ctx.fillRect(-70, 26, 140, 2);

  } else if (s.key === 'missile') {
    ctx.fillStyle = '#2b3340';
    ctx.fillRect(-84, 18, 168, 40);
    ctx.strokeStyle = 'rgba(255,190,120,0.55)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-84, 18, 168, 40);
    for (let i = 0; i < 6; i++) {
      const hx = -70 + i * 28;
      const open = b.volley && b.volley.key === 'missile';
      ctx.fillStyle = open ? 'rgba(255,120,60,0.85)' : '#111820';
      ctx.fillRect(hx - 9, 24, 18, 28);
      ctx.strokeStyle = 'rgba(190,215,245,0.35)';
      ctx.strokeRect(hx - 9, 24, 18, 28);
    }

  } else if (s.key === 'spine') {
    for (let i = -4; i <= 4; i++) {
      ctx.fillStyle = i % 2 ? '#4d576a' : '#3b4454';
      ctx.fillRect(i * 22 - 9, -68, 18, 30);
    }
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-96, -40); ctx.lineTo(96, -40); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(-96, 44, 192, 10);
    // vent glow when it is about to blow a ring
    const vent = b.volley && b.volley.key === 'flak';
    ctx.fillStyle = vent ? 'rgba(255,170,80,0.8)' : 'rgba(120,180,255,0.25)';
    for (let i = -3; i <= 3; i++) ctx.fillRect(i * 26 - 6, 56, 12, 8);

  } else if (s.key === 'emitter') {
    const up = b.shield.state === 'up';
    ctx.fillStyle = '#2e3a46';
    ctx.fillRect(-52, -46, 104, 26);
    ctx.strokeStyle = up ? '#8effe4' : 'rgba(140,220,255,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeRect(-52, -46, 104, 26);
    ctx.beginPath();
    ctx.arc(0, -50, 20, Math.PI, Math.PI * 2);
    ctx.fillStyle = up ? 'rgba(140,255,230,0.9)' : 'rgba(70,120,140,0.9)';
    ctx.fill();
    ctx.strokeStyle = up ? '#dffff7' : '#6ea0b4';
    ctx.stroke();
    // launch cradles
    ctx.fillStyle = '#222b36';
    ctx.fillRect(-70, 40, 44, 20);
    ctx.fillRect(26, 40, 44, 20);

  } else if (s.key === 'bridge') {
    ctx.fillStyle = '#455063';
    ctx.beginPath();
    ctx.moveTo(-56, -34); ctx.lineTo(-40, -74); ctx.lineTo(44, -74); ctx.lineTo(60, -34);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = b.litanyCall > 0 ? '#ffffff' : '#ffd27a';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const on = ((frame * 0.07 + i) % 6.283) < 3.6;
      ctx.fillStyle = on ? 'rgba(255,235,170,0.95)' : 'rgba(120,110,80,0.4)';
      ctx.fillRect(-44 + i * 16, -62, 11, 7);
    }
    // it is the soft spot and it is marked as one
    ctx.strokeStyle = 'rgba(255,120,90,' + (0.3 + 0.35 * Math.sin(frame * 0.13)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -50, 40 + Math.sin(frame * 0.09) * 4, 0, Math.PI * 2); ctx.stroke();
  }

  if (b.litanyCall > 0) b.litanyCall--;
  ctx.restore();
}


// ===========================================================================
// L2500 — THE DREADED SCOURGE OF HUMANITY — WARR MOTHERSHIP
// ---------------------------------------------------------------------------
// The Devouring. Every phase it eats a band of the arena and the space does
// not come back: it is drawn as void and static, and standing in it kills.
// By phase seven the war is being fought in a corridor.
//
// Hard floor: it will never eat more than 100px from either side (280px of
// playable width, 58% of the canvas) or 96px from the bottom, so there is
// always somewhere to dodge to.
// ===========================================================================

function mothershipPlayable(b) {
  return { l: b.eatL, r: W - b.eatR, bot: H - b.eatB };
}

function mothershipDevour(b, ph) {
  const order = ['left', 'right', 'bottom'];
  const side = order[(ph - 2 + 3) % 3];
  if (side === 'left') b.eatL = Math.min(100, b.eatL + (b.eatL < 60 ? 55 : 45));
  else if (side === 'right') b.eatR = Math.min(100, b.eatR + (b.eatR < 60 ? 55 : 45));
  else b.eatB = Math.min(96, b.eatB + 48);
}

function mothershipVoidEdge(x, y, seed) {
  // A jagged, animated tear-line offset.
  return Math.sin(y * 0.05 + frame * 0.03 + seed) * 5 + Math.sin(y * 0.19 + seed * 2) * 3;
}

BOSS.mothership = {
  w: 460, h: 200,
  init(b) {
    b.eatL = 0; b.eatR = 0; b.eatB = 0;
    b.devour = 0;            // frames of the consumption sequence remaining
    b.devourMax = 200;
    b.voidCd = 0;
    b.hurtCd = 0;
    b.cast = null;           // { kind, t, max, data }
    b.beams = null;          // { t, xs }
    b.wall = null;           // { r, gap, t }
    b.suiteIdx = 0;
    b.mawOpen = 0;
    b.plateScroll = 0;
    b.sway = 0;
    b.pull = 0;
    b.agg = 1 + Math.min(0.55, (b.ascendant || 0) * 0.08);
    b.consumed = 0;
    // It opens mid-meal. The first Devouring lands before phase two, so the
    // rule is taught by being used on you rather than explained.
    b.devour = 140;
    b.devourIntro = true;
  },

  onPhase(b, ph) {
    b.cast = null; b.beams = null; b.wall = null;
    mothershipDevour(b, ph);
    b.devour = b.devourMax;
    b.devourIntro = false;
    b.consumed = Math.round(((b.eatL + b.eatR) / W + b.eatB / H) * 50);
    FX.addShake(26);
    FX.hitStop(5);
    Sound.play('bigExplode');
    addFlashText('THE DEVOURING', W / 2, 300, '#cc88ff');
  },

  damage(b, bl, dmg) {
    // While it is consuming, the void field over the hull all but seals it.
    if (b.devour > 0) {
      if (frame % 3 === 0) spawnParticles(bl.x, bl.y, '#aa77ff', 2);
      return dmg * 0.10;
    }
    const local = bl.x - b.x;
    const ly = bl.y - b.y;
    if (Math.abs(local) < 68 && ly > -20) return dmg;   // straight down the maw
    return dmg * 0.5;                                   // armour plating
  },

  move(b) {
    // It centres itself over whatever arena is left, and sways like weather.
    b.sway += 0.006;
    const pl = mothershipPlayable(b);
    const cx = (pl.l + pl.r) / 2;
    b.x += (cx + Math.sin(b.sway) * 16 - b.x) * 0.01;
    b.y = b.targetY + Math.sin(b.sway * 1.7) * 4;
  },

  think(b, ph) {
    b.plateScroll = (b.plateScroll + 0.35) % 44;
    if (b.hurtCd > 0) b.hurtCd--;
    if (b.voidCd > 0) b.voidCd--;
    if (b.mawOpen > 0) b.mawOpen--;

    // ---- standing in what it has eaten ------------------------------------
    const pl = mothershipPlayable(b);
    const inVoid = player.x < pl.l || player.x > pl.r || player.y > pl.bot;
    if (inVoid) {
      if (frame % 3 === 0) spawnParticles(player.x, player.y, '#9955ff', 3);
      // shove them back toward the living arena rather than trapping them
      if (player.x < pl.l) player.x += 1.6;
      if (player.x > pl.r) player.x -= 1.6;
      if (player.y > pl.bot) player.y -= 1.6;
      if (b.voidCd <= 0) { hitPlayer(); b.voidCd = 45; addFlashText('THE VOID', player.x, player.y - 30, '#cc88ff'); }
    }

    // ---- the Devouring sequence -------------------------------------------
    if (b.devour > 0) {
      b.devour--;
      if (b.devour % 18 === 0) {
        FX.addShake(6);
        spawnParticles(b.x + (litanyRnd(frame) - 0.5) * 300, b.y + 70, '#aa66ff', 5);
      }
      // It is not defenceless while it feeds — a slow, readable ring.
      if (b.devour % 46 === 0) bossRing(b.x, b.y + 60, 10, 0.5, frame * 0.01, 6);
      if (b.devour === 0) {
        Sound.play('bossPhase');
        FX.addShake(18);
        if (b.devourIntro) {
          b.devourIntro = false;
          b.eatB = 40;                       // the floor goes first
          addFlashText('THE DEVOURING', W / 2, 300, '#cc88ff');
          addFlashText('THE FLOOR IS GONE', W / 2, 330, '#cc88ff');
          FX.addShake(24);
        }
      }
      return;
    }

    // ---- active beams -----------------------------------------------------
    if (b.beams) {
      b.beams.t--;
      if (b.hurtCd <= 0) {
        for (let i = 0; i < b.beams.xs.length; i++) {
          if (Math.abs(player.x - b.beams.xs[i]) < 22) { hitPlayer(); b.hurtCd = 50; break; }
        }
      }
      if (b.beams.t <= 0) b.beams = null;
    }

    // ---- the gapped wall --------------------------------------------------
    if (b.wall) {
      b.wall.t--;
      if (b.wall.t % 5 === 0) {
        const n = 26;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + b.wall.rot;
          let d = a - b.wall.gap;
          while (d > Math.PI) d -= Math.PI * 2;
          while (d < -Math.PI) d += Math.PI * 2;
          if (Math.abs(d) < 0.55) continue;
          bossShot(b.x, b.y + 50, a, 0.5, 5);
        }
        b.wall.gap += 0.7;
      }
      if (b.wall.t <= 0) b.wall = null;
      return;
    }

    // ---- the pull ---------------------------------------------------------
    if (b.pull > 0) {
      b.pull--;
      const dx = b.x - player.x, dy = (b.y + 70) - player.y;
      const d = Math.max(40, Math.sqrt(dx * dx + dy * dy));
      player.x += (dx / d) * 1.25;
      player.y += (dy / d) * 0.95;
      if (b.pull % 9 === 0) bossAimed(b.x, b.y + 70, [-0.6, 0.6], 0.9, 5);
      if (frame % 2 === 0) spawnParticles(player.x, player.y, '#7744cc', 1);
      if (b.pull <= 0) b.mawOpen = 40;
    }

    // ---- casting (every attack has a 30+ frame tell) -----------------------
    if (b.cast) {
      b.cast.t--;
      if (b.cast.t <= 0) { mothershipFire(b, ph, b.cast); b.cast = null; }
      return;
    }

    const iv = Math.max(46, (128 - ph * 11) / b.agg);
    if (b.attackTimer >= iv) {
      b.attackTimer = 0;
      const suite = mothershipSuite(ph);
      const kind = suite[(b.suiteIdx++) % suite.length];
      b.cast = { kind: kind, t: kind === 'stareater' ? 66 : 36, max: kind === 'stareater' ? 66 : 36, x: player.x, xs: null };
      if (kind === 'harvest') {
        const pl2 = mothershipPlayable(b);
        b.cast.xs = [];
        const span = pl2.r - pl2.l;
        for (let i = 0; i < 3; i++) b.cast.xs.push(pl2.l + span * (0.2 + 0.3 * i) + (litanyRnd(frame + i) - 0.5) * 30);
      }
      Sound.play(kind === 'stareater' ? 'warning' : 'hit');
    }
  },

  paint(b) {
    const t = (b.phase - 1) / Math.max(1, b.maxPhases - 1);
    const hot = bossTint(b, '#7f9fff', '#c07dff', '#ff5f8f');

    // ---- engine wash, drawn behind everything ------------------------------
    ctx.save();
    ctx.globalAlpha = 0.55;
    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 5; i++) {
        const ex = side * (150 + i * 14);
        const h = 26 + Math.sin(frame * 0.11 + i + side) * 9;
        const gg = ctx.createLinearGradient(ex, -100, ex, -100 - h);
        gg.addColorStop(0, hot);
        gg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gg;
        ctx.fillRect(ex - 6, -100 - h, 12, h);
      }
    }
    ctx.restore();

    // ---- back plate: the structure behind the structure ---------------------
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-230, -60); ctx.lineTo(-180, -100); ctx.lineTo(180, -100);
    ctx.lineTo(230, -60); ctx.lineTo(210, 40); ctx.lineTo(-210, 40);
    ctx.closePath();
    const bg = ctx.createLinearGradient(0, -100, 0, 40);
    bg.addColorStop(0, '#2a2440');
    bg.addColorStop(1, '#0a0912');
    ctx.fillStyle = bg;
    ctx.fill();
    // scrolling plating
    ctx.save();
    ctx.clip();
    for (let y = -100; y < 40; y += 22) {
      const yy = y + (b.plateScroll % 22);
      ctx.fillStyle = 'rgba(255,255,255,0.035)';
      ctx.fillRect(-230, yy, 460, 9);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-230, yy); ctx.lineTo(230, yy); ctx.stroke();
    }
    for (let x = -216; x <= 216; x += 36) {
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.moveTo(x, -100); ctx.lineTo(x, 40); ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = hot;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.restore();

    // ---- main hull ----------------------------------------------------------
    ctx.beginPath();
    ctx.moveTo(-208, -40);
    ctx.lineTo(-140, -78);
    ctx.lineTo(140, -78);
    ctx.lineTo(208, -40);
    ctx.lineTo(176, 52);
    ctx.lineTo(86, 82);
    ctx.lineTo(-86, 82);
    ctx.lineTo(-176, 52);
    ctx.closePath();
    const hg = ctx.createLinearGradient(0, -78, 0, 82);
    hg.addColorStop(0, '#6a6f8c');
    hg.addColorStop(0.5, '#333850');
    hg.addColorStop(1, '#100f1c');
    ctx.fillStyle = hg;
    ctx.fill();
    ctx.strokeStyle = hot;
    ctx.lineWidth = 3;
    ctx.stroke();
    bossFlash(b);

    // hull ribs
    ctx.save();
    ctx.beginPath(); ctx.rect(-208, -78, 416, 160); ctx.clip();
    for (let i = -5; i <= 5; i++) {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(i * 38, -76); ctx.lineTo(i * 30, 80); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(i * 38 + 3, -76); ctx.lineTo(i * 30 + 3, 80); ctx.stroke();
    }
    ctx.restore();

    // ---- engine banks --------------------------------------------------------
    for (let side = -1; side <= 1; side += 2) {
      ctx.save();
      ctx.translate(side * 168, -20);
      ctx.fillStyle = '#252a3c';
      ctx.fillRect(-26, -58, 52, 100);
      ctx.strokeStyle = 'rgba(200,215,255,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(-26, -58, 52, 100);
      for (let i = 0; i < 5; i++) {
        const p = 0.35 + 0.65 * Math.abs(Math.sin(frame * 0.07 + i * 0.8 + side));
        ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.2 * p) + ')';
        ctx.fillRect(-20, -50 + i * 19, 40, 12);
        ctx.fillStyle = hot;
        ctx.globalAlpha = 0.35 + 0.5 * p;
        ctx.fillRect(-20, -50 + i * 19, 40, 4);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    // ---- spires -------------------------------------------------------------
    ctx.strokeStyle = hot;
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      const hgt = 26 + Math.abs(i) * -6 + 18;
      ctx.beginPath();
      ctx.moveTo(i * 52, -78);
      ctx.lineTo(i * 52 + i * 4, -78 - hgt);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(i * 52 + i * 4, -80 - hgt, 3 + Math.sin(frame * 0.1 + i) * 1.2, 0, Math.PI * 2);
      ctx.fillStyle = hot;
      ctx.fill();
    }

    // ---- THE MAW -------------------------------------------------------------
    const open = b.mawOpen > 0 || b.pull > 0 || (b.cast && b.cast.kind === 'stareater');
    const gape = open ? 22 : 8;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 46, 74, 34 + gape, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#04040a';
    ctx.fill();
    ctx.strokeStyle = hot;
    ctx.lineWidth = 3;
    ctx.stroke();
    // the swirl inside
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 46, 72, 32 + gape, 0, 0, Math.PI * 2);
    ctx.clip();
    for (let i = 0; i < 5; i++) {
      const a = frame * 0.03 + i * 1.25;
      const rr = 12 + i * 11;
      ctx.strokeStyle = 'rgba(' + (140 + i * 20) + ',80,255,' + (0.42 - i * 0.06) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * 8, 46 + Math.sin(a) * 5, rr, rr * 0.55, a, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,240,255,' + (0.12 + 0.3 * t + (open ? 0.3 : 0)) + ')';
    ctx.beginPath();
    ctx.ellipse(0, 46, 20 + (open ? 12 : 0), 12 + (open ? 8 : 0), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // intake vanes
    ctx.strokeStyle = 'rgba(190,200,235,0.75)';
    ctx.lineWidth = 3;
    for (let i = -3; i <= 3; i++) {
      const x = i * 20;
      ctx.beginPath();
      ctx.moveTo(x, 46 - 34 - gape * 0.2);
      ctx.lineTo(x + (open ? i * 4 : 0), 46 - 14 + (open ? -6 : 0));
      ctx.stroke();
    }
    ctx.restore();

    // ---- the void shield while it feeds --------------------------------------
    if (b.devour > 0) {
      const a = 0.25 + 0.2 * Math.sin(frame * 0.2);
      ctx.save();
      ctx.strokeStyle = 'rgba(190,120,255,' + (a + 0.35) + ')';
      ctx.lineWidth = 3;
      ctx.fillStyle = 'rgba(120,60,220,' + a * 0.5 + ')';
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) {
        const ang = (i / 6) * Math.PI * 2 + frame * 0.01;
        const px = Math.cos(ang) * 240, py = Math.sin(ang) * 118;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }

    // ---- star-eater charge ----------------------------------------------------
    if (b.cast && b.cast.kind === 'stareater') {
      const p = 1 - b.cast.t / b.cast.max;
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 52, 6 + 40 * p, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,235,255,' + (0.2 + 0.6 * p) + ')';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,120,220,0.9)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 52, 60 - 50 * p, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  },

  paintWorld(b) {
    ctx.save();

    // ---- the consumed arena ----------------------------------------------
    mothershipPaintVoid(b, 0, 0, b.eatL, H, 1);
    mothershipPaintVoid(b, W - b.eatR, 0, b.eatR, H, 2);
    mothershipPaintVoid(b, 0, H - b.eatB, W, b.eatB, 3);

    // ---- harvest beam telegraph / fire -------------------------------------
    if (b.cast && b.cast.kind === 'harvest' && b.cast.xs) {
      const p = 1 - b.cast.t / b.cast.max;
      for (let i = 0; i < b.cast.xs.length; i++) {
        const x = b.cast.xs[i];
        ctx.strokeStyle = 'rgba(255,120,220,' + (0.12 + 0.4 * p) + ')';
        ctx.lineWidth = 2 + 10 * p;
        ctx.setLineDash([12, 9]);
        ctx.beginPath(); ctx.moveTo(x, b.y + 80); ctx.lineTo(x, H); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
    if (b.beams) {
      for (let i = 0; i < b.beams.xs.length; i++) {
        const x = b.beams.xs[i];
        const gg = ctx.createLinearGradient(x - 24, 0, x + 24, 0);
        gg.addColorStop(0, 'rgba(200,60,255,0)');
        gg.addColorStop(0.5, 'rgba(255,225,255,0.9)');
        gg.addColorStop(1, 'rgba(200,60,255,0)');
        ctx.fillStyle = gg;
        ctx.fillRect(x - 24, b.y + 70, 48, H);
      }
    }

    // ---- the pull ----------------------------------------------------------
    if (b.pull > 0) {
      ctx.strokeStyle = 'rgba(170,110,255,0.35)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 8; i++) {
        const a = frame * 0.02 + i * 0.785;
        const r0 = 90 + ((frame * 3 + i * 40) % 260);
        ctx.beginPath();
        ctx.arc(b.x, b.y + 70, r0, a, a + 0.5);
        ctx.stroke();
      }
    }
    ctx.restore();
  },

  title(b) {
    if (b.devour > 0) return 'THE DEVOURING — SHIELDED';
    const pct = Math.round(((b.eatL + b.eatR) / W) * 100);
    return 'ARENA CONSUMED ' + pct + '% — MAW IS THE WEAK POINT';
  }
};

function mothershipSuite(ph) {
  if (ph <= 1) return ['lance', 'ring'];
  if (ph === 2) return ['lance', 'swarm', 'crossfire'];
  if (ph === 3) return ['ring', 'harvest', 'crossfire'];
  if (ph === 4) return ['wall', 'swarm', 'lance', 'harvest'];
  if (ph === 5) return ['harvest', 'crossfire', 'ring', 'pull'];
  if (ph === 6) return ['stareater', 'wall', 'swarm', 'lance'];
  return ['stareater', 'harvest', 'wall', 'pull', 'crossfire', 'ring', 'swarm'];
}

function mothershipFire(b, ph, cast) {
  const k = cast.kind;
  if (k === 'lance') {
    bossAimed(b.x, b.y + 80, [-0.42, -0.21, 0, 0.21, 0.42], 1.15, 7);
    b.mawOpen = 26;
    Sound.play('laser');

  } else if (k === 'ring') {
    bossRing(b.x, b.y + 60, 18 + ph * 2, 0.62, frame * 0.01, 6);
    bossRing(b.x, b.y + 60, 12, 0.9, frame * 0.02 + 0.3, 5);
    Sound.play('warning');

  } else if (k === 'crossfire') {
    // two sweeping fans from the outer nacelles
    for (let side = -1; side <= 1; side += 2) {
      const ox = b.x + side * 168;
      for (let i = 0; i < 7; i++) {
        bossShot(ox, b.y - 10, Math.PI / 2 + side * (i - 3) * 0.16, 0.85, 5);
      }
    }
    Sound.play('hit');

  } else if (k === 'harvest') {
    b.beams = { t: 72, xs: cast.xs || [b.x] };
    FX.addShake(16);
    Sound.play('laser');

  } else if (k === 'swarm') {
    const kinds = ph >= 6 ? ['harbinger', 'bulwark', 'weaver'] : (ph >= 4 ? ['bulwark', 'lancer', 'weaver'] : ['elite', 'lancer']);
    for (let i = 0; i < 3; i++) {
      if (enemies.length >= 22) break;
      bossMinion(kinds[i % kinds.length], b.x + (i - 1) * 130, b.y + 60);
    }
    b.mawOpen = 34;
    Sound.play('explode');

  } else if (k === 'wall') {
    b.wall = { t: 70, gap: Math.atan2(player.y - b.y, player.x - b.x), rot: 0 };
    Sound.play('warning');

  } else if (k === 'pull') {
    b.pull = 110;
    Sound.play('warning');

  } else if (k === 'stareater') {
    // The big one: a wide column plus a shockwave ring.
    const pl = mothershipPlayable(b);
    b.beams = { t: 90, xs: [b.x - 90, b.x, b.x + 90].filter(function (x) { return x > pl.l - 40 && x < pl.r + 40; }) };
    if (!b.beams.xs.length) b.beams.xs = [b.x];
    bossRing(b.x, b.y + 60, 24, 0.55, frame * 0.01, 7);
    FX.addShake(30);
    FX.hitStop(6);
    b.mawOpen = 90;
    Sound.play('bigExplode');
  }
}

function mothershipPaintVoid(b, x, y, w, h, seed) {
  if (w <= 0 || h <= 0) return;
  ctx.save();
  ctx.fillStyle = 'rgba(2,0,6,0.96)';
  ctx.fillRect(x, y, w, h);
  // static
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  const n = Math.min(70, Math.floor(w * h / 900));
  for (let i = 0; i < n; i++) {
    const r1 = litanyRnd(i * 3.7 + seed * 91 + Math.floor(frame / 3) * 0.37);
    const r2 = litanyRnd(i * 7.1 + seed * 17 + Math.floor(frame / 3) * 0.61);
    ctx.fillStyle = 'rgba(190,140,255,' + (0.1 + r1 * 0.35) + ')';
    ctx.fillRect(x + r1 * w, y + r2 * h, 2, 2);
  }
  // torn edge
  ctx.strokeStyle = 'rgba(200,120,255,0.8)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if (seed === 3) {
    for (let px = x; px <= x + w; px += 12) {
      const py = y + mothershipVoidEdge(px, px, seed);
      if (px === x) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  } else {
    const ex = seed === 1 ? x + w : x;
    for (let py = y; py <= y + h; py += 12) {
      const px = ex + mothershipVoidEdge(ex, py, seed);
      if (py === y) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
  }
  ctx.stroke();
  ctx.restore();
}


// ===========================================================================
// L1100-2400 — WARR ARMADA
// ---------------------------------------------------------------------------
// A command ship running two captured doctrines. It alternates between the
// behaviours of the two bosses in b.composite, driven by real delegation:
// each source gets its own private boss-record (so their state cannot collide
// with each other's or with mine) and its own init/onPhase, and its think()
// is called with that record. Anything that throws is retired for the rest of
// the fight and the escort fleet covers for it.
//
// Escorts are the ARMADA's own mechanic: four (later six) frigates fly cover
// and physically intercept shots that pass through them.
// ===========================================================================

function armadaSourcePhases(key) {
  try {
    const t = RLCore.BOSS_TABLE;
    for (let i = 0; i < t.length; i++) if (t[i].key === key) return t[i].phases;
  } catch (e) { /* ignore */ }
  return 3;
}

function armadaMakeSub(b, key) {
  const sub = {
    x: b.x, y: b.y, targetY: b.targetY,
    hp: b.hp, maxHp: b.maxHp,
    key: key, name: key.toUpperCase(),
    maxPhases: armadaSourcePhases(key),
    phase: 1, entering: false, dying: 0, deathTick: 0,
    flash: 0, attackTimer: 0, minionTimer: 0,
    laser: null, beamCooldown: 0,
    tier: b.tier, composite: null, ascendant: 0,
    broken: false, lastPhase: 0
  };
  const def = BOSS[key];
  if (!def || typeof def.think !== 'function') { sub.broken = true; return sub; }
  try { if (def.init) def.init(sub); }
  catch (e) { sub.broken = true; }
  return sub;
}

function armadaRunSub(b, sub, ph) {
  if (!sub || sub.broken) return false;
  const def = BOSS[sub.key];
  if (!def || typeof def.think !== 'function') { sub.broken = true; return false; }
  // keep the source's world-view honest
  sub.x = b.x; sub.y = b.y;
  sub.hp = b.hp; sub.maxHp = b.maxHp;
  sub.flash = b.flash;
  const mapped = Math.max(1, Math.min(sub.maxPhases, Math.round(ph / b.maxPhases * sub.maxPhases) || 1));
  try {
    if (mapped !== sub.lastPhase) {
      sub.lastPhase = mapped;
      sub.phase = mapped;
      sub.attackTimer = 0;
      if (def.onPhase) def.onPhase(sub, mapped);
    }
    sub.phase = mapped;
    sub.attackTimer++;
    def.think(sub, mapped);
    return true;
  } catch (e) {
    sub.broken = true;
    addFlashText('DOCTRINE LOST', b.x, b.y - 40, '#ff8866');
    return false;
  }
}

BOSS.armada = {
  w: 200, h: 90,
  init(b) {
    const pair = b.composite && b.composite.length === 2 ? b.composite : ['generic', 'generic'];
    b.srcKeys = pair;
    b.subs = [armadaMakeSub(b, pair[0]), armadaMakeSub(b, pair[1])];
    b.lead = 0;
    b.swap = 0;
    b.escorts = [];
    for (let i = 0; i < 4; i++) {
      b.escorts.push({
        a: (i / 4) * Math.PI * 2, r: 86 + (i % 2) * 22, sp: 0.011 * (i % 2 ? -1 : 1),
        hp: b.maxHp * 0.05, max: b.maxHp * 0.05, dead: false, fire: 40 + i * 33,
        ox: 0, oy: 0
      });
    }
    b.reinforced = false;
    b.bob = 0;
    b.salvo = 0;
  },

  onPhase(b, ph) {
    // Doctrine swap: odd phases run source A, even phases run source B.
    b.lead = (ph - 1) % 2;
    b.swap = 40;
    addFlashText('DOCTRINE ' + (b.lead ? 'BETH' : 'ALEPH'), b.x, b.y - 46, '#88ddff');
    Sound.play('bossPhase');
    if (ph >= 3 && !b.reinforced) {
      b.reinforced = true;
      for (let i = 0; i < 2; i++) {
        b.escorts.push({
          a: Math.PI * i, r: 120, sp: 0.014, hp: b.maxHp * 0.04, max: b.maxHp * 0.04,
          dead: false, fire: 60 + i * 40, ox: 0, oy: 0
        });
      }
      addFlashText('RESERVE WING', b.x, b.y + 40, '#ffcc66');
    }
  },

  damage(b, bl, dmg) {
    // Escorts physically screen the command ship.
    for (let i = 0; i < b.escorts.length; i++) {
      const e = b.escorts[i];
      if (e.dead) continue;
      const dx = bl.x - (b.x + e.ox), dy = bl.y - (b.y + e.oy);
      if (dx * dx + dy * dy < 22 * 22) {
        e.hp -= dmg;
        spawnParticles(bl.x, bl.y, '#88ccff', 3);
        if (e.hp <= 0) {
          e.dead = true;
          FX.explode(b.x + e.ox, b.y + e.oy, 30, '#99ddff');
          FX.addShake(10);
          Sound.play('explode');
          addFlashText('ESCORT DOWN', b.x + e.ox, b.y + e.oy, '#aaddff');
        }
        return 0;
      }
    }
    return dmg;
  },

  move(b) {
    b.bob += 0.024;
    b.x += Math.sign(player.x - b.x) * Math.min(1.05, Math.abs(player.x - b.x));
    b.x = litanyClamp(b.x, 104, W - 104);
    b.y = b.targetY + Math.sin(b.bob) * 7;
  },

  think(b, ph) {
    if (b.swap > 0) b.swap--;

    // ---- escorts fly cover and shoot ---------------------------------------
    let alive = 0;
    for (let i = 0; i < b.escorts.length; i++) {
      const e = b.escorts[i];
      if (e.dead) continue;
      alive++;
      e.a += e.sp * (1 + ph * 0.16);
      e.ox = Math.cos(e.a) * e.r;
      e.oy = Math.sin(e.a) * e.r * 0.42;
      e.fire--;
      if (e.fire <= 0) {
        e.fire = Math.max(70, 190 - ph * 24) + Math.floor(litanyRnd(frame + i) * 50);
        bossAimed(b.x + e.ox, b.y + e.oy, [0], 1.0, 4);
      }
    }

    // ---- delegate to the captured doctrine ----------------------------------
    const sub = b.subs[b.lead];
    const ran = armadaRunSub(b, sub, ph);
    if (!ran) {
      // Fallback: the ARMADA fights as itself — massed escort barrages.
      if (b.salvo > 0) {
        b.salvo--;
        if (b.salvo % 7 === 0) {
          for (let i = 0; i < b.escorts.length; i++) {
            const e = b.escorts[i];
            if (e.dead) continue;
            bossShot(b.x + e.ox, b.y + e.oy, Math.PI / 2 + (litanyRnd(frame + i) - 0.5) * 0.7, 0.9, 5);
          }
        }
      } else if (b.attackTimer >= Math.max(50, 110 - ph * 12)) {
        b.attackTimer = 0;
        const pick = Math.floor(litanyRnd(frame) * 3);
        if (pick === 0) { b.salvo = 48; Sound.play('warning'); }
        else if (pick === 1) { bossRing(b.x, b.y, 14 + ph * 2, 0.7, frame * 0.02, 5); Sound.play('hit'); }
        else {
          bossAimed(b.x, b.y + 30, [-0.35, -0.12, 0.12, 0.35], 1.1, 6);
          if (enemies.length < 18) bossMinion(ph >= 3 ? 'bulwark' : 'elite', b.x, b.y + 40);
          Sound.play('hit');
        }
      }
    }

    // ---- the command ship always adds its own fire, so the two doctrines
    // ---- never feel like a straight replay of the original fight ----------
    if (b.attackTimer % Math.max(38, 96 - ph * 12) === 0 && b.attackTimer > 0) {
      bossAimed(b.x, b.y + 34, ph >= 3 ? [-0.28, 0, 0.28] : [0], 1.05, 5);
    }
    if (alive === 0 && frame % 240 === 0 && enemies.length < 16) {
      bossMinion('lancer', b.x - 60, b.y + 40);
      bossMinion('lancer', b.x + 60, b.y + 40);
    }
  },

  paint(b) {
    const accent = bossTint(b, '#7fd0ff', '#ffcf74', '#ff6a6a');

    // ---- escorts (drawn around the command ship) ---------------------------
    for (let i = 0; i < b.escorts.length; i++) {
      const e = b.escorts[i];
      if (e.dead) continue;
      const behind = Math.sin(e.a) < 0;
      ctx.save();
      ctx.translate(e.ox, e.oy);
      ctx.globalAlpha = behind ? 0.65 : 1;
      const s = behind ? 0.85 : 1;
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, 16); ctx.lineTo(-15, -6); ctx.lineTo(-6, -13);
      ctx.lineTo(6, -13); ctx.lineTo(15, -6);
      ctx.closePath();
      ctx.fillStyle = '#2e3a4c';
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      const frac = e.hp / e.max;
      ctx.fillStyle = frac > 0.5 ? '#8fe6a0' : (frac > 0.22 ? '#ffcc55' : '#ff5544');
      ctx.fillRect(-14, -20, 28 * Math.max(0, frac), 2.5);
      ctx.fillStyle = accent;
      ctx.beginPath(); ctx.arc(0, 2, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // ---- command ship --------------------------------------------------------
    ctx.beginPath();
    ctx.moveTo(0, 46);
    ctx.lineTo(-46, 16);
    ctx.lineTo(-100, 6);
    ctx.lineTo(-78, -22);
    ctx.lineTo(-30, -34);
    ctx.lineTo(30, -34);
    ctx.lineTo(78, -22);
    ctx.lineTo(100, 6);
    ctx.lineTo(46, 16);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -34, 0, 46);
    g.addColorStop(0, '#71809a');
    g.addColorStop(0.55, '#333c4e');
    g.addColorStop(1, '#101520');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2.5;
    ctx.stroke();
    bossFlash(b);

    // doctrine bars — two slots, the live one lit
    for (let i = 0; i < 2; i++) {
      const on = i === b.lead;
      ctx.fillStyle = on ? accent : 'rgba(120,140,170,0.3)';
      ctx.fillRect(-34 + i * 40, -28, 28, 6);
      if (on && b.swap > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (b.swap / 40) + ')';
        ctx.fillRect(-34 + i * 40, -28, 28, 6);
      }
    }
    // fleet hardpoints
    ctx.fillStyle = '#1b222e';
    [-72, -46, 46, 72].forEach(function (x) { ctx.fillRect(x - 6, 2, 12, 16); });
    ctx.fillStyle = accent;
    [-72, -46, 46, 72].forEach(function (x, i) {
      const p = 0.3 + 0.6 * Math.abs(Math.sin(frame * 0.08 + i));
      ctx.globalAlpha = p;
      ctx.fillRect(x - 4, 16, 8, 3);
      ctx.globalAlpha = 1;
    });
    // bridge
    ctx.beginPath();
    ctx.ellipse(0, -12, 22, 11, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#0d1420';
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,200,' + (0.5 + 0.4 * Math.sin(frame * 0.11)) + ')';
    for (let i = -2; i <= 2; i++) ctx.fillRect(i * 8 - 2, -14, 4, 4);
    // prow lance
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 46); ctx.lineTo(0, 60); ctx.stroke();
  },

  paintWorld(b) {
    // formation lines, so it reads as a fleet rather than a sprite with dots
    ctx.save();
    ctx.strokeStyle = 'rgba(140,200,255,0.16)';
    ctx.lineWidth = 1;
    for (let i = 0; i < b.escorts.length; i++) {
      const e = b.escorts[i];
      if (e.dead) continue;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + e.ox, b.y + e.oy);
      ctx.stroke();
    }
    ctx.restore();

    // The captured doctrine's WORLD-space pass, and only that pass. Several
    // source bosses hurt you from something they only draw here (the Widow's
    // tether above all), so delegating think() without this would mean
    // invisible damage. The hull is still drawn as the ARMADA's own.
    const sub = b.subs && b.subs[b.lead];
    if (!sub || sub.broken) return;
    const def = BOSS[sub.key];
    if (!def || !def.paintWorld) return;
    ctx.save();
    try { def.paintWorld(sub); }
    catch (e) { sub.broken = true; }
    ctx.restore();
  },

  title(b) {
    let alive = 0;
    for (let i = 0; i < b.escorts.length; i++) if (!b.escorts[i].dead) alive++;
    const sub = b.subs[b.lead];
    const name = sub ? (sub.broken ? 'ARMADA DOCTRINE' : sub.key.toUpperCase()) : 'ARMADA';
    return 'ESCORTS ' + alive + '/' + b.escorts.length + ' — RUNNING: ' + name;
  }
};
// ---- end boss pack: boss_d ----

const BOSS_W = 112, BOSS_H = 54;

function bossMaxHp(lv) {
  // Hand-set per boss, fitted so a reasonable build at that level kills it in
  // its target time. See the boss table in the pure core.
  return RLCore.bossHp(lv);
}

function bossDef(b) { return (b && BOSS[b.key]) || BOSS.generic; }

function spawnBoss(lv) {
  const info = RLCore.bossFor(lv);
  const hp = info ? info.hp : RLCore.fittedBossHp(lv);
  boss = {
    x: W/2, y: -70, targetY: 150,
    hp, maxHp: hp,
    key: info ? info.key : 'generic',
    name: info ? info.name : 'UNKNOWN CONTACT',
    maxPhases: info ? info.phases : 3,
    composite: info ? info.composite : null,
    ascendant: info ? info.ascendant : 0,
    tier: Math.max(1, Math.round(lv / 10)),
    phase: 1, entering: true, flash: 0,
    attackTimer: 0, minionTimer: 0,
    laser: null, beamCooldown: 0,
    dying: 0, deathTick: 0
  };
  const def = bossDef(boss);
  if (def.init) def.init(boss);
  bossActive = true;
  bossWarning = 110;
  levelBanner = null;          // the warning owns the screen
  Sound.play('warning');
  Music.setBoss(true);
}

// Phases are even slices of the health bar, so a seven-phase mothership and a
// two-phase Scrapjaw both change at predictable, readable moments.
function bossPhaseFor(b) {
  const n = Math.max(1, b.maxPhases || 3);
  const f = b.hp / b.maxHp;
  return Math.min(n, Math.max(1, n - Math.floor(f * n)));
}

function updateBoss() {
  const b = boss;
  const def = bossDef(b);

  // ---- death cascade ----
  if (b.dying > 0) {
    b.dying--;
    b.deathTick++;
    if (b.deathTick % 5 === 0) {
      FX.explode(b.x + (Math.random()-0.5)*bossHalfW(b)*2, b.y + (Math.random()-0.5)*bossHalfH(b)*2, 26 + Math.random()*18, '#ffbb33');
      FX.addShake(10);
      Sound.play('explode');
    }
    if (b.dying === 0) {
      FX.explode(b.x, b.y, 90, '#ffdd66');
      FX.addShake(30);
      FX.hitStop(8);
      FX.slowMo(60, 0.3);
      Sound.play('bigExplode');
      const pts = 2000 * b.tier;
      score += pts;
      // The boss is the biggest kill in the game and used to pay no scrap at
      // all, because it never went through killEnemy. Routed through
      // scrapForKill so SCRAP MAGNET and SALVAGE RIG apply here too.
      const bossScrap = RLCore.scrapForKill(pts, stats.scrapMul, level);
      scrap += bossScrap;
      addFlashText('+' + pts.toLocaleString(), b.x, b.y, '#ffdd44');
      addFlashText('+' + bossScrap.toLocaleString() + ' SCRAP', b.x, b.y + 24, '#ffdd44');
      levelBanner = { text: b.name.length > 22 ? 'BOSS DOWN' : b.name + ' DOWN', life: 140 };
      Save.data.bossesKilled[b.key] = (Save.data.bossesKilled[b.key] || 0) + 1;
      Save.write();
      boss = null; bossActive = false;
      Music.setBoss(false);
    }
    return;
  }

  if (b.flash > 0) b.flash--;

  // ---- entrance ----
  if (b.entering) {
    b.y += 1.6;
    if (b.y >= b.targetY) { b.y = b.targetY; b.entering = false; }
    return;                              // no attacks until it's in position
  }

  // ---- movement ----
  // A boss may override this entirely; the default is a lazy drift toward the
  // player so it stays a presence rather than a stationary target.
  if (def.move) def.move(b);
  else {
    b.x += Math.sign(player.x - b.x) * Math.min(1.2, Math.abs(player.x - b.x));
    b.x = Math.max(bossHalfW(b), Math.min(W - bossHalfW(b), b.x));
  }

  // ---- phase transitions ----
  const p = bossPhaseFor(b);
  if (p !== b.phase) {
    b.phase = p;
    b.flash = 10;
    b.attackTimer = 0;
    b.laser = null;
    FX.addShake(14);
    Sound.play('bossPhase');
    // No generic "PHASE n" banner here: the bar already shows the phase, and
    // several bosses announce something far more useful of their own. Two
    // overlapping captions is worse than one good one.
    if (def.onPhase) def.onPhase(b, p);
  }

  b.attackTimer++;
  def.think(b, b.phase);

  // Death is checked HERE as well as in the bullet loop below. A boss may damage
  // itself — Voidgate weakens as its mirrors die — and if the only death check
  // lived in the bullet loop, such a boss could sit at zero health with an empty
  // bar and keep fighting until a shot happened to clip its hull.
  if (b.hp <= 0 && b.dying === 0) bossBeginDeath(b);

  // ---- taking fire ----
  const hw = bossHalfW(b), hh = bossHalfH(b);
  bullets.forEach(bl => {
    if (bl.dead) return;
    if (Math.abs(bl.x - b.x) < hw && Math.abs(bl.y - b.y) < hh) {
      if (bl.pierce > 0) bl.pierce--; else bl.dead = true;
      // SIEGE OPTICS / SIEGE ENGINE only ever apply here, which is the whole
      // point of them: they are a boss-fight investment, not a general one.
      let dmg = bl.damage * stats.bossDamageMul;
      // A boss may absorb, deflect, or ignore a hit entirely — plates, shield
      // gaps, hangar bays. Returning 0 means "nothing landed".
      if (def.damage) dmg = def.damage(b, bl, dmg);
      if (dmg > 0) {
        b.hp -= dmg;
        b.flash = Math.max(b.flash, 2);
        spawnParticles(bl.x, bl.y, '#ffaa44', 3);
      }

      // FLAK BURST / CHAIN LIGHTNING / SPLIT SHOT during a boss fight.
      // applySplash/applyChain only ever touch the `enemies` array, so this
      // cannot double-damage the boss itself — it lets those upgrades still
      // do something (hit whatever minions the boss has spawned) instead of
      // going dead silent for the entire fight.
      if (bl.splash > 0) applySplash(bl.x, bl.y, bl.splash, bl.damage * 0.6);
      if (stats.chain > 0) applyChain(bl.x, bl.y, stats.chain, bl.damage * 0.5);
      if (bl.split && !bl.isSplit) {
        [-0.5, 0.5].forEach(a => bullets.push({
          x: bl.x, y: bl.y,
          vx: Math.sin(a) * BULLET_SPEED, vy: -Math.cos(a) * BULLET_SPEED,
          w: 3, h: 10, pierce: 0, damage: bl.damage * 0.5, homing: 0, splash: 0,
          burn: 0, chill: 0, bounces: 0,
          split: false, isSplit: true, crit: false, dead: false
        }));
      }

      if (b.hp <= 0 && b.dying === 0) bossBeginDeath(b);
    }
  });
}

// One place where a boss starts dying, so every path that can kill one — a
// bullet, splash, or the boss damaging itself — behaves identically.
function bossBeginDeath(b) {
  b.hp = 0;
  b.dying = 45; b.deathTick = 0;
  runKills++;
  enemyBullets = [];
  // Bosses that displace the pilot (Magnetar drags you around on a magnetic
  // leash) stop thinking the instant they start dying, so the release has to
  // happen here or the offset would persist for the rest of the run.
  releasePlayerPosition();
  Sound.play('explode');
}

// The pilot's resting position. Anything that moves the player as a mechanic
// must be undone against this, not against wherever the ship happened to be.
const PLAYER_HOME_Y = H - 120;

function releasePlayerPosition() { player.y = PLAYER_HOME_Y; }

let nextFormationId = 1;

// Coordinated waves. Members share a formationId so clearing the whole group
// can be rewarded.
function spawnFormation(type) {
  const id = nextFormationId++;
  const d = difficulty();
  if (type === 'vee') {
    const cx = 100 + Math.random()*(W - 200);
    for (let i = -2; i <= 2; i++) {
      const e = makeEnemy('grunt');
      e.x = cx + i*38;
      e.y = -30 - Math.abs(i)*28;
      e.vx = 0; e.vy = d.enemySpeed * 0.85;
      e.zigzagDir = 0; e.formationId = id;
      enemies.push(e);
    }
  } else {
    for (let i = 0; i < 4; i++) {
      const e = makeEnemy('grunt');
      e.baseX = 80 + i*((W - 160)/3);
      e.x = e.baseX; e.y = -30 - i*10;
      e.vx = 0; e.vy = d.enemySpeed * 0.55;
      e.zigzagDir = 0; e.sweep = true; e.formationId = id;
      enemies.push(e);
    }
  }
  return id;
}

const BULLET_SPEED = 11;

// Nearest live target, boss included. Shared by GIMBAL MOUNT and TRACER
// ROUNDS so the line you are shown and the line you shoot always agree.
function nearestTarget(x, y) {
  let best = null, bestD = 1e9;
  enemies.forEach(e => {
    if (e.dead) return;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bestD) { bestD = d; best = e; }
  });
  if (boss && !boss.entering && boss.dying === 0) {
    const d = (boss.x - x) ** 2 + (boss.y - y) ** 2;
    if (d < bestD) { bestD = d; best = boss; }
  }
  return best;
}

function fireWeapon() {
  overchargeCount++;
  // OVERCHARGE (every Nth shot) and the crit stat are one system: whichever
  // fires, the shot crits once and pays out once. Rolling them separately
  // would let a single bullet multiply twice.
  const timed = stats.overcharge > 0 && overchargeCount % stats.overcharge === 0;
  const rolled = stats.critChance > 0 && Math.random() < stats.critChance;
  const crit = timed || rolled;
  const dmg = stats.damage * (crit ? stats.critMul : 1);
  const speed = BULLET_SPEED * stats.bulletSpeedMul;

  // GIMBAL MOUNT: the whole pattern rotates toward the nearest enemy, but
  // only up to aimCone. It closes the gap on a target off to your side
  // without ever becoming the auto-aim that HUNTER ROUNDS is.
  let bias = 0;
  if (stats.aimCone > 0) {
    const t = nearestTarget(player.x, player.y);
    if (t) {
      const want = Math.atan2(t.x - player.x, -(t.y - player.y));
      bias = Math.max(-stats.aimCone, Math.min(stats.aimCone, want));
    }
  }

  RLCore.buildShots(stats).forEach(s => {
    const a = s.a + (s.needle ? 0 : bias);
    bullets.push({
      x: player.x + s.dx, y: player.y + s.dy,
      vx: Math.sin(a) * speed,
      vy: -Math.cos(a) * speed,
      // THE NEEDLE is one screen-height lance that never stops.
      w: s.needle ? 7 : 3, h: s.needle ? 26 : 10,
      pierce: s.needle ? 9999 : stats.pierce,
      damage: s.needle ? dmg * 2.2 : dmg,
      homing: stats.homing,
      splash: stats.splash, split: stats.split, crit,
      burn: stats.burn, chill: stats.chill,
      bounces: stats.ricochet,
      needle: !!s.needle,
      dead: false
    });
  });
  player.muzzle = 3;
  Sound.play('laser');
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random()*Math.PI*2;
    let speed = 1.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 30 + Math.random()*30, maxLife: 60,
      r: 1.5+Math.random()*3,
      color, type: Math.random() < 0.3 ? 'spark' : 'dot'
    });
  }
}

// ---- ORBITAL DRONE ----
// stats.drones can rise (upgrade picked up) or fall (a hit strips it), so this
// must reconcile the drones[] array in both directions, not just grow it.
function syncDrones() {
  while (drones.length < stats.drones) drones.push({ angle: drones.length * Math.PI, fire: 0 });
  while (drones.length > stats.drones) drones.pop();
}

function updateDrones() {
  drones.forEach(d => {
    d.angle += 0.03;
    d.x = player.x + Math.cos(d.angle) * 46;
    d.y = player.y + Math.sin(d.angle) * 32;
    if (--d.fire <= 0) {
      d.fire = stats.dronesCopyGun ? Math.max(8, Math.round(stats.fireRate)) : 22;
      // Carries the full bullet field set the collision code in update()
      // reads (pierce/damage/homing/splash/split/crit/burn/chill/bounces/dead)
      // — matching fireWeapon()'s shape so a drone bullet can't leave any of
      // these undefined and corrupt the damage arithmetic.
      //
      // MIRROR WING / IRON SWARM give the drones your actual gun instead of
      // the stock peashooter, which is what makes them worth their tier.
      const copy = stats.dronesCopyGun;
      bullets.push({
        x: d.x, y: d.y - 6, vx: 0, vy: -BULLET_SPEED * (copy ? stats.bulletSpeedMul : 1),
        w: copy ? 3 : 2, h: copy ? 10 : 8,
        pierce: copy ? stats.pierce : 0,
        damage: stats.damage * (copy ? 0.75 : 0.5),
        homing: copy ? stats.homing : 0,
        splash: copy ? stats.splash : 0,
        split: copy ? stats.split : false,
        burn: copy ? stats.burn : 0,
        chill: copy ? stats.chill : 0,
        bounces: copy ? stats.ricochet : 0,
        crit: false, dead: false
      });
    }
  });
}

function drawDrones() {
  drones.forEach(d => {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.fillStyle = '#ffaa22';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffdd88'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  });
}

// ---- SINGULARITY ----
// Drags nearby enemies inward and grinds them down at close range. Damage is
// routed through damageEnemy (not a direct e.hp-- / killEnemy) so mines still
// arm instead of dying outright — see damageEnemy's comment for why that
// decision must live in exactly one place.
// EVENT HORIZON runs three of these at once, evenly spaced on the same orbit.
// `singularity` stays the first one so drawSingularity and anything else that
// reads a single hole keeps working; the rest live in singularityExtra.
let singularityExtra = [];

function updateSingularity() {
  const n = stats.singularityCount;
  if (n <= 0) { singularity = null; singularityExtra = []; return; }
  if (!singularity) singularity = { angle: 0 };
  singularity.angle += 0.02;

  const holes = [];
  for (let i = 0; i < n; i++) {
    const a = singularity.angle + (i * Math.PI * 2) / n;
    holes.push({ x: player.x + Math.cos(a) * 70, y: player.y + Math.sin(a) * 52 });
  }
  singularity.x = holes[0].x; singularity.y = holes[0].y;
  singularityExtra = holes.slice(1);

  enemies.forEach(e => {
    if (e.dead) return;
    holes.forEach(h => {
      if (e.dead) return;
      const dx = h.x - e.x, dy = h.y - e.y;
      const d = Math.max(Math.hypot(dx, dy), 0.001); // guard div-by-zero if exactly co-located
      if (d < 120) {
        e.x += (dx / d) * 1.6; e.y += (dy / d) * 1.6;
        // Scales with your damage so it does not become a rounding error at
        // depth, the way a flat 0.5 did.
        if (d < 26) damageEnemy(e, Math.max(0.5, stats.damage * 0.05));
      }
    });
  });
}

function drawOneSingularity(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
  g.addColorStop(0, '#000000');
  g.addColorStop(0.6, 'rgba(120,0,200,0.7)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,120,255,0.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(frame*0.1)*2, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawSingularity() {
  if (!singularity) return;
  drawOneSingularity(singularity);
  singularityExtra.forEach(drawOneSingularity);
}

// TRACER ROUNDS: shows where the nearest target is, and nothing more. All of
// the information HUNTER ROUNDS gives you, none of the aiming — which is why
// one is a RARE and the other is an APEX.
function drawTracer() {
  if (!stats || !stats.tracer) return;
  const t = nearestTarget(player.x, player.y);
  if (!t) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(120,255,200,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 12);
  ctx.lineTo(t.x, t.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(120,255,200,0.6)';
  ctx.beginPath(); ctx.arc(t.x, t.y, 14, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

// Single definition of "what happens when an enemy takes damage". Every path
// that can hurt an enemy — the direct bullet/enemy collision, applySplash and
// applyChain — routes through here so they can't disagree about it. In
// particular: a mine is supposed to arm (not die outright) once its hp hits
// zero, however that damage arrived. Before this existed, applySplash and
// applyChain called killEnemy directly with no mine check at all, so FLAK
// BURST/CHAIN LIGHTNING silently killed mines instead of letting them arm and
// detonate — including a *directly*-hit mine, since a mine's 2 hp is often
// wiped out by the splash from its own impact before a per-site special case
// would ever get a turn to run.
// The single damage path. `hitX` is optional and only the BULWARK DRONE reads
// it: a shield plate covers its underside, so shots landing under its centre
// hit the plate while shots landing on its flanks reach the hull. That is the
// answer to "how do I deal with the thing sitting off to my side" — you go
// wide and shoot in, rather than sitting under it.
function damageEnemy(e, dmg, hitX) {
  if (e.dead) return;
  if (e.kind === 'bulwark' && e.plate > 0) {
    const flank = typeof hitX === 'number' && Math.abs(hitX - e.x) > ENEMY.bulwark.r * 0.55 * (e.scale || 1);
    if (!flank) {
      e.plate -= dmg;
      e.flash = 3;
      if (e.plate <= 0) {
        e.plate = 0;
        spawnParticles(e.x, e.y + 12, '#88ffaa', 16);
        FX.addShake(8);
        Sound.play('shieldBreak');
      }
      return;                       // the plate ate it; the hull is untouched
    }
  }
  // KINETIC VERDICT: the first hit of each level bites a flat slice out of
  // whatever it lands on, however large. One per level, tracked on the run.
  if (stats.verdict > 0 && !verdictSpent) {
    verdictSpent = true;
    dmg += e.maxHp * stats.verdict;
    addFlashText('VERDICT', e.x, e.y - 20, '#ffffff');
    FX.addShake(10);
  }
  e.hp -= dmg;
  e.flash = 4;

  // EXECUTIONER / THE LAST WORD: below the threshold it simply ends.
  if (e.hp > 0 && stats.execute > 0 && e.maxHp > 0 && e.hp / e.maxHp < stats.execute) {
    e.hp = 0;
    spawnParticles(e.x, e.y, '#ffffff', 10);
  }

  if (e.hp <= 0) {
    if (e.kind === 'mine') { e.hp = 1; if (e.arming === 0) e.arming = 30; }
    else killEnemy(e);
  }
}

// INCENDIARY and CRYO ROUNDS. Applied after the hit lands so a killing blow
// does not waste them, and stored on the enemy so the pure core stays out of
// per-frame state.
function applyOnHitEffects(e, b) {
  if (e.dead) return;
  if (b.burn > 0) { e.burnDps = Math.max(e.burnDps || 0, b.damage * b.burn / 2); e.burnLeft = 120; }
  if (b.chill > 0) { e.chill = Math.max(e.chill || 0, b.chill); e.chillLeft = 120; }
}

function tickStatusEffects() {
  enemies.forEach(e => {
    if (e.dead) return;
    if (e.burnLeft > 0) {
      e.burnLeft--;
      damageEnemy(e, e.burnDps / 60);
      if (frame % 8 === 0) spawnParticles(e.x, e.y, '#ff8833', 1);
    }
    if (e.chillLeft > 0) e.chillLeft--; else e.chill = 0;
  });
}

// Flak Burst: on-impact AoE against nearby enemies. Deliberately does not
// call itself (or trigger further splash) — one blast per impact.
function applySplash(x, y, radius, damage) {
  if (radius <= 0) return;
  enemies.forEach(e => {
    if (e.dead) return;
    if ((e.x - x) ** 2 + (e.y - y) ** 2 <= radius * radius) {
      damageEnemy(e, damage);
    }
  });
  FX.explode(x, y, radius * 0.7, '#ffaa44');
}

// Chain Lightning: arcs to the nearest un-hit enemy within range, up to `hops`
// times. Bounded by the hop count, so it cannot recurse indefinitely.
function applyChain(x, y, hops, damage) {
  let from = { x, y };
  const hit = [];
  for (let i = 0; i < hops; i++) {
    let best = null, bestD = 1e9;
    enemies.forEach(e => {
      if (e.dead || hit.includes(e)) return;
      const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2;
      // Skip anything essentially co-located with the current arc origin —
      // on hop 0 that's the enemy the bullet just hit directly, and without
      // this the chain wastes its first hop re-hitting the same target
      // instead of arcing out to a nearby one.
      if (d < 4) return;
      if (d < bestD && d < 160 * 160) { bestD = d; best = e; }
    });
    if (!best) return;
    hit.push(best);
    spawnParticles(best.x, best.y, '#88ddff', 6);
    damageEnemy(best, damage);
    from = best;
  }
}

function comboMultiplier() {
  return Math.max(1, Math.min(CFG.maxComboMultiplier, Math.floor(combo/3)));
}

function killEnemy(e) {
  const st = ENEMY[e.kind];
  e.dead = true;
  runKills++;
  FX.explode(e.x, e.y, st.boom, st.color);
  FX.addShake(st.shake);
  if (st.hitStop) FX.hitStop(st.hitStop);
  Sound.play('explode');

  const multiplier = comboMultiplier();
  score += st.points * multiplier;
  // Scrap deliberately ignores the combo multiplier — score rewards a hot
  // streak, but the shop economy stays predictable only if scrap does not.
  scrap += RLCore.scrapForKill(st.points, stats.scrapMul, level);
  // Vampiric Core: a life back every stats.lifePerKills kills.
  if (stats.lifePerKills > 0) {
    killsSinceLife++;
    if (killsSinceLife >= stats.lifePerKills) {
      killsSinceLife = 0; lives++;
      addFlashText('+1 LIFE', player.x, player.y - 40, '#44ff88');
    }
  }
  // KILL SHIELD: a charge back every N kills, capped by the same ceiling
  // every other shield source respects.
  if (stats.shieldPerKills > 0) {
    killsSinceShield++;
    if (killsSinceShield >= stats.shieldPerKills) {
      killsSinceShield = 0;
      if (player.shieldCharges < RLCore.MAX_SHIELD_CHARGES) {
        player.shieldCharges++;
        addFlashText('+SHIELD', player.x, player.y - 40, '#66ddff');
      }
    }
  }
  combo++; comboTimer = 120;
  addFlashText('+' + st.points*multiplier, e.x, e.y - 10, st.color);

  // Clearing an entire formation pays a bonus.
  if (e.formationId) {
    const remaining = enemies.some(o => o !== e && !o.dead && o.formationId === e.formationId);
    if (!remaining) {
      score += 500;
      addFlashText('FORMATION! +500', W/2, e.y - 34, '#66ffcc');
      FX.hitStop(3);
      Sound.play('levelUp');
    }
  }
}

function addFlashText(text, x, y, color) {
  flashText.push({text, x, y, life: 60, color, vy: -1.2});
}

function hitPlayer() {
  if (player.invincible > 0) return;
  // Phase Drive: a banked free hit that recharges on its own clock. Spent
  // before the shield and before Phantom's once-per-level slip, because it is
  // the only one of the three that comes back by itself.
  if (stats.phaseDrive && player.phaseCharge > 0) {
    player.phaseCharge = 0;
    player.phaseDriveTimer = 0;
    player.invincible = 70;
    addFlashText('PHASE DRIVE', player.x, player.y - 34, '#aa66ff');
    spawnParticles(player.x, player.y, '#aa66ff', 18);
    FX.addShake(8);
    Sound.play('shieldBreak');
    return;
  }
  // Plating / Fortress / Kinetic Barrier all just add to this same charge
  // count — one system, no separate timer.
  if (player.shieldCharges > 0) {
    // BULWARK FIELD sometimes gives the charge straight back.
    if (!(stats.shieldRefund > 0 && Math.random() < stats.shieldRefund)) {
      player.shieldCharges--;
    } else {
      addFlashText('HELD', player.x, player.y - 34, '#88ffcc');
    }
    // PHALANX widens the window after a break so a burst cannot strip every
    // charge in a handful of frames.
    player.invincible = Math.max(60, stats.shieldIframes);
    FX.addShake(10);
    FX.explode(player.x, player.y, 22, '#00ffff');
    // REACTIVE ARMOUR turns a blocked hit into a counterattack.
    if (stats.thorns) {
      applySplash(player.x, player.y, 110, stats.damage * 6);
      spawnParticles(player.x, player.y, '#ffdd66', 22);
      FX.addShake(14);
    }
    Sound.play('shieldBreak');
    return;
  }
  // Phantom slips through one hit per level.
  if (player.phaseReady) {
    player.phaseReady = false;
    player.invincible = 70;
    addFlashText('PHASED', player.x, player.y - 34, '#cc88ff');
    spawnParticles(player.x, player.y, '#cc88ff', 16);
    FX.addShake(6);
    Sound.play('shieldBreak');
    return;
  }
  // ---- Task 8: hit penalty ----
  // Only a hit that actually lands (past both the shield and phase early
  // returns above) strips an upgrade. Self-contained on purpose: a later
  // task's shield logic will touch the rest of hitPlayer, not this block.
  // ABSOLUTION (HYPERCLOCKED) switches this off entirely; GREED ENGINE makes
  // it cost two. Both read through stats so the rule stays in one place.
  if (!stats.noStrip) {
    const res = RLCore.stripN(runUpgrades, stats.strips);
    runUpgrades = res.owned;
    if (res.removed) {
      runUpgradesVersion++;
      const t = RLCore.tierOf(RLCore.effectiveTier(RLCore.byId(res.removed.id), voidbirths));
      const u = RLCore.resolve(RLCore.byId(res.removed.id), voidbirths);
      addFlashText('-' + u.name, player.x, player.y - 30, t.color);
      recomputeStats();
    }
  }
  lives--;
  // SECOND WIND buys breathing room after a hit that actually landed.
  player.invincible = Math.max(120, Math.round(stats.graceSeconds * 60));
  FX.addShake(20);
  FX.explode(player.x, player.y, 24, '#ff4400');
  combo = 0; comboTimer = 0;
  if (lives <= 0 && stats.reviveOnDeath > 0 && !revivedThisRun) {
    // UNDYING: death hands one life back, once per run.
    revivedThisRun = true;
    lives = stats.reviveOnDeath;
    player.invincible = 180;
    enemyBullets = [];
    addFlashText('UNDYING', player.x, player.y - 44, '#ffffff');
    FX.addShake(30);
    Sound.play('apex');
    return;
  }
  if (lives <= 0) endRun();
  else Sound.play('explode');
}

function aabbCircle(rx, ry, rw, rh, cx, cy, cr) {
  let nx = Math.max(rx-rw/2, Math.min(cx, rx+rw/2));
  let ny = Math.max(ry-rh/2, Math.min(cy, ry+rh/2));
  return (nx-cx)*(nx-cx)+(ny-cy)*(ny-cy) < cr*cr;
}

// ===== UPDATE =====

// Advances only presentation-layer things: particles, rings, floating text,
// shake. Runs during 'dying' and 'dead' too, so the wreck keeps burning while
// the game-over screen is up.
function updateEffects() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--;
    if (p.type === 'chunk') { p.rot += p.rotSpeed; p.vy += 0.04; }
    else p.r *= 0.97;
  });
  particles = particles.filter(p => p.life > 0);

  flashText.forEach(f => { f.y += f.vy; f.life--; });
  flashText = flashText.filter(f => f.life > 0);

  FX.step();
  capArray(particles, CFG.caps.particles);
}

function update() {
  // The clock stops during a boss fight — the fight is the level.
  if (!bossActive) {
    levelTimer++;
    if (levelTimer > 60*CFG.levelSeconds) levelUp();
  }
  if (bossWarning > 0) bossWarning--;

  // Stars
  starLayers.forEach(layer => layer.forEach(s => {
    s.y += s.speed; if (s.y > H+2) { s.y = -2; s.x = Math.random()*W; }
  }));

  // Nebulae
  nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

  // Player movement
  let dx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (touchX !== null) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = W / rect.width;
    let tx = (touchX - rect.left) * scaleX;
    if (tx < player.x - 15) dx = -1;
    else if (tx > player.x + 15) dx = 1;
  }
  player.x = Math.max(20, Math.min(W-20, player.x + dx*player.speed));

  // The ship has NO vertical control — ArrowUp/ArrowDown are swallowed but
  // never move it. So any boss that displaces the pilot vertically (Magnetar
  // drags you on a magnetic leash) would otherwise leave a permanent offset
  // for the rest of the run. Easing back to the resting line here means the
  // displacement self-heals and no boss has to remember to release it; a boss
  // that keeps pulling simply wins against the spring while it is alive.
  player.y = Math.max(90, Math.min(H - 24, player.y));
  if (player.y !== PLAYER_HOME_Y) {
    player.y += (PLAYER_HOME_Y - player.y) * 0.06;
    if (Math.abs(player.y - PLAYER_HOME_Y) < 0.4) player.y = PLAYER_HOME_Y;
  }

  // Player trail
  player.trail.push({x: player.x, y: player.y, life: 12});
  if (player.trail.length > 12) player.trail.shift();
  player.trail.forEach(t => t.life--);
  player.trail = player.trail.filter(t => t.life > 0);

  if (player.invincible > 0) player.invincible--;

  // Phase Drive: recharge the banked hit. The timer only runs while the charge
  // is spent, so an unused charge doesn't quietly bank a second one.
  if (stats.phaseDrive) {
    if (player.phaseCharge <= 0) {
      player.phaseDriveTimer++;
      if (player.phaseDriveTimer >= RLCore.PHASE_DRIVE_FRAMES) {
        player.phaseDriveTimer = 0;
        player.phaseCharge = 1;
        addFlashText('PHASE READY', player.x, player.y - 44, '#aa66ff');
      }
    }
  } else {
    player.phaseCharge = 0; player.phaseDriveTimer = 0;
  }

  // Kinetic Barrier: regenerate one shield charge every stats.shieldRegen
  // frames. Capped so it can't grow without bound if it's left to regen
  // uninterrupted for a whole run.
  if (stats.shieldRegen > 0) {
    player.shieldRegenTimer = (player.shieldRegenTimer || 0) + 1;
    if (player.shieldRegenTimer >= stats.shieldRegen) {
      player.shieldRegenTimer = 0;
      player.shieldCharges = Math.min(player.shieldCharges + 1, stats.shieldCharges + 3);
    }
  }

  // Shooting (auto-fire). The interval is entirely upgrade-driven now.
  shootTimer++;
  const fireRate = Math.max(RLCore.MIN_FIRE_RATE, Math.round(stats.fireRate));
  if (shootTimer >= fireRate) {
    shootTimer = 0;
    fireWeapon();
  }

  // Orbital Drone / Singularity: pushed here (same as fireWeapon above) so any
  // new drone bullet moves this frame along with everything else, and so the
  // singularity's drag/grind against enemies happens once per frame.
  updateDrones();
  updateSingularity();
  tickStatusEffects();

  // MIDAS FIELD: enemies bleed scrap while they are alive, so a screen full
  // of tanky things at depth is income rather than only a threat. Fractions
  // are carried in scrapDrip so a low rate still pays out.
  if (stats.scrapPerSecond > 0 && enemies.length) {
    scrapDrip += (stats.scrapPerSecond * Math.min(enemies.length, 12)) / 60;
    if (scrapDrip >= 1) { const whole = Math.floor(scrapDrip); scrap += whole; scrapDrip -= whole; }
  }

  // CHRONOSTALL: holding fire slows the world. Re-armed every frame the
  // trigger is down, so it decays the moment you stop shooting.
  if (stats.chronostall > 0 && (keys[' '] || touchX !== null)) {
    FX.slowMo(4, 1 - stats.chronostall);
  }

  // Normal spawning is suspended for the duration of a boss fight; the boss
  // supplies its own minions in phase 3.
  if (!bossActive) {
    asteroidTimer++;
    if (asteroidTimer >= difficulty().asteroidRate) {
      asteroidTimer = 0;
      asteroids.push(makeAsteroid(Math.random() < 0.4));
    }

    spawnTimer++;
    if (spawnTimer >= difficulty().spawnRate) {
      spawnTimer = 0;
      spawnCycle++;
      if (level >= 3 && spawnCycle % 3 === 0) {
        spawnFormation(Math.random() < 0.5 ? 'vee' : 'line');
      } else if (Math.random() < 0.7) {
        enemies.push(makeEnemy(pickEnemyKind()));
      }
    }
  }

  if (boss) updateBoss();

  // Hunter Rounds: steer bullets toward the nearest live enemy. b.homing is a
  // turn-rate cap in radians/frame, so shots curve rather than snap onto target.
  bullets.forEach(b => {
    if (b.homing > 0) {
      let best = null, bestD = 1e9;
      enemies.forEach(e => {
        if (e.dead) return;
        const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = e; }
      });
      // The boss is not in `enemies`, so without this a boss fight steers
      // homing shots onto the minions it spawns in phase 3 — curving a
      // 900-scrap upgrade's bullets away from the only target that matters.
      if (boss && !boss.entering && boss.dying === 0) {
        const d = (boss.x - b.x) ** 2 + (boss.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = boss; }
      }
      if (best) {
        const want = Math.atan2(best.x - b.x, -(best.y - b.y));
        const cur  = Math.atan2(b.vx, -b.vy);
        let diff = want - cur;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.max(-b.homing, Math.min(b.homing, diff));
        const a = cur + turn;
        b.vx = Math.sin(a) * BULLET_SPEED;
        b.vy = -Math.cos(a) * BULLET_SPEED;
      }
    }
  });

  // Move bullets. RICOCHET reflects off the side walls a limited number of
  // times, which is what lets a shot reach something tucked against an edge.
  bullets.forEach(b => {
    b.x += b.vx; b.y += b.vy;
    if (b.bounces > 0) {
      if (b.x < 4)     { b.x = 4;     b.vx = Math.abs(b.vx);  b.bounces--; }
      else if (b.x > W-4) { b.x = W-4; b.vx = -Math.abs(b.vx); b.bounces--; }
      else if (b.y < 4)   { b.y = 4;   b.vy = Math.abs(b.vy);  b.bounces--; }
    }
  });

  // Move enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    bullets.forEach(b => {
      if (b.dead || a.hp <= 0) return;
      if (Math.abs(b.x - a.x) < a.r + 2 && Math.abs(b.y - a.y) < a.r + 2) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        a.hp -= b.damage;
        a.flash = 3;
        spawnParticles(b.x, b.y, '#aaaaaa', 4);
        Sound.play('hit');
        if (a.hp <= 0) {
          if (a.big) {
            for (let i = 0; i < 2; i++) asteroids.push({...makeAsteroid(false), x: a.x + (i?15:-15), y: a.y, vy: a.vy*1.2});
          }
          FX.explode(a.x, a.y, a.big ? 30 : 16, '#9a9a9a');
          if (a.big) FX.addShake(6);
          Sound.play(a.big ? 'explode' : 'hit');
          score += a.big ? 50 : 20;
          combo++; comboTimer = 120;
          if (combo > 2) addFlashText('x'+combo+'!', a.x, a.y, '#ffff00');
        }
      }
    });
    if (a.hp > 0 && aabbCircle(player.x, player.y, player.w, player.h, a.x, a.y, a.r)) hitPlayer();
  });

  // Enemies
  const diff = difficulty();
  enemies.forEach(e => {
    const st = ENEMY[e.kind];

    // CRYO ROUNDS slow whatever they hit. Applied by scaling the velocity for
    // the duration of the movement step and restoring it after, so every
    // movement branch is chilled without each one having to know about it.
    const chillF = e.chill > 0 ? Math.max(0.15, 1 - e.chill) : 1;
    const _cvx = e.vx, _cvy = e.vy;
    if (chillF !== 1) { e.vx *= chillF; e.vy *= chillF; }

    // ---- movement ----
    switch (e.kind) {
      case 'kamikaze':
        e.x += Math.sign(e.targetX - e.x) * Math.min(1.5, Math.abs(e.targetX - e.x));
        e.y += e.vy;
        break;

      case 'turret':
        if (e.phase === 'descend') {
          e.y += e.vy;
          if (e.y >= e.holdY) { e.y = e.holdY; e.phase = 'hold'; }
        } else if (e.phase === 'hold') {
          e.holdTimer--;
          if (e.holdTimer <= 0) e.phase = 'retreat';
        } else {
          e.y -= 2.2;
        }
        e.aim = Math.atan2(player.y - e.y, player.x - e.x);
        break;

      case 'mine':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 16 || e.x > W-16) e.vx *= -1;
        break;

      case 'lancer':
        // Slides toward the player's column, then commits. The slide IS the
        // warning: it cannot shoot until it is nearly lined up.
        e.x += Math.sign(player.x - e.x) * Math.min(1.1, Math.abs(player.x - e.x) * 0.05);
        e.y += e.vy;
        break;

      case 'weaver':
        e.weavePhase += 0.045;
        {
          const nx = e.baseX + Math.sin(e.weavePhase) * e.weaveAmp;
          e.bank = (nx - e.x) * 0.12;      // banks into the turn
          e.x = nx;
        }
        e.y += e.vy;
        if (e.x < 24) e.baseX += 3; if (e.x > W-24) e.baseX -= 3;
        break;

      case 'bulwark':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 34 || e.x > W-34) e.vx *= -1;
        break;

      case 'swarmling':
        e.jitter += 0.3;
        e.x += e.vx + Math.sin(e.jitter) * 1.6;
        e.y += e.vy;
        if (e.x < 12 || e.x > W-12) e.vx *= -1;
        break;

      case 'harbinger':
        e.x += e.vx; e.y += Math.max(0, e.vy * (e.y < 130 ? 1 : 0.12));
        if (e.x < 50 || e.x > W-50) e.vx *= -1;
        break;

      default: // grunt, elite
        if (e.sweep) {
          e.x = e.baseX + Math.sin(frame*0.02)*70;   // whole line moves as one
          e.y += e.vy;
        } else {
          e.zigzag += 0.04;
          e.x += e.vx + Math.sin(e.zigzag)*2.5*e.zigzagDir;
          e.y += e.vy;
          if (e.x < 20 || e.x > W-20) e.vx *= -1;
        }
    }

    if (chillF !== 1) { e.vx = _cvx; e.vy = _cvy; }

    // ---- firing ----
    // The side-attack fix. Past ARC_FROM_LEVEL a grunt, elite, or lancer may
    // only shoot within a cone of straight-down, so one sitting off to your
    // flank physically cannot hit you — it has to commit to your column
    // first, and that commitment is something you can see coming.
    if (e.kind === 'grunt' || e.kind === 'elite' || e.kind === 'lancer') {
      e.shootTimer++;
      const eRate = e.kind === 'elite' ? 55 : e.kind === 'lancer' ? 75 : 90;
      if (e.shootTimer >= eRate) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        // Straight down is +PI/2; measure the deviation from it, wrapped.
        let off = angle - Math.PI/2;
        while (off > Math.PI) off -= Math.PI*2;
        while (off < -Math.PI) off += Math.PI*2;
        if (!RLCore.canFireAt(e.kind, level, off)) {
          // Out of arc: hold the shot rather than firing sideways. Timer is
          // left charged so it fires the instant it does line up.
          e.shootTimer = eRate;
        } else {
          e.shootTimer = 0;
          const spd2 = diff.bulletSpeed * stats.enemyBulletMul;
          if (e.kind === 'lancer') {
            // One heavy, fast round straight down its own nose.
            enemyBullets.push({x: e.x, y: e.y + 14, vx: 0, vy: spd2*1.9, r: 5.5, elite: true, dead: false});
          } else {
            enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle)*spd2, vy: Math.sin(angle)*spd2, r: 4, elite: e.kind === 'elite', dead: false});
            if (e.kind === 'elite') {
              [-0.3, 0.3].forEach(o => {
                enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle+o)*spd2, vy: Math.sin(angle+o)*spd2, r: 4, elite: true, dead: false});
              });
            }
          }
        }
      }
    } else if (e.kind === 'weaver') {
      // Not arc-limited: dodging it is the point, and it fires while moving.
      e.shootTimer++;
      if (e.shootTimer >= 80) {
        e.shootTimer = 0;
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        const spd2 = diff.bulletSpeed * 0.9 * stats.enemyBulletMul;
        [-0.16, 0.16].forEach(o => {
          enemyBullets.push({x: e.x, y: e.y + 8, vx: Math.cos(angle+o)*spd2, vy: Math.sin(angle+o)*spd2, r: 4, elite: false, dead: false});
        });
      }
    } else if (e.kind === 'harbinger') {
      e.shootTimer++;
      e.broodTimer--;
      if (e.broodTimer <= 0) {
        e.broodTimer = 150;
        for (let i = -1; i <= 1; i++) {
          const m = makeEnemy('swarmling');
          m.x = e.x + i*24; m.y = e.y + 26;
          enemies.push(m);
        }
      }
      if (e.shootTimer >= 100) {
        e.shootTimer = 0;
        const spd2 = diff.bulletSpeed * 0.85 * stats.enemyBulletMul;
        for (let i = 0; i < 10; i++) {
          const a = (i/10)*Math.PI*2 + frame*0.01;
          enemyBullets.push({x: e.x, y: e.y, vx: Math.cos(a)*spd2, vy: Math.sin(a)*spd2, r: 4.5, elite: true, dead: false});
        }
      }
    } else if (e.kind === 'turret' && e.phase === 'hold') {
      e.shootTimer++;
      if (e.shootTimer >= 90) { e.shootTimer = 0; e.burstLeft = 3; e.burstTimer = 0; }
      if (e.burstLeft > 0) {
        e.burstTimer--;
        if (e.burstTimer <= 0) {
          e.burstTimer = 8;
          e.burstLeft--;
          const spd2 = diff.bulletSpeed * 1.15 * stats.enemyBulletMul;
          enemyBullets.push({x: e.x, y: e.y + 12, vx: Math.cos(e.aim)*spd2, vy: Math.sin(e.aim)*spd2, r: 4.5, elite: true, dead: false});
        }
      }
    }

    // ---- mine proximity trigger ----
    if (e.kind === 'mine' && !e.dead) {
      const dx2 = player.x - e.x, dy2 = player.y - e.y;
      if (e.arming === 0 && dx2*dx2 + dy2*dy2 < 45*45) { e.arming = 30; Sound.play('hit'); }
      if (e.arming > 0) {
        e.arming--;
        if (e.arming === 0) {
          const ddx = player.x - e.x, ddy = player.y - e.y;
          if (ddx*ddx + ddy*ddy < 60*60) hitPlayer();
          FX.explode(e.x, e.y, st.boom, st.color);
          FX.addShake(st.shake);
          Sound.play('explode');
          e.dead = true;
        }
      }
    }

    // ---- taking fire ----
    bullets.forEach(b => {
      if (b.dead || e.dead) return;
      if (Math.abs(b.x-e.x) < st.r*0.8 && Math.abs(b.y-e.y) < st.r*0.8) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        spawnParticles(b.x, b.y, st.color, 4);
        Sound.play('hit');
        // damageEnemy applies the hp loss and decides mine-arms-vs-dies; see
        // its definition for why that decision lives in one place.
        damageEnemy(e, b.damage, b.x);
        applyOnHitEffects(e, b);

        // On-impact bullet behaviours (Task 12). These fire on every hit,
        // independent of whether this hit kills the enemy. Split children
        // re-enter this same collision path on their own later hits, so
        // CHAIN LIGHTNING (which reads the global stats.chain rather than a
        // per-bullet flag) will trigger off them too — that's intentional
        // and bounded by the hop count, not something to guard against.
        if (b.splash > 0) applySplash(e.x, e.y, b.splash, b.damage * 0.6);
