// Barely there. One thin blade of hull, everything else negative space, and
// trailing edges that fade out instead of ending.
SHIP_ART.wraith = function (c0, c1, c2, trim) {
  // Ghosted trailing edges — long, thin, almost gone.
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.beginPath();
  ctx.moveTo(-2, 2); ctx.lineTo(-10, 20); ctx.lineTo(-3, 12); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2, 2); ctx.lineTo(10, 20); ctx.lineTo(3, 12); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill();
  ctx.restore();

  // The blade: a single narrow sliver of solid hull.
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(3.5, -2); ctx.lineTo(2, 15); ctx.lineTo(-2, 15); ctx.lineTo(-3.5, -2);
  ctx.closePath();
  var xg = ctx.createLinearGradient(0, -17, 0, 15);
  xg.addColorStop(0, c0); xg.addColorStop(0.45, c1); xg.addColorStop(1, c2);
  ctx.fillStyle = xg; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.1; ctx.stroke();

  // Wings exist only as outlines — the fill is the void behind them.
  ctx.beginPath();
  ctx.moveTo(-3, -4); ctx.lineTo(-10, 8); ctx.lineTo(-6, 14);
  ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(3, -4); ctx.lineTo(10, 8); ctx.lineTo(6, 14);
  ctx.stroke();

  // A single lit rib on each side, so the empty wing still has an edge.
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.beginPath();
  ctx.moveTo(-3.2, 3); ctx.lineTo(-8, 9);
  ctx.moveTo(3.2, 3); ctx.lineTo(8, 9);
  ctx.strokeStyle = c0; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();

  // Dark slit where a cockpit would be.
  ctx.beginPath(); ctx.ellipse(0, -8, 1.2, 3.6, 0, 0, Math.PI * 2);
  ctx.fillStyle = c2; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(0, -12);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.8; ctx.stroke();
};

// --- ASCENDANT ------------------------------------------------------------
// Regal. Three layered wing blades a side stack into a crown, with a spiked
// diadem over the nose and a jewel at the heart.
SHIP_ART.ascendant = function (c0, c1, c2, trim) {
  // Crown wings: three blades each side, each longer and higher than the last.
  var blade = [[8, 4, 16, -4, 10, 10], [10, 8, 15, 4, 9, 14], [9, 12, 12, 12, 6, 17]];
  for (var i = 0; i < 3; i++) {
    var b = blade[i];
    ctx.beginPath();
    ctx.moveTo(-b[0], b[1]); ctx.lineTo(-b[2], b[3]); ctx.lineTo(-b[4], b[5]);
    ctx.closePath();
    ctx.fillStyle = i === 1 ? c1 : c2; ctx.fill();
    ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(b[0], b[1]); ctx.lineTo(b[2], b[3]); ctx.lineTo(b[4], b[5]);
    ctx.closePath();
    ctx.fillStyle = i === 1 ? c1 : c2; ctx.fill(); ctx.stroke();
  }

  // Core hull, tall and narrow.
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(5, -6); ctx.lineTo(7, 8); ctx.lineTo(5, 17);
  ctx.lineTo(-5, 17); ctx.lineTo(-7, 8); ctx.lineTo(-5, -6);
  ctx.closePath();
  var ag = ctx.createLinearGradient(-7, -17, 7, 17);
  ag.addColorStop(0, c0); ag.addColorStop(0.5, c1); ag.addColorStop(1, c2);
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.4; ctx.stroke();

  // The diadem: five spikes stepped over the nose.
  var spike = [[-9, -8, -7, -14], [-5, -12, -4, -17], [0, -15, 0, -21], [5, -12, 4, -17], [9, -8, 7, -14]];
  for (var j = 0; j < 5; j++) {
    var s = spike[j];
    ctx.beginPath();
    ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.lineTo(s[0] * 0.45, s[1] - 1);
    ctx.closePath();
    ctx.fillStyle = c0; ctx.fill();
    ctx.strokeStyle = trim; ctx.lineWidth = 0.9; ctx.stroke();
  }

  // Filigree down the flanks.
  ctx.beginPath();
  ctx.moveTo(-4, -2); ctx.quadraticCurveTo(-8, 4, -4, 12);
  ctx.moveTo(4, -2); ctx.quadraticCurveTo(8, 4, 4, 12);
  ctx.strokeStyle = c0; ctx.lineWidth = 0.9; ctx.stroke();

  // Heart jewel — a slow, faint pulse.
  ctx.beginPath();
  ctx.moveTo(0, -8); ctx.lineTo(4, -2); ctx.lineTo(0, 5); ctx.lineTo(-4, -2);
  ctx.closePath();
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();
  ctx.save();
  ctx.globalAlpha = 0.3 + 0.2 * Math.sin(frame * 0.06);
  ctx.beginPath();
  ctx.moveTo(0, -11); ctx.lineTo(6, -2); ctx.lineTo(0, 8); ctx.lineTo(-6, -2);
  ctx.closePath();
  ctx.strokeStyle = c0; ctx.lineWidth = 0.9; ctx.stroke();
  ctx.restore();
};

// Eight new hulls. Each is drawn, not tinted — tools/shipcheck.mjs fingerprints
// the geometry with colour deliberately excluded, so a recolour cannot pass.

// MAGPIE — a collector: long open cargo forks and a hunched cockpit.
SHIP_ART.magpie = function (c0, c1, c2, trim) {
  ctx.strokeStyle = c1; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(-19, -20); ctx.lineTo(-24, -10); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -6); ctx.lineTo(19, -20); ctx.lineTo(24, -10); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(9, -2); ctx.lineTo(13, 12);
  ctx.lineTo(5, 19); ctx.lineTo(-5, 19); ctx.lineTo(-13, 12); ctx.lineTo(-9, -2);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -14, 0, 19);
  g.addColorStop(0, c0); g.addColorStop(0.55, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0, -3, 5, 6, 0, 0, Math.PI * 2);
  ctx.fillStyle = trim; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1;

  // Collector ring — the magnet, drawn as the thing it is.
  ctx.strokeStyle = trim; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.arc(0, 2, 21, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = c0; ctx.fillRect(-7, 15, 5, 5); ctx.fillRect(2, 15, 5, 5);
};

// RAMHEAD — everything is in front: a solid wedge prow, engines tucked behind.
SHIP_ART.ramhead = function (c0, c1, c2, trim) {
  ctx.beginPath();
  ctx.moveTo(0, -20); ctx.lineTo(17, -2); ctx.lineTo(17, 8);
  ctx.lineTo(8, 18); ctx.lineTo(-8, 18); ctx.lineTo(-17, 8); ctx.lineTo(-17, -2);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -20, 0, 18);
  g.addColorStop(0, c0); g.addColorStop(0.4, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 2; ctx.stroke();

  // The ram itself, a separate plate bolted over the nose.
  ctx.beginPath();
  ctx.moveTo(0, -22); ctx.lineTo(11, -6); ctx.lineTo(0, -10); ctx.lineTo(-11, -6);
  ctx.closePath();
  ctx.fillStyle = trim; ctx.fill();
  ctx.strokeStyle = c2; ctx.lineWidth = 1; ctx.stroke();

  ctx.fillStyle = c2;
  ctx.fillRect(-14, 2, 5, 12); ctx.fillRect(9, 2, 5, 12);
  ctx.strokeStyle = trim; ctx.lineWidth = 1;
  ctx.strokeRect(-14, 2, 5, 12); ctx.strokeRect(9, 2, 5, 12);
  ctx.beginPath(); ctx.moveTo(-6, 4); ctx.lineTo(6, 4); ctx.stroke();
};

// LANTERN — a hollow frame around a lit core.
SHIP_ART.lantern = function (c0, c1, c2, trim) {
  ctx.strokeStyle = c1; ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(0, -19); ctx.lineTo(15, -4); ctx.lineTo(11, 17);
  ctx.lineTo(-11, 17); ctx.lineTo(-15, -4); ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = c2; ctx.globalAlpha = 0.75; ctx.fill(); ctx.globalAlpha = 1;

  const cg = ctx.createRadialGradient(0, 0, 1, 0, 0, 13);
  cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.35, trim); cg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2);
  ctx.fillStyle = cg; ctx.fill();

  ctx.strokeStyle = trim; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(-15, -4); ctx.lineTo(15, -4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-13, 7); ctx.lineTo(13, 7); ctx.stroke();

  ctx.fillStyle = c0;
  ctx.beginPath(); ctx.moveTo(-11, 17); ctx.lineTo(-6, 22); ctx.lineTo(-2, 17); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(11, 17); ctx.lineTo(6, 22); ctx.lineTo(2, 17); ctx.closePath(); ctx.fill();
};

// GLACIER — a flat crystal shelf, wider than it is long, with shard fins.
SHIP_ART.glacier = function (c0, c1, c2, trim) {
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(20, -6); ctx.lineTo(24, 6);
  ctx.lineTo(10, 17); ctx.lineTo(-10, 17); ctx.lineTo(-24, 6); ctx.lineTo(-20, -6);
  ctx.closePath();
  const g = ctx.createLinearGradient(-24, 0, 24, 0);
  g.addColorStop(0, c2); g.addColorStop(0.5, c0); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  // Fracture lines — the whole read of the hull is "cracked ice".
  ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.globalAlpha = 0.7;
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(-6, 4); ctx.lineTo(0, 17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(8, 2); ctx.lineTo(2, 17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-20, -6); ctx.lineTo(-6, 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, -6); ctx.lineTo(8, 2); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.moveTo(-24, 6); ctx.lineTo(-30, 14); ctx.lineTo(-16, 12); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(24, 6); ctx.lineTo(30, 14); ctx.lineTo(16, 12); ctx.closePath(); ctx.fill();
};

// CARTWHEEL — a spinning rotor of four spokes around a small core.
SHIP_ART.cartwheel = function (c0, c1, c2, trim) {
  ctx.strokeStyle = c1; ctx.lineWidth = 4;
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 5, Math.sin(a) * 5);
    ctx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20);
    ctx.stroke();
  }
  ctx.strokeStyle = trim; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke();

  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    ctx.beginPath(); ctx.arc(Math.cos(a) * 20, Math.sin(a) * 20, 4, 0, Math.PI * 2);
    ctx.fillStyle = c0; ctx.fill();
  }

  ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(0, -3, 1, 0, 0, 8);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, c0); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(4, -12); ctx.lineTo(-4, -12); ctx.closePath();
  ctx.fillStyle = trim; ctx.fill();
};

// HOWITZER — one enormous barrel with a ship built behind it as an afterthought.
SHIP_ART.howitzer = function (c0, c1, c2, trim) {
  ctx.fillStyle = c2;
  ctx.fillRect(-7, -24, 14, 22);
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5;
  ctx.strokeRect(-7, -24, 14, 22);
  ctx.fillStyle = c0;
  ctx.fillRect(-9, -26, 18, 5);
  ctx.strokeRect(-9, -26, 18, 5);

  ctx.beginPath();
  ctx.moveTo(-13, -2); ctx.lineTo(13, -2); ctx.lineTo(18, 10);
  ctx.lineTo(9, 19); ctx.lineTo(-9, 19); ctx.lineTo(-18, 10);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -2, 0, 19);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 2; ctx.stroke();

  // Recoil struts, because a gun that size needs bracing.
  ctx.strokeStyle = c0; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(-15, 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, -6); ctx.lineTo(15, 8); ctx.stroke();

  ctx.fillStyle = trim;
  ctx.fillRect(-11, 16, 6, 5); ctx.fillRect(5, 16, 6, 5);
};

// DOMINO — two stacked slabs joined by a narrow waist, pips on the upper.
SHIP_ART.domino = function (c0, c1, c2, trim) {
  ctx.fillStyle = c1;
  ctx.fillRect(-14, -20, 28, 15);
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5;
  ctx.strokeRect(-14, -20, 28, 15);

  ctx.fillStyle = c2;
  ctx.fillRect(-6, -6, 12, 6);

  ctx.fillStyle = c0;
  ctx.fillRect(-16, 0, 32, 14);
  ctx.strokeStyle = trim;
  ctx.strokeRect(-16, 0, 32, 14);

  ctx.fillStyle = trim;
  [[-8, -15], [0, -15], [8, -15], [-8, -9], [8, -9]].forEach(p => {
    ctx.beginPath(); ctx.arc(p[0], p[1], 2, 0, Math.PI * 2); ctx.fill();
  });

  ctx.strokeStyle = c2; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-16, 7); ctx.lineTo(16, 7); ctx.stroke();

  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.moveTo(-16, 14); ctx.lineTo(-10, 21); ctx.lineTo(-4, 14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(16, 14); ctx.lineTo(10, 21); ctx.lineTo(4, 14); ctx.closePath(); ctx.fill();
};

// LOTTERY — a scratch card with a ship attached: asymmetric, gaudy, lucky.
SHIP_ART.lottery = function (c0, c1, c2, trim) {
  ctx.beginPath();
  ctx.moveTo(0, -21); ctx.lineTo(12, -8); ctx.lineTo(19, 6);
  ctx.lineTo(6, 18); ctx.lineTo(-9, 18); ctx.lineTo(-16, 3); ctx.lineTo(-10, -9);
  ctx.closePath();
  const g = ctx.createLinearGradient(-16, -21, 19, 18);
  g.addColorStop(0, c0); g.addColorStop(0.45, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  // Seven pips in a wedge — the only ship in the hangar with an odd number
  // of anything, on purpose.
  ctx.fillStyle = trim;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.34;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 11, Math.sin(a) * 11 + 2, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.beginPath(); ctx.ellipse(-2, -4, 5, 7, -0.25, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(-2, -6, 1, -2, -4, 7);
  cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, c2);
  ctx.fillStyle = cg; ctx.fill();

  ctx.fillStyle = c0;
  ctx.beginPath(); ctx.moveTo(-9, 18); ctx.lineTo(-13, 24); ctx.lineTo(-3, 20); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(6, 18); ctx.lineTo(11, 24); ctx.lineTo(1, 20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c2; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-10, -9); ctx.lineTo(12, -8); ctx.stroke();
};

function drawShip(x, y, invincible, shield, t, muzzle, shipDef) {
  const def = shipDef || currentShip();
  const [c0, c1, c2] = def.hull;
  const trim = def.trim;
  ctx.save();
  ctx.translate(x, y);
  if (invincible && Math.floor(t/4)%2 === 0) { ctx.restore(); return; }

  // Engine flames
  const flameLen = 16, flameW = 7;
  ctx.save();
  let gL = ctx.createLinearGradient(0,0,0,flameLen);
  gL.addColorStop(0,'rgba(0,200,255,0.9)'); gL.addColorStop(0.4,'rgba(255,140,0,0.7)'); gL.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.ellipse(-9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  let gR = ctx.createLinearGradient(0,0,0,flameLen);
  gR.addColorStop(0,'rgba(0,200,255,0.9)'); gR.addColorStop(0.4,'rgba(255,140,0,0.7)'); gR.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gR;
  ctx.beginPath(); ctx.ellipse(9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // WRAITH's cloak has to be visible to the player even though it is invisible
  // to the enemy — otherwise its one mechanic is something you can only infer.
  const cloaked = !shipDef && player.cloak > 0;
  if (cloaked) {
    ctx.globalAlpha = 0.45 + 0.15 * Math.sin(t * 0.25);
    ctx.save();
    ctx.strokeStyle = 'rgba(168,146,255,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, 26 + Math.sin(t * 0.2) * 3, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Body. Each ship owns its own silhouette; drawShip keeps the shared chrome
  // (engine flames, shield bubble, phase ring, muzzle flash, the invincibility
  // flicker) so a new hull only has to draw a shape. Falls back to the
  // Vanguard outline for any ship without art yet, which keeps every ship
  // flyable rather than invisible.
  (SHIP_ART[def.id] || SHIP_ART.vanguard)(c0, c1, c2, trim);

  // Phase charge indicator
  if (def.phase && player.phaseReady && !shipDef) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(t*0.12);
    ctx.strokeStyle = '#cc88ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Muzzle flash
  if (muzzle > 0) {
    const a = muzzle / 3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    [-11, 11].forEach(mx => {
      const mg = ctx.createRadialGradient(mx, -6, 0, mx, -6, 9);
      mg.addColorStop(0, `rgba(255,255,255,${0.9*a})`);
      mg.addColorStop(0.4, `rgba(120,230,255,${0.6*a})`);
      mg.addColorStop(1, 'rgba(0,150,255,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, -6, 9, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // Shield charges — `shield` is now a charge count, not a frame timer.
  // One ring per charge, capped at 3 so it can't visually run away.
  if (shield > 0) {
    let alpha = 0.3 + 0.2*Math.sin(t*0.2);
    const rings = Math.min(shield, 3);
    for (let i = 0; i < rings; i++) {
      ctx.beginPath(); ctx.arc(0, 0, 26 + i*5, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,255,255,${alpha})`; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.fillStyle = `rgba(0,200,255,${alpha*0.15})`;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    let v = a.verts[i];
    i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  let ag = ctx.createRadialGradient(0,0,2,0,0,a.r);
  ag.addColorStop(0,'#aaa'); ag.addColorStop(1,'#444');
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5; ctx.stroke();
  if (a.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.28*a.flash})`; ctx.fill(); }
  ctx.restore();
}

// A lit engine bell, used by every hull that has one. Drawn behind the body
// (enemies fly downward, so their engines face up).
function drawEngine(x, y, w, h, hot) {
  ctx.fillStyle = '#1a1a22';
  ctx.fillRect(x - w/2, y - h, w, h);
  const g = ctx.createLinearGradient(0, y - h, 0, y - h - 14);
  g.addColorStop(0, hot); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - w/2, y - h); ctx.lineTo(x, y - h - 12 - Math.random()*4); ctx.lineTo(x + w/2, y - h);
  ctx.closePath(); ctx.fill();
}

// ===== ROSTER HULLS =====
// Ninety-five ships drawn from one renderer with eight independent shape
// axes: nose, body, wing, gun pods, engines, fins, cockpit and armament.
// Every roster entry has a unique combination -- tools/genenemies guarantees
// it and refuses to emit two the same -- so no enemy in this game is another
// enemy with the palette swapped.

function enemyNose(a, R) {
  switch (a.nose) {
    case 'spike':  ctx.moveTo(0, -R * 1.5); ctx.lineTo(R * 0.24, -R * 0.55); ctx.lineTo(-R * 0.24, -R * 0.55); break;
    case 'wedge':  ctx.moveTo(0, -R * 1.1); ctx.lineTo(R * 0.5, -R * 0.45); ctx.lineTo(-R * 0.5, -R * 0.45); break;
    case 'fork':   ctx.moveTo(-R * 0.55, -R * 1.25); ctx.lineTo(-R * 0.2, -R * 0.5); ctx.lineTo(R * 0.2, -R * 0.5); ctx.lineTo(R * 0.55, -R * 1.25); ctx.lineTo(0, -R * 0.7); break;
    case 'dome':   ctx.arc(0, -R * 0.35, R * 0.62, Math.PI, 0); break;
    case 'chisel': ctx.moveTo(-R * 0.3, -R * 1.3); ctx.lineTo(R * 0.42, -R * 1.0); ctx.lineTo(R * 0.5, -R * 0.4); ctx.lineTo(-R * 0.5, -R * 0.4); break;
    case 'prow':   ctx.moveTo(0, -R * 1.25); ctx.lineTo(R * 0.34, -R * 0.9); ctx.lineTo(R * 0.52, -R * 0.3); ctx.lineTo(-R * 0.52, -R * 0.3); ctx.lineTo(-R * 0.34, -R * 0.9); break;
    default:       ctx.moveTo(-R * 0.5, -R * 0.85); ctx.lineTo(R * 0.5, -R * 0.85); ctx.lineTo(R * 0.55, -R * 0.4); ctx.lineTo(-R * 0.55, -R * 0.4);
  }
}

function enemyBody(a, R) {
  switch (a.body) {
    case 'delta':   ctx.moveTo(0, -R * 0.6); ctx.lineTo(R * 0.85, R * 0.85); ctx.lineTo(-R * 0.85, R * 0.85); break;
    case 'hex':     for (let i = 0; i < 6; i++) { const t = -Math.PI/2 + i * Math.PI/3; const x = Math.cos(t)*R*0.8, y = Math.sin(t)*R*0.8; i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); } break;
    case 'cross':   ctx.moveTo(-R*0.28,-R*0.8); ctx.lineTo(R*0.28,-R*0.8); ctx.lineTo(R*0.28,-R*0.28); ctx.lineTo(R*0.9,-R*0.28); ctx.lineTo(R*0.9,R*0.28); ctx.lineTo(R*0.28,R*0.28); ctx.lineTo(R*0.28,R*0.85); ctx.lineTo(-R*0.28,R*0.85); ctx.lineTo(-R*0.28,R*0.28); ctx.lineTo(-R*0.9,R*0.28); ctx.lineTo(-R*0.9,-R*0.28); ctx.lineTo(-R*0.28,-R*0.28); break;
    case 'ring':    ctx.arc(0, 0, R * 0.82, 0, Math.PI * 2); ctx.moveTo(R*0.42, 0); ctx.arc(0, 0, R * 0.42, 0, Math.PI * 2, true); break;
    case 'slab':    ctx.rect(-R * 0.95, -R * 0.62, R * 1.9, R * 1.35); break;
    case 'spindle': ctx.moveTo(0, -R * 0.95); ctx.lineTo(R * 0.34, 0); ctx.lineTo(0, R * 1.05); ctx.lineTo(-R * 0.34, 0); break;
    case 'trident': ctx.moveTo(-R*0.85,-R*0.55); ctx.lineTo(-R*0.5,R*0.9); ctx.lineTo(-R*0.2,R*0.2); ctx.lineTo(0,R*1.0); ctx.lineTo(R*0.2,R*0.2); ctx.lineTo(R*0.5,R*0.9); ctx.lineTo(R*0.85,-R*0.55); break;
    case 'diamond': ctx.moveTo(0, -R * 0.9); ctx.lineTo(R * 0.75, 0); ctx.lineTo(0, R * 0.9); ctx.lineTo(-R * 0.75, 0); break;
    case 'arrow':   ctx.moveTo(0, -R * 0.9); ctx.lineTo(R * 0.6, R * 0.5); ctx.lineTo(0, R * 0.15); ctx.lineTo(-R * 0.6, R * 0.5); break;
    default:        ctx.moveTo(0, -R * 0.7); ctx.lineTo(R * 0.62, R * 0.75); ctx.lineTo(-R * 0.62, R * 0.75);
  }
}

function enemyWings(a, R) {
  ctx.beginPath();
  switch (a.wing) {
    case 'swept':    ctx.moveTo(-R*0.7,-R*0.1); ctx.lineTo(-R*1.28,R*0.72); ctx.lineTo(-R*0.6,R*0.6); ctx.closePath();
                     ctx.moveTo(R*0.7,-R*0.1); ctx.lineTo(R*1.28,R*0.72); ctx.lineTo(R*0.6,R*0.6); ctx.closePath(); break;
    case 'straight': ctx.rect(-R*1.34,-R*0.18, R*0.66, R*0.36); ctx.rect(R*0.68,-R*0.18, R*0.66, R*0.36); break;
    case 'forward':  ctx.moveTo(-R*0.7,R*0.35); ctx.lineTo(-R*1.3,-R*0.5); ctx.lineTo(-R*0.6,-R*0.3); ctx.closePath();
                     ctx.moveTo(R*0.7,R*0.35); ctx.lineTo(R*1.5,-R*0.5); ctx.lineTo(R*0.6,-R*0.3); ctx.closePath(); break;
    case 'double':   ctx.rect(-R*1.3,-R*0.5, R*0.8, R*0.26); ctx.rect(-R*1.3,R*0.2, R*0.8, R*0.26);
                     ctx.rect(R*0.68,-R*0.5, R*0.62, R*0.26); ctx.rect(R*0.68,R*0.2, R*0.62, R*0.26); break;
    case 'ringwing': ctx.arc(-R*0.98, R*0.1, R*0.38, 0, Math.PI*2); ctx.moveTo(R*1.36, R*0.1); ctx.arc(R*0.98, R*0.1, R*0.38, 0, Math.PI*2); break;
    case 'anhedral': ctx.moveTo(-R*0.65,-R*0.25); ctx.lineTo(-R*1.22,R*0.9); ctx.lineTo(-R*0.95,R*0.95); ctx.lineTo(-R*0.5,R*0.2); ctx.closePath();
                     ctx.moveTo(R*0.65,-R*0.25); ctx.lineTo(R*1.22,R*0.9); ctx.lineTo(R*0.95,R*0.95); ctx.lineTo(R*0.5,R*0.2); ctx.closePath(); break;
    default: return false;
  }
  return true;
}

function drawRosterHull(e, art, R, flashFill) {
  // Wings sit behind the fuselage.
  ctx.fillStyle = art.c2;
  if (enemyWings(art, R)) {
    ctx.fill();
    ctx.strokeStyle = art.c1; ctx.lineWidth = 1.2; ctx.stroke();
  }

  // Gun pods, outboard, one pair at a time.
  for (let i = 0; i < art.pods; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const row = Math.floor(i / 2);
    ctx.fillStyle = art.c2;
    ctx.fillRect(side * R * (0.78 + row * 0.34) - R * 0.14, -R * 0.2 + row * R * 0.3, R * 0.28, R * 0.62);
    ctx.strokeStyle = art.c0; ctx.lineWidth = 1;
    ctx.strokeRect(side * R * (0.78 + row * 0.34) - R * 0.14, -R * 0.2 + row * R * 0.3, R * 0.28, R * 0.62);
  }

  // Engines along the tail.
  for (let i = 0; i < art.eng; i++) {
    const off = (i - (art.eng - 1) / 2) * R * 0.42;
    drawEngine(off, -R * 0.9, R * 0.26, R * 0.2, 'rgba(255,190,90,0.8)');
  }

  // The fuselage itself: nose plus body, filled as one silhouette.
  ctx.beginPath();
  enemyBody(art, R);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, -R, 0, R);
  g.addColorStop(0, art.c0); g.addColorStop(0.55, art.c1); g.addColorStop(1, art.c2);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = art.c0; ctx.lineWidth = 1.6; ctx.stroke();

  ctx.beginPath();
  enemyNose(art, R);
  ctx.closePath();
  ctx.fillStyle = art.c1; ctx.fill();
  ctx.strokeStyle = art.c0; ctx.lineWidth = 1.2; ctx.stroke();

  // Tail fins.
  for (let i = 0; i < art.fin; i++) {
    const side = i === 0 ? 0 : (i === 1 ? -1 : 1);
    ctx.beginPath();
    ctx.moveTo(side * R * 0.4, R * 0.55);
    ctx.lineTo(side * R * 0.4 + (side || 0.5) * R * 0.3, R * 1.15);
    ctx.lineTo(side * R * 0.4 - R * 0.12, R * 0.95);
    ctx.closePath();
    ctx.fillStyle = art.c0; ctx.fill();
  }

  // Armament silhouette.
  ctx.fillStyle = art.c0;
  switch (art.arm) {
    case 'chin':      ctx.fillRect(-R * 0.16, -R * 1.0, R * 0.32, R * 0.4); break;
    case 'dorsal':    ctx.fillRect(-R * 0.1, -R * 0.5, R * 0.2, R * 1.1); break;
    case 'outrigger': ctx.fillRect(-R * 1.2, R * 0.35, R * 0.5, R * 0.16); ctx.fillRect(R * 0.7, R * 0.35, R * 0.5, R * 0.16); break;
    case 'shoulder':  ctx.fillRect(-R * 0.72, -R * 0.62, R * 0.26, R * 0.3); ctx.fillRect(R * 0.46, -R * 0.62, R * 0.26, R * 0.3); break;
  }

  // Cockpit.
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  switch (art.cock) {
    case 'bubble':    ctx.beginPath(); ctx.ellipse(0, -R * 0.22, R * 0.24, R * 0.3, 0, 0, Math.PI*2); ctx.fill(); break;
    case 'slit':      ctx.fillRect(-R * 0.3, -R * 0.3, R * 0.6, R * 0.12); break;
    case 'twin':      ctx.beginPath(); ctx.arc(-R * 0.22, -R * 0.2, R * 0.13, 0, Math.PI*2); ctx.fill();
                      ctx.beginPath(); ctx.arc(R * 0.22, -R * 0.2, R * 0.13, 0, Math.PI*2); ctx.fill(); break;
    case 'ringlight': ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
                      ctx.beginPath(); ctx.arc(0, -R * 0.18, R * 0.3, 0, Math.PI*2); ctx.stroke(); break;
  }

  // A plate, if something gave it one (BULWARK hulls, or a SHIELDER's aura).
  if (e.plate > 0) {
    ctx.strokeStyle = 'rgba(150,255,200,' + (0.35 + 0.45 * (e.plate / Math.max(1, e.plateMax))) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.25, 0.15, Math.PI - 0.15); ctx.stroke();
  }

  flashFill();
}

function drawEnemy(e) {
  const rd = ENEMY[e.kind];
  if (rd && rd.art) {
    ctx.save(); ctx.translate(e.x, e.y);
    if (e.scale && e.scale !== 1) ctx.scale(e.scale, e.scale);
    // A blinker leaves an afterimage where it used to be.
    if (e.blinkGhost > 0 && e.ghostX !== undefined) {
      ctx.save();
      ctx.globalAlpha = e.blinkGhost / 28;
      ctx.translate(e.ghostX - e.x, e.ghostY - e.y);
      ctx.rotate(Math.PI);
      drawRosterHull(e, rd.art, rd.r * 0.62, () => {});
      ctx.restore();
    }
    // A sniper's charge is drawn as the line it is about to fire down.
    if (e.beh === 'sniper' && e.charge > 0) {
      ctx.save();
      ctx.rotate(e.aim - Math.PI / 2);
      ctx.strokeStyle = 'rgba(255,90,90,' + (0.25 + 0.5 * (1 - e.charge / 50)) + ')';
      ctx.lineWidth = 1 + (1 - e.charge / 50) * 2.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 900); ctx.stroke();
      ctx.restore();
    }
    // A shielder shows the aura that is the reason to kill it first.
    if (e.beh === 'shielder') {
      ctx.strokeStyle = 'rgba(150,255,200,0.16)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 130 * (1 / (e.scale || 1)), 0, Math.PI*2); ctx.stroke();
    }
    const flashFill = () => {
      if (e.flash > 0) {
        ctx.globalAlpha = 0.30 * e.flash;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(0, 0, rd.r * 0.9, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    };
    // The hull turns to face you; the effects above deliberately do not, so
    // the sniper's aim line and the shielder's aura stay in world space.
    ctx.save();
    ctx.rotate(Math.PI);
    drawRosterHull(e, rd.art, rd.r * 0.62, flashFill);
    ctx.restore();
    ctx.restore();
    return;
  }
  drawLegacyEnemy(e);
}

function drawLegacyEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  // Enemies grow as you descend, so a level-2000 grunt reads as a real ship
  // rather than the same sprite with a bigger number behind it.
  if (e.scale && e.scale !== 1) ctx.scale(e.scale, e.scale);
  const flashFill = () => { if (e.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.30*e.flash})`; ctx.fill(); } };

  switch (e.kind) {
    case 'elite': {
      // Broad gunship: armoured canopy, side weapon pods, four engines.
      drawEngine(-9, -12, 7, 5, 'rgba(255,170,40,0.85)');
      drawEngine( 9, -12, 7, 5, 'rgba(255,170,40,0.85)');
      ctx.fillStyle = '#5a2a10';
      ctx.fillRect(-22, -6, 8, 18);          // port pod
      ctx.fillRect( 14, -6, 8, 18);          // starboard pod
      ctx.strokeStyle = '#ff7722'; ctx.lineWidth = 1.5;
      ctx.strokeRect(-22, -6, 8, 18); ctx.strokeRect(14, -6, 8, 18);
      ctx.fillStyle = '#ffcc44';
      ctx.fillRect(-20, 11, 4, 5); ctx.fillRect(16, 11, 4, 5);   // pod muzzles

      ctx.beginPath();
      ctx.moveTo(0, 20); ctx.lineTo(13, 8); ctx.lineTo(16, -8);
      ctx.lineTo(8, -14); ctx.lineTo(-8, -14); ctx.lineTo(-16, -8);
      ctx.lineTo(-13, 8); ctx.closePath();
      const eg = ctx.createLinearGradient(0, -14, 0, 20);
      eg.addColorStop(0, '#ffcc55'); eg.addColorStop(0.5, '#dd6600'); eg.addColorStop(1, '#771100');
      ctx.fillStyle = eg; ctx.fill();
      ctx.strokeStyle = '#ff5500'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();

      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-11, 2); ctx.lineTo(11, 2); ctx.stroke();

      ctx.beginPath(); ctx.ellipse(0, 6, 5, 4, 0, 0, Math.PI*2);
      ctx.fillStyle = '#ffee99'; ctx.fill();
      ctx.strokeStyle = '#442200'; ctx.lineWidth = 1.2; ctx.stroke();
      break;
    }

    case 'lancer': {
      // Long, thin, one big barrel. Everything about it points down.
      drawEngine(0, -18, 8, 6, 'rgba(120,220,255,0.9)');
      ctx.beginPath();
      ctx.moveTo(0, 24); ctx.lineTo(5, 4); ctx.lineTo(7, -16);
      ctx.lineTo(-7, -16); ctx.lineTo(-5, 4); ctx.closePath();
      const lg = ctx.createLinearGradient(0, -16, 0, 24);
      lg.addColorStop(0, '#bfefff'); lg.addColorStop(1, '#0d4a66');
      ctx.fillStyle = lg; ctx.fill();
      ctx.strokeStyle = '#66ddff'; ctx.lineWidth = 1.6; ctx.stroke();
      flashFill();
      // swept fins
      ctx.fillStyle = '#0d4a66';
      ctx.beginPath(); ctx.moveTo(-7,-14); ctx.lineTo(-17,-4); ctx.lineTo(-6,-2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo( 7,-14); ctx.lineTo( 17,-4); ctx.lineTo( 6,-2); ctx.closePath(); ctx.fill();
      // the barrel, glowing when it has a shot ready
      const ready = e.shootTimer >= 60;
      ctx.fillStyle = ready ? '#ffffff' : '#2a6a88';
      ctx.fillRect(-2.5, 18, 5, 10);
      if (ready) {
        ctx.fillStyle = 'rgba(120,220,255,0.45)';
        ctx.beginPath(); ctx.arc(0, 28, 5 + Math.sin(frame*0.4)*1.5, 0, Math.PI*2); ctx.fill();
      }
      break;
    }

    case 'weaver': {
      // Twin-boom frame that visibly banks into its strafe.
      ctx.save();
      ctx.rotate(Math.max(-0.5, Math.min(0.5, (e.bank || 0) * 0.35)));
      drawEngine(-11, -10, 6, 5, 'rgba(210,120,255,0.9)');
      drawEngine( 11, -10, 6, 5, 'rgba(210,120,255,0.9)');
      ctx.fillStyle = '#3a1155';
      ctx.fillRect(-14, -10, 5, 22);
      ctx.fillRect(  9, -10, 5, 22);
      ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 1.4;
      ctx.strokeRect(-14, -10, 5, 22); ctx.strokeRect(9, -10, 5, 22);
      ctx.beginPath();
      ctx.moveTo(0, 16); ctx.lineTo(8, 2); ctx.lineTo(8, -8); ctx.lineTo(-8, -8); ctx.lineTo(-8, 2); ctx.closePath();
      const wg = ctx.createLinearGradient(0, -8, 0, 16);
      wg.addColorStop(0, '#e9c4ff'); wg.addColorStop(1, '#5a1188');
      ctx.fillStyle = wg; ctx.fill();
      ctx.strokeStyle = '#cc66ff'; ctx.lineWidth = 1.6; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0, 2, 3.5, 0, Math.PI*2);
      ctx.fillStyle = '#ffddff'; ctx.fill();
      ctx.restore();
      break;
    }

    case 'bulwark': {
      // Heavy wedge with a physical shield plate across its underside.
      drawEngine(-12, -16, 8, 6, 'rgba(120,255,170,0.85)');
      drawEngine( 12, -16, 8, 6, 'rgba(120,255,170,0.85)');
      ctx.beginPath();
      ctx.moveTo(0, 10); ctx.lineTo(26, 0); ctx.lineTo(22, -14);
      ctx.lineTo(-22, -14); ctx.lineTo(-26, 0); ctx.closePath();
      const bwg = ctx.createLinearGradient(0, -14, 0, 10);
      bwg.addColorStop(0, '#d8ffe6'); bwg.addColorStop(1, '#14603a');
      ctx.fillStyle = bwg; ctx.fill();
      ctx.strokeStyle = '#88ffaa'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i*9, -13); ctx.lineTo(i*9, 6); ctx.stroke(); }

      if (e.plate > 0) {
        const frac = e.plate / e.plateMax;
        ctx.strokeStyle = `rgba(140,255,190,${0.4 + 0.5*frac})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 6, 25, 0.18*Math.PI, 0.82*Math.PI); ctx.stroke();
        // the plate cracks as it takes damage, so its state is readable
        if (frac < 0.66) {
          ctx.strokeStyle = 'rgba(10,40,25,0.9)'; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(-8, 28); ctx.lineTo(-2, 22); ctx.stroke();
        }
        if (frac < 0.33) {
          ctx.beginPath(); ctx.moveTo(10, 27); ctx.lineTo(4, 21); ctx.stroke();
        }
      }
      break;
    }

    case 'swarmling': {
      const p = 0.75 + 0.25*Math.sin(frame*0.3 + (e.jitter || 0));
      ctx.beginPath();
      ctx.moveTo(0, 8); ctx.lineTo(5, -2); ctx.lineTo(0, -6); ctx.lineTo(-5, -2); ctx.closePath();
      ctx.fillStyle = '#ffee66'; ctx.fill();
      ctx.strokeStyle = '#ffaa22'; ctx.lineWidth = 1; ctx.stroke();
      flashFill();
      ctx.globalAlpha = 0.35 * p;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2);
      ctx.fillStyle = '#ffee66'; ctx.fill();
      ctx.globalAlpha = 1;
      break;
    }

    case 'harbinger': {
      // A small mothership: layered plating, a lit hangar mouth, four engines.
      [-24, -8, 8, 24].forEach(x => drawEngine(x, -22, 8, 6, 'rgba(255,80,140,0.85)'));
      ctx.beginPath();
      ctx.moveTo(-38, -18); ctx.lineTo(38, -18); ctx.lineTo(30, 6);
      ctx.lineTo(14, 18); ctx.lineTo(-14, 18); ctx.lineTo(-30, 6); ctx.closePath();
      const hb = ctx.createLinearGradient(0, -18, 0, 18);
      hb.addColorStop(0, '#ffc0d8'); hb.addColorStop(0.55, '#c01a55'); hb.addColorStop(1, '#4a0020');
      ctx.fillStyle = hb; ctx.fill();
      ctx.strokeStyle = '#ff4488'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
      [-10, 0, 10].forEach(y => { ctx.beginPath(); ctx.moveTo(-34, y); ctx.lineTo(34, y); ctx.stroke(); });
      // hangar mouth — brightens just before it releases a brood
      const soon = e.broodTimer < 30;
      ctx.fillStyle = soon ? 'rgba(255,240,120,0.9)' : 'rgba(255,120,170,0.45)';
      ctx.fillRect(-13, 12, 26, 6);
      break;
    }

    case 'kamikaze': {
      // Narrow dart with a burning trail — reads as "this one is coming for you".
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const tg = ctx.createLinearGradient(0,-22,0,-4);
      tg.addColorStop(0,'rgba(255,60,80,0)'); tg.addColorStop(1,'rgba(255,120,60,0.75)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.ellipse(0,-13,4,10,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(0,16); ctx.lineTo(9,-6); ctx.lineTo(3,-2); ctx.lineTo(0,-12);
      ctx.lineTo(-3,-2); ctx.lineTo(-9,-6); ctx.closePath();
      const kg = ctx.createLinearGradient(0,-12,0,16);
      kg.addColorStop(0,'#ff88aa'); kg.addColorStop(1,'#aa0022');
      ctx.fillStyle = kg; ctx.fill();
      ctx.strokeStyle = '#ff2255'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    case 'turret': {
      // Barrel first so the platform sits on top of it.
      ctx.save();
      ctx.rotate(e.aim - Math.PI/2);
      ctx.fillStyle = '#667788';
      ctx.fillRect(-4, 0, 8, 22);
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 1; ctx.strokeRect(-4, 0, 8, 22);
      ctx.restore();
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2 + Math.PI/6;
        const px = Math.cos(a)*18, py = Math.sin(a)*15;
        i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      const hg = ctx.createLinearGradient(0,-15,0,15);
      hg.addColorStop(0,'#c3d8ee'); hg.addColorStop(1,'#3a4a5c');
      ctx.fillStyle = hg; ctx.fill();
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fillStyle = e.phase === 'hold' ? '#ff5533' : '#335577'; ctx.fill();
      ctx.strokeStyle = '#001122'; ctx.lineWidth = 1; ctx.stroke();
      // Health pips so its 8 HP doesn't feel arbitrary.
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(-14, -22, 28*Math.max(0, e.hp/e.maxHp), 2.5);
      break;
    }

    case 'mine': {
      const arming = e.arming > 0;
      const pulse = arming ? 1 + 0.5*Math.sin((30-e.arming)*0.9) : 1;
      if (arming) {
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.35*Math.sin((30-e.arming)*0.9);
        ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 60*(1 - e.arming/30), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      ctx.strokeStyle = arming ? '#ff5533' : '#8a7a33'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 + frame*0.01;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*8, Math.sin(a)*8);
        ctx.lineTo(Math.cos(a)*15*pulse, Math.sin(a)*15*pulse);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2);
      const mg = ctx.createRadialGradient(-3,-3,1,0,0,10);
      mg.addColorStop(0, arming ? '#ffdd88' : '#8a8a6a');
      mg.addColorStop(1, arming ? '#992200' : '#33332a');
      ctx.fillStyle = mg; ctx.fill();
      ctx.strokeStyle = arming ? '#ff7744' : '#ffcc00'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    default: { // grunt — stubby four-fin interceptor, twin engines
      drawEngine(-6, -10, 6, 4, 'rgba(255,140,40,0.85)');
      drawEngine( 6, -10, 6, 4, 'rgba(255,140,40,0.85)');
      ctx.fillStyle = '#7a1d00';
      ctx.beginPath(); ctx.moveTo(-9,-8); ctx.lineTo(-18,2); ctx.lineTo(-8,4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo( 9,-8); ctx.lineTo( 18,2); ctx.lineTo( 8,4); ctx.closePath(); ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 18); ctx.lineTo(9, 6); ctx.lineTo(10, -8);
      ctx.lineTo(4, -12); ctx.lineTo(-4, -12); ctx.lineTo(-10, -8);
      ctx.lineTo(-9, 6); ctx.closePath();
      const bg = ctx.createLinearGradient(0, -12, 0, 18);
      bg.addColorStop(0, '#ffb066'); bg.addColorStop(0.5, '#ee5500'); bg.addColorStop(1, '#8a0d00');
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#ff5522'; ctx.lineWidth = 1.6; ctx.stroke();
      flashFill();

      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(7, 0); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 5, 3.5, 3, 0, 0, Math.PI*2);
      ctx.fillStyle = '#ffdd66'; ctx.fill();
      ctx.strokeStyle = '#552200'; ctx.lineWidth = 1; ctx.stroke();
    }
  }
  ctx.restore();

  // Health bar for anything tanky enough that "how close am I?" is a real
  // question. Drawn outside the scale transform so it stays legible at depth.
  drawEnemyHealth(e);
}

const BAR_KINDS = ['elite', 'turret', 'lancer', 'bulwark', 'harbinger'];

function drawEnemyHealth(e) {
  if (!e.maxHp || e.hp >= e.maxHp) return;
  // Roster ships carry their own `bar` flag, set from how heavy they are
  // relative to the lightest hull in their own band. The legacy kinds keep
  // the hardcoded list they always had.
  const def = ENEMY[e.kind];
  if (!def) return;
  if (!e.showBar && BAR_KINDS.indexOf(e.kind) === -1) return;
  const w = def.r >= 34 ? 66 : 34;
  const y = e.y - (def.r * (e.scale || 1)) - 10;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(e.x - w/2, y, w, 3.5);
  ctx.fillStyle = def.color;
  ctx.fillRect(e.x - w/2, y, w * Math.max(0, e.hp / e.maxHp), 3.5);
  if (e.plate > 0) {
    ctx.fillStyle = '#88ffcc';
    ctx.fillRect(e.x - w/2, y - 4.5, w * Math.max(0, e.plate / Math.max(1, e.plateMax)), 2.5);
  }
}

function drawBoss(b) {
  const def = bossDef(b);
  const dying = b.dying > 0;
  ctx.save();
  ctx.translate(b.x, b.y);
  // The death flicker is applied here rather than per-boss so every hull
  // dies the same readable way.
  if (dying && Math.floor(b.deathTick/3) % 2 === 0) ctx.globalAlpha = 0.55;
  ctx.save();
  def.paint(b);
  ctx.restore();
  ctx.restore();
  // A second pass in world space, for anything that has to escape the hull:
  // beams, tethers, arena grids, the pull of a devouring mothership.
  if (def.paintWorld) {
    ctx.save();
    if (dying && Math.floor(b.deathTick/3) % 2 === 0) ctx.globalAlpha = 0.55;
    def.paintWorld(b);
    ctx.restore();
  }
}

function drawBossBar(b) {
  const pad = 14, barW = W - pad*2, y = 52;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,20,0.65)';
  ctx.fillRect(pad, y, barW, 10);
  const frac = Math.max(0, b.hp / b.maxHp);
  const col = bossTint(b, '#33ccff', '#ffaa22', '#ff3322');
  ctx.fillStyle = col;
  ctx.fillRect(pad, y, barW*frac, 10);
  // A tick per phase boundary, however many phases this boss has — the
  // seven-phase Mothership and the two-phase Scrapjaw both read honestly.
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
  const n = Math.max(1, b.maxPhases || 3);
  for (let i = 1; i < n; i++) {
    const f = i / n;
    ctx.beginPath(); ctx.moveTo(pad + barW*f, y); ctx.lineTo(pad + barW*f, y+10); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, y, barW, 10);

  // The boss's own name, and under it whatever it wants you to know right now
  // (plates remaining, heads alive, bays open). Long names shrink to fit
  // rather than running off the canvas.
  ctx.fillStyle = col;
  ctx.textAlign = 'left';
  ctx.font = 'bold 10px monospace';
  const name = b.name || 'UNKNOWN CONTACT';
  if (name.length > 34) ctx.font = 'bold 8px monospace';
  ctx.fillText(name, pad, y - 4);
  ctx.textAlign = 'right';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('PHASE ' + b.phase + '/' + n, W - pad, y - 4);

  const def = bossDef(b);
  if (def.title) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText(def.title(b), W/2, y + 22);
  }
  ctx.restore();
}

function drawBossWarning() {
  const t = bossWarning / 110;
  ctx.save();
  // Red pulse around the screen edge.
  ctx.globalAlpha = 0.35 + 0.35*Math.sin(frame*0.35);
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.72);
  vg.addColorStop(0, 'rgba(255,0,0,0)');
  vg.addColorStop(1, 'rgba(255,20,20,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(1, t*2.2);
  ctx.fillStyle = 'rgba(30,0,0,0.72)';
  ctx.fillRect(0, H/2 - 44, W, 88);
  ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H/2-44); ctx.lineTo(W, H/2-44);
  ctx.moveTo(0, H/2+44); ctx.lineTo(W, H/2+44); ctx.stroke();
  ctx.fillStyle = Math.floor(frame/6) % 2 ? '#ff5544' : '#ffdd88';
  ctx.font = 'bold 38px monospace'; ctx.textAlign = 'center';
  ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 24;
  ctx.fillText('WARNING', W/2, H/2 - 4);
  // Name the thing. A boss you can name is a boss you can talk about
  // afterwards, which is most of why the roster is hand-built at all.
  const info = RLCore.bossFor(level);
  const nm = info ? info.name : 'CAPITAL SHIP INBOUND';
  ctx.fillStyle = '#ffaa88'; ctx.shadowBlur = 0;
  ctx.font = 'bold ' + (nm.length > 30 ? 11 : nm.length > 18 ? 14 : 17) + 'px monospace';
  ctx.fillText(nm, W/2, H/2 + 24);
  ctx.restore();
}

// ===== PICKUPS =====
// What meteors are FOR. A rock used to be scenery you shot for twenty points;
// now each class carries something, and that is the reason to take the shot
// instead of sliding around it.

let pickups = [];

const PICKUP = {
  scrap:  { col: '#ffd23f', edge: '#8a6a00', label: 'SCRAP' },
  shield: { col: '#5fe0ff', edge: '#0a5a78', label: '+SHIELD' },
  life:   { col: '#5fff9f', edge: '#0a6a34', label: '+1 LIFE' },
  rage:   { col: '#ff6a3a', edge: '#7a2000', label: 'OVERDRIVE' },
  freeze: { col: '#a8f0ff', edge: '#1a6a80', label: 'COLD SNAP' }
};

function spawnPickup(x, y, kind, value) {
  if (pickups.length > 60) return;
  pickups.push({
    x, y, kind, value: value || 0,
    vx: (Math.random()-0.5) * 1.8, vy: -0.6 - Math.random() * 1.2,
    life: 600, spin: Math.random() * Math.PI * 2, taken: false
  });
}

// The magnet. Range comes from LODESTONE and friends, or from MAGPIE's hull.
function pickupRange() {
  const ship = currentShip();
  return Math.max(stats ? stats.magnetRange : 0, ship.magnetStart || 0) + 26;
}

function updatePickups() {
  const range = pickupRange();
  pickups.forEach(p => {
    if (p.taken) return;
    const dx = player.x - p.x, dy = player.y - p.y;
    const d2 = dx*dx + dy*dy;
    if (d2 < range * range) {
      const d = Math.max(1, Math.sqrt(d2));
      const pull = 0.55 + (1 - Math.min(1, d / range)) * 1.6;
      p.vx += (dx / d) * pull; p.vy += (dy / d) * pull;
    }
    p.vx *= 0.94; p.vy = p.vy * 0.94 + 0.06;
    p.x += p.vx; p.y += p.vy;
    p.spin += 0.08;
    p.life--;
    if (d2 < 24 * 24) collectPickup(p);
  });
  pickups = pickups.filter(p => !p.taken && p.life > 0 && p.y < H + 40);
}

function collectPickup(p) {
  p.taken = true;
  const d = PICKUP[p.kind] || PICKUP.scrap;
  switch (p.kind) {
    case 'scrap':
      scrap += p.value;
      addFlashText('+' + p.value.toLocaleString(), p.x, p.y - 12, d.col);
      break;
    case 'shield':
      if (player.shieldCharges < RLCore.MAX_SHIELD_CHARGES) player.shieldCharges++;
      addFlashText(d.label, p.x, p.y - 12, d.col);
      break;
    case 'life':
      lives++;
      addFlashText(d.label, p.x, p.y - 12, d.col);
      break;
    case 'rage':
      // A short, loud damage window. Deliberately timed rather than permanent.
      boostRage = Math.max(boostRage, 480);
      addFlashText(d.label, p.x, p.y - 12, d.col);
      break;
    case 'freeze':
      boostFreeze = Math.max(boostFreeze, 360);
      enemies.forEach(e => { e.chill = Math.max(e.chill || 0, 0.6); e.chillLeft = 360; });
      addFlashText(d.label, p.x, p.y - 12, d.col);
      break;
  }
  spawnParticles(p.x, p.y, d.col, 10);
  Sound.play('pickup');
}

function drawPickups() {
  pickups.forEach(p => {
    const d = PICKUP[p.kind] || PICKUP.scrap;
    const fade = p.life < 90 ? (p.life % 12 < 6 ? 0.35 : 1) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.kind === 'scrap' ? p.spin * 0.35 : 0);
    const glow = ctx.createRadialGradient(0, 0, 1, 0, 0, 15);
    glow.addColorStop(0, d.col); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = fade * 0.45;
    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI*2); ctx.fillStyle = glow; ctx.fill();
    ctx.globalAlpha = fade;
    if (p.kind === 'scrap') drawScrapIcon(0, 0, 8, d.col, d.edge);
    else {
      ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2);
      ctx.fillStyle = d.col; ctx.fill();
      ctx.strokeStyle = d.edge; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = d.edge;
      if (p.kind === 'shield') { ctx.fillRect(-1.5, -4, 3, 8); ctx.fillRect(-4, -1.5, 8, 3); }
      else if (p.kind === 'life') { ctx.fillRect(-1.5, -4, 3, 8); ctx.fillRect(-4, -1.5, 8, 3); ctx.fillStyle = d.col; ctx.fillRect(-1, -3, 2, 6); }
      else if (p.kind === 'rage') { ctx.beginPath(); ctx.moveTo(1,-5); ctx.lineTo(-3,1); ctx.lineTo(0,1); ctx.lineTo(-1,5); ctx.lineTo(3,-1); ctx.lineTo(0,-1); ctx.closePath(); ctx.fill(); }
      else if (p.kind === 'freeze') { for (let i=0;i<3;i++){ const a=i*Math.PI/3; ctx.beginPath(); ctx.moveTo(-Math.cos(a)*5,-Math.sin(a)*5); ctx.lineTo(Math.cos(a)*5,Math.sin(a)*5); ctx.lineWidth=1.6; ctx.strokeStyle=d.edge; ctx.stroke(); } }
    }
    ctx.restore();
  });
}

// The scrap mark: a cut hex washer, not a yellow circle. Used by the pickup,
// the HUD and the shop so the currency reads as one thing everywhere.
function drawScrapIcon(x, y, r, col, edge) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = -Math.PI/2 + i * Math.PI/3;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0, '#fff3bf'); g.addColorStop(0.5, col || '#ffd23f'); g.addColorStop(1, edge || '#8a6a00');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = edge || '#8a6a00'; ctx.lineWidth = Math.max(1, r * 0.16); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  ctx.restore();
}

// The credit mark: a struck coin with a notch, so it never reads as scrap.
function drawCreditIcon(x, y, r, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2);
  const g = ctx.createRadialGradient(-r*0.3, -r*0.4, r*0.1, 0, 0, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, col || '#9fe8ff'); g.addColorStop(1, '#14506b');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = '#0d3a50'; ctx.lineWidth = Math.max(1, r * 0.18); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.55, -0.6, Math.PI * 1.4); ctx.stroke();
  ctx.fillStyle = '#0d3a50';
  ctx.fillRect(-r * 0.12, -r * 0.72, r * 0.24, r * 1.44);
  ctx.restore();
}

function makeAsteroid(big) {
  let r = big ? 22+Math.random()*14 : 10+Math.random()*8;
  let verts = [];
  let n = 7 + Math.floor(Math.random()*4);
  for (let i = 0; i < n; i++) {
    let angle = (i/n)*Math.PI*2;
    let dist = r * (0.7 + Math.random()*0.5);
    verts.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
  }
  // Every rock is now one of eight classes, and the class decides what falls
  // out of it. RLCore.rollMeteor keeps the odds pure and testable.
  const cls = RLCore.rollMeteor(level, Math.random);
  const hp = Math.max(1, Math.round(RLCore.meteorHp(cls.id, level) * (big ? 1 : 0.45)));
  return {
    x: r + Math.random()*(W-2*r), y: -r-10,
    vx: (Math.random()-0.5)*1.2,
    vy: (difficulty().enemySpeed * (big ? 1.2 : 0.8)),
    r, verts, rot: 0, rotSpeed: (Math.random()-0.5)*0.04, big,
    cls: cls.id, hp, maxHp: hp, flash: 0
  };
}

// What a broken rock leaves behind.
function meteorPayload(a) {
  const cls = RLCore.METEORS.find(m => m.id === a.cls) || RLCore.METEORS[0];
  const ship = currentShip();
  const bonus = (stats ? stats.dropBonus : 0) + (ship.dropRich || 0);
  let n = cls.drops + (a.big ? 1 : 0) + Math.floor(bonus * (cls.drop === 'scrap' ? 1 : 0.34));
  // One-off boons stay one-off however much drop bonus is stacked; only the
  // scrap classes actually multiply out.
  if (cls.drop !== 'scrap') n = Math.min(n, 3);
  const unit = Math.max(1, Math.round(RLCore.scrapForKill(90, stats ? stats.scrapMul : 1, level) * (a.big ? 1 : 0.5)));
  for (let i = 0; i < n; i++) {
    spawnPickup(a.x + (Math.random()-0.5)*a.r, a.y + (Math.random()-0.5)*a.r, cls.drop, unit);
  }
  return cls;
}

// Per-kind stats. Everything that differs between enemy types lives here so
// the update and render paths only branch on behaviour, not on numbers.
// Health now comes from RLCore.enemyHp(kind, level) — the `hp` field that used
// to live here was a flat number that could not scale to level 2500.
// The ten legacy kinds. Boss minions still spawn these by name, and they are
// the fallback for anything the roster does not cover, so they keep their own
// art path in drawEnemy. `beh` is what the update loop actually switches on.
const LEGACY_ENEMY = {
  grunt:     { points: 100, r: 22, color: '#ff5500', boom: 24, shake: 5,  hitStop: 0, beh: 'drifter' },
  elite:     { points: 200, r: 24, color: '#ffaa00', boom: 40, shake: 12, hitStop: 3, beh: 'drifter', elite: true },
  kamikaze:  { points: 120, r: 18, color: '#ff2255', boom: 28, shake: 8,  hitStop: 0, beh: 'charger' },
  turret:    { points: 300, r: 26, color: '#99bbdd', boom: 44, shake: 12, hitStop: 3, beh: 'turret' },
  mine:      { points:  80, r: 20, color: '#ffcc00', boom: 46, shake: 14, hitStop: 0, beh: 'mine' },
  lancer:    { points: 260, r: 22, color: '#66ddff', boom: 34, shake: 9,  hitStop: 2, beh: 'lancer' },
  weaver:    { points: 220, r: 20, color: '#cc66ff', boom: 30, shake: 8,  hitStop: 1, beh: 'weaver' },
  bulwark:   { points: 480, r: 30, color: '#88ffaa', boom: 52, shake: 16, hitStop: 4, beh: 'bulwark' },
  swarmling: { points:  40, r: 11, color: '#ffee66', boom: 14, shake: 2,  hitStop: 0, beh: 'swarm' },
  harbinger: { points: 900, r: 40, color: '#ff4488', boom: 70, shake: 22, hitStop: 6, beh: 'harbinger' }
};

// One table the whole game looks things up in: the ten legacy kinds plus all
// ninety-five roster ships, each derived from its RLCore entry so the numbers
// live in exactly one place.
const ENEMY = Object.assign({}, LEGACY_ENEMY);
RLCore.ENEMY_ROSTER.forEach(d => {
  const band = RLCore.ENEMY_BANDS[d.band];
  const lightest = band.reduce((a, x) => Math.min(a, x.hp), Infinity);
  ENEMY[d.id] = {
    points: d.points, r: d.r, color: d.art.c1,
    boom: Math.round(d.r * 1.7), shake: Math.round(2 + d.r * 0.35),
    hitStop: d.r >= 34 ? 4 : d.r >= 26 ? 2 : 0,
    beh: d.beh, art: d.art, name: d.name, band: d.band,
    // More gun pods means more guns. It is the one stat the silhouette
    // already tells you, so the firing pattern should agree with it.
    elite: d.art.pods >= 2,
    // Anything meaningfully tougher than the lightest hull in its own band
    // earns a health bar, rather than a hardcoded list of five names.
    bar: d.hp >= lightest * 2.5
  };
});

// Which ships fly at this level, and how often. The roster swaps wholesale
// every ten levels; the mix inside a band shifts from light hulls to heavy
// ones as you cross it.
function enemyWeights() {
  return RLCore.enemyWeightsFor(level);
}

function pickEnemyKind() {
  const w = enemyWeights();
  const total = w.reduce((s, e) => s + e[1], 0);
  let r = Math.random() * total;
  for (const [kind, weight] of w) { r -= weight; if (r <= 0) return kind; }
  return w.length ? w[0][0] : 'skiff';
}

function makeEnemy(kind) {
  const d = difficulty();
  const def = ENEMY[kind] || ENEMY.skiff;
  const e = {
    kind, beh: def.beh, x: 30 + Math.random()*(W-60), y: -30,
    vx: 0, vy: d.enemySpeed * 0.8,
    hp: RLCore.enemyHp(kind, level), maxHp: RLCore.enemyHp(kind, level),
    scale: RLCore.enemyScale(level), flash: 0, dead: false,
    shootTimer: 0, zigzag: 0, zigzagDir: 1,
    formationId: 0, sweep: false, baseX: 0
  };
  switch (def.beh) {
    case 'drifter':
      e.vx = (Math.random()-0.5)*2;
      e.shootTimer = Math.floor(Math.random()*80);
      break;
    case 'charger':
      // Locks a target column at spawn, then commits to it.
      e.vy = d.enemySpeed * 2.6;
      e.targetX = player.x;
      break;
    case 'turret':
      e.vy = d.enemySpeed * 0.9;
      e.holdY = 120 + Math.random()*50;
      e.holdTimer = 480;
      e.phase = 'descend';
      e.aim = Math.PI/2;
      e.burstLeft = 0; e.burstTimer = 0;
      break;
    case 'mine':
      e.vy = 0.6;
      e.vx = (Math.random()-0.5)*0.4;
      e.arming = 0;
      break;
    case 'lancer':
      // Fires straight down and only straight down. It has to line itself up
      // with you, which is a telegraph you can read and get out of.
      e.vy = d.enemySpeed * 0.6;
      e.vx = 0;
      e.shootTimer = Math.floor(Math.random()*60);
      e.chargeUp = 0;
      break;
    case 'weaver':
      // Wide, fast strafing — the one that punishes standing still.
      e.vy = d.enemySpeed * 0.5;
      e.weavePhase = Math.random()*Math.PI*2;
      e.weaveAmp = 60 + Math.random()*50;
      e.baseX = e.x;
      e.bank = 0;
      e.shootTimer = Math.floor(Math.random()*70);
      break;
    case 'bulwark':
      // A shield plate covers its underside. Shoot it from the flank — which
      // is the answer to "how do I hit the thing that is off to the side".
      e.vy = d.enemySpeed * 0.34;
      e.vx = (Math.random()-0.5)*0.8;
      e.plate = e.maxHp * 0.45;
      e.plateMax = e.plate;
      break;
    case 'swarm':
      e.vy = d.enemySpeed * 1.5;
      e.vx = (Math.random()-0.5)*3;
      e.jitter = Math.random()*Math.PI*2;
      break;
    case 'harbinger':
      // A small mothership with its own bar. Escorts itself.
      e.vy = d.enemySpeed * 0.3;
      e.vx = (Math.random()-0.5)*1.2;
      e.broodTimer = 90;
      e.shootTimer = 0;
      break;

    // ---- the six new behaviours ------------------------------------------
    case 'orbiter':
      // Falls to a ring around you and circles it, firing inward. You cannot
      // out-run it, only out-turn it.
      e.vy = d.enemySpeed * 0.55;
      e.orbitA = Math.random() * Math.PI * 2;
      e.orbitR = 130 + Math.random() * 70;
      e.orbitDir = Math.random() < 0.5 ? 1 : -1;
      e.settled = false;
      e.shootTimer = Math.floor(Math.random()*60);
      break;
    case 'sniper':
      // Holds high, paints a line at you for most of a second, then fires one
      // very fast round down it. The telegraph IS the fight.
      e.vy = d.enemySpeed * 0.5;
      e.holdY = 90 + Math.random()*60;
      e.phase = 'descend';
      e.charge = 0;
      e.aim = Math.PI/2;
      e.shootTimer = Math.floor(Math.random()*90);
      break;
    case 'splitter':
      // Dies into two smaller copies of itself, once. Killing it badly makes
      // the situation worse, which is the whole idea.
      e.vy = d.enemySpeed * 0.6;
      e.vx = (Math.random()-0.5)*1.4;
      e.splitsLeft = 1;
      e.shootTimer = Math.floor(Math.random()*80);
      break;
    case 'shielder':
      // Hands out a plate to every nearby ship. Kill it first or kill nothing.
      e.vy = d.enemySpeed * 0.4;
      e.vx = (Math.random()-0.5)*0.9;
      e.auraTimer = 0;
      e.shootTimer = Math.floor(Math.random()*70);
      break;
    case 'bomber':
      // Drops slow bombs that sit, then burst into a ring. Area denial.
      e.vy = d.enemySpeed * 0.45;
      e.vx = (Math.random()-0.5)*1.2;
      e.bombTimer = 60 + Math.floor(Math.random()*60);
      break;
    case 'blinker':
      // Teleports rather than travels. Cannot be led, only reacted to.
      e.vy = d.enemySpeed * 0.5;
      e.blinkTimer = 50 + Math.floor(Math.random()*40);
      e.blinkGhost = 0;
      e.shootTimer = Math.floor(Math.random()*70);
      break;
  }
  if (def.bar) e.showBar = true;
  return e;
}

// ---- BOSS ----

// ===== BOSSES =====
// One entry in BOSS per `key` in RLCore.BOSS_TABLE. Each is a self-contained
// fight: its own state, its own attacks, its own hull, and one mechanic that
// appears nowhere else. They deliberately share no attack code — only the
// chrome (entrance, health bar, phase flash, death cascade) is common, and
// that lives in updateBoss/drawBoss rather than in any boss.
//
// Contract. Every field is optional except think and paint:
//   w, h            hitbox half-extents source (defaults BOSS_W x BOSS_H)
//   init(b)         once at spawn; set up bespoke state on b
//   onPhase(b, ph)  once whenever the phase changes
//   think(b, ph)    every frame once in position; ph is 1..b.maxPhases
//   damage(b, bl, dmg) -> number   how much of a hit actually lands.
//                   Return 0 to block it. Default: all of it.
//   move(b)         every frame; default drifts toward the player
//   paint(b)        draw the hull. Already translated to the boss; +y is down.
//   paintWorld(b)   optional second pass in world space (beams, tethers)
//   title(b)        the label above the health bar
//
// Everything in the game is in scope: player, enemies, enemyBullets, W, H,
// frame, level, stats, FX, Sound, hitPlayer(), spawnParticles(), makeEnemy().

const BOSS = {};

// ---- shared firing helpers -------------------------------------------------
// These exist so a boss can say what it wants rather than restating the
// velocity maths. TIME DILATION applies through every one of them.

function bossSpeed(mul) { return difficulty().bulletSpeed * (mul === undefined ? 1 : mul) * stats.enemyBulletMul; }

function bossShot(x, y, angle, speedMul, r, elite) {
  if (enemyBullets.length >= CFG.caps.enemyBullets) return;
  const s = bossSpeed(speedMul);
  enemyBullets.push({
    x, y, vx: Math.cos(angle) * s, vy: Math.sin(angle) * s,
    r: r || 5, elite: elite !== false, dead: false
  });
}

function bossRing(x, y, n, speedMul, offset, r) {
  for (let i = 0; i < n; i++) bossShot(x, y, (offset || 0) + (i / n) * Math.PI * 2, speedMul, r);
}

function bossAimed(x, y, spreads, speedMul, r) {
  const a = enemyAimAngle(x, y);
  (spreads || [0]).forEach(o => bossShot(x, y, a + o, speedMul, r));
}

function bossMinion(kind, x, y) {
  if (enemies.length >= CFG.caps.enemies) return null;
  const m = makeEnemy(kind);
  m.x = x; m.y = y;
  enemies.push(m);
  return m;
}

// Hull whiteout on a hit. Called by a boss's paint() right after it fills its
// silhouette, so the flash follows the shape rather than a bounding box.
function bossFlash(b) {
  if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, 0.10 * b.flash)})`; ctx.fill(); }
}

// A phase-tinted colour ramp, so every boss escalates visually without all of
// them escalating the same way.
function bossTint(b, cool, warm, hot) {
  const t = (b.phase - 1) / Math.max(1, b.maxPhases - 1);
  return t < 0.34 ? cool : t < 0.7 ? warm : hot;
}

function bossHalfW(b) { const d = BOSS[b.key]; return (d && d.w) ? d.w / 2 : BOSS_W / 2; }
function bossHalfH(b) { const d = BOSS[b.key]; return (d && d.h) ? d.h / 2 : BOSS_H / 2; }

// ---------------------------------------------------------------------------
// The fallback. Used only if a boss key has no entry yet, so a partially
// populated registry still produces a playable, honest fight rather than a
// crash or an inert sitting duck.
// ---------------------------------------------------------------------------
BOSS.generic = {
  think(b, ph) {
    if (b.attackTimer >= 120 - ph * 8) {
      b.attackTimer = 0;
      if (ph % 2 === 1) bossRing(b.x, b.y, 10 + ph * 2, 0.85, frame * 0.01);
      else bossAimed(b.x, b.y + 20, [-0.22, 0, 0.22], 1);
      Sound.play('hit');
    }
  },
  paint(b) {
    ctx.beginPath();
    ctx.moveTo(-BOSS_W/2, -6); ctx.lineTo(-BOSS_W/2 + 18, -BOSS_H/2);
    ctx.lineTo(BOSS_W/2 - 18, -BOSS_H/2); ctx.lineTo(BOSS_W/2, -6);
    ctx.lineTo(BOSS_W/2 - 26, BOSS_H/2); ctx.lineTo(0, BOSS_H/2 + 10);
    ctx.lineTo(-BOSS_W/2 + 26, BOSS_H/2);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -BOSS_H/2, 0, BOSS_H/2);
    g.addColorStop(0, '#4a5a72'); g.addColorStop(1, '#0d1119');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = bossTint(b, '#66aaff', '#ffaa33', '#ff4433');
    ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);
    [-32, 0, 32].forEach((cx, i) => {
      ctx.beginPath(); ctx.arc(cx, 4, i === 1 ? 8 : 6, 0, Math.PI*2);
      ctx.fillStyle = bossTint(b, '#33ccff', '#ffaa00', '#ff3311'); ctx.fill();
    });
  }
};

// ---------------------------------------------------------------------------
// L10 — SCRAPJAW
// Mechanic: four bolt-on armour plates absorb ALL damage. Break them off to
// expose the core. This is the game's first lesson in "find the weak point",
// so it is deliberately unmissable: the plates are huge, they crack visibly,
// and nothing you do to the hull registers until they are gone.
// ---------------------------------------------------------------------------
BOSS.scrapjaw = {
  w: 130, h: 62,
  init(b) {
    b.plates = [-48, -16, 16, 48].map(x => ({ x, hp: b.maxHp * 0.11, max: b.maxHp * 0.11, gone: false }));
    b.chomp = 0;
  },
  damage(b, bl, dmg) {
    // A plate covers roughly a quarter of the hull. Whichever one the shot
    // lands over eats it; only a gap lets damage through to the core.
    const local = bl.x - b.x;
    const plate = b.plates.find(p => !p.gone && Math.abs(local - p.x) < 17);
    if (!plate) return dmg;
    plate.hp -= dmg;
    if (plate.hp <= 0) {
      plate.gone = true;
      spawnParticles(b.x + plate.x, b.y + 10, '#cc9955', 20);
      FX.addShake(12);
      Sound.play('plateBreak');
      addFlashText('PLATE OFF', b.x + plate.x, b.y, '#ffcc66');
    }
    return 0;
  },
  onPhase(b) { b.chomp = 26; },
  think(b, ph) {
    const open = b.plates.filter(p => p.gone).length;
    // It gets angrier as it is stripped, which rewards breaking plates fast.
    if (b.attackTimer >= 96 - open * 12) {
      b.attackTimer = 0;
      b.chomp = 18;
      if (ph === 1) bossAimed(b.x, b.y + 24, [-0.28, -0.09, 0.09, 0.28], 0.95, 5);
      else { bossRing(b.x, b.y, 9, 0.8, frame * 0.02, 5); bossAimed(b.x, b.y + 24, [0], 1.25, 6); }
      Sound.play('hit');
    }
    // Spits scrap-hulks it has chewed up.
    if (ph === 2 && b.attackTimer === 40 && frame % 3 === 0) bossMinion('swarmling', b.x, b.y + 30);
    if (b.chomp > 0) b.chomp--;
  },
  paint(b) {
    const bite = b.chomp > 0 ? Math.sin(b.chomp * 0.35) * 7 : 0;
    // lower jaw
    ctx.beginPath();
    ctx.moveTo(-58, 6); ctx.lineTo(58, 6);
    ctx.lineTo(46, 26 + bite); ctx.lineTo(-46, 26 + bite);
    ctx.closePath();
    ctx.fillStyle = '#3a2c1c'; ctx.fill();
    ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2; ctx.stroke();
    // teeth
    ctx.fillStyle = '#d8cbb0';
    for (let i = -4; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 11 - 4, 8 + bite); ctx.lineTo(i * 11, 20 + bite); ctx.lineTo(i * 11 + 4, 8 + bite);
      ctx.closePath(); ctx.fill();
    }
    // hull
    ctx.beginPath();
    ctx.moveTo(-65, 6); ctx.lineTo(-52, -28); ctx.lineTo(52, -28); ctx.lineTo(65, 6);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -28, 0, 6);
    g.addColorStop(0, '#7b6a4e'); g.addColorStop(1, '#2a2118');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#a98c55'; ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);
    // eye — only lights once the plates are off, so "now it is vulnerable"
    // is something you see rather than something you infer.
    const exposed = b.plates.every(p => p.gone);
    ctx.beginPath(); ctx.arc(0, -12, exposed ? 9 : 6, 0, Math.PI*2);
    ctx.fillStyle = exposed ? '#ff3322' : '#553322'; ctx.fill();
    if (exposed) {
      ctx.strokeStyle = 'rgba(255,80,50,' + (0.4 + 0.4*Math.sin(frame*0.15)) + ')';
      ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, -12, 14, 0, Math.PI*2); ctx.stroke();
    }
    // the plates themselves
    b.plates.forEach(p => {
      if (p.gone) return;
      const frac = p.hp / p.max;
      ctx.fillStyle = '#5d5347';
      ctx.fillRect(p.x - 16, -26, 32, 30);
      ctx.strokeStyle = '#cbb27e'; ctx.lineWidth = 2;
      ctx.strokeRect(p.x - 16, -26, 32, 30);
      ctx.fillStyle = 'rgba(255,220,150,0.16)';
      ctx.fillRect(p.x - 16, -26, 32, 30 * (1 - frac));
      ctx.fillStyle = '#8a7a55';
      [-9, 9].forEach(o => { ctx.beginPath(); ctx.arc(p.x + o, -21, 2.5, 0, Math.PI*2); ctx.fill(); });
      if (frac < 0.6) {
        ctx.strokeStyle = 'rgba(20,14,8,0.9)'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(p.x - 10, -22); ctx.lineTo(p.x + 2, -8); ctx.stroke();
      }
      if (frac < 0.3) {
        ctx.beginPath(); ctx.moveTo(p.x + 11, -24); ctx.lineTo(p.x - 1, -4); ctx.stroke();
      }
    });
  },
  title(b) {
    const left = b.plates.filter(p => !p.gone).length;
    return left ? 'ARMOUR PLATES ' + left : 'CORE EXPOSED';
  }
};

// ---------------------------------------------------------------------------
// L20 — HALO WARDEN
// Mechanic: a rotating shield ring with a single gap. Damage only lands when
// the gap is between you and the hull, so the fight is about reading rotation
// and moving to where the opening will be, not where it is.
// ---------------------------------------------------------------------------
BOSS.halowarden = {
  w: 96, h: 96,
  // The ring is a damage GATE, not a wall. A hard block was tried first and
  // made the fight nine times too long: with a narrow gap only ~9% of shots
  // ever landed, turning a 28-second boss into a three-minute one. The ring
  // now soaks most of a blocked shot instead, so timing your burst into the
  // gap is a large reward rather than the only way to make any progress.
  RING_SOAK: 0.72,
  init(b) { b.ringAngle = 0; b.ringSpeed = 0.028; b.gapWidth = 2.0; b.spin = 0; },
  onPhase(b, ph) {
    b.ringSpeed = (0.028 + ph * 0.007) * (ph % 2 === 0 ? -1 : 1);   // reverses
    b.gapWidth = Math.max(1.25, 2.0 - ph * 0.25);                    // narrows
  },
  damage(b, bl, dmg) {
    // Angle from the boss to the shot, measured against the gap's centre.
    const a = Math.atan2(bl.y - b.y, bl.x - b.x);
    let d = a - b.ringAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    if (Math.abs(d) < b.gapWidth / 2) return dmg;
    // Through the ring: mostly absorbed, and visibly so.
    spawnParticles(bl.x, bl.y, '#66ccff', 3);
    b.spin = 6;
    return dmg * (1 - BOSS.halowarden.RING_SOAK);
  },
  think(b, ph) {
    b.ringAngle += b.ringSpeed;
    if (b.spin > 0) b.spin--;
    if (b.attackTimer >= 108 - ph * 14) {
      b.attackTimer = 0;
      // Fires OUT OF THE GAP, so the opening is both the way in and the
      // direction the danger comes from.
      bossShot(b.x + Math.cos(b.ringAngle) * 44, b.y + Math.sin(b.ringAngle) * 44, b.ringAngle, 1.35, 6);
      bossRing(b.x, b.y, 4 + ph * 2, 0.7, b.ringAngle, 4);
      Sound.play('hit');
    }
  },
  paint(b) {
    // core
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2);
    const g = ctx.createRadialGradient(-6, -8, 3, 0, 0, 28);
    g.addColorStop(0, '#e6f4ff'); g.addColorStop(1, '#123a5c');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#66ccff'; ctx.lineWidth = 2.5; ctx.stroke();
    bossFlash(b);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI*2);
    ctx.fillStyle = bossTint(b, '#aef0ff', '#ffdd88', '#ff8866'); ctx.fill();

    // the ring, drawn as an arc that stops at the gap
    ctx.save();
    ctx.rotate(b.ringAngle);
    ctx.lineCap = 'round';
    ctx.strokeStyle = b.spin > 0 ? '#ffffff' : 'rgba(110,200,255,0.9)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(0, 0, 44, b.gapWidth / 2, Math.PI * 2 - b.gapWidth / 2);
    ctx.stroke();
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(200,240,255,0.55)';
    ctx.beginPath();
    ctx.arc(0, 0, 44, b.gapWidth / 2, Math.PI * 2 - b.gapWidth / 2);
    ctx.stroke();
    // gap mouth markers, so the opening reads at a glance
    ctx.lineCap = 'butt';
    ctx.strokeStyle = '#ffee66'; ctx.lineWidth = 3;
    [b.gapWidth / 2, -b.gapWidth / 2].forEach(a => {
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 36, Math.sin(a) * 36);
      ctx.lineTo(Math.cos(a) * 52, Math.sin(a) * 52);
      ctx.stroke();
    });
    ctx.restore();
  },
  title() { return 'SHIELD RING — FIRE THROUGH THE GAP'; }
};

// ---------------------------------------------------------------------------
// L10 — TRIAD  (three hulls flying as one; it was THE CHOIR at level 30)
// Mechanic: three linked heads sharing one health pool. Damage to any head
// drains the shared pool, but each head you silence makes the survivors
// faster and angrier — so the order and timing are the puzzle, and burning
// one down early is a real (punishable) choice.
// ---------------------------------------------------------------------------
BOSS.choir = {
  w: 150, h: 70,
  init(b) {
    b.heads = [-52, 0, 52].map((x, i) => ({ ox: x, x: b.x + x, y: b.y, dead: false, t: i * 2.1, sing: 0 }));
    b.silenced = 0;
  },
  damage(b, bl, dmg) {
    const h = b.heads.find(h => !h.dead && Math.abs(bl.x - h.x) < 26 && Math.abs(bl.y - h.y) < 26);
    if (!h) return 0;                       // the gaps between heads are empty air
    h.sing = 6;
    // Silence a head once the shared pool passes its share of the total.
    const alive = b.heads.filter(x => !x.dead).length;
    const threshold = b.maxHp * (alive - 1) / 3;
    if (b.hp - dmg <= threshold && alive > 1) {
      h.dead = true;
      b.silenced++;
      spawnParticles(h.x, h.y, '#aa88ff', 26);
      FX.addShake(16);
      Sound.play('explode');
      addFlashText('SILENCED', h.x, h.y, '#cc99ff');
    }
    return dmg;
  },
  move(b) {
    b.x += Math.sign(player.x - b.x) * Math.min(0.9 + b.silenced * 0.5, Math.abs(player.x - b.x));
    b.x = Math.max(80, Math.min(W - 80, b.x));
  },
  think(b, ph) {
    const rate = 1 + b.silenced * 0.9;      // survivors take up the slack
    b.heads.forEach((h, i) => {
      if (h.dead) return;
      h.t += 0.03 * rate;
      h.x = b.x + h.ox + Math.sin(h.t) * 16;
      h.y = b.y + Math.cos(h.t * 0.7) * 12;
      if (h.sing > 0) h.sing--;
      h.timer = (h.timer || i * 30) + rate;
      if (h.timer >= 110) {
        h.timer = 0;
        h.sing = 10;
        if (ph >= 2) bossAimed(h.x, h.y + 16, [-0.2, 0.2], 0.95, 5);
        else bossAimed(h.x, h.y + 16, [0], 0.9, 5);
        Sound.play('hit');
      }
    });
    // In the last phase the survivors sing together — a wall you must gap.
    if (ph >= 3 && b.attackTimer >= 150) {
      b.attackTimer = 0;
      const live = b.heads.filter(h => !h.dead);
      live.forEach(h => bossRing(h.x, h.y, 7, 0.65, frame * 0.02));
      Sound.play('warning');
    }
  },
  paint(b) {
    // Painted in world space via the translate already applied: heads are
    // stored in world coords, so undo the translate for them.
    ctx.save();
    ctx.translate(-b.x, -b.y);
    // linking filaments
    const live = b.heads.filter(h => !h.dead);
    ctx.strokeStyle = 'rgba(170,120,255,0.35)'; ctx.lineWidth = 2;
    for (let i = 0; i < live.length - 1; i++) {
      ctx.beginPath(); ctx.moveTo(live[i].x, live[i].y); ctx.lineTo(live[i+1].x, live[i+1].y); ctx.stroke();
    }
    b.heads.forEach(h => {
      if (h.dead) {
        ctx.strokeStyle = 'rgba(90,70,120,0.5)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(h.x, h.y, 14, 0, Math.PI*2); ctx.stroke();
        return;
      }
      ctx.beginPath(); ctx.arc(h.x, h.y, 24, 0, Math.PI*2);
      const g = ctx.createRadialGradient(h.x - 6, h.y - 8, 2, h.x, h.y, 26);
      g.addColorStop(0, '#e9d8ff'); g.addColorStop(1, '#3a1170');
      ctx.fillStyle = g; ctx.fill();
      ctx.strokeStyle = h.sing > 0 ? '#ffffff' : '#aa77ff';
      ctx.lineWidth = 2.5; ctx.stroke();
      // an open mouth when it sings
      ctx.beginPath();
      ctx.ellipse(h.x, h.y + 8, 7, h.sing > 0 ? 9 : 3, 0, 0, Math.PI*2);
      ctx.fillStyle = '#180030'; ctx.fill();
      ctx.beginPath(); ctx.arc(h.x - 8, h.y - 5, 3, 0, Math.PI*2);
      ctx.arc(h.x + 8, h.y - 5, 3, 0, Math.PI*2);
      ctx.fillStyle = bossTint(b, '#88ddff', '#ffcc66', '#ff6655'); ctx.fill();
      if (h.sing > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(h.x, h.y, 30 + (10 - h.sing) * 2, 0, Math.PI*2); ctx.stroke();
      }
    });
    ctx.restore();
    if (b.flash > 0) { /* per-head flash is drawn above */ }
  },
  title(b) { return 'HEADS ' + b.heads.filter(h => !h.dead).length + ' / 3'; }
};

// ---- boss pack: boss_c ----
// ===========================================================================
// VOID RUNNER — boss set C
//   L300  SEVEN ANGLES        a polygon that gains a side, and a gun, a phase
//   L350  THE WIDOW           a tether that hurts while taut
//   L400  ASHEN CHOIRMASTER   everything lands on an audible four-beat bar
//   L500  THE THRESHOLD       copies your build and fights you with it
//
// Every helper below is prefixed with its boss key so nothing in this file can
// collide with another boss file spliced into the same script.
// ===========================================================================


// ---------------------------------------------------------------------------
// L300 — SEVEN ANGLES
// Mechanic: the hull IS the weapon. It is a rotating regular polygon whose
// side count rises with the phase — a triangle at phase 1, a heptagon at
// phase 5 — and every side is an independent turret firing along its own
// outward normal. So the shot pattern is a rotating star that gains a point
// every phase, and rotation reverses direction each time, which means the
// safe wedge you learned last phase sweeps the other way in this one.
//
// Two firing modes share the same geometry:
//   SEQUENCER  one face at a time, lit for the full interval before it fires,
//              walking around the polygon. That lit face IS the wind-up.
//   VOLLEY     every face at once, after a 36-frame charge where all muzzles
//              glow and the hull pulses. Punctuation, not chip damage.
//
// Damage: a face that just fired is glowing hot and takes 60% more. It never
// blocks — the shape is a target, not a shield.
// ---------------------------------------------------------------------------

function sevenanglesSideCount(ph) { return Math.max(3, Math.min(7, 2 + ph)); }

// Outward normal of face i on an n-gon rotated by rot.
function sevenanglesFaceAngle(rot, n, i) { return rot + (i + 0.5) * Math.PI * 2 / n; }

// Distance from centre to the midpoint of a face (the apothem).
function sevenanglesApothem(n, R) { return R * Math.cos(Math.PI / n); }

// Which face is a world point sitting over?
function sevenanglesFaceAt(b, wx, wy) {
  var n = b.sevN;
  // Face i spans the arc [rot + i*step, rot + (i+1)*step].
  var step = Math.PI * 2 / n;
  var a = Math.atan2(wy - b.y, wx - b.x) - b.sevRot;
  var i = Math.floor(a / step) % n;
  while (i < 0) i += n;
  return i;
}

function sevenanglesFireFace(b, i, ph, heavy) {
  var R = b.sevR;
  var ang = sevenanglesFaceAngle(b.sevRot, b.sevN, i);
  var ap = sevenanglesApothem(b.sevN, R);
  var mx = b.x + Math.cos(ang) * (ap + 6);
  var my = b.y + Math.sin(ang) * (ap + 6);
  var f = b.sevFaces[i];
  if (f) { f.heat = 60; f.muzzle = 9; }
  if (heavy) {
    // volley shot: a tight three-lance out of every muzzle
    bossShot(mx, my, ang - 0.13, 1.05, 5);
    bossShot(mx, my, ang, 1.20, 6);
    bossShot(mx, my, ang + 0.13, 1.05, 5);
  } else {
    bossShot(mx, my, ang, 1.05, 5);
    if (ph >= 4) bossShot(mx, my, ang + (ph === 5 ? 0.22 : 0.16) * (i % 2 ? 1 : -1), 0.9, 4);
  }
  spawnParticles(mx, my, '#ffd27a', 3);
}

BOSS.sevenangles = {
  w: 122, h: 116,
  init: function (b) {
    b.sevR = 58;
    b.sevRot = -Math.PI / 2;
    b.sevSpeed = 0.011;
    b.sevN = 3;
    b.sevFaces = [];
    b.sevSeq = 0;          // index of the face currently lit / about to fire
    b.sevSeqT = 0;
    b.sevVolley = 0;       // charge counter for the all-faces volley
    b.sevPulse = 0;
    for (var i = 0; i < 7; i++) b.sevFaces.push({ heat: 0, muzzle: 0 });
  },

  onPhase: function (b, ph) {
    b.sevN = sevenanglesSideCount(ph);
    // Rotation reverses and quickens every phase, so a learned safe wedge
    // does not survive the transition.
    b.sevSpeed = (0.010 + ph * 0.0045) * (ph % 2 === 0 ? -1 : 1);
    b.sevSeq = b.sevSeq % b.sevN;
    b.sevSeqT = 0;
    b.sevVolley = 0;
    b.sevPulse = 26;
    addFlashText(b.sevN + ' ANGLES', b.x, b.y - 74, '#ffcc55');
    FX.addShake(10);
  },

  damage: function (b, bl, dmg) {
    var i = sevenanglesFaceAt(b, bl.x, bl.y);
    var f = b.sevFaces[i];
    if (f && f.heat > 0) {
      spawnParticles(bl.x, bl.y, '#ff8833', 4);
      return dmg * 1.6;                       // a vented face is soft
    }
    return dmg;
  },

  think: function (b, ph) {
    b.sevRot += b.sevSpeed;
    if (b.sevPulse > 0) b.sevPulse--;
    var i;
    for (i = 0; i < b.sevFaces.length; i++) {
      if (b.sevFaces[i].heat > 0) b.sevFaces[i].heat--;
      if (b.sevFaces[i].muzzle > 0) b.sevFaces[i].muzzle--;
    }

    // ---- sequencer: one face, lit for its whole interval, then it fires ----
    var interval = Math.max(30, 46 - ph * 3);
    b.sevSeqT++;
    if (b.sevSeqT >= interval) {
      b.sevSeqT = 0;
