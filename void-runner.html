<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VOID RUNNER</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', monospace; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480, H = 720;
canvas.width = W; canvas.height = H;

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ===== CONFIG =====

const CFG = {
  creditsPerScore: 100,

  caps: { particles: 400, bullets: 200, enemyBullets: 300, enemies: 40 },

  // Ship roster. `id` is the persisted key.
  ships: [
    { id: 'vanguard', name: 'VANGUARD', cost: 0,    lives: 3, speed: 5.5, fireMul: 1.00, hitW: 28, hitH: 36, spreadMul: 1.0, phase: false,
      hull: ['#a0d8ff', '#3399ff', '#0055bb'], trim: '#00ccff',
      blurb: 'Balanced. Standard-issue runner.' },
    { id: 'needle',   name: 'NEEDLE',   cost: 500,  lives: 2, speed: 7.5, fireMul: 0.62, hitW: 22, hitH: 32, spreadMul: 0.8, phase: false,
      hull: ['#ffe0a0', '#ff9933', '#bb4400'], trim: '#ffcc33',
      blurb: 'Fast and fragile. Fires far quicker.' },
    { id: 'bulwark',  name: 'BULWARK',  cost: 1500, lives: 4, speed: 4.0, fireMul: 1.25, hitW: 34, hitH: 40, spreadMul: 1.6, phase: false,
      hull: ['#c8ffd0', '#33bb66', '#116633'], trim: '#44ffaa',
      blurb: 'Slow tank. Starts each run shielded.' },
    { id: 'phantom',  name: 'PHANTOM',  cost: 4000, lives: 3, speed: 6.0, fireMul: 0.92, hitW: 18, hitH: 28, spreadMul: 1.0, phase: true,
      hull: ['#e8ccff', '#9955ff', '#4400aa'], trim: '#cc88ff',
      blurb: 'Tiny hitbox. Phases one hit per level.' }
  ],

  // Weapon levels 1..5. `dx` is the muzzle offset, `a` the launch angle in radians.
  weapons: [
    { fireRate: 14, pierce: 0, shots: [{dx:-10, a: 0}, {dx: 10, a: 0}] },
    { fireRate: 10, pierce: 0, shots: [{dx:-10, a: 0}, {dx: 10, a: 0}] },
    { fireRate: 10, pierce: 0, shots: [{dx:-11, a:-0.08}, {dx: 0, a: 0}, {dx: 11, a: 0.08}] },
    { fireRate:  9, pierce: 0, shots: [{dx:-12, a:-0.16}, {dx:-5, a:-0.06}, {dx: 5, a: 0.06}, {dx: 12, a: 0.16}] },
    { fireRate:  8, pierce: 1, shots: [{dx:-13, a:-0.14}, {dx:-7, a:-0.05}, {dx: 0, a: 0}, {dx: 7, a: 0.05}, {dx: 13, a: 0.14}] }
  ]
};

// ===== SAVE =====

const Save = {
  KEY: 'voidrunner.save',
  VERSION: 1,
  ok: true,
  data: null,

  defaults() {
    return {
      version: 1,
      hiScore: 0, bestLevel: 1, totalRuns: 0, totalKills: 0,
      credits: 0, unlocked: ['vanguard'], selectedShip: 'vanguard', muted: false
    };
  },

  load() {
    Save.data = Save.defaults();
    try {
      const raw = localStorage.getItem(Save.KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        // An unrecognized version resets to defaults rather than crashing.
        if (parsed && parsed.version === Save.VERSION) {
          Object.assign(Save.data, parsed);
          if (!Array.isArray(Save.data.unlocked) || !Save.data.unlocked.length) Save.data.unlocked = ['vanguard'];
          if (!CFG.ships.some(s => s.id === Save.data.selectedShip)) Save.data.selectedShip = 'vanguard';
        }
      }
    } catch (e) {
      // Storage blocked or corrupt: run from memory with defaults.
      Save.ok = false;
      Save.data = Save.defaults();
    }
  },

  write() {
    try {
      localStorage.setItem(Save.KEY, JSON.stringify(Save.data));
    } catch (e) {
      Save.ok = false;
    }
  }
};

Save.load();

// ===== STATE =====

let state = 'start'; // start | play | dead
let score = 0, lives = 3, level = 1;
let hiScore = Save.data.hiScore;
let shake = 0, shakeX = 0, shakeY = 0;
let combo = 0, comboTimer = 0;
let flashText = [], levelBanner = null;
let frame = 0;
let runKills = 0;

// ---- STARS ----
const starLayers = [
  Array.from({length:60}, () => ({x: Math.random()*W, y: Math.random()*H, r: 0.6, speed: 0.4})),
  Array.from({length:40}, () => ({x: Math.random()*W, y: Math.random()*H, r: 1.0, speed: 0.9})),
  Array.from({length:20}, () => ({x: Math.random()*W, y: Math.random()*H, r: 1.6, speed: 1.8}))
];

// ---- NEBULA ----
const nebulae = Array.from({length: 5}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  rx: 60+Math.random()*80, ry: 40+Math.random()*60,
  hue: [220,260,280,200][Math.floor(Math.random()*4)],
  speed: 0.25 + Math.random()*0.15
}));

// ---- PLAYER ----
const player = { x: W/2, y: H - 120, w: 28, h: 36, speed: 5.5, invincible: 0, shield: 0, boost: 0, trail: [] };

// ---- COLLECTIONS ----
let bullets = [], enemyBullets = [], asteroids = [], enemies = [], particles = [], powerups = [];
let shootTimer = 0;

// ---- TOUCH ----
let touchX = null;

// ---- DIFFICULTY ----
let spawnTimer = 0, asteroidTimer = 0, levelTimer = 0;
function difficulty() {
  return {
    spawnRate: Math.max(35, 90 - level*5),
    asteroidRate: Math.max(50, 120 - level*6),
    enemySpeed: 1.2 + level*0.2,
    bulletSpeed: 2.5 + level*0.15
  };
}

// ===== SYSTEMS =====

// Keep array lengths bounded so a chaotic screen can't sink the frame rate.
function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
  return arr;
}
function capAll() {
  capArray(particles, CFG.caps.particles);
  capArray(bullets, CFG.caps.bullets);
  capArray(enemyBullets, CFG.caps.enemyBullets);
  capArray(enemies, CFG.caps.enemies);
}

// ---- INPUT ----
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === 'start' || state === 'dead') { if (e.key === ' ' || e.key === 'Enter') startGame(); }
  if (e.key === ']' && state === 'play') levelUp(); // DEBUG: removed in final pass
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });
canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; if (state !== 'play') startGame(); }, {passive:true});
canvas.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', () => { touchX = null; });

function startGame() {
  state = 'play';
  score = 0; lives = 3; level = 1; frame = 0; runKills = 0;
  player.x = W/2; player.y = H - 120; player.invincible = 0; player.shield = 0; player.boost = 0; player.trail = [];
  bullets = []; enemyBullets = []; asteroids = []; enemies = []; particles = []; powerups = []; flashText = [];
  spawnTimer = 0; asteroidTimer = 0; levelTimer = 0; combo = 0; comboTimer = 0; levelBanner = null;
}

function levelUp() {
  levelTimer = 0; level++;
  levelBanner = {text: 'LEVEL ' + level, life: 120};
  spawnParticles(W/2, H/2, '#00ffff', 30);
}

function endRun() {
  state = 'dead';
  hiScore = Math.max(hiScore, score);
  Save.data.hiScore = hiScore;
  Save.data.bestLevel = Math.max(Save.data.bestLevel, level);
  Save.data.totalRuns += 1;
  Save.data.totalKills += runKills;
  Save.write();
  spawnParticles(player.x, player.y, '#ff8800', 50);
}

// ===== ENTITIES =====

function drawShip(x, y, invincible, shield, boost, t) {
  ctx.save();
  ctx.translate(x, y);
  if (invincible && Math.floor(t/4)%2 === 0) { ctx.restore(); return; }

  // Engine flames
  let flameLen = boost ? 28 : 16;
  let flameW = boost ? 10 : 7;
  ctx.save();
  let gL = ctx.createLinearGradient(0,0,0,flameLen);
  gL.addColorStop(0,'rgba(0,200,255,0.9)'); gL.addColorStop(0.4,'rgba(255,140,0,0.7)'); gL.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.ellipse(-9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  let gR = ctx.createLinearGradient(0,0,0,flameLen);
  gR.addColorStop(0,'rgba(0,200,255,0.9)'); gR.addColorStop(0.4,'rgba(255,140,0,0.7)'); gR.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gR;
  ctx.beginPath(); ctx.ellipse(9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Hull
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(10, 10); ctx.lineTo(10, 18);
  ctx.lineTo(-10, 18); ctx.lineTo(-10, 10); ctx.lineTo(-14, 14); ctx.closePath();
  let hullG = ctx.createLinearGradient(-14, -18, 14, 18);
  hullG.addColorStop(0, '#a0d8ff'); hullG.addColorStop(0.5, '#3399ff'); hullG.addColorStop(1, '#0055bb');
  ctx.fillStyle = hullG;
  ctx.fill();
  ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 1.5; ctx.stroke();

  // Cockpit
  ctx.beginPath(); ctx.ellipse(0, -4, 6, 8, 0, 0, Math.PI*2);
  let cg = ctx.createRadialGradient(0,-6,1,0,-4,8);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.4,'#88eeff'); cg.addColorStop(1,'#0044cc');
  ctx.fillStyle = cg; ctx.fill();

  // Wings
  ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(-22, 18); ctx.lineTo(-10, 14); ctx.closePath();
  ctx.fillStyle = '#2277dd'; ctx.fill(); ctx.strokeStyle='#00ccff'; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 6); ctx.lineTo(22, 18); ctx.lineTo(10, 14); ctx.closePath();
  ctx.fillStyle = '#2277dd'; ctx.fill(); ctx.stroke();

  // Cannons
  ctx.fillStyle = '#aaddff';
  ctx.fillRect(-13, -4, 4, 14); ctx.fillRect(9, -4, 4, 14);

  // Shield bubble
  if (shield > 0) {
    let alpha = 0.3 + 0.2*Math.sin(t*0.2);
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,255,255,${alpha})`; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = `rgba(0,200,255,${alpha*0.2})`; ctx.fill();
  }

  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    let v = a.verts[i];
    i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  let ag = ctx.createRadialGradient(0,0,2,0,0,a.r);
  ag.addColorStop(0,'#aaa'); ag.addColorStop(1,'#444');
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.elite) {
    ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(16,0); ctx.lineTo(0,16); ctx.lineTo(-16,0); ctx.closePath();
    let eg = ctx.createRadialGradient(0,0,2,0,0,18);
    eg.addColorStop(0,'#ffaa00'); eg.addColorStop(1,'#880000');
    ctx.fillStyle = eg; ctx.fill();
    ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.moveTo(0,-8); ctx.lineTo(0,8);
    ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(14,-10); ctx.lineTo(8,-4); ctx.lineTo(0,-14); ctx.lineTo(-8,-4); ctx.lineTo(-14,-10); ctx.closePath();
    let bg = ctx.createLinearGradient(-14,-14,14,18);
    bg.addColorStop(0,'#ff6600'); bg.addColorStop(1,'#aa0000');
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2);
    ctx.fillStyle='#ffdd00'; ctx.fill();
  }
  ctx.restore();
}

function makeAsteroid(big) {
  let r = big ? 22+Math.random()*14 : 10+Math.random()*8;
  let verts = [];
  let n = 7 + Math.floor(Math.random()*4);
  for (let i = 0; i < n; i++) {
    let angle = (i/n)*Math.PI*2;
    let dist = r * (0.7 + Math.random()*0.5);
    verts.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
  }
  return {
    x: r + Math.random()*(W-2*r), y: -r-10,
    vx: (Math.random()-0.5)*1.2,
    vy: (difficulty().enemySpeed * (big ? 1.2 : 0.8)),
    r, verts, rot: 0, rotSpeed: (Math.random()-0.5)*0.04, big, hp: big ? 3 : 1
  };
}

function makeEnemy() {
  let elite = level >= 3 && Math.random() < 0.3;
  return {
    x: 30 + Math.random()*(W-60), y: -30,
    vx: (Math.random()-0.5)*2, vy: difficulty().enemySpeed * 0.8,
    elite, hp: elite ? 4 : 2, shootTimer: Math.floor(Math.random()*80),
    zigzag: 0, zigzagDir: 1
  };
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random()*Math.PI*2;
    let speed = 1.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 30 + Math.random()*30, maxLife: 60,
      r: 1.5+Math.random()*3,
      color, type: Math.random() < 0.3 ? 'spark' : 'dot'
    });
  }
}

function addFlashText(text, x, y, color) {
  flashText.push({text, x, y, life: 60, color, vy: -1.2});
}

function hitPlayer() {
  if (player.invincible > 0 || player.shield > 0) {
    if (player.shield > 0) { player.shield = 0; shake = 8; spawnParticles(player.x, player.y, '#00ffff', 12); }
    return;
  }
  lives--;
  player.invincible = 120;
  shake = 20;
  spawnParticles(player.x, player.y, '#ff4400', 20);
  combo = 0; comboTimer = 0;
  if (lives <= 0) endRun();
}

function aabbCircle(rx, ry, rw, rh, cx, cy, cr) {
  let nx = Math.max(rx-rw/2, Math.min(cx, rx+rw/2));
  let ny = Math.max(ry-rh/2, Math.min(cy, ry+rh/2));
  return (nx-cx)*(nx-cx)+(ny-cy)*(ny-cy) < cr*cr;
}

// ===== UPDATE =====

function update() {
  frame++;
  levelTimer++;

  // Level up every 28 seconds
  if (levelTimer > 60*28) levelUp();

  // Stars
  starLayers.forEach(layer => layer.forEach(s => {
    s.y += s.speed; if (s.y > H+2) { s.y = -2; s.x = Math.random()*W; }
  }));

  // Nebulae
  nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

  // Player movement
  let dx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (touchX !== null) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = W / rect.width;
    let tx = (touchX - rect.left) * scaleX;
    if (tx < player.x - 15) dx = -1;
    else if (tx > player.x + 15) dx = 1;
  }
  let spd = player.speed * (player.boost > 0 ? 1.6 : 1);
  player.x = Math.max(20, Math.min(W-20, player.x + dx*spd));

  // Player trail
  player.trail.push({x: player.x, y: player.y, life: 12});
  if (player.trail.length > 12) player.trail.shift();
  player.trail.forEach(t => t.life--);
  player.trail = player.trail.filter(t => t.life > 0);

  if (player.invincible > 0) player.invincible--;
  if (player.shield > 0) player.shield--;
  if (player.boost > 0) player.boost--;

  // Shooting (auto-fire)
  shootTimer++;
  let fireRate = player.boost > 0 ? 8 : 14;
  if (shootTimer >= fireRate) {
    shootTimer = 0;
    bullets.push({x: player.x - 10, y: player.y - 10, vx: 0, vy: -11, w: 3, h: 10, pierce: 0, dead: false});
    bullets.push({x: player.x + 10, y: player.y - 10, vx: 0, vy: -11, w: 3, h: 10, pierce: 0, dead: false});
    if (player.boost > 0) bullets.push({x: player.x, y: player.y - 20, vx: 0, vy: -13, w: 3, h: 10, pierce: 0, dead: false});
  }

  // Spawn asteroids
  asteroidTimer++;
  if (asteroidTimer >= difficulty().asteroidRate) {
    asteroidTimer = 0;
    asteroids.push(makeAsteroid(Math.random() < 0.4));
  }

  // Spawn enemies
  spawnTimer++;
  if (spawnTimer >= difficulty().spawnRate) {
    spawnTimer = 0;
    if (Math.random() < 0.7) enemies.push(makeEnemy());
  }

  // Move bullets
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Move enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    bullets.forEach(b => {
      if (b.dead || a.hp <= 0) return;
      if (Math.abs(b.x - a.x) < a.r + 2 && Math.abs(b.y - a.y) < a.r + 2) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        a.hp--;
        spawnParticles(b.x, b.y, '#aaaaaa', 4);
        if (a.hp <= 0) {
          if (a.big) {
            for (let i = 0; i < 2; i++) asteroids.push({...makeAsteroid(false), x: a.x + (i?15:-15), y: a.y, vy: a.vy*1.2});
          }
          spawnParticles(a.x, a.y, '#888888', 16);
          score += a.big ? 50 : 20;
          combo++; comboTimer = 120;
          if (combo > 2) addFlashText('x'+combo+'!', a.x, a.y, '#ffff00');
        }
      }
    });
    if (a.hp > 0 && aabbCircle(player.x, player.y, player.w, player.h, a.x, a.y, a.r)) hitPlayer();
  });

  // Enemies
  enemies.forEach(e => {
    e.zigzag += 0.04;
    e.x += e.vx + Math.sin(e.zigzag)*2.5*e.zigzagDir;
    e.y += e.vy;
    if (e.x < 20 || e.x > W-20) e.vx *= -1;

    e.shootTimer++;
    let eRate = e.elite ? 55 : 90;
    if (e.shootTimer >= eRate) {
      e.shootTimer = 0;
      let angle = Math.atan2(player.y - e.y, player.x - e.x);
      let spd2 = difficulty().bulletSpeed;
      enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle)*spd2, vy: Math.sin(angle)*spd2, r: 4, elite: e.elite, dead: false});
      if (e.elite) {
        [-0.3, 0.3].forEach(offset => {
          enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle+offset)*spd2, vy: Math.sin(angle+offset)*spd2, r: 4, elite: true, dead: false});
        });
      }
    }

    bullets.forEach(b => {
      if (b.dead || e.hp <= 0) return;
      if (Math.abs(b.x-e.x)<18 && Math.abs(b.y-e.y)<18) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        e.hp--;
        spawnParticles(b.x, b.y, e.elite ? '#ff8800' : '#ff4400', 4);
        if (e.hp <= 0) {
          runKills++;
          spawnParticles(e.x, e.y, e.elite ? '#ffaa00' : '#ff4400', e.elite ? 30 : 20);
          shake = e.elite ? 10 : 5;
          let pts = e.elite ? 200 : 100;
          let multiplier = Math.max(1, Math.floor(combo/3));
          score += pts * multiplier;
          combo++; comboTimer = 120;
          addFlashText('+' + pts*multiplier, e.x, e.y - 10, e.elite ? '#ffaa00' : '#ff6600');
          if (Math.random() < 0.3) {
            powerups.push({x: e.x, y: e.y, type: Math.random()<0.5?'shield':'boost', vy: 1.5, life: 300, dead: false});
          }
        }
      }
    });
    if (e.hp > 0 && Math.abs(player.x-e.x)<22 && Math.abs(player.y-e.y)<22) hitPlayer();
  });

  // Enemy bullets hit player
  enemyBullets.forEach(b => {
    if (b.dead) return;
    if (Math.abs(b.x-player.x)<14 && Math.abs(b.y-player.y)<14) {
      b.dead = true;
      hitPlayer();
    }
  });

  // Powerups
  powerups.forEach(p => {
    p.y += p.vy; p.life--;
    if (p.dead) return;
    if (Math.abs(p.x-player.x)<24 && Math.abs(p.y-player.y)<24) {
      p.dead = true;
      if (p.type === 'shield') { player.shield = 180; addFlashText('SHIELD!', player.x, player.y-30, '#00ffff'); }
      else { player.boost = 200; addFlashText('BOOST!', player.x, player.y-30, '#ffff00'); }
      spawnParticles(p.x, p.y, p.type==='shield'?'#00ffff':'#ffff00', 15);
    }
  });

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--; p.r *= 0.97; });

  // Flash text
  flashText.forEach(f => { f.y += f.vy; f.life--; });

  // Reap everything in one place, after all collision passes have run.
  bullets = bullets.filter(b => !b.dead && b.y > -20);
  enemyBullets = enemyBullets.filter(b => !b.dead && b.y < H+20 && b.x > -20 && b.x < W+20);
  asteroids = asteroids.filter(a => a.y < H + 60 && a.hp > 0);
  enemies = enemies.filter(e => e.y < H+50 && e.hp > 0);
  powerups = powerups.filter(p => !p.dead && p.y < H+30 && p.life > 0);
  particles = particles.filter(p => p.life > 0);
  flashText = flashText.filter(f => f.life > 0);
  capAll();

  // Level banner
  if (levelBanner) { levelBanner.life--; if (levelBanner.life <= 0) levelBanner = null; }

  // Combo timer
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }

  // Screen shake
  if (shake > 0) {
    shake -= 1.2;
    shakeX = (Math.random()-0.5)*shake;
    shakeY = (Math.random()-0.5)*shake;
  } else { shakeX = 0; shakeY = 0; shake = 0; }

  score++;
}

// ===== RENDER =====

function drawBg() {
  ctx.fillStyle = '#020818';
  ctx.fillRect(0, 0, W, H);

  nebulae.forEach(n => {
    let ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rx);
    ng.addColorStop(0, `hsla(${n.hue},70%,40%,0.07)`);
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI*2); ctx.fill();
  });

  starLayers.forEach((layer, li) => {
    layer.forEach(s => {
      ctx.fillStyle = li===2 ? `rgba(200,220,255,0.9)` : li===1 ? `rgba(180,200,255,0.6)` : `rgba(160,180,255,0.4)`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
  });
}

function draw() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBg();

  if (state === 'play' || state === 'dead') {
    player.trail.forEach(t => {
      let alpha = (t.life/12)*0.3;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,150,255,${alpha})`; ctx.fill();
    });

    powerups.forEach(p => {
      let pulse = 0.7 + 0.3*Math.sin(frame*0.15);
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.type === 'shield') {
        ctx.beginPath(); ctx.arc(0, 0, 12*pulse, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(0,220,255,0.25)'; ctx.fill();
        ctx.strokeStyle = '#00ddff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#00eeff'; ctx.font = 'bold 11px monospace'; ctx.textAlign='center'; ctx.fillText('S',0,4);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, 12*pulse, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255,220,0,0.25)'; ctx.fill();
        ctx.strokeStyle = '#ffdd00'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#ffee00'; ctx.font = 'bold 11px monospace'; ctx.textAlign='center'; ctx.fillText('B',0,4);
      }
      ctx.restore();
    });

    asteroids.forEach(drawAsteroid);
    enemies.forEach(drawEnemy);

    bullets.forEach(b => {
      let bg2 = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(0.3, '#88ffff'); bg2.addColorStop(1, 'rgba(0,200,255,0)');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.roundRect(b.x - b.w/2, b.y - b.h, b.w, b.h, 2); ctx.fill();
    });

    enemyBullets.forEach(b => {
      ctx.save(); ctx.translate(b.x, b.y);
      let eg = ctx.createRadialGradient(0,0,1,0,0,b.r);
      eg.addColorStop(0, b.elite ? '#ffffff' : '#ffcc00');
      eg.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    if (state === 'play') drawShip(player.x, player.y, player.invincible, player.shield, player.boost, frame);

    particles.forEach(p => {
      let alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.type === 'spark') {
        ctx.save(); ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillRect(-p.r*3, -p.r/2, p.r*3, p.r);
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });

    flashText.forEach(f => {
      let alpha = f.life / 60;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color; ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    drawHUD();

    if (levelBanner) {
      let alpha = Math.min(1, levelBanner.life < 30 ? levelBanner.life/30 : (120-levelBanner.life)/30);
      if (alpha > 1) alpha = 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(0,0,40,0.7)';
      ctx.fillRect(0, H/2-30, W, 60);
      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
      ctx.fillText(levelBanner.text, W/2, H/2+12);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  if (state === 'start') drawStart();
  if (state === 'dead') drawGameOver();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,30,0.6)';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score.toLocaleString(), 10, 18);
  ctx.fillStyle = '#6688bb';
  ctx.font = '11px monospace';
  ctx.fillText('BEST: ' + hiScore.toLocaleString(), 10, 34);

  ctx.fillStyle = '#ffdd44';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LV ' + level, W/2, 18);

  for (let i = 0; i < 3; i++) {
    let lx = W - 20 - i*26;
    ctx.save(); ctx.translate(lx, 18); ctx.scale(0.6, 0.6);
    if (i < lives) {
      ctx.fillStyle = '#3399ff';
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = '#224466'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  let barY = 48;
  if (player.shield > 0) {
    ctx.fillStyle = 'rgba(0,200,255,0.2)';
    ctx.fillRect(8, barY, (W-16)*(player.shield/180), 5);
    ctx.strokeStyle = '#00ccff'; ctx.lineWidth=1;
    ctx.strokeRect(8, barY, W-16, 5);
    ctx.fillStyle = '#00ccff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('SHIELD', 8, barY+14);
    barY += 20;
  }
  if (player.boost > 0) {
    ctx.fillStyle = 'rgba(255,220,0,0.2)';
    ctx.fillRect(8, barY, (W-16)*(player.boost/200), 5);
    ctx.strokeStyle = '#ffdd00'; ctx.lineWidth=1;
    ctx.strokeRect(8, barY, W-16, 5);
    ctx.fillStyle = '#ffdd00'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('BOOST', 8, barY+14);
  }
}

// ===== SCREENS =====

function drawStatBlock(cx, y) {
  const d = Save.data;
  const rows = [
    ['BEST',    d.hiScore.toLocaleString()],
    ['BEST LV', String(d.bestLevel)],
    ['RUNS',    String(d.totalRuns)],
    ['KILLS',   d.totalKills.toLocaleString()],
    ['CREDITS', d.credits.toLocaleString() + ' CR']
  ];
  ctx.save();
  ctx.font = '11px monospace';
  const boxW = 210, boxH = rows.length*16 + 14;
  ctx.fillStyle = 'rgba(0,20,45,0.55)';
  ctx.fillRect(cx - boxW/2, y, boxW, boxH);
  ctx.strokeStyle = 'rgba(0,180,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(cx - boxW/2, y, boxW, boxH);
  rows.forEach((r, i) => {
    const ry = y + 18 + i*16;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#5577aa';
    ctx.fillText(r[0], cx - boxW/2 + 12, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = r[0] === 'CREDITS' ? '#ffdd44' : '#aaccee';
    ctx.fillText(r[1], cx + boxW/2 - 12, ry);
  });
  ctx.restore();
}

function drawStart() {
  ctx.fillStyle = 'rgba(0,5,20,0.85)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#00eeff';
  ctx.font = 'bold 52px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('VOID', W/2, 205);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('RUNNER', W/2, 258);
  ctx.restore();

  ctx.fillStyle = '#aaccff';
  ctx.font = '14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('Survive the endless void', W/2, 292);

  drawStatBlock(W/2, 314);

  ctx.fillStyle = '#667799';
  ctx.font = '12px monospace';
  ctx.fillText('← → or A D to move', W/2, 452);
  ctx.fillText('Auto-fire enabled', W/2, 472);
  ctx.fillText('Collect S (Shield) and B (Boost)', W/2, 492);

  let pulse = 0.6 + 0.4*Math.sin(frame*0.08);
  ctx.fillStyle = `rgba(0,255,200,${pulse})`;
  ctx.font = 'bold 18px monospace';
  ctx.fillText('PRESS SPACE TO LAUNCH', W/2, 548);

  drawShip(W/2, 112, 0, 0, 0, frame);

  if (!Save.ok) {
    ctx.fillStyle = '#665533';
    ctx.font = '10px monospace';
    ctx.fillText('progress cannot be saved in this browser', W/2, H - 16);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,10,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#ff6622';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2 - 70);
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SCORE: ' + score.toLocaleString(), W/2, H/2 - 20);

  if (score >= hiScore) {
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('✦ NEW BEST! ✦', W/2, H/2 + 12);
  } else {
    ctx.fillStyle = '#6688aa';
    ctx.font = '14px monospace';
    ctx.fillText('BEST: ' + hiScore.toLocaleString(), W/2, H/2 + 12);
  }

  let pulse = 0.6 + 0.4*Math.sin(frame*0.1);
  ctx.fillStyle = `rgba(0,220,180,${pulse})`;
  ctx.font = 'bold 18px monospace';
  ctx.fillText('PRESS SPACE TO RETRY', W/2, H/2 + 65);
}

// ===== LOOP =====

function loop() {
  if (state === 'play') update();
  else {
    frame++;
    starLayers.forEach(layer => layer.forEach(s => { s.y += s.speed; if (s.y > H+2) { s.y=-2; s.x=Math.random()*W; } }));
    nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });
  }
  draw();
  requestAnimationFrame(loop);
}

// Fix roundRect for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}

// DEBUG: inspection hook, removed in final pass
window.__vr = {
  get state(){return state}, get player(){return player}, get enemies(){return enemies},
  get bullets(){return bullets}, get enemyBullets(){return enemyBullets},
  get particles(){return particles}, get asteroids(){return asteroids},
  get level(){return level}, get score(){return score}, get lives(){return lives},
  Save, CFG
};

loop();
</script>
