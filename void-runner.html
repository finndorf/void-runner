        if (stats.chain > 0) applyChain(e.x, e.y, stats.chain, b.damage * 0.5);
        if (b.split && !b.isSplit) {
          [-0.5, 0.5].forEach(a => bullets.push({
            x: e.x, y: e.y,
            vx: Math.sin(a) * BULLET_SPEED, vy: -Math.cos(a) * BULLET_SPEED,
            w: 3, h: 10, pierce: 0, damage: b.damage * 0.5, homing: 0, splash: 0,
            split: false, isSplit: true, crit: false, dead: false
          }));
        }
      }
    });

    // ---- ramming the player ---- (scaled by the ship's own hitbox)
    if (!e.dead &&
        Math.abs(player.x-e.x) < st.r*0.6 + player.w*0.35 &&
        Math.abs(player.y-e.y) < st.r*0.6 + player.h*0.28) {
      hitPlayer();
      if (e.kind === 'kamikaze') {
        FX.explode(e.x, e.y, st.boom, st.color);
        Sound.play('explode');
        e.dead = true;
      }
    }
  });

  // Enemy bullets hit player
  enemyBullets.forEach(b => {
    if (b.dead) return;
    if (Math.abs(b.x-player.x) < b.r + player.w*0.30 && Math.abs(b.y-player.y) < b.r + player.h*0.26) {
      b.dead = true;
      hitPlayer();
    }
  });

  // Hit-flash decay
  enemies.forEach(e => { if (e.flash > 0) e.flash--; });
  asteroids.forEach(a => { if (a.flash > 0) a.flash--; });
  if (player.muzzle > 0) player.muzzle--;

  // Reap everything in one place, after all collision passes have run.
  // Player bullets aren't all forward-firing any more (rear cannon fires
  // downward, side pods fire sideways), so cull on all four edges rather
  // than only the top or they'd fly off-screen forever and just pile up
  // until capArray trims them from the front of the array.
  bullets = bullets.filter(b => !b.dead && b.y > -20 && b.y < H+20 && b.x > -20 && b.x < W+20);
  enemyBullets = enemyBullets.filter(b => !b.dead && b.y < H+20 && b.x > -20 && b.x < W+20);
  asteroids = asteroids.filter(a => a.y < H + 60 && a.hp > 0);
  // Turrets retreat off the top, so cull in both directions.
  enemies = enemies.filter(e => !e.dead && e.y < H+50 && e.y > -120);
  capAll();

  // Level banner
  if (levelBanner) { levelBanner.life--; if (levelBanner.life <= 0) levelBanner = null; }

  // Combo timer
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }

  updateEffects();

  score++;
}

// ===== RENDER =====

function drawBg() {
  ctx.fillStyle = '#020818';
  ctx.fillRect(0, 0, W, H);

  nebulae.forEach(n => {
    let ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rx);
    ng.addColorStop(0, `hsla(${n.hue},70%,40%,0.07)`);
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI*2); ctx.fill();
  });

  starLayers.forEach((layer, li) => {
    const col = li===2 ? `rgba(200,220,255,0.9)` : li===1 ? `rgba(180,200,255,0.6)` : `rgba(160,180,255,0.4)`;
    layer.forEach(s => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
  });
}

function draw() {
  // The shop owns the whole frame: it draws its own background and does not
  // want the screen-shake transform or the play HUD drawn under/over it.
  if (state === 'shop') { drawShop(); return; }
  if (state === 'voidbirth') { drawVoidbirth(); return; }

  ctx.save();
  ctx.translate(FX.shakeX, FX.shakeY);

  drawBg();

  if (state !== 'start') {
    player.trail.forEach(t => {
      let alpha = (t.life/12)*0.3;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,150,255,${alpha})`; ctx.fill();
    });

    asteroids.forEach(drawAsteroid);
    enemies.forEach(drawEnemy);
    if (boss) drawBoss(boss);

    bullets.forEach(b => {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI/2);   // point along travel
      const bg2 = ctx.createLinearGradient(0, 0, 0, b.h);
      bg2.addColorStop(0, '#ffffff');
      bg2.addColorStop(0.3, b.crit ? '#ffdd33' : b.isSplit ? '#88ddff' : b.pierce > 0 ? '#ffbbff' : '#88ffff');
      bg2.addColorStop(1, 'rgba(0,200,255,0)');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.roundRect(-b.w/2, -b.h, b.w, b.h, 2); ctx.fill();
      ctx.restore();
    });

    enemyBullets.forEach(b => {
      ctx.save(); ctx.translate(b.x, b.y);
      let eg = ctx.createRadialGradient(0,0,1,0,0,b.r);
      eg.addColorStop(0, b.elite ? '#ffffff' : '#ffcc00');
      eg.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    if (state === 'play') {
      drawShip(player.x, player.y, player.invincible, player.shieldCharges, frame, player.muzzle);
      drawDrones();
      drawSingularity();
      drawTracer();
    }

    particles.forEach(p => {
      let alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.type === 'spark') {
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillRect(-p.r*3, -p.r/2, p.r*3, p.r);
      } else if (p.type === 'chunk') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.8;
        ctx.strokeRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });

    // Shockwave rings and the additive flash at the heart of each blast.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    FX.glows.forEach(g => {
      const a = g.life / g.maxLife;
      const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
      gr.addColorStop(0, `rgba(255,255,255,${0.45*a})`);
      gr.addColorStop(0.35, g.color);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = a*0.55;
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    FX.rings.forEach(r => {
      const a = r.life / r.maxLife;
      ctx.save();
      ctx.globalAlpha = a*0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1 + 3*a;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });

    flashText.forEach(f => {
      let alpha = f.life / 60;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color; ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    drawHUD();
    if (boss && boss.dying === 0) drawBossBar(boss);
    if (bossWarning > 0) drawBossWarning();

    if (levelBanner) {
      let alpha = Math.min(1, levelBanner.life < 30 ? levelBanner.life/30 : (120-levelBanner.life)/30);
      if (alpha > 1) alpha = 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(0,0,40,0.7)';
      ctx.fillRect(0, H/2-30, W, 60);
      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
      ctx.fillText(levelBanner.text, W/2, H/2+12);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  // Colour drains out of the scene across the dying beat.
  if (state === 'dying') {
    const t = 1 - (dyingTimer / 75);
    ctx.save();
    ctx.fillStyle = `rgba(12,2,0,${0.55*t})`;
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.7*t})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (state === 'start') drawStart();
  if (state === 'dead') drawGameOver();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,30,0.6)';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score.toLocaleString(), 10, 18);
  ctx.fillStyle = '#6688bb';
  ctx.font = '11px monospace';
  ctx.fillText('BEST: ' + hiScore.toLocaleString(), 10, 34);

  ctx.fillStyle = '#ffdd44';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LV ' + level, W/2, 18);

  // Combo meter — drains as the window closes, colour steps with the multiplier.
  if (combo > 1) {
    const mult = comboMultiplier();
    const tierCol = mult >= 6 ? '#ff44aa' : mult >= 4 ? '#ff8800' : mult >= 2 ? '#ffdd00' : '#66ddff';
    const bw = 74, bx = W/2 - bw/2, by = 26;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = tierCol;
    ctx.fillRect(bx, by, bw*(comboTimer/120), 4);
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('x' + mult + '  (' + combo + ')', W/2, by + 15);
  }

  // Lives are no longer capped at the ship's 2-4 starting lives: REPAIR KIT
  // adds up to 2, IMMORTAL ENGINE 1, and VAMPIRIC CORE has no ceiling at all.
  // Draw up to LIVES_PIP_CAP pips and collapse the rest into "+N", the same
  // way drawScrapAndBuild handles a build list that outgrows its column.
  const LIVES_PIP_CAP = 5;
  const pipSlots = Math.max(3, Math.min(lives, LIVES_PIP_CAP));
  const overflowLives = Math.max(0, lives - LIVES_PIP_CAP);
  for (let i = 0; i < pipSlots; i++) {
    let lx = W - 20 - i*26;
    ctx.save(); ctx.translate(lx, 18); ctx.scale(0.6, 0.6);
    if (i < lives) {
      ctx.fillStyle = '#3399ff';
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = '#224466'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }
  if (overflowLives > 0) {
    ctx.fillStyle = '#3399ff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('+' + overflowLives, W - 20 - pipSlots*26 + 12, 22);
  }

  // Shield/phase readouts drop below the boss health bar when a fight is live.
  let barY = (boss && boss.dying === 0) ? 70 : 48;
  // Shield is a charge count now, not a fraction of a timer, so it draws as
  // one pip per charge rather than a draining bar.
  if (player.shieldCharges > 0) {
    ctx.fillStyle = '#00ccff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('SHIELD', 8, barY+9);
    for (let i = 0; i < player.shieldCharges; i++) {
      ctx.beginPath(); ctx.arc(54 + i*14, barY+5, 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,200,255,0.35)'; ctx.fill();
      ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 1; ctx.stroke();
    }
    barY += 20;
  }
  // Phase Drive: a lit pip when the free hit is banked, a filling bar while it
  // recharges, so the player can tell whether they are covered right now.
  if (stats.phaseDrive) {
    ctx.fillStyle = '#aa66ff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('PHASE', 8, barY+9);
    if (player.phaseCharge > 0) {
      ctx.beginPath(); ctx.arc(54, barY+5, 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(170,102,255,0.45)'; ctx.fill();
      ctx.strokeStyle = '#aa66ff'; ctx.lineWidth = 1; ctx.stroke();
    } else {
      const frac = player.phaseDriveTimer / RLCore.PHASE_DRIVE_FRAMES;
      ctx.strokeStyle = 'rgba(170,102,255,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(48, barY+1, 60, 8);
      ctx.fillStyle = 'rgba(170,102,255,0.55)';
      ctx.fillRect(48, barY+1, 60*frac, 8);
    }
    barY += 20;
  }

  drawScrapAndBuild();
  drawMuteIcon(MUTE_RECT_PLAY);
}

// Scrap readout plus the current build (owned upgrades), drawn down the
// left side under the boss/shield/phase readouts. Fixed anchor at y=124: the
// rows above it top out around y=109 in the worst case (boss bar + shield
// + phase all live at once), so this always clears them with margin.
// The player only ever moves horizontally at a fixed y=H-120=600, and the
// list is capped well short of that, so it can never sit over the ship.
function drawScrapAndBuild() {
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#5577aa';
  ctx.fillText('SCRAP', 14, 124);
  ctx.fillStyle = '#ffdd44';
  ctx.fillText(Math.floor(scrap).toLocaleString(), 62, 124);

  if (buildCacheVersion !== runUpgradesVersion) rebuildBuildCache();
  const n = buildCache.length;
  if (n === 0) return;

  ctx.font = '8px monospace';
  ctx.fillStyle = 'rgba(150,175,200,0.55)';
  ctx.fillText('BUILD', 14, 138);

  // Two columns of up to 8 rows (16 slots). Six COMMON and six UNCOMMON
  // upgrades can each stack to 5, plus up to ~17 non-stacking uniques, so a
  // maxed-out run can hold ~29 distinct entries -- far more than fits on a
  // 720px canvas. Past the cap, the last slot collapses into "+N MORE"
  // instead of letting the list run off the bottom of the screen.
  const perCol = 8, maxSlots = perCol * 2, rowH = 12, startY = 150, colX = [14, 180];
  const overflow = n > maxSlots;
  const showCount = overflow ? maxSlots - 1 : n;

  for (let i = 0; i < showCount; i++) {
    const col = i < perCol ? 0 : 1;
    const row = i % perCol;
    const x = colX[col], rowTop = startY + row * rowH;
    const o = buildCache[i];
    ctx.fillStyle = o.color;
    ctx.fillRect(x, rowTop, 6, 6);
    ctx.fillStyle = 'rgba(200,220,240,0.75)';
    ctx.fillText(o.name + (o.stacks > 1 ? ' x' + o.stacks : ''), x + 10, rowTop + 6);
  }

  if (overflow) {
    const row = (maxSlots - 1) % perCol;
    const rowTop = startY + row * rowH;
    ctx.fillStyle = 'rgba(150,175,200,0.7)';
    ctx.fillText('+' + (n - showCount) + ' MORE', colX[1] + 10, rowTop + 6);
  }
}

// ===== SCREENS =====

function drawMuteIcon(r) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  const on = !Sound.muted;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = on ? 'rgba(0,200,255,0.75)' : 'rgba(120,140,160,0.55)';
  ctx.fillStyle   = on ? 'rgba(0,200,255,0.75)' : 'rgba(120,140,160,0.55)';
  ctx.lineWidth = 1.6;
  // Speaker body
  ctx.beginPath();
  ctx.moveTo(-7, -3); ctx.lineTo(-3, -3); ctx.lineTo(1, -8);
  ctx.lineTo(1, 8); ctx.lineTo(-3, 3); ctx.lineTo(-7, 3);
  ctx.closePath(); ctx.fill();
  if (on) {
    // Two arcs of sound
    ctx.beginPath(); ctx.arc(2, 0, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(2, 0, 9, -0.9, 0.9); ctx.stroke();
  } else {
    // Crossed out
    ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(11, 5);
    ctx.moveTo(11, -5); ctx.lineTo(4, 5); ctx.stroke();
  }
  ctx.restore();
}

function drawStatBlock(cx, y) {
  const d = Save.data;
  const rows = [
    ['BEST',    d.hiScore.toLocaleString()],
    ['BEST LV', String(d.bestLevel)],
    ['RUNS',    String(d.totalRuns)],
    ['KILLS',   d.totalKills.toLocaleString()],
    ['CREDITS', d.credits.toLocaleString() + ' CR']
  ];
  ctx.save();
  ctx.font = '11px monospace';
  const boxW = 210, boxH = rows.length*16 + 14;
  ctx.fillStyle = 'rgba(0,20,45,0.55)';
  ctx.fillRect(cx - boxW/2, y, boxW, boxH);
  ctx.strokeStyle = 'rgba(0,180,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(cx - boxW/2, y, boxW, boxH);
  rows.forEach((r, i) => {
    const ry = y + 18 + i*16;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#5577aa';
    ctx.fillText(r[0], cx - boxW/2 + 12, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = r[0] === 'CREDITS' ? '#ffdd44' : '#aaccee';
    ctx.fillText(r[1], cx + boxW/2 - 12, ry);
  });
  ctx.restore();
}

function drawChevron(r, dir, enabled) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  ctx.save();
  ctx.strokeStyle = enabled ? 'rgba(0,220,255,0.85)' : 'rgba(90,110,130,0.35)';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // dir -1 points left, +1 points right: the apex sits on the dir side.
  ctx.beginPath();
  ctx.moveTo(cx - dir*5, cy - 10);
  ctx.lineTo(cx + dir*5, cy);
  ctx.lineTo(cx - dir*5, cy + 10);
  ctx.stroke();
  ctx.restore();
}

// ===== SHOP =====

// The countdown is gone. A shop that rushes you is pressure applied to the one
// moment in the run that is supposed to be a breather, so the hauler now stays
// docked until you choose to leave.
let shopSlots = [], shopRerolls = 0, shopSel = 0, haulerX = W + 120;
let shopApexFlash = 0, shopDockTick = 0, shopFreeRerolls = 0, shopName = '';

const HAULER_NAMES = ['MERIDIAN', 'BLACKFOOT', 'CALLOWAY', 'DUST ROSE', 'OLD SEPTEMBER',
  'HANNIBAL GREY', 'TIN WIDOW', 'LONG MARCH', 'SALT & IRON', 'PATIENT MULE'];

function openShop() {
  // update() does not run during the shop, so the player cannot move while
  // enemy bullets sit frozen mid-flight — one parked beside the hull would
  // land on the first frame after DEPART, costing a life AND the upgrade just
  // bought. Nothing threatens the ship while it is docked, so the in-flight
  // bullets are cleared rather than paused.
  enemyBullets = [];
  shopSlots = RLCore.rollShop(level, voidbirths, runUpgrades, Math.random, stats.shopSlots);
  shopRerolls = 0;
  shopFreeRerolls = stats.freeRerolls;
  shopSel = 0;
  haulerX = W + 120;
  shopDockTick = 0;
  shopApexFlash = 0;
  shopName = HAULER_NAMES[Math.floor(Math.random() * HAULER_NAMES.length)];
  state = 'shop';
  noteApex();
}

// Standalone (not inlined into openShop) because Task 10's reroll calls it
// too — an APEX rerolled into still counts. Tolerates null slots because
// Task 10 sets a bought slot to null.
// Anything at APEX or above is a story, so all five top tiers announce
// themselves rather than only the one that happened to be top when the ladder
// was six rungs long.
const LOUD_TIERS = ['APEX', 'OVERCLOCKED', 'HYPERCLOCKED', 'UBERCLOCKED', 'DYNACLOCKED'];

function noteApex() {
  const loud = shopSlots.filter(s => s && LOUD_TIERS.indexOf(s.tier) !== -1);
  if (!loud.length) return;
  loud.forEach(s => {
    Save.data.tiersFound[s.tier] = (Save.data.tiersFound[s.tier] || 0) + 1;
  });
  Save.data.apexFound += loud.length;
  Save.write();
  // FX.addShake is deliberately NOT used for the flash: draw() returns for the
  // shop before it ever applies the shake transform, and drawShop applies no
  // transform of its own, so an FX-driven flash would be invisible. drawShop
  // paints this counter itself.
  shopApexFlash = 34;
  FX.addShake(10);
  Sound.play('apex');
}

function updateShop() {
  // The hauler flies in, decelerates, and clamps on. No clock: it leaves when
  // you tell it to.
  haulerX += (W/2 - haulerX) * 0.07;
  shopDockTick++;
  if (shopDockTick === 34) Sound.play('dock');
  if (shopApexFlash > 0) shopApexFlash--;
}

function closeShop() {
  state = 'play';
  verdictSpent = false;          // KINETIC VERDICT re-arms each level
  levelBanner = { text: 'LEVEL ' + level, life: 120 };
  spawnParticles(W/2, H/2, '#00ffff', 30);
  Sound.play('levelUp');
  if (stats.fortress > 0) player.shieldCharges = Math.max(player.shieldCharges, stats.fortress);
  if (RLCore.isBossLevel(level)) spawnBoss(level);
}

// Screen-space rects for the shop panel. shopSlots may hold fewer than 3
// entries once the upgrade pool runs dry, but the rects still reserve all
// three card positions so the remaining cards keep their original spots.
// BROKER LICENCE can add a fourth card, so the rects are computed from the
// live slot count rather than fixed at three. Cards stay centred and shrink
// to fit rather than running off the 480px canvas.
function slotRects(n) {
  const count = Math.max(1, n || shopSlots.length || 3);
  const gap = 12;
  const w = Math.min(134, Math.floor((W - 48 - gap * (count - 1)) / count));
  const total = count * w + gap * (count - 1);
  const x0 = Math.round((W - total) / 2);
  return Array.from({ length: count }, (_, i) => ({ x: x0 + i * (w + gap), y: 300, w, h: 150 }));
}
const SLOT_RECTS = slotRects(3);   // retained for the pointer fallback path
const REROLL_RECT = { x: W/2 - 228, y: 474, w: 142, h: 34 };
const DEPART_RECT = { x: W/2 -  72, y: 474, w: 142, h: 34 };
const SKIP_RECT   = { x: W/2 +  84, y: 474, w: 142, h: 34 };

// WAR CHEST discounts everything on the rack. Read through one function so
// the card, the affordability check, and the charge can never disagree.
function slotPrice(u) {
  return RLCore.priceFor(u.tier, stats ? stats.priceDiscount : 0);
}

function tryBuySlot(i) {
  const u = shopSlots[i];
  if (!u) { Sound.play('uiDeny'); return false; }
  const t = RLCore.tierOf(u.tier);
  const price = slotPrice(u);
  if (scrap < price) { Sound.play('uiDeny'); return false; }
  // REPAIR KIT tops the ship up to its starting lives + 2 and no further. At
  // the ceiling the purchase is refused outright rather than taking 500 scrap
  // for nothing — same contract as the stack-limit guard below.
  if (u.effect.lives && lives >= currentShip().lives + 2) { Sound.play('uiDeny'); return false; }
  const have = runUpgrades.find(o => o.id === u.id);
  // Defensive: RLCore.eligible already keeps a maxed-out upgrade off the roll,
  // so this should never trigger from live play, but a shop visit spans
  // multiple purchases without re-rolling, so re-check here rather than trust
  // the roll-time filter to still hold.
  if (have && have.stacks >= t.stackLimit) { Sound.play('uiDeny'); return false; }
  scrap -= price;
  scrapSpent += price;
  scrapOnUpgrades += price;   // boss scaling counts only scrap that bought power
  if (have) have.stacks++; else runUpgrades.push({ id: u.id, stacks: 1 });
  runUpgradesVersion++;
  shopSlots[i] = null;
  recomputeStats();
  if (u.effect.shieldCharges) player.shieldCharges = Math.max(player.shieldCharges, stats.shieldCharges);
  if (u.effect.lives || u.effect.extraLife) lives += (u.effect.lives || 0) + (u.effect.extraLife || 0);
  // Phase Drive arrives charged rather than 12 seconds cold.
  if (u.effect.phaseDrive) { player.phaseCharge = 1; player.phaseDriveTimer = 0; }
  Sound.play('uiBuy');
  return true;
}

function rerollCost() {
  return shopFreeRerolls > 0 ? 0 : RLCore.rerollCost(shopRerolls);
}

function tryReroll() {
  const cost = rerollCost();
  if (scrap < cost) { Sound.play('uiDeny'); return false; }
  if (shopFreeRerolls > 0) {
    shopFreeRerolls--;              // DEALER FRIEND: a free spin, and it does
  } else {                          // not advance the doubling ladder.
    scrap -= cost;
    // Counted in scrapSpent (the player's total outlay) but not in
    // scrapOnUpgrades, which tracks scrap that actually bought power.
    scrapSpent += cost;
    shopRerolls++;
  }
  shopSlots = RLCore.rollShop(level, voidbirths, runUpgrades, Math.random, stats.shopSlots);
  shopSel = Math.min(shopSel, Math.max(0, shopSlots.length - 1));
  noteApex();
  Sound.play('uiMove');
  return true;
}

// A real ship, not a slab: panel-lined hull, lit cargo bay, running lights, a
// deceleration burn on approach, docking clamps that physically reach down to
// the player, and a name stencilled on the flank.
function drawHauler() {
  const dock = Math.min(1, shopDockTick / 40);          // 0 → 1 as it settles
  const clamp = Math.max(0, Math.min(1, (shopDockTick - 30) / 22));
  ctx.save();
  ctx.translate(haulerX, 118);

  const HW = 118, HH = 46;

  // deceleration burn, ahead of the hull while it is still braking
  if (dock < 1) {
    const b = (1 - dock);
    ctx.fillStyle = `rgba(120,200,255,${0.55 * b})`;
    ctx.beginPath();
    ctx.moveTo(-HW - 4, -10); ctx.lineTo(-HW - 4 - 46 * b, 0); ctx.lineTo(-HW - 4, 10);
    ctx.closePath(); ctx.fill();
  }

  // hull
  ctx.fillStyle = '#22323f';
  ctx.beginPath();
  ctx.moveTo(-HW, -HH + 14); ctx.lineTo(-HW + 26, -HH);
  ctx.lineTo(HW - 34, -HH);  ctx.lineTo(HW, -HH + 18);
  ctx.lineTo(HW, HH - 10);   ctx.lineTo(HW - 40, HH);
  ctx.lineTo(-HW + 18, HH);  ctx.lineTo(-HW, HH - 16);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#4d6c88'; ctx.lineWidth = 2; ctx.stroke();

  // panel lines and weathering
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath(); ctx.moveTo(i * 30, -HH + 6); ctx.lineTo(i * 30, HH - 6); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(140,90,50,0.16)';
  ctx.fillRect(-HW + 40, -HH + 8, 34, 9);
  ctx.fillRect(HW - 72, HH - 20, 42, 7);

  // lit cargo bay along the flank — the cards rise out of this
  ctx.fillStyle = '#08131c';
  ctx.fillRect(-HW + 24, 6, HW * 2 - 62, 22);
  ctx.fillStyle = `rgba(255,196,90,${0.30 + 0.12 * Math.sin(frame * 0.07)})`;
  ctx.fillRect(-HW + 24, 6, HW * 2 - 62, 22);
  ctx.fillStyle = '#0c1a26';
  for (let i = 0; i < 7; i++) ctx.fillRect(-HW + 32 + i * 28, 9, 8, 16);

  // bridge windows
  ctx.fillStyle = '#ffd47a';
  for (let i = 0; i < 4; i++) ctx.fillRect(HW - 46 + i * 9, -HH + 12, 5, 8);

  // running lights
  const blink = Math.floor(frame / 22) % 2;
  ctx.fillStyle = blink ? '#ff4444' : '#331111';
  ctx.fillRect(-HW + 4, -6, 6, 6);
  ctx.fillStyle = blink ? '#33ff77' : '#113322';
  ctx.fillRect(HW - 10, -6, 6, 6);

  // name stencil
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(190,215,235,0.45)';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(shopName, -HW + 30, -HH + 26);

  // docking clamps, reaching down to the player's hull
  if (clamp > 0) {
    ctx.strokeStyle = '#6f8ba6'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    [-34, 34].forEach(dx => {
      ctx.beginPath();
      ctx.moveTo(dx, HH - 2);
      ctx.lineTo(dx * 0.55, HH + 52 * clamp);
      ctx.stroke();
    });
    ctx.lineCap = 'butt';
    if (clamp >= 1) {
      ctx.fillStyle = `rgba(0,255,238,${0.25 + 0.2 * Math.sin(frame * 0.12)})`;
      ctx.fillRect(-30, HH + 48, 60, 3);
    }
  }
  ctx.restore();
}

function drawShop() {
  drawBg();
  drawHauler();

  // The player parks under the clamps rather than wherever it happened to be
  // when the level ended, so the docking reads as one connected image.
  drawShip(W/2, 218, 0, player.shieldCharges, frame, 0);

  // The panel runs to the bottom of the canvas: stopping it at 536 left a band
  // of dead black under the buttons that read as a rendering fault rather than
  // as space.
  ctx.fillStyle = 'rgba(0,5,20,0.82)';
  ctx.fillRect(0, 236, W, H - 236);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#00eeff'; ctx.font = 'bold 18px monospace';
  ctx.fillText('CARGO DOCKED', W/2, 268);

  ctx.fillStyle = '#5b7b96'; ctx.font = '10px monospace';
  ctx.fillText('NO RUSH — LEAVE WHEN YOU ARE READY', W/2, 288);

  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffdd44'; ctx.font = 'bold 13px monospace';
  ctx.fillText('SCRAP ' + Math.floor(scrap).toLocaleString(), 24, 268);

  if (voidbirths > 0) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#00ffee'; ctx.font = 'bold 12px monospace';
    ctx.fillText('VOIDBIRTH ' + RLCore.ROMAN[voidbirths - 1], W - 24, 268);
  }

  const rects = slotRects(shopSlots.length);
  shopSlots.forEach((u, i) => {
    const r = rects[i];
    if (!u) {
      ctx.fillStyle = 'rgba(255,255,255,0.03)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = '#3d4d5d'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
      ctx.fillText('SOLD', r.x + r.w/2, r.y + r.h/2);
      return;
    }
    const t = RLCore.tierOf(u.tier);
    const price = slotPrice(u);
    const afford = scrap >= price;
    // Every tier from APEX up animates between its two colours, so the loud
    // ones are unmistakable at a glance rather than only APEX being special.
    const col = LOUD_TIERS.indexOf(u.tier) !== -1
      ? (Math.floor(frame/6) % 2 ? t.color : t.color2)
      : t.color;

    ctx.globalAlpha = afford ? 1 : 0.45;
    ctx.fillStyle = 'rgba(0,20,45,0.75)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = col; ctx.lineWidth = i === shopSel ? 3 : 1.5;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    ctx.textAlign = 'center';
    ctx.fillStyle = col; ctx.font = 'bold 10px monospace';
    ctx.fillText(t.name, r.x + r.w/2, r.y + 20);

    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace';
    wrapText(u.name, r.x + r.w/2, r.y + 48, r.w - 14, 14);

    ctx.fillStyle = '#8fa8c0'; ctx.font = '9px monospace';
    wrapText(u.desc, r.x + r.w/2, r.y + 88, r.w - 14, 11);

    ctx.fillStyle = afford ? '#ffdd44' : '#7d6a4a'; ctx.font = 'bold 12px monospace';
    ctx.fillText(price.toLocaleString(), r.x + r.w/2, r.y + r.h - 14);
    ctx.globalAlpha = 1;
  });

  const rc = rerollCost();
  drawShopButton(REROLL_RECT, rc === 0 ? 'REROLL FREE' : 'REROLL ' + rc.toLocaleString(), scrap >= rc);
  drawShopButton(DEPART_RECT, 'DEPART →', true);
  drawShopButton(SKIP_RECT, 'SKIP', true);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#5b6b80'; ctx.font = '10px monospace';
  ctx.fillText('← → choose   SPACE buy   R reroll   D depart   S skip', W/2, 524);

  drawShopBuild();

  // APEX flash. Drawn here, last and full-screen, because draw() returns for
  // the shop before the FX shake transform and drawShop applies none — an
  // FX-driven flash would never reach the screen.
  if (shopApexFlash > 0) {
    const a = (shopApexFlash / 34) * 0.55;
    const rgb = Math.floor(frame/4) % 2 ? '0,255,238' : '255,221,51';   // APEX's two colours
    ctx.fillStyle = 'rgba(' + rgb + ',' + a + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// What you already own, listed under the rack. You are deciding what to buy,
// so the thing you most need to see is what you have — and at depth the build
// is also the only place the tier colours of your run are visible at once.
function drawShopBuild() {
  const top = 552;
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4d5f73'; ctx.font = 'bold 10px monospace';
  ctx.fillText('YOUR BUILD', 24, top);

  if (!runUpgrades.length) {
    ctx.fillStyle = '#39485a'; ctx.font = '10px monospace';
    ctx.fillText('nothing yet — a hit costs you your cheapest upgrade first,', 24, top + 20);
    ctx.fillText('so cheap ones are armour around the expensive ones.', 24, top + 34);
    return;
  }

  // Cheapest first, matching the order a hit will strip them in — so the
  // list doubles as a readout of what you are about to lose.
  const rows = runUpgrades.map(o => {
    const u = RLCore.byId(o.id);
    if (!u) return null;
    const r = RLCore.resolve(u, voidbirths);
    return { name: r.name, stacks: o.stacks, tier: r.tier, idx: RLCore.tierIndexOf(r.tier) };
  }).filter(Boolean).sort((a, b) => a.idx - b.idx);

  const COLS = 2, ROWS = 7;
  rows.slice(0, COLS * ROWS).forEach((r, i) => {
    const cx = 24 + (i % COLS) * 220;
    const cy = top + 18 + Math.floor(i / COLS) * 15;
    ctx.fillStyle = RLCore.tierOf(r.tier).color;
    ctx.font = '10px monospace';
    const label = r.name + (r.stacks > 1 ? ' ×' + r.stacks : '');
    ctx.fillText(label.length > 26 ? label.slice(0, 25) + '…' : label, cx, cy);
  });

  const hidden = rows.length - COLS * ROWS;
  if (hidden > 0) {
    ctx.fillStyle = '#4d5f73'; ctx.font = '10px monospace';
    ctx.fillText('+' + hidden + ' more', 24, top + 18 + ROWS * 15);
  }
}

function drawShopButton(r, label, enabled) {
  ctx.fillStyle = enabled ? 'rgba(0,180,255,0.12)' : 'rgba(120,130,140,0.08)';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.strokeStyle = enabled ? '#00bbee' : 'rgba(140,150,160,0.3)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(r.x, r.y, r.w, r.h);
  ctx.textAlign = 'center';
  ctx.fillStyle = enabled ? '#aee6ff' : '#6b7681';
  ctx.font = 'bold 11px monospace';
  ctx.fillText(label, r.x + r.w/2, r.y + 22);
}

// Canvas has no text wrapping, and upgrade names overflow a 134px card.
function wrapText(text, cx, y, maxW, lineH) {
  const words = String(text).split(' ');
  let line = '', ly = y;
  words.forEach(word => {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, cx, ly); line = word; ly += lineH;
    } else line = test;
  });
  if (line) ctx.fillText(line, cx, ly);
}

// ===== LOOP =====

function loop() {
  frame++;

  if (state === 'play') {
    if (FX.hitStopFrames > 0) {
      // Everything freezes; only the render below still runs.
      FX.hitStopFrames--;
    } else if (FX.slowMoFrames > 0) {
      FX.slowMoFrames--;
      FX.slowAcc += FX.slowMoFactor;
      if (FX.slowAcc >= 1) { FX.slowAcc -= 1; update(); }
    } else {
      update();
    }
  } else {
    starLayers.forEach(layer => layer.forEach(s => { s.y += s.speed; if (s.y > H+2) { s.y=-2; s.x=Math.random()*W; } }));
    nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

    if (state === 'shop') updateShop();
    if (state === 'voidbirth') updateVoidbirth();

    // Animate the credit payout on the game-over screen.
    if (state === 'dead' && creditsShown < runCredits) {
      creditsShown = Math.min(runCredits, creditsShown + Math.max(1, runCredits/45));
    }

    if (state === 'dying') {
      if (FX.hitStopFrames > 0) {
        FX.hitStopFrames--;
      } else {
        FX.slowAcc += (FX.slowMoFrames > 0 ? FX.slowMoFactor : 1);
        if (FX.slowMoFrames > 0) FX.slowMoFrames--;
        if (FX.slowAcc >= 1) { FX.slowAcc -= 1; updateEffects(); }
        dyingTimer--;
        if (dyingTimer <= 0) state = 'dead';
      }
    } else {
      updateEffects();
    }
  }

  draw();
  requestAnimationFrame(loop);
}

// Fix roundRect for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}

// Open the hangar on the ship you last flew.
selIndex = Math.max(0, CFG.ships.findIndex(s => s.id === Save.data.selectedShip));

loop();
</script>
