<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480, H = 720;
canvas.width = W; canvas.height = H;

function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ===== CONFIG =====

const CFG = {
  creditsPerScore: 60,
  maxComboMultiplier: 8,   // uncapped, a long streak runs score into the millions
  levelSeconds: 24,

  caps: { particles: 400, bullets: 200, enemyBullets: 300, enemies: 40 },

  // Ship roster. `id` is the persisted key.
  ships: [
    { id: 'vanguard', name: 'VANGUARD', cost: 0,    lives: 3, speed: 5.5, fireMul: 1.00, hitW: 28, hitH: 36, spreadMul: 1.0, phase: false,
      hull: ['#a0d8ff', '#3399ff', '#0055bb'], trim: '#00ccff',
      blurb: 'Balanced. Standard-issue runner.' },
    { id: 'needle',   name: 'NEEDLE',   cost: 500,  lives: 2, speed: 7.5, fireMul: 0.62, hitW: 22, hitH: 32, spreadMul: 0.8, phase: false,
      hull: ['#ffe0a0', '#ff9933', '#bb4400'], trim: '#ffcc33',
      blurb: 'Fast and fragile. Fires far quicker.' },
    { id: 'bulwark',  name: 'BULWARK',  cost: 1200, lives: 4, speed: 4.0, fireMul: 1.25, hitW: 34, hitH: 40, spreadMul: 1.6, phase: false,
      hull: ['#c8ffd0', '#33bb66', '#116633'], trim: '#44ffaa',
      blurb: 'Slow tank. Starts each run shielded.' },
    { id: 'phantom',  name: 'PHANTOM',  cost: 3000, lives: 3, speed: 6.0, fireMul: 0.92, hitW: 18, hitH: 28, spreadMul: 1.0, phase: true,
      hull: ['#e8ccff', '#9955ff', '#4400aa'], trim: '#cc88ff',
      blurb: 'Tiny hitbox. Phases one hit per level.' }
  ],

  // Weapon levels 1..5. `dx` is the muzzle offset, `a` the launch angle in radians.
  weapons: [
    { fireRate: 14, pierce: 0, shots: [{dx:-10, a: 0}, {dx: 10, a: 0}] },
    { fireRate: 10, pierce: 0, shots: [{dx:-10, a: 0}, {dx: 10, a: 0}] },
    { fireRate: 10, pierce: 0, shots: [{dx:-11, a:-0.08}, {dx: 0, a: 0}, {dx: 11, a: 0.08}] },
    { fireRate:  9, pierce: 0, shots: [{dx:-12, a:-0.16}, {dx:-5, a:-0.06}, {dx: 5, a: 0.06}, {dx: 12, a: 0.16}] },
    { fireRate:  8, pierce: 1, shots: [{dx:-13, a:-0.14}, {dx:-7, a:-0.05}, {dx: 0, a: 0}, {dx: 7, a: 0.05}, {dx: 13, a: 0.14}] }
  ]
};

// ===== ROGUELIKE CORE (PURE) =====
// No DOM, no canvas, no game globals. Randomness arrives as an injected rnd().
// tests/roguelike.test.mjs extracts and evaluates everything between these
// sentinels, so keeping it pure is what makes the game testable at all.

const RLCore = {};

RLCore.SAVE_VERSION = 2;

// Upgrading rather than resetting is the whole point: the old loader threw away
// any save whose version did not match, which would wipe every player's credits
// and ships the moment the format changed.
RLCore.migrateSave = function (parsed, defaults) {
  if (!parsed || typeof parsed !== 'object') return { data: defaults, ok: false };
  const v = parsed.version;
  if (v !== 1 && v !== RLCore.SAVE_VERSION) return { data: defaults, ok: false };

  const data = Object.assign({}, defaults, parsed);
  data.version = RLCore.SAVE_VERSION;
  if (v === 1) {
    data.bestScrapSpent = 0;
    data.apexFound = 0;
  }
  if (!Array.isArray(data.unlocked) || !data.unlocked.length) data.unlocked = ['vanguard'];
  if (typeof data.selectedShip !== 'string' || !data.unlocked.includes(data.selectedShip)) data.selectedShip = 'vanguard';
  return { data, ok: true };
};

// ===== END ROGUELIKE CORE (PURE) =====

// ===== SAVE =====

const Save = {
  KEY: 'voidrunner.save',
  VERSION: RLCore.SAVE_VERSION,
  ok: true,
  data: null,

  defaults() {
    return {
      version: RLCore.SAVE_VERSION,
      hiScore: 0, bestLevel: 1, totalRuns: 0, totalKills: 0,
      credits: 0, unlocked: ['vanguard'], selectedShip: 'vanguard', muted: false,
      bestScrapSpent: 0, apexFound: 0
    };
  },

  load() {
    Save.data = Save.defaults();
    try {
      const raw = localStorage.getItem(Save.KEY);
      if (raw) {
        const { data } = RLCore.migrateSave(JSON.parse(raw), Save.defaults());
        Save.data = data;
        if (!CFG.ships.some(s => s.id === Save.data.selectedShip)) Save.data.selectedShip = 'vanguard';
        Save.write();
      }
    } catch (e) {
      Save.ok = false;
      Save.data = Save.defaults();
    }
  },

  write() {
    try {
      localStorage.setItem(Save.KEY, JSON.stringify(Save.data));
    } catch (e) {
      Save.ok = false;
    }
  }
};

Save.load();

// ===== AUDIO =====
// Everything here is synthesized at runtime — no asset files, so the game stays
// a single portable document. If the AudioContext can't be created the module
// goes inert and the game runs silent rather than failing.

const Sound = {
  ctx: null, master: null, sfxBus: null,
  dead: false, muted: Save.data.muted,
  noiseBuf: null,
  voiceEnds: [], MAX_VOICES: 12,

  // Browsers refuse to start audio before a user gesture, so this is called
  // from the first keydown / pointer event rather than at load.
  unlock() {
    if (Sound.ctx || Sound.dead) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { Sound.dead = true; return; }
      Sound.ctx = new AC();

      // Compressor on the way out so stacked explosions duck instead of clipping.
      const comp = Sound.ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 12;
      comp.ratio.value = 6;
      comp.attack.value = 0.004;
      comp.release.value = 0.18;
      comp.connect(Sound.ctx.destination);

      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = Sound.muted ? 0 : 1;
      Sound.master.connect(comp);

      Sound.sfxBus = Sound.ctx.createGain();
      Sound.sfxBus.gain.value = 1.3;
      Sound.sfxBus.connect(Sound.master);

      // One second of white noise, reused by every percussive sound.
      const len = Math.floor(Sound.ctx.sampleRate);
      const buf = Sound.ctx.createBuffer(1, len, Sound.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      Sound.noiseBuf = buf;

      Music.init();
      if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
    } catch (e) {
      Sound.dead = true;
      Sound.ctx = null;
    }
  },

  setMuted(m) {
    Sound.muted = m;
    if (Sound.master) Sound.master.gain.value = m ? 0 : 1;
  },

  ready() { return !!Sound.ctx && !Sound.dead; },

  // Voice limiting by scheduled end time rather than by an 'ended' event.
  // An event that never fires would leak the counter and silence the game
  // permanently; expired end times always clear themselves.
  claimVoice(endTime) {
    const now = Sound.ctx.currentTime;
    Sound.voiceEnds = Sound.voiceEnds.filter(t => t > now);
    if (Sound.voiceEnds.length >= Sound.MAX_VOICES) return false;
    Sound.voiceEnds.push(endTime);
    return true;
  },

  tone(freq, dur, type, gain, freqEnd, delay) {
    if (!Sound.ready()) return;
    const t = Sound.ctx.currentTime + (delay || 0);
    if (!Sound.claimVoice(t + dur)) return;
    const o = Sound.ctx.createOscillator();
    const g = Sound.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Sound.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, filtFreq, gain, filtEnd, delay) {
    if (!Sound.ready() || !Sound.noiseBuf) return;
    const t = Sound.ctx.currentTime + (delay || 0);
    if (!Sound.claimVoice(t + dur)) return;
    const s = Sound.ctx.createBufferSource();
    s.buffer = Sound.noiseBuf;
    const f = Sound.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(filtFreq, t);
    if (filtEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, filtEnd), t + dur);
    const g = Sound.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(Sound.sfxBus);
    s.start(t); s.stop(t + dur);
  },

  play(name) {
    if (!Sound.ready()) return;
    switch (name) {
      case 'laser':
        Sound.tone(900, 0.08, 'square', 0.10, 240);
        break;
      case 'hit':
        Sound.noise(0.05, 3200, 0.22, 700);
        break;
      case 'explode':
        Sound.noise(0.34, 1400, 0.40, 70);
        Sound.tone(130, 0.28, 'sawtooth', 0.14, 42);
        break;
      case 'bigExplode':
        Sound.noise(0.85, 1000, 0.42, 40);
        Sound.tone(85, 0.7, 'sawtooth', 0.16, 26);
        Sound.noise(0.5, 400, 0.2, 30, 0.12);
        break;
      case 'powerup':
        [523.25, 659.25, 783.99].forEach((f, i) => Sound.tone(f, 0.11, 'triangle', 0.12, null, i*0.055));
        break;
      case 'weaponUp':
        [440, 554.37, 659.25, 880].forEach((f, i) => Sound.tone(f, 0.10, 'square', 0.13, null, i*0.05));
        break;
      case 'shieldBreak':
        Sound.tone(1500, 0.28, 'triangle', 0.18, 320);
        Sound.noise(0.16, 5200, 0.14, 1100);
        break;
      case 'death':
        Sound.tone(440, 0.9, 'sawtooth', 0.22, 55);
        break;
      case 'warning':
        for (let i = 0; i < 3; i++) {
          Sound.tone(330, 0.28, 'square', 0.11, null, i*0.6);
          Sound.tone(247, 0.28, 'square', 0.11, null, i*0.6 + 0.3);
        }
        break;
      case 'levelUp':
        [523.25, 659.25, 783.99].forEach(f => Sound.tone(f, 0.45, 'triangle', 0.12));
        break;
      case 'uiMove':
        Sound.tone(680, 0.05, 'square', 0.08);
        break;
      case 'uiBuy':
        [523.25, 783.99].forEach((f, i) => Sound.tone(f, 0.14, 'triangle', 0.16, null, i*0.09));
        break;
    }
  }
};

// Procedural soundtrack: a 16-step sequencer scheduled ahead of the audio clock,
// so it never depends on the render loop's timing.
const Music = {
  bus: null, playing: false, timer: null,
  // `wanted` is whether a run wants music at all; `playing` is whether it is
  // actually being scheduled. Mute separates the two so unmuting mid-run can
  // resume without a run having to restart the track.
  wanted: false,
  step: 0, bar: 0, nextTime: 0,
  level: 1, boss: false,

  ROOTS:      [55.00, 43.65, 65.41, 48.99], // A1  F1  C2  G1
  BOSS_ROOTS: [55.00, 58.27, 55.00, 51.91], // A1  Bb1 A1  Ab1

  init() {
    if (!Sound.ready()) return;
    // Deliberately well under the SFX bus — the track is a bed, not the focus.
    Music.bus = Sound.ctx.createGain();
    Music.bus.gain.value = 0.14;
    Music.bus.connect(Sound.master);
  },

  start() {
    Music.wanted = true;
    if (!Sound.ready() || !Music.bus) return;
    Music.playing = !Sound.muted;
    Music.step = 0; Music.bar = 0;
    Music.nextTime = Sound.ctx.currentTime + 0.08;
    if (!Music.timer) Music.timer = setInterval(Music.tick, 25);
  },

  stop() { Music.wanted = false; Music.playing = false; },

  // Muting stops scheduling outright rather than only zeroing the output gain,
  // so a muted game does no audio work at all. Unmuting picks the track up from
  // where it was, and rebases nextTime so the silent gap is not scheduled as a
  // backlog of notes all landing at once.
  setMuted(m) {
    if (m) { Music.playing = false; return; }
    if (!Music.wanted || !Sound.ready() || !Music.bus) return;
    Music.playing = true;
    Music.nextTime = Sound.ctx.currentTime + 0.08;
  },
  setIntensity(lv) { Music.level = lv; },
  setBoss(b) { Music.boss = b; },

  stepDur() {
    return Music.boss ? 0.112 : Math.max(0.105, 0.16 - Music.level*0.004);
  },

  tick() {
    if (!Music.playing || !Sound.ready()) return;
    const dur = Music.stepDur();
    // Schedule a little ahead of the clock so timing survives a busy main thread.
    while (Music.nextTime < Sound.ctx.currentTime + 0.15) {
      Music.schedule(Music.step, Music.nextTime);
      Music.nextTime += dur;
      Music.step++;
      if (Music.step >= 16) { Music.step = 0; Music.bar++; }
    }
  },

  note(freq, dur, type, gain, t, freqEnd) {
    if (!Sound.ready() || !Music.bus) return;
    const o = Sound.ctx.createOscillator();
    const g = Sound.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Music.bus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  perc(dur, filt, gain, t, filtEnd) {
    if (!Sound.ready() || !Music.bus || !Sound.noiseBuf) return;
    const s = Sound.ctx.createBufferSource();
    s.buffer = Sound.noiseBuf;
    const f = Sound.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.setValueAtTime(filt, t);
    if (filtEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, filtEnd), t + dur);
    const g = Sound.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(Music.bus);
    s.start(t); s.stop(t + dur);
  },

  schedule(step, t) {
    const roots = Music.boss ? Music.BOSS_ROOTS : Music.ROOTS;
    const root = roots[Music.bar % roots.length];
    const lv = Music.level;

    // Kick — always present, the spine of the track.
    if (step === 0 || step === 8 || (Music.boss && step === 11)) {
      Music.note(130, 0.16, 'sine', 0.5, t, 40);
    }
    // Bass
    if ([0, 3, 6, 8, 11, 14].includes(step)) {
      Music.note(root, 0.16, 'square', 0.16, t);
    }
    // Arpeggio from level 3 — minor triad above the root.
    if (lv >= 3 && step % 2 === 1) {
      const ratios = [2, 2.378, 3, 4]; // octave, minor 3rd, 5th, two octaves
      const f = root * ratios[(step >> 1) % ratios.length];
      Music.note(f, 0.10, 'triangle', 0.075, t);
    }
    // Hi-hat from level 6.
    if (lv >= 6 && step % 2 === 0) {
      Music.perc(0.035, 7000, 0.10, t);
    }
    // Snare backbeat from level 4.
    if (lv >= 4 && (step === 4 || step === 12)) {
      Music.perc(0.09, 1600, 0.16, t, 600);
    }
  }
};

// ===== STATE =====

let state = 'start'; // start | play | dying | dead
let score = 0, lives = 3, level = 1;
let hiScore = Save.data.hiScore;
let dyingTimer = 0;
let combo = 0, comboTimer = 0;
let flashText = [], levelBanner = null;
let frame = 0;
let runKills = 0;
let runCredits = 0, creditsShown = 0;
let selIndex = 0;   // start-screen ship selector

// ---- STARS ----
const starLayers = [
  Array.from({length:60}, () => ({x: Math.random()*W, y: Math.random()*H, r: 0.6, speed: 0.4})),
  Array.from({length:40}, () => ({x: Math.random()*W, y: Math.random()*H, r: 1.0, speed: 0.9})),
  Array.from({length:20}, () => ({x: Math.random()*W, y: Math.random()*H, r: 1.6, speed: 1.8}))
];

// ---- NEBULA ----
const nebulae = Array.from({length: 5}, () => ({
  x: Math.random()*W, y: Math.random()*H,
  rx: 60+Math.random()*80, ry: 40+Math.random()*60,
  hue: [220,260,280,200][Math.floor(Math.random()*4)],
  speed: 0.25 + Math.random()*0.15
}));

// ---- PLAYER ----
const player = {
  x: W/2, y: H - 120, w: 28, h: 36, speed: 5.5,
  invincible: 0, shield: 0, boost: 0, trail: [],
  weaponLevel: 1, muzzle: 0,
  fireMul: 1, spreadMul: 1   // set per ship
};

// ---- COLLECTIONS ----
let bullets = [], enemyBullets = [], asteroids = [], enemies = [], particles = [], powerups = [];
let shootTimer = 0;
let boss = null, bossActive = false, bossWarning = 0;

// ---- TOUCH ----
let touchX = null;

// ---- DIFFICULTY ----
let spawnTimer = 0, asteroidTimer = 0, levelTimer = 0, spawnCycle = 0;
function difficulty() {
  return {
    spawnRate: Math.max(35, 90 - level*5),
    asteroidRate: Math.max(50, 120 - level*6),
    enemySpeed: 1.2 + level*0.2,
    bulletSpeed: 2.5 + level*0.15
  };
}

// ===== SYSTEMS =====

// Impact feedback. Kept separate from game state so nothing here can change
// the outcome of a run — it only changes how the run feels.
const FX = {
  hitStopFrames: 0,
  shake: 0, shakeX: 0, shakeY: 0,
  slowMoFrames: 0, slowMoFactor: 1, slowAcc: 0,
  rings: [], glows: [],
  MAX_RINGS: 24, MAX_GLOWS: 24,

  reset() {
    FX.hitStopFrames = 0; FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0;
    FX.slowMoFrames = 0; FX.slowMoFactor = 1; FX.slowAcc = 0;
    FX.rings = []; FX.glows = [];
  },

  // Freezing the simulation for a few frames while the explosion stays on
  // screen is the cheapest way to make a kill feel like it landed.
  hitStop(f) { FX.hitStopFrames = Math.max(FX.hitStopFrames, f); },
  addShake(a) { FX.shake = Math.max(FX.shake, a); },
  slowMo(frames, factor) { FX.slowMoFrames = frames; FX.slowMoFactor = factor; FX.slowAcc = 0; },

  explode(x, y, size, color) {
    FX.rings.push({ x, y, r: size*0.25, maxR: size*2.1, life: 24, maxLife: 24, color });
    FX.glows.push({ x, y, r: size*1.5, life: 9, maxLife: 9, color });
    const chunks = Math.max(4, Math.round(size*0.5));
    for (let i = 0; i < chunks; i++) {
      const a = Math.random()*Math.PI*2;
      const sp = 1 + Math.random()*size*0.14;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 26 + Math.random()*28, maxLife: 54,
        r: 1.5 + Math.random()*size*0.10,
        color, type: 'chunk',
        rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.35
      });
    }
    spawnParticles(x, y, color, Math.max(4, Math.round(size*0.45)));
    if (FX.rings.length > FX.MAX_RINGS) FX.rings.splice(0, FX.rings.length - FX.MAX_RINGS);
    if (FX.glows.length > FX.MAX_GLOWS) FX.glows.splice(0, FX.glows.length - FX.MAX_GLOWS);
  },

  step() {
    FX.rings.forEach(r => { r.life--; r.r += (r.maxR - r.r) * 0.18; });
    FX.rings = FX.rings.filter(r => r.life > 0);
    FX.glows.forEach(g => { g.life--; });
    FX.glows = FX.glows.filter(g => g.life > 0);
    if (FX.shake > 0) {
      FX.shake -= 1.2;
      FX.shakeX = (Math.random()-0.5)*FX.shake;
      FX.shakeY = (Math.random()-0.5)*FX.shake;
    } else { FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0; }
  }
};

// Keep array lengths bounded so a chaotic screen can't sink the frame rate.
function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
  return arr;
}
function capAll() {
  capArray(particles, CFG.caps.particles);
  capArray(bullets, CFG.caps.bullets);
  capArray(enemyBullets, CFG.caps.enemyBullets);
  capArray(enemies, CFG.caps.enemies);
}

// ---- UI HIT TESTING ----
// Screen-space rects, tested against pointer positions converted to canvas coords.
const MUTE_RECT_START = { x: W - 48, y: 14, w: 34, h: 34 };
const MUTE_RECT_PLAY  = { x: W - 40, y: H - 42, w: 30, h: 30 };
const CHEV_L   = { x: 62,      y: 148, w: 46, h: 48 };
const CHEV_R   = { x: W - 108, y: 148, w: 46, h: 48 };
const BUY_RECT = { x: W/2 - 78, y: 322, w: 156, h: 30 };
function muteRect() { return state === 'play' ? MUTE_RECT_PLAY : MUTE_RECT_START; }
function pointInRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function canvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) * (W / rect.width), y: (clientY - rect.top) * (H / rect.height) };
}
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  Music.setMuted(Sound.muted);
  Save.data.muted = Sound.muted;
  Save.write();
}

function cycleShip(dir) {
  selIndex = (selIndex + dir + CFG.ships.length) % CFG.ships.length;
  const def = CFG.ships[selIndex];
  // Selecting an owned ship makes it the one you fly.
  if (shipOwned(def.id)) { Save.data.selectedShip = def.id; Save.write(); }
  Sound.play('uiMove');
}

function tryBuyShip() {
  const def = CFG.ships[selIndex];
  if (shipOwned(def.id) || Save.data.credits < def.cost) return false;
  Save.data.credits -= def.cost;
  Save.data.unlocked.push(def.id);
  Save.data.selectedShip = def.id;
  Save.write();
  Sound.play('uiBuy');
  return true;
}

// Launch is only legal on a ship you own.
function tryLaunch() {
  if (!shipOwned(CFG.ships[selIndex].id)) return false;
  startGame();
  return true;
}

// ---- INPUT ----
const keys = {};
document.addEventListener('keydown', e => {
  Sound.unlock();
  keys[e.key] = true;
  if (state === 'start') {
    if (e.key === 'ArrowLeft')  cycleShip(-1);
    if (e.key === 'ArrowRight') cycleShip(1);
    if (e.key === 'b' || e.key === 'B') tryBuyShip();
    if (e.key === ' ' || e.key === 'Enter') tryLaunch();
  } else if (state === 'dead') {
    if (e.key === ' ' || e.key === 'Enter') state = 'start';
  }
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// A tap on a control acts on that control; a tap anywhere else launches.
function handlePointer(p) {
  if (pointInRect(p, muteRect())) { toggleMute(); return true; }
  if (state === 'start') {
    if (pointInRect(p, CHEV_L)) { cycleShip(-1); return true; }
    if (pointInRect(p, CHEV_R)) { cycleShip(1); return true; }
    if (!shipOwned(CFG.ships[selIndex].id) && pointInRect(p, BUY_RECT)) { tryBuyShip(); return true; }
    tryLaunch();
    return true;
  }
  if (state === 'dead') { state = 'start'; return true; }
  return false;
}

canvas.addEventListener('touchstart', e => {
  Sound.unlock();
  const t = e.touches[0];
  if (handlePointer(canvasPos(t.clientX, t.clientY))) return;
  touchX = t.clientX;
}, {passive:true});
canvas.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', () => { touchX = null; });

// Mouse equivalent so every control is clickable on desktop too.
canvas.addEventListener('mousedown', e => {
  Sound.unlock();
  handlePointer(canvasPos(e.clientX, e.clientY));
});

function currentShip() {
  return CFG.ships.find(s => s.id === Save.data.selectedShip) || CFG.ships[0];
}

function shipOwned(id) { return Save.data.unlocked.includes(id); }

// Ships differ only in these handling stats — no ship changes any other system.
function applyShip(def) {
  player.speed = def.speed;
  player.fireMul = def.fireMul;
  player.spreadMul = def.spreadMul;
  player.w = def.hitW;
  player.h = def.hitH;
  player.canPhase = def.phase;
  player.phaseReady = def.phase;
  lives = def.lives;
  if (def.id === 'bulwark') player.shield = 180;
}

function startGame() {
  const ship = currentShip();
  state = 'play';
  score = 0; level = 1; frame = 0; runKills = 0;
  player.x = W/2; player.y = H - 120; player.invincible = 0; player.shield = 0; player.boost = 0; player.trail = [];
  applyShip(ship);
  bullets = []; enemyBullets = []; asteroids = []; enemies = []; particles = []; powerups = []; flashText = [];
  spawnTimer = 0; asteroidTimer = 0; levelTimer = 0; spawnCycle = 0; combo = 0; comboTimer = 0; levelBanner = null;
  player.muzzle = 0;
  player.weaponLevel = 1;
  shootTimer = 0;
  dyingTimer = 0;
  boss = null; bossActive = false; bossWarning = 0;
  FX.reset();
  Music.setBoss(false);
  Music.setIntensity(1);
  Music.start();
}

function levelUp() {
  levelTimer = 0; level++;
  Music.setIntensity(level);
  if (player.canPhase) player.phaseReady = true;   // Phantom recharges each level
  // Every fifth level is a boss fight instead of a normal wave.
  if (level % 5 === 0) {
    spawnBoss(level);
    return;
  }
  levelBanner = {text: 'LEVEL ' + level, life: 120};
  spawnParticles(W/2, H/2, '#00ffff', 30);
  Sound.play('levelUp');
}

function endRun() {
  // 'dying' holds the camera on the wreck for a slow-motion beat before the
  // game-over screen takes over.
  state = 'dying';
  dyingTimer = 75;
  hiScore = Math.max(hiScore, score);
  Save.data.hiScore = hiScore;
  Save.data.bestLevel = Math.max(Save.data.bestLevel, level);
  Save.data.totalRuns += 1;
  Save.data.totalKills += runKills;
  runCredits = Math.floor(score / CFG.creditsPerScore);
  creditsShown = 0;
  Save.data.credits += runCredits;
  Save.write();
  FX.explode(player.x, player.y, 46, '#ff8800');
  FX.explode(player.x - 12, player.y + 8, 26, '#ffdd44');
  FX.addShake(26);
  FX.hitStop(6);
  FX.slowMo(75, 0.3);
  boss = null; bossActive = false; bossWarning = 0;
  Music.stop();
  Music.setBoss(false);
  Sound.play('bigExplode');
  Sound.play('death');
}

// ===== ENTITIES =====

function drawShip(x, y, invincible, shield, boost, t, muzzle, shipDef) {
  const def = shipDef || currentShip();
  const [c0, c1, c2] = def.hull;
  const trim = def.trim;
  ctx.save();
  ctx.translate(x, y);
  if (invincible && Math.floor(t/4)%2 === 0) { ctx.restore(); return; }

  // Engine flames
  let flameLen = boost ? 28 : 16;
  let flameW = boost ? 10 : 7;
  ctx.save();
  let gL = ctx.createLinearGradient(0,0,0,flameLen);
  gL.addColorStop(0,'rgba(0,200,255,0.9)'); gL.addColorStop(0.4,'rgba(255,140,0,0.7)'); gL.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.ellipse(-9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  let gR = ctx.createLinearGradient(0,0,0,flameLen);
  gR.addColorStop(0,'rgba(0,200,255,0.9)'); gR.addColorStop(0.4,'rgba(255,140,0,0.7)'); gR.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gR;
  ctx.beginPath(); ctx.ellipse(9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Hull
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(10, 10); ctx.lineTo(10, 18);
  ctx.lineTo(-10, 18); ctx.lineTo(-10, 10); ctx.lineTo(-14, 14); ctx.closePath();
  let hullG = ctx.createLinearGradient(-14, -18, 14, 18);
  hullG.addColorStop(0, c0); hullG.addColorStop(0.5, c1); hullG.addColorStop(1, c2);
  ctx.fillStyle = hullG;
  ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  // Cockpit
  ctx.beginPath(); ctx.ellipse(0, -4, 6, 8, 0, 0, Math.PI*2);
  let cg = ctx.createRadialGradient(0,-6,1,0,-4,8);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.4, c0); cg.addColorStop(1, c2);
  ctx.fillStyle = cg; ctx.fill();

  // Wings
  ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(-22, 18); ctx.lineTo(-10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = trim; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 6); ctx.lineTo(22, 18); ctx.lineTo(10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();

  // Cannons
  ctx.fillStyle = c0;
  ctx.fillRect(-13, -4, 4, 14); ctx.fillRect(9, -4, 4, 14);

  // Phase charge indicator
  if (def.phase && player.phaseReady && !shipDef) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(t*0.12);
    ctx.strokeStyle = '#cc88ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Muzzle flash
  if (muzzle > 0) {
    const a = muzzle / 3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    [-11, 11].forEach(mx => {
      const mg = ctx.createRadialGradient(mx, -6, 0, mx, -6, 9);
      mg.addColorStop(0, `rgba(255,255,255,${0.9*a})`);
      mg.addColorStop(0.4, `rgba(120,230,255,${0.6*a})`);
      mg.addColorStop(1, 'rgba(0,150,255,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, -6, 9, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // Shield bubble
  if (shield > 0) {
    let alpha = 0.3 + 0.2*Math.sin(t*0.2);
    ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,255,255,${alpha})`; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = `rgba(0,200,255,${alpha*0.2})`; ctx.fill();
  }

  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    let v = a.verts[i];
    i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  let ag = ctx.createRadialGradient(0,0,2,0,0,a.r);
  ag.addColorStop(0,'#aaa'); ag.addColorStop(1,'#444');
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5; ctx.stroke();
  if (a.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.28*a.flash})`; ctx.fill(); }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const flashFill = () => { if (e.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.30*e.flash})`; ctx.fill(); } };

  switch (e.kind) {
    case 'elite': {
      ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(16,0); ctx.lineTo(0,16); ctx.lineTo(-16,0); ctx.closePath();
      const eg = ctx.createRadialGradient(0,0,2,0,0,18);
      eg.addColorStop(0,'#ffaa00'); eg.addColorStop(1,'#880000');
      ctx.fillStyle = eg; ctx.fill();
      ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.moveTo(0,-8); ctx.lineTo(0,8);
      ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1; ctx.stroke();
      break;
    }

    case 'kamikaze': {
      // Narrow dart with a burning trail — reads as "this one is coming for you".
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const tg = ctx.createLinearGradient(0,-22,0,-4);
      tg.addColorStop(0,'rgba(255,60,80,0)'); tg.addColorStop(1,'rgba(255,120,60,0.75)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.ellipse(0,-13,4,10,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(0,16); ctx.lineTo(9,-6); ctx.lineTo(3,-2); ctx.lineTo(0,-12);
      ctx.lineTo(-3,-2); ctx.lineTo(-9,-6); ctx.closePath();
      const kg = ctx.createLinearGradient(0,-12,0,16);
      kg.addColorStop(0,'#ff88aa'); kg.addColorStop(1,'#aa0022');
      ctx.fillStyle = kg; ctx.fill();
      ctx.strokeStyle = '#ff2255'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    case 'turret': {
      // Barrel first so the platform sits on top of it.
      ctx.save();
      ctx.rotate(e.aim - Math.PI/2);
      ctx.fillStyle = '#667788';
      ctx.fillRect(-4, 0, 8, 22);
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 1; ctx.strokeRect(-4, 0, 8, 22);
      ctx.restore();
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2 + Math.PI/6;
        const px = Math.cos(a)*18, py = Math.sin(a)*15;
        i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      const hg = ctx.createLinearGradient(0,-15,0,15);
      hg.addColorStop(0,'#c3d8ee'); hg.addColorStop(1,'#3a4a5c');
      ctx.fillStyle = hg; ctx.fill();
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fillStyle = e.phase === 'hold' ? '#ff5533' : '#335577'; ctx.fill();
      ctx.strokeStyle = '#001122'; ctx.lineWidth = 1; ctx.stroke();
      // Health pips so its 8 HP doesn't feel arbitrary.
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(-14, -22, 28*(e.hp/ENEMY.turret.hp), 2.5);
      break;
    }

    case 'mine': {
      const arming = e.arming > 0;
      const pulse = arming ? 1 + 0.5*Math.sin((30-e.arming)*0.9) : 1;
      if (arming) {
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.35*Math.sin((30-e.arming)*0.9);
        ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 60*(1 - e.arming/30), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      ctx.strokeStyle = arming ? '#ff5533' : '#8a7a33'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 + frame*0.01;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*8, Math.sin(a)*8);
        ctx.lineTo(Math.cos(a)*15*pulse, Math.sin(a)*15*pulse);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2);
      const mg = ctx.createRadialGradient(-3,-3,1,0,0,10);
      mg.addColorStop(0, arming ? '#ffdd88' : '#8a8a6a');
      mg.addColorStop(1, arming ? '#992200' : '#33332a');
      ctx.fillStyle = mg; ctx.fill();
      ctx.strokeStyle = arming ? '#ff7744' : '#ffcc00'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    default: { // grunt
      ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(14,-10); ctx.lineTo(8,-4); ctx.lineTo(0,-14); ctx.lineTo(-8,-4); ctx.lineTo(-14,-10); ctx.closePath();
      const bg = ctx.createLinearGradient(-14,-14,14,18);
      bg.addColorStop(0,'#ff6600'); bg.addColorStop(1,'#aa0000');
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2);
      ctx.fillStyle='#ffdd00'; ctx.fill();
    }
  }
  ctx.restore();
}

function drawBoss(b) {
  const dying = b.dying > 0;
  ctx.save();
  ctx.translate(b.x, b.y);
  if (dying && Math.floor(b.deathTick/3) % 2 === 0) ctx.globalAlpha = 0.55;

  // Charging beam telegraph — a thin targeting line before the real thing.
  if (b.laser && b.laser.charge > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.4*Math.sin(b.laser.charge*0.5);
    ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, BOSS_H/2); ctx.lineTo(0, H); ctx.stroke();
    ctx.restore();
  }

  // Hull
  ctx.beginPath();
  ctx.moveTo(-BOSS_W/2, -6);
  ctx.lineTo(-BOSS_W/2 + 18, -BOSS_H/2);
  ctx.lineTo(BOSS_W/2 - 18, -BOSS_H/2);
  ctx.lineTo(BOSS_W/2, -6);
  ctx.lineTo(BOSS_W/2 - 26, BOSS_H/2);
  ctx.lineTo(BOSS_W/2 - 40, BOSS_H/2 - 8);
  ctx.lineTo(0, BOSS_H/2 + 10);
  ctx.lineTo(-BOSS_W/2 + 40, BOSS_H/2 - 8);
  ctx.lineTo(-BOSS_W/2 + 26, BOSS_H/2);
  ctx.closePath();
  const hg = ctx.createLinearGradient(0, -BOSS_H/2, 0, BOSS_H/2);
  hg.addColorStop(0, '#4a5a72'); hg.addColorStop(0.5, '#22293a'); hg.addColorStop(1, '#0d1119');
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = b.phase === 3 ? '#ff4433' : b.phase === 2 ? '#ffaa33' : '#66aaff';
  ctx.lineWidth = 2.5; ctx.stroke();
  if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, 0.10*b.flash)})`; ctx.fill(); }

  // Armour ribs
  ctx.strokeStyle = 'rgba(140,170,210,0.30)'; ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i*20, -BOSS_H/2 + 6); ctx.lineTo(i*20, BOSS_H/2 - 6); ctx.stroke();
  }

  // Three glowing cores, brighter as the fight escalates.
  const coreCol = b.phase === 3 ? '#ff3311' : b.phase === 2 ? '#ffaa00' : '#33ccff';
  [-32, 0, 32].forEach((cx, i) => {
    const pulse = 0.6 + 0.4*Math.sin(frame*0.09 + i);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createRadialGradient(cx, 4, 0, cx, 4, 16);
    cg.addColorStop(0, coreCol); cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = pulse;
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, 4, 16, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, 4, i === 1 ? 8 : 6, 0, Math.PI*2);
    ctx.fillStyle = coreCol; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  });

  ctx.restore();

  // Firing beam, drawn in world space so it spans the screen.
  if (b.laser && b.laser.fire > 0) {
    const w = 13 + 4*Math.sin(frame*0.7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(b.laser.x - w, 0, b.laser.x + w, 0);
    lg.addColorStop(0, 'rgba(255,40,80,0)');
    lg.addColorStop(0.5, 'rgba(255,220,240,0.95)');
    lg.addColorStop(1, 'rgba(255,40,80,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(b.laser.x - w, b.y, w*2, H - b.y);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(b.laser.x - 2, b.y, 4, H - b.y);
    ctx.restore();
  }
}

function drawBossBar(b) {
  const pad = 14, barW = W - pad*2, y = 52;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,20,0.65)';
  ctx.fillRect(pad, y, barW, 10);
  const frac = Math.max(0, b.hp / b.maxHp);
  const col = b.phase === 3 ? '#ff3322' : b.phase === 2 ? '#ffaa22' : '#33ccff';
  ctx.fillStyle = col;
  ctx.fillRect(pad, y, barW*frac, 10);
  // Phase boundaries at 66% and 33%.
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
  [0.33, 0.66].forEach(f => {
    ctx.beginPath(); ctx.moveTo(pad + barW*f, y); ctx.lineTo(pad + barW*f, y+10); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, y, barW, 10);
  ctx.fillStyle = col;
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('DREADNOUGHT MK.' + b.tier, pad, y - 4);
  ctx.textAlign = 'right';
  ctx.fillText('PHASE ' + b.phase, W - pad, y - 4);
  ctx.restore();
}

function drawBossWarning() {
  const t = bossWarning / 90;
  ctx.save();
  // Red pulse around the screen edge.
  ctx.globalAlpha = 0.35 + 0.35*Math.sin(frame*0.35);
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.72);
  vg.addColorStop(0, 'rgba(255,0,0,0)');
  vg.addColorStop(1, 'rgba(255,20,20,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(1, t*2.2);
  ctx.fillStyle = 'rgba(30,0,0,0.72)';
  ctx.fillRect(0, H/2 - 44, W, 88);
  ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H/2-44); ctx.lineTo(W, H/2-44);
  ctx.moveTo(0, H/2+44); ctx.lineTo(W, H/2+44); ctx.stroke();
  ctx.fillStyle = Math.floor(frame/6) % 2 ? '#ff5544' : '#ffdd88';
  ctx.font = 'bold 38px monospace'; ctx.textAlign = 'center';
  ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 24;
  ctx.fillText('WARNING', W/2, H/2 + 2);
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#ffaa88'; ctx.shadowBlur = 0;
  ctx.fillText('CAPITAL SHIP INBOUND', W/2, H/2 + 28);
  ctx.restore();
}

function makeAsteroid(big) {
  let r = big ? 22+Math.random()*14 : 10+Math.random()*8;
  let verts = [];
  let n = 7 + Math.floor(Math.random()*4);
  for (let i = 0; i < n; i++) {
    let angle = (i/n)*Math.PI*2;
    let dist = r * (0.7 + Math.random()*0.5);
    verts.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
  }
  return {
    x: r + Math.random()*(W-2*r), y: -r-10,
    vx: (Math.random()-0.5)*1.2,
    vy: (difficulty().enemySpeed * (big ? 1.2 : 0.8)),
    r, verts, rot: 0, rotSpeed: (Math.random()-0.5)*0.04, big, hp: big ? 3 : 1, flash: 0
  };
}

// Per-kind stats. Everything that differs between enemy types lives here so
// the update and render paths only branch on behaviour, not on numbers.
const ENEMY = {
  grunt:    { hp: 2, points: 100, r: 22, color: '#ff5500', boom: 24, shake: 5,  hitStop: 0 },
  elite:    { hp: 4, points: 200, r: 24, color: '#ffaa00', boom: 40, shake: 12, hitStop: 3 },
  kamikaze: { hp: 1, points: 120, r: 18, color: '#ff2255', boom: 28, shake: 8,  hitStop: 0 },
  turret:   { hp: 8, points: 300, r: 26, color: '#99bbdd', boom: 44, shake: 12, hitStop: 3 },
  mine:     { hp: 2, points:  80, r: 20, color: '#ffcc00', boom: 46, shake: 14, hitStop: 0 }
};

// Which kinds can appear, and how often, at a given level.
function enemyWeights() {
  return [
    ['grunt',    Math.max(3, 12 - level)],
    ['elite',    level >= 3 ? Math.min(8, level - 1) : 0],
    ['kamikaze', level >= 3 ? Math.min(7, level)     : 0],
    ['mine',     level >= 4 ? Math.min(5, level - 2) : 0],
    ['turret',   level >= 6 ? Math.min(5, level - 4) : 0]
  ];
}

function pickEnemyKind() {
  const w = enemyWeights();
  const total = w.reduce((s, e) => s + e[1], 0);
  let r = Math.random() * total;
  for (const [kind, weight] of w) { r -= weight; if (r <= 0) return kind; }
  return 'grunt';
}

function makeEnemy(kind) {
  const d = difficulty();
  const e = {
    kind, x: 30 + Math.random()*(W-60), y: -30,
    vx: 0, vy: d.enemySpeed * 0.8,
    hp: ENEMY[kind].hp, flash: 0, dead: false,
    shootTimer: 0, zigzag: 0, zigzagDir: 1,
    formationId: 0, sweep: false, baseX: 0
  };
  switch (kind) {
    case 'grunt':
    case 'elite':
      e.vx = (Math.random()-0.5)*2;
      e.shootTimer = Math.floor(Math.random()*80);
      break;
    case 'kamikaze':
      // Locks a target column at spawn, then commits to it.
      e.vy = d.enemySpeed * 2.6;
      e.targetX = player.x;
      break;
    case 'turret':
      e.vy = d.enemySpeed * 0.9;
      e.holdY = 120 + Math.random()*50;
      e.holdTimer = 480;
      e.phase = 'descend';
      e.aim = Math.PI/2;
      e.burstLeft = 0; e.burstTimer = 0;
      break;
    case 'mine':
      e.vy = 0.6;
      e.vx = (Math.random()-0.5)*0.4;
      e.arming = 0;
      break;
  }
  return e;
}

// ---- BOSS ----

const BOSS_W = 112, BOSS_H = 54;

function bossMaxHp(lv) {
  // Tuned against real player DPS (~18 hits/sec at weapon level 3) for a
  // fight of roughly 20-30 seconds rather than a war of attrition.
  return Math.round(340 + 160 * (lv / 5));
}

function spawnBoss(lv) {
  const hp = bossMaxHp(lv);
  boss = {
    x: W/2, y: -70, targetY: 150,
    hp, maxHp: hp,
    tier: Math.max(1, Math.round(lv / 5)),
    phase: 1, entering: true, flash: 0,
    attackTimer: 0, minionTimer: 0,
    laser: null, beamCooldown: 0,
    dying: 0, deathTick: 0
  };
  bossActive = true;
  bossWarning = 90;
  levelBanner = null;          // the warning owns the screen
  Sound.play('warning');
  Music.setBoss(true);
}

function bossPhaseFor(b) {
  const f = b.hp / b.maxHp;
  return f > 0.66 ? 1 : f > 0.33 ? 2 : 3;
}

function updateBoss() {
  const b = boss;
  const diff = difficulty();

  // ---- death cascade ----
  if (b.dying > 0) {
    b.dying--;
    b.deathTick++;
    if (b.deathTick % 5 === 0) {
      FX.explode(b.x + (Math.random()-0.5)*BOSS_W, b.y + (Math.random()-0.5)*BOSS_H, 26 + Math.random()*18, '#ffbb33');
      FX.addShake(10);
      Sound.play('explode');
    }
    if (b.dying === 0) {
      FX.explode(b.x, b.y, 90, '#ffdd66');
      FX.addShake(30);
      FX.hitStop(8);
      FX.slowMo(60, 0.3);
      Sound.play('bigExplode');
      const pts = 2000 * b.tier;
      score += pts;
      addFlashText('+' + pts.toLocaleString(), b.x, b.y, '#ffdd44');
      // Guaranteed reward for clearing the fight.
      powerups.push({x: b.x, y: b.y + 20, type: 'weapon', vy: 1.2, life: 400, dead: false});
      levelBanner = { text: 'BOSS DOWN', life: 120 };
      boss = null; bossActive = false;
      Music.setBoss(false);
    }
    return;
  }

  if (b.flash > 0) b.flash--;

  // ---- movement ----
  if (b.entering) {
    b.y += 1.6;
    if (b.y >= b.targetY) { b.y = b.targetY; b.entering = false; }
    return;                              // no attacks until it's in position
  }
  if (b.laser && b.laser.fire > 0) {
    // While the beam is up the ship itself sweeps, so the beam always
    // emanates from the hull instead of drifting free of it.
    b.x += b.laser.dir * 2.6;
    if (b.x < BOSS_W/2 + 8 || b.x > W - BOSS_W/2 - 8) b.laser.dir *= -1;
  } else {
    b.x += Math.sign(player.x - b.x) * Math.min(1.2, Math.abs(player.x - b.x));
  }
  b.x = Math.max(BOSS_W/2, Math.min(W - BOSS_W/2, b.x));

  // ---- phase transitions ----
  const p = bossPhaseFor(b);
  if (p !== b.phase) {
    b.phase = p;
    b.flash = 10;
    b.attackTimer = 0;
    b.laser = null;
    FX.addShake(14);
    Sound.play('levelUp');
  }

  b.attackTimer++;

  if (b.phase === 1) {
    // Radial bullet ring.
    if (b.attackTimer >= 120) {
      b.attackTimer = 0;
      const spd = diff.bulletSpeed * 0.85;
      for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2;
        enemyBullets.push({x: b.x, y: b.y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r: 5, elite: true, dead: false});
      }
      Sound.play('hit');
    }

  } else if (b.phase === 2) {
    // Telegraphed charge, then a sweeping vertical beam.
    if (!b.laser && b.attackTimer >= 90) {
      b.attackTimer = 0;
      b.laser = { charge: 45, fire: 0, x: b.x, dir: player.x < b.x ? 1 : -1 };
      Sound.play('warning');
    }
    if (b.laser) {
      if (b.laser.charge > 0) {
        b.laser.charge--;
        b.laser.x = b.x;
        if (b.laser.charge === 0) b.laser.fire = 90;
      } else if (b.laser.fire > 0) {
        b.laser.fire--;
        b.laser.x = b.x;                 // locked to the hull
        if (b.beamCooldown > 0) b.beamCooldown--;
        if (Math.abs(player.x - b.laser.x) < 16 && player.y > b.y && b.beamCooldown === 0) {
          b.beamCooldown = 30;   // at most one hit per half second
          hitPlayer();
        }
        if (b.laser.fire === 0) b.laser = null;
      }
    }

  } else {
    // Minion swarm plus aimed spreads.
    b.minionTimer++;
    if (b.minionTimer >= 90) {
      b.minionTimer = 0;
      const m = makeEnemy('grunt');
      m.x = b.x + (Math.random()-0.5)*BOSS_W; m.y = b.y + 20;
      enemies.push(m);
    }
    if (b.attackTimer >= 70) {
      b.attackTimer = 0;
      const a = Math.atan2(player.y - b.y, player.x - b.x);
      const spd = diff.bulletSpeed;
      [-0.22, 0, 0.22].forEach(o => {
        enemyBullets.push({x: b.x, y: b.y + 20, vx: Math.cos(a+o)*spd, vy: Math.sin(a+o)*spd, r: 5, elite: true, dead: false});
      });
    }
  }

  // ---- taking fire ----
  bullets.forEach(bl => {
    if (bl.dead) return;
    if (Math.abs(bl.x - b.x) < BOSS_W/2 && Math.abs(bl.y - b.y) < BOSS_H/2) {
      if (bl.pierce > 0) bl.pierce--; else bl.dead = true;
      b.hp--;
      b.flash = Math.max(b.flash, 2);
      spawnParticles(bl.x, bl.y, '#ffaa44', 3);
      if (b.hp <= 0 && b.dying === 0) {
        b.hp = 0;
        b.dying = 45; b.deathTick = 0;
        runKills++;
        enemyBullets = [];
        Sound.play('explode');
      }
    }
  });
}

let nextFormationId = 1;

// Coordinated waves. Members share a formationId so clearing the whole group
// can be rewarded.
function spawnFormation(type) {
  const id = nextFormationId++;
  const d = difficulty();
  if (type === 'vee') {
    const cx = 100 + Math.random()*(W - 200);
    for (let i = -2; i <= 2; i++) {
      const e = makeEnemy('grunt');
      e.x = cx + i*38;
      e.y = -30 - Math.abs(i)*28;
      e.vx = 0; e.vy = d.enemySpeed * 0.85;
      e.zigzagDir = 0; e.formationId = id;
      enemies.push(e);
    }
  } else {
    for (let i = 0; i < 4; i++) {
      const e = makeEnemy('grunt');
      e.baseX = 80 + i*((W - 160)/3);
      e.x = e.baseX; e.y = -30 - i*10;
      e.vx = 0; e.vy = d.enemySpeed * 0.55;
      e.zigzagDir = 0; e.sweep = true; e.formationId = id;
      enemies.push(e);
    }
  }
  return id;
}

// Weapon pickups are magenta rather than yellow so they read instantly against
// the yellow boost orb.
const POWERUP_COLOR = { shield: '#00ddff', boost: '#ffdd00', weapon: '#ff66cc' };
const POWERUP_LETTER = { shield: 'S', boost: 'B', weapon: 'W' };

const BULLET_SPEED = 11;

function fireWeapon() {
  const w = CFG.weapons[player.weaponLevel - 1];
  w.shots.forEach(s => {
    const a = s.a * player.spreadMul;
    bullets.push({
      x: player.x + s.dx, y: player.y - 10,
      vx: Math.sin(a) * BULLET_SPEED,
      vy: -Math.cos(a) * BULLET_SPEED,
      w: 3, h: 10, pierce: w.pierce, dead: false
    });
  });
  player.muzzle = 3;
  Sound.play('laser');
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random()*Math.PI*2;
    let speed = 1.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 30 + Math.random()*30, maxLife: 60,
      r: 1.5+Math.random()*3,
      color, type: Math.random() < 0.3 ? 'spark' : 'dot'
    });
  }
}

function comboMultiplier() {
  return Math.max(1, Math.min(CFG.maxComboMultiplier, Math.floor(combo/3)));
}

function killEnemy(e) {
  const st = ENEMY[e.kind];
  e.dead = true;
  runKills++;
  FX.explode(e.x, e.y, st.boom, st.color);
  FX.addShake(st.shake);
  if (st.hitStop) FX.hitStop(st.hitStop);
  Sound.play('explode');

  const multiplier = comboMultiplier();
  score += st.points * multiplier;
  combo++; comboTimer = 120;
  addFlashText('+' + st.points*multiplier, e.x, e.y - 10, st.color);

  if (Math.random() < 0.32) {
    const r = Math.random();
    const type = r < 0.40 ? 'weapon' : r < 0.70 ? 'shield' : 'boost';
    powerups.push({x: e.x, y: e.y, type, vy: 1.5, life: 300, dead: false});
  }

  // Clearing an entire formation pays a bonus.
  if (e.formationId) {
    const remaining = enemies.some(o => o !== e && !o.dead && o.formationId === e.formationId);
    if (!remaining) {
      score += 500;
      addFlashText('FORMATION! +500', W/2, e.y - 34, '#66ffcc');
      FX.hitStop(3);
      Sound.play('levelUp');
    }
  }
}

function addFlashText(text, x, y, color) {
  flashText.push({text, x, y, life: 60, color, vy: -1.2});
}

function hitPlayer() {
  if (player.invincible > 0 || player.shield > 0) {
    if (player.shield > 0) {
      player.shield = 0;
      FX.addShake(10);
      FX.explode(player.x, player.y, 22, '#00ffff');
      Sound.play('shieldBreak');
    }
    return;
  }
  // Phantom slips through one hit per level.
  if (player.phaseReady) {
    player.phaseReady = false;
    player.invincible = 70;
    addFlashText('PHASED', player.x, player.y - 34, '#cc88ff');
    spawnParticles(player.x, player.y, '#cc88ff', 16);
    FX.addShake(6);
    Sound.play('shieldBreak');
    return;
  }
  lives--;
  player.invincible = 120;
  // Losing a weapon level on every hit is the tension the upgrades hang on.
  if (player.weaponLevel > 1) {
    player.weaponLevel--;
    addFlashText('-WEAPON', player.x, player.y - 34, '#ff4466');
  }
  FX.addShake(20);
  FX.explode(player.x, player.y, 24, '#ff4400');
  combo = 0; comboTimer = 0;
  if (lives <= 0) endRun();
  else Sound.play('explode');
}

function aabbCircle(rx, ry, rw, rh, cx, cy, cr) {
  let nx = Math.max(rx-rw/2, Math.min(cx, rx+rw/2));
  let ny = Math.max(ry-rh/2, Math.min(cy, ry+rh/2));
  return (nx-cx)*(nx-cx)+(ny-cy)*(ny-cy) < cr*cr;
}

// ===== UPDATE =====

// Advances only presentation-layer things: particles, rings, floating text,
// shake. Runs during 'dying' and 'dead' too, so the wreck keeps burning while
// the game-over screen is up.
function updateEffects() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--;
    if (p.type === 'chunk') { p.rot += p.rotSpeed; p.vy += 0.04; }
    else p.r *= 0.97;
  });
  particles = particles.filter(p => p.life > 0);

  flashText.forEach(f => { f.y += f.vy; f.life--; });
  flashText = flashText.filter(f => f.life > 0);

  FX.step();
  capArray(particles, CFG.caps.particles);
}

function update() {
  // The clock stops during a boss fight — the fight is the level.
  if (!bossActive) {
    levelTimer++;
    if (levelTimer > 60*CFG.levelSeconds) levelUp();
  }
  if (bossWarning > 0) bossWarning--;

  // Stars
  starLayers.forEach(layer => layer.forEach(s => {
    s.y += s.speed; if (s.y > H+2) { s.y = -2; s.x = Math.random()*W; }
  }));

  // Nebulae
  nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

  // Player movement
  let dx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (touchX !== null) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = W / rect.width;
    let tx = (touchX - rect.left) * scaleX;
    if (tx < player.x - 15) dx = -1;
    else if (tx > player.x + 15) dx = 1;
  }
  let spd = player.speed * (player.boost > 0 ? 1.6 : 1);
  player.x = Math.max(20, Math.min(W-20, player.x + dx*spd));

  // Player trail
  player.trail.push({x: player.x, y: player.y, life: 12});
  if (player.trail.length > 12) player.trail.shift();
  player.trail.forEach(t => t.life--);
  player.trail = player.trail.filter(t => t.life > 0);

  if (player.invincible > 0) player.invincible--;
  if (player.shield > 0) player.shield--;
  if (player.boost > 0) player.boost--;

  // Shooting (auto-fire). Shot count and spread come from the weapon level;
  // boost only shortens the interval.
  shootTimer++;
  const wcfg = CFG.weapons[player.weaponLevel - 1];
  const fireRate = Math.max(4, Math.round(wcfg.fireRate * player.fireMul * (player.boost > 0 ? 0.65 : 1)));
  if (shootTimer >= fireRate) {
    shootTimer = 0;
    fireWeapon();
  }

  // Normal spawning is suspended for the duration of a boss fight; the boss
  // supplies its own minions in phase 3.
  if (!bossActive) {
    asteroidTimer++;
    if (asteroidTimer >= difficulty().asteroidRate) {
      asteroidTimer = 0;
      asteroids.push(makeAsteroid(Math.random() < 0.4));
    }

    spawnTimer++;
    if (spawnTimer >= difficulty().spawnRate) {
      spawnTimer = 0;
      spawnCycle++;
      if (level >= 3 && spawnCycle % 3 === 0) {
        spawnFormation(Math.random() < 0.5 ? 'vee' : 'line');
      } else if (Math.random() < 0.7) {
        enemies.push(makeEnemy(pickEnemyKind()));
      }
    }
  }

  if (boss) updateBoss();

  // Move bullets
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Move enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    bullets.forEach(b => {
      if (b.dead || a.hp <= 0) return;
      if (Math.abs(b.x - a.x) < a.r + 2 && Math.abs(b.y - a.y) < a.r + 2) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        a.hp--;
        a.flash = 3;
        spawnParticles(b.x, b.y, '#aaaaaa', 4);
        Sound.play('hit');
        if (a.hp <= 0) {
          if (a.big) {
            for (let i = 0; i < 2; i++) asteroids.push({...makeAsteroid(false), x: a.x + (i?15:-15), y: a.y, vy: a.vy*1.2});
          }
          FX.explode(a.x, a.y, a.big ? 30 : 16, '#9a9a9a');
          if (a.big) FX.addShake(6);
          Sound.play(a.big ? 'explode' : 'hit');
          score += a.big ? 50 : 20;
          combo++; comboTimer = 120;
          if (combo > 2) addFlashText('x'+combo+'!', a.x, a.y, '#ffff00');
        }
      }
    });
    if (a.hp > 0 && aabbCircle(player.x, player.y, player.w, player.h, a.x, a.y, a.r)) hitPlayer();
  });

  // Enemies
  const diff = difficulty();
  enemies.forEach(e => {
    const st = ENEMY[e.kind];

    // ---- movement ----
    switch (e.kind) {
      case 'kamikaze':
        e.x += Math.sign(e.targetX - e.x) * Math.min(1.5, Math.abs(e.targetX - e.x));
        e.y += e.vy;
        break;

      case 'turret':
        if (e.phase === 'descend') {
          e.y += e.vy;
          if (e.y >= e.holdY) { e.y = e.holdY; e.phase = 'hold'; }
        } else if (e.phase === 'hold') {
          e.holdTimer--;
          if (e.holdTimer <= 0) e.phase = 'retreat';
        } else {
          e.y -= 2.2;
        }
        e.aim = Math.atan2(player.y - e.y, player.x - e.x);
        break;

      case 'mine':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 16 || e.x > W-16) e.vx *= -1;
        break;

      default: // grunt, elite
        if (e.sweep) {
          e.x = e.baseX + Math.sin(frame*0.02)*70;   // whole line moves as one
          e.y += e.vy;
        } else {
          e.zigzag += 0.04;
          e.x += e.vx + Math.sin(e.zigzag)*2.5*e.zigzagDir;
          e.y += e.vy;
          if (e.x < 20 || e.x > W-20) e.vx *= -1;
        }
    }

    // ---- firing ----
    if (e.kind === 'grunt' || e.kind === 'elite') {
      e.shootTimer++;
      const eRate = e.kind === 'elite' ? 55 : 90;
      if (e.shootTimer >= eRate) {
        e.shootTimer = 0;
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        const spd2 = diff.bulletSpeed;
        enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle)*spd2, vy: Math.sin(angle)*spd2, r: 4, elite: e.kind === 'elite', dead: false});
        if (e.kind === 'elite') {
          [-0.3, 0.3].forEach(o => {
            enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle+o)*spd2, vy: Math.sin(angle+o)*spd2, r: 4, elite: true, dead: false});
          });
        }
      }
    } else if (e.kind === 'turret' && e.phase === 'hold') {
      e.shootTimer++;
      if (e.shootTimer >= 90) { e.shootTimer = 0; e.burstLeft = 3; e.burstTimer = 0; }
      if (e.burstLeft > 0) {
        e.burstTimer--;
        if (e.burstTimer <= 0) {
          e.burstTimer = 8;
          e.burstLeft--;
          const spd2 = diff.bulletSpeed * 1.15;
          enemyBullets.push({x: e.x, y: e.y + 12, vx: Math.cos(e.aim)*spd2, vy: Math.sin(e.aim)*spd2, r: 4.5, elite: true, dead: false});
        }
      }
    }

    // ---- mine proximity trigger ----
    if (e.kind === 'mine' && !e.dead) {
      const dx2 = player.x - e.x, dy2 = player.y - e.y;
      if (e.arming === 0 && dx2*dx2 + dy2*dy2 < 45*45) { e.arming = 30; Sound.play('hit'); }
      if (e.arming > 0) {
        e.arming--;
        if (e.arming === 0) {
          const ddx = player.x - e.x, ddy = player.y - e.y;
          if (ddx*ddx + ddy*ddy < 60*60) hitPlayer();
          FX.explode(e.x, e.y, st.boom, st.color);
          FX.addShake(st.shake);
          Sound.play('explode');
          e.dead = true;
        }
      }
    }

    // ---- taking fire ----
    bullets.forEach(b => {
      if (b.dead || e.dead) return;
      if (Math.abs(b.x-e.x) < st.r*0.8 && Math.abs(b.y-e.y) < st.r*0.8) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        e.hp--;
        e.flash = 3;
        spawnParticles(b.x, b.y, st.color, 4);
        Sound.play('hit');
        if (e.hp <= 0) {
          // A shot mine arms rather than dying outright, so it still detonates.
          if (e.kind === 'mine') { e.hp = 1; if (e.arming === 0) e.arming = 30; }
          else killEnemy(e);
        }
      }
    });

    // ---- ramming the player ---- (scaled by the ship's own hitbox)
    if (!e.dead &&
        Math.abs(player.x-e.x) < st.r*0.6 + player.w*0.35 &&
        Math.abs(player.y-e.y) < st.r*0.6 + player.h*0.28) {
      hitPlayer();
      if (e.kind === 'kamikaze') {
        FX.explode(e.x, e.y, st.boom, st.color);
        Sound.play('explode');
        e.dead = true;
      }
    }
  });

  // Enemy bullets hit player
  enemyBullets.forEach(b => {
    if (b.dead) return;
    if (Math.abs(b.x-player.x) < b.r + player.w*0.30 && Math.abs(b.y-player.y) < b.r + player.h*0.26) {
      b.dead = true;
      hitPlayer();
    }
  });

  // Powerups
  powerups.forEach(p => {
    p.y += p.vy; p.life--;
    if (p.dead) return;
    if (Math.abs(p.x-player.x)<24 && Math.abs(p.y-player.y)<24) {
      p.dead = true;
      if (p.type === 'shield') {
        player.shield = 180;
        addFlashText('SHIELD!', player.x, player.y-30, '#00ffff');
        Sound.play('powerup');
      } else if (p.type === 'boost') {
        player.boost = 200;
        addFlashText('BOOST!', player.x, player.y-30, '#ffff00');
        Sound.play('powerup');
      } else {
        if (player.weaponLevel < CFG.weapons.length) {
          player.weaponLevel++;
          addFlashText('WEAPON ' + player.weaponLevel, player.x, player.y-30, '#ff66cc');
        } else {
          score += 250;
          addFlashText('+250', player.x, player.y-30, '#ff66cc');
        }
        Sound.play('weaponUp');
      }
      spawnParticles(p.x, p.y, POWERUP_COLOR[p.type], 15);
    }
  });

  // Hit-flash decay
  enemies.forEach(e => { if (e.flash > 0) e.flash--; });
  asteroids.forEach(a => { if (a.flash > 0) a.flash--; });
  if (player.muzzle > 0) player.muzzle--;

  // Reap everything in one place, after all collision passes have run.
  bullets = bullets.filter(b => !b.dead && b.y > -20);
  enemyBullets = enemyBullets.filter(b => !b.dead && b.y < H+20 && b.x > -20 && b.x < W+20);
  asteroids = asteroids.filter(a => a.y < H + 60 && a.hp > 0);
  // Turrets retreat off the top, so cull in both directions.
  enemies = enemies.filter(e => !e.dead && e.y < H+50 && e.y > -120);
  powerups = powerups.filter(p => !p.dead && p.y < H+30 && p.life > 0);
  capAll();

  // Level banner
  if (levelBanner) { levelBanner.life--; if (levelBanner.life <= 0) levelBanner = null; }

  // Combo timer
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }

  updateEffects();

  score++;
}

// ===== RENDER =====

function drawBg() {
  ctx.fillStyle = '#020818';
  ctx.fillRect(0, 0, W, H);

  nebulae.forEach(n => {
    let ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rx);
    ng.addColorStop(0, `hsla(${n.hue},70%,40%,0.07)`);
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI*2); ctx.fill();
  });

  // While boosting the stars smear into warp streaks.
  const warp = (state === 'play' && player.boost > 0);
  starLayers.forEach((layer, li) => {
    const col = li===2 ? `rgba(200,220,255,0.9)` : li===1 ? `rgba(180,200,255,0.6)` : `rgba(160,180,255,0.4)`;
    layer.forEach(s => {
      if (warp) {
        const len = s.speed * 9;
        ctx.strokeStyle = col; ctx.lineWidth = s.r*1.6;
        ctx.beginPath(); ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y); ctx.stroke();
      } else {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
      }
    });
  });
}

function draw() {
  ctx.save();
  ctx.translate(FX.shakeX, FX.shakeY);

  drawBg();

  if (state !== 'start') {
    player.trail.forEach(t => {
      let alpha = (t.life/12)*0.3;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,150,255,${alpha})`; ctx.fill();
    });

    powerups.forEach(p => {
      const pulse = 0.7 + 0.3*Math.sin(frame*0.15);
      const col = POWERUP_COLOR[p.type];
      ctx.save(); ctx.translate(p.x, p.y);
      ctx.beginPath(); ctx.arc(0, 0, 12*pulse, 0, Math.PI*2);
      ctx.globalAlpha = 0.25; ctx.fillStyle = col; ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = col; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
      ctx.fillText(POWERUP_LETTER[p.type], 0, 4);
      ctx.restore();
    });

    asteroids.forEach(drawAsteroid);
    enemies.forEach(drawEnemy);
    if (boss) drawBoss(boss);

    bullets.forEach(b => {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI/2);   // point along travel
      const bg2 = ctx.createLinearGradient(0, 0, 0, b.h);
      bg2.addColorStop(0, '#ffffff');
      bg2.addColorStop(0.3, b.pierce > 0 ? '#ffbbff' : '#88ffff');
      bg2.addColorStop(1, 'rgba(0,200,255,0)');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.roundRect(-b.w/2, -b.h, b.w, b.h, 2); ctx.fill();
      ctx.restore();
    });

    enemyBullets.forEach(b => {
      ctx.save(); ctx.translate(b.x, b.y);
      let eg = ctx.createRadialGradient(0,0,1,0,0,b.r);
      eg.addColorStop(0, b.elite ? '#ffffff' : '#ffcc00');
      eg.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    if (state === 'play') drawShip(player.x, player.y, player.invincible, player.shield, player.boost, frame, player.muzzle);

    particles.forEach(p => {
      let alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.type === 'spark') {
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillRect(-p.r*3, -p.r/2, p.r*3, p.r);
      } else if (p.type === 'chunk') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.8;
        ctx.strokeRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });

    // Shockwave rings and the additive flash at the heart of each blast.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    FX.glows.forEach(g => {
      const a = g.life / g.maxLife;
      const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
      gr.addColorStop(0, `rgba(255,255,255,${0.45*a})`);
      gr.addColorStop(0.35, g.color);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = a*0.55;
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    FX.rings.forEach(r => {
      const a = r.life / r.maxLife;
      ctx.save();
      ctx.globalAlpha = a*0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1 + 3*a;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });

    flashText.forEach(f => {
      let alpha = f.life / 60;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color; ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    drawHUD();
    if (boss && boss.dying === 0) drawBossBar(boss);
    if (bossWarning > 0) drawBossWarning();

    if (levelBanner) {
      let alpha = Math.min(1, levelBanner.life < 30 ? levelBanner.life/30 : (120-levelBanner.life)/30);
      if (alpha > 1) alpha = 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(0,0,40,0.7)';
      ctx.fillRect(0, H/2-30, W, 60);
      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
      ctx.fillText(levelBanner.text, W/2, H/2+12);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  // Colour drains out of the scene across the dying beat.
  if (state === 'dying') {
    const t = 1 - (dyingTimer / 75);
    ctx.save();
    ctx.fillStyle = `rgba(12,2,0,${0.55*t})`;
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.7*t})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (state === 'start') drawStart();
  if (state === 'dead') drawGameOver();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,30,0.6)';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score.toLocaleString(), 10, 18);
  ctx.fillStyle = '#6688bb';
  ctx.font = '11px monospace';
  ctx.fillText('BEST: ' + hiScore.toLocaleString(), 10, 34);

  ctx.fillStyle = '#ffdd44';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LV ' + level, W/2, 18);

  // Combo meter — drains as the window closes, colour steps with the multiplier.
  if (combo > 1) {
    const mult = comboMultiplier();
    const tierCol = mult >= 6 ? '#ff44aa' : mult >= 4 ? '#ff8800' : mult >= 2 ? '#ffdd00' : '#66ddff';
    const bw = 74, bx = W/2 - bw/2, by = 26;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = tierCol;
    ctx.fillRect(bx, by, bw*(comboTimer/120), 4);
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('x' + mult + '  (' + combo + ')', W/2, by + 15);
  }

  for (let i = 0; i < 3; i++) {
    let lx = W - 20 - i*26;
    ctx.save(); ctx.translate(lx, 18); ctx.scale(0.6, 0.6);
    if (i < lives) {
      ctx.fillStyle = '#3399ff';
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = '#224466'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  // Shield/boost bars drop below the boss health bar when a fight is live.
  let barY = (boss && boss.dying === 0) ? 70 : 48;
  if (player.shield > 0) {
    ctx.fillStyle = 'rgba(0,200,255,0.2)';
    ctx.fillRect(8, barY, (W-16)*(player.shield/180), 5);
    ctx.strokeStyle = '#00ccff'; ctx.lineWidth=1;
    ctx.strokeRect(8, barY, W-16, 5);
    ctx.fillStyle = '#00ccff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('SHIELD', 8, barY+14);
    barY += 20;
  }
  if (player.boost > 0) {
    ctx.fillStyle = 'rgba(255,220,0,0.2)';
    ctx.fillRect(8, barY, (W-16)*(player.boost/200), 5);
    ctx.strokeStyle = '#ffdd00'; ctx.lineWidth=1;
    ctx.strokeRect(8, barY, W-16, 5);
    ctx.fillStyle = '#ffdd00'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('BOOST', 8, barY+14);
  }

  // Weapon level pips, bottom-left and out of the play area.
  ctx.save();
  ctx.font = '9px monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = '#556677';
  ctx.fillText('WPN', 10, H - 24);
  for (let i = 0; i < CFG.weapons.length; i++) {
    const px = 10 + i*11, py = H - 18;
    if (i < player.weaponLevel) {
      ctx.fillStyle = '#ff66cc';
      ctx.fillRect(px, py, 7, 7);
    } else {
      ctx.strokeStyle = 'rgba(255,102,204,0.28)'; ctx.lineWidth = 1;
      ctx.strokeRect(px + 0.5, py + 0.5, 6, 6);
    }
  }
  ctx.restore();

  drawMuteIcon(MUTE_RECT_PLAY);
}

// ===== SCREENS =====

function drawMuteIcon(r) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  const on = !Sound.muted;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = on ? 'rgba(0,200,255,0.75)' : 'rgba(120,140,160,0.55)';
  ctx.fillStyle   = on ? 'rgba(0,200,255,0.75)' : 'rgba(120,140,160,0.55)';
  ctx.lineWidth = 1.6;
  // Speaker body
  ctx.beginPath();
  ctx.moveTo(-7, -3); ctx.lineTo(-3, -3); ctx.lineTo(1, -8);
  ctx.lineTo(1, 8); ctx.lineTo(-3, 3); ctx.lineTo(-7, 3);
  ctx.closePath(); ctx.fill();
  if (on) {
    // Two arcs of sound
    ctx.beginPath(); ctx.arc(2, 0, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(2, 0, 9, -0.9, 0.9); ctx.stroke();
  } else {
    // Crossed out
    ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(11, 5);
    ctx.moveTo(11, -5); ctx.lineTo(4, 5); ctx.stroke();
  }
  ctx.restore();
}

function drawStatBlock(cx, y) {
  const d = Save.data;
  const rows = [
    ['BEST',    d.hiScore.toLocaleString()],
    ['BEST LV', String(d.bestLevel)],
    ['RUNS',    String(d.totalRuns)],
    ['KILLS',   d.totalKills.toLocaleString()],
    ['CREDITS', d.credits.toLocaleString() + ' CR']
  ];
  ctx.save();
  ctx.font = '11px monospace';
  const boxW = 210, boxH = rows.length*16 + 14;
  ctx.fillStyle = 'rgba(0,20,45,0.55)';
  ctx.fillRect(cx - boxW/2, y, boxW, boxH);
  ctx.strokeStyle = 'rgba(0,180,255,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(cx - boxW/2, y, boxW, boxH);
  rows.forEach((r, i) => {
    const ry = y + 18 + i*16;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#5577aa';
    ctx.fillText(r[0], cx - boxW/2 + 12, ry);
    ctx.textAlign = 'right';
    ctx.fillStyle = r[0] === 'CREDITS' ? '#ffdd44' : '#aaccee';
    ctx.fillText(r[1], cx + boxW/2 - 12, ry);
  });
  ctx.restore();
}

function drawChevron(r, dir, enabled) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  ctx.save();
  ctx.strokeStyle = enabled ? 'rgba(0,220,255,0.85)' : 'rgba(90,110,130,0.35)';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // dir -1 points left, +1 points right: the apex sits on the dir side.
  ctx.beginPath();
  ctx.moveTo(cx - dir*5, cy - 10);
  ctx.lineTo(cx + dir*5, cy);
  ctx.lineTo(cx - dir*5, cy + 10);
  ctx.stroke();
  ctx.restore();
}

function drawStart() {
  const def = CFG.ships[selIndex];
  const owned = shipOwned(def.id);
  const affordable = Save.data.credits >= def.cost;

  ctx.fillStyle = 'rgba(0,5,20,0.88)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.save();
  ctx.shadowColor = '#00ccff'; ctx.shadowBlur = 26;
  ctx.fillStyle = '#00eeff';
  ctx.font = 'bold 40px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('VOID', W/2, 62);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('RUNNER', W/2, 102);
  ctx.restore();

  // Ship preview and selector
  ctx.save();
  ctx.translate(W/2, 172);
  ctx.scale(1.7, 1.7);
  ctx.translate(-W/2, -172);
  drawShip(W/2, 172, 0, 0, 0, frame, 0, def);
  ctx.restore();

  drawChevron(CHEV_L, -1, true);
  drawChevron(CHEV_R, 1, true);

  ctx.textAlign = 'center';
  ctx.fillStyle = owned ? '#ffffff' : '#7d8a9c';
  ctx.font = 'bold 22px monospace';
  ctx.fillText(def.name, W/2, 236);

  ctx.fillStyle = '#6b7f96';
  ctx.font = '11px monospace';
  ctx.fillText(def.blurb, W/2, 256);

  // Handling stats as small bars
  const stats = [
    ['LIVES', def.lives / 4],
    ['SPEED', (def.speed - 3.5) / 4.5],
    ['FIRE',  (1.35 - def.fireMul) / 0.8]
  ];
  stats.forEach((s, i) => {
    const sy = 276 + i*15;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#5577aa'; ctx.font = '10px monospace';
    ctx.fillText(s[0], W/2 - 92, sy + 7);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(W/2 - 42, sy, 130, 6);
    ctx.fillStyle = def.trim;
    ctx.fillRect(W/2 - 42, sy, 130 * Math.max(0.06, Math.min(1, s[1])), 6);
  });

  // Ownership / purchase control
  if (owned) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#44cc88'; ctx.font = 'bold 12px monospace';
    ctx.fillText('OWNED', W/2, 340);
    if (def.id === Save.data.selectedShip) {
      ctx.fillStyle = '#66ffcc'; ctx.font = '10px monospace';
      ctx.fillText('SELECTED', W/2, 355);
    }
  } else {
    ctx.fillStyle = affordable ? 'rgba(255,200,40,0.16)' : 'rgba(120,130,140,0.10)';
    ctx.fillRect(BUY_RECT.x, BUY_RECT.y, BUY_RECT.w, BUY_RECT.h);
    ctx.strokeStyle = affordable ? '#ffcc33' : 'rgba(140,150,160,0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(BUY_RECT.x, BUY_RECT.y, BUY_RECT.w, BUY_RECT.h);
    ctx.textAlign = 'center';
    ctx.fillStyle = affordable ? '#ffdd66' : '#7d8894';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('BUY — ' + def.cost.toLocaleString() + ' CR', W/2, BUY_RECT.y + 20);
    if (!affordable) {
      ctx.fillStyle = '#6b5f4a'; ctx.font = '10px monospace';
      ctx.fillText('need ' + (def.cost - Save.data.credits).toLocaleString() + ' more', W/2, BUY_RECT.y + 42);
    } else {
      ctx.fillStyle = '#8a7f5a'; ctx.font = '10px monospace';
      ctx.fillText('press B or tap to buy', W/2, BUY_RECT.y + 42);
    }
  }

  // Dots showing position in the roster
  CFG.ships.forEach((s, i) => {
    const dx = W/2 - (CFG.ships.length-1)*7 + i*14;
    ctx.beginPath(); ctx.arc(dx, 372, 3.2, 0, Math.PI*2);
    ctx.fillStyle = i === selIndex ? '#00ddff' : shipOwned(s.id) ? 'rgba(120,180,220,0.5)' : 'rgba(120,140,160,0.22)';
    ctx.fill();
  });

  drawStatBlock(W/2, 388);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#5b6b80';
  ctx.font = '11px monospace';
  ctx.fillText('← → move    W upgrades your gun    a hit costs one', W/2, 512);
  ctx.fillText('S = Shield    B = Boost    auto-fire is always on', W/2, 530);

  if (owned) {
    const pulse = 0.6 + 0.4*Math.sin(frame*0.08);
    ctx.fillStyle = `rgba(0,255,200,${pulse})`;
    ctx.font = 'bold 17px monospace';
    ctx.fillText('PRESS SPACE TO LAUNCH', W/2, 570);
  } else {
    ctx.fillStyle = 'rgba(120,135,150,0.8)';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('LOCKED — pick an owned ship to launch', W/2, 570);
  }

  drawMuteIcon(MUTE_RECT_START);

  ctx.fillStyle = '#445566';
  ctx.font = '10px monospace';
  ctx.fillText('M to mute', W/2, 596);

  if (!Save.ok) {
    ctx.fillStyle = '#665533';
    ctx.font = '10px monospace';
    ctx.fillText('progress cannot be saved in this browser', W/2, H - 14);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,10,0.75)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#ff6622';
  ctx.font = 'bold 44px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2 - 70);
  ctx.restore();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SCORE: ' + score.toLocaleString(), W/2, H/2 - 20);

  if (score >= hiScore) {
    ctx.fillStyle = '#ffdd00';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('✦ NEW BEST! ✦', W/2, H/2 + 12);
  } else {
    ctx.fillStyle = '#6688aa';
    ctx.font = '14px monospace';
    ctx.fillText('BEST: ' + hiScore.toLocaleString(), W/2, H/2 + 12);
  }

  // Credits earned, counting up so the reward is felt rather than just shown.
  ctx.fillStyle = 'rgba(255,210,60,0.14)';
  ctx.fillRect(W/2 - 92, H/2 + 32, 184, 40);
  ctx.strokeStyle = 'rgba(255,210,60,0.45)'; ctx.lineWidth = 1;
  ctx.strokeRect(W/2 - 92, H/2 + 32, 184, 40);
  ctx.fillStyle = '#ffdd44';
  ctx.font = 'bold 18px monospace';
  ctx.fillText('+' + Math.floor(creditsShown).toLocaleString() + ' CR', W/2, H/2 + 58);
  ctx.fillStyle = '#8a7f5a';
  ctx.font = '10px monospace';
  ctx.fillText('banked: ' + Save.data.credits.toLocaleString() + ' CR', W/2, H/2 + 86);
  ctx.fillText('reached level ' + level + '   ·   ' + runKills + ' kills', W/2, H/2 + 102);

  const pulse = 0.6 + 0.4*Math.sin(frame*0.1);
  ctx.fillStyle = `rgba(0,220,180,${pulse})`;
  ctx.font = 'bold 17px monospace';
  ctx.fillText('PRESS SPACE FOR HANGAR', W/2, H/2 + 136);
}

// ===== LOOP =====

function loop() {
  frame++;

  if (state === 'play') {
    if (FX.hitStopFrames > 0) {
      // Everything freezes; only the render below still runs.
      FX.hitStopFrames--;
    } else if (FX.slowMoFrames > 0) {
      FX.slowMoFrames--;
      FX.slowAcc += FX.slowMoFactor;
      if (FX.slowAcc >= 1) { FX.slowAcc -= 1; update(); }
    } else {
      update();
    }
  } else {
    starLayers.forEach(layer => layer.forEach(s => { s.y += s.speed; if (s.y > H+2) { s.y=-2; s.x=Math.random()*W; } }));
    nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

    // Animate the credit payout on the game-over screen.
    if (state === 'dead' && creditsShown < runCredits) {
      creditsShown = Math.min(runCredits, creditsShown + Math.max(1, runCredits/45));
    }

    if (state === 'dying') {
      if (FX.hitStopFrames > 0) {
        FX.hitStopFrames--;
      } else {
        FX.slowAcc += (FX.slowMoFrames > 0 ? FX.slowMoFactor : 1);
        if (FX.slowMoFrames > 0) FX.slowMoFrames--;
        if (FX.slowAcc >= 1) { FX.slowAcc -= 1; updateEffects(); }
        dyingTimer--;
        if (dyingTimer <= 0) state = 'dead';
      }
    } else {
      updateEffects();
    }
  }

  draw();
  requestAnimationFrame(loop);
}

// Fix roundRect for older browsers
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); return this; };
}

// Open the hangar on the ship you last flew.
selIndex = Math.max(0, CFG.ships.findIndex(s => s.id === Save.data.selectedShip));

loop();
</script>
