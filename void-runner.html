    }
  },

  // ------------------------------------------------------------------- voices
  // Every builder below creates its nodes, schedules an envelope, starts and
  // stops in the same call, and returns nothing. There is no persistent
  // oscillator anywhere in this engine.

  _dest: function (name) {
    return (Music._v && Music._v[name]) ? Music._v[name] : Music.bus;
  },

  // A short plucked sixteenth with a fast decay, so a full bar of them reads
  // as movement rather than as a wall.
  _arp: function (f, t, dur, peak, wave) {
    if (!(f > 0)) return;
    if (!Sound.claimVoice(t + dur)) return;
    var g = Music._env(t, dur, peak, 0.003, Music._dest('arp'));
    var o = Music._osc(wave || 'square', f, t, t + dur + 0.01, 0);
    o.connect(g);
  },

  // Noise burst through a bandpass — the backbeat layer that sits on top of
  // the snare rather than replacing it.
  _clap: function (t, peak) {
    if (!Sound.noiseBuf) return;
    if (!Sound.claimVoice(t + 0.14)) return;
    var c = Sound.ctx;
    var src = c.createBufferSource();
    src.buffer = Sound.noiseBuf;
    src.loop = true;
    var f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 1400;
    f.Q.value = 1.6;
    var g = c.createGain();
    // Three quick taps, which is what makes a clap sound like hands and not
    // like a second snare.
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak * 0.6, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.02, t + 0.02);
    g.gain.linearRampToValueAtTime(peak, t + 0.024);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    src.connect(f); f.connect(g); g.connect(Music._dest('drum'));
    src.start(t); src.stop(t + 0.14);
  },

  // Percussive/plucked gain envelope: silent -> peak -> silent, exponential
  // tail. Never ramps to zero (exponentialRamp to 0 is a RangeError).
  _env: function (t, dur, peak, atk, dest) {
    var g = Sound.ctx.createGain();
    var a = Math.min(atk, dur * 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(dest);
    return g;
  },

  _osc: function (type, f, t, stopAt, cents) {
    var o = Sound.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(8, f), t);
    if (cents) o.detune.setValueAtTime(cents, t);
    o.start(t);
    o.stop(stopAt);
    return o;
  },

  _noise: function (t, stopAt) {
    if (!Sound.noiseBuf) return null;
    var s = Sound.ctx.createBufferSource();
    s.buffer = Sound.noiseBuf;
    s.loop = true;              // the shared buffer is only 1s long
    s.start(t);
    s.stop(stopAt);
    return s;
  },

  // Sine fundamental plus a quiet octave so it reads on small speakers that
  // cannot reproduce the fundamental at all.
  _sub: function (f, t, dur, peak) {
    if (!Sound.ready() || !Music.bus) return;
    var end = t + dur;
    var g = Music._env(t, dur, peak, 0.04, Music._dest('sub'));
    var o1 = Music._osc('sine', f, t, end + 0.03);
    o1.connect(g);
    var o2 = Music._osc('triangle', f * 2, t, end + 0.03);
    var g2 = Sound.ctx.createGain(); g2.gain.value = 0.22;
    o2.connect(g2); g2.connect(g);
  },

  // Two detuned oscillators through a resonant lowpass that closes over the
  // note — the classic synth-bass pluck.
  _bass: function (f, t, dur, peak, wave) {
    if (!Sound.ready() || !Music.bus) return;
    var end = t + dur;
    var c = Sound.ctx;
    var filt = c.createBiquadFilter();
    filt.type = 'lowpass';
    filt.Q.value = 6;
    filt.frequency.setValueAtTime(Math.min(7000, Math.max(200, f * 12)), t);
    filt.frequency.exponentialRampToValueAtTime(Math.max(90, f * 2.2), end);
    var g = Music._env(t, dur, peak, 0.008, Music._dest('bass'));
    filt.connect(g);
    var o1 = Music._osc(wave || 'sawtooth', f, t, end + 0.03);
    o1.connect(filt);
    var o2 = Music._osc('square', f, t, end + 0.03, -11);
    var g2 = c.createGain(); g2.gain.value = 0.45;
    o2.connect(g2); g2.connect(filt);
  },

  // Slow-attack chord. Each note gets a pair of oscillators a few cents apart
  // so the chord beats against itself and sounds wide without a reverb.
  _pad: function (freqs, t, dur, peak, wave, cents) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var end = t + dur;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t + dur * 0.35);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak * 0.7), t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    var filt = c.createBiquadFilter();
    filt.type = 'lowpass';
    filt.Q.value = 1;
    filt.frequency.setValueAtTime(400, t);
    filt.frequency.linearRampToValueAtTime(2600, t + dur * 0.45);
    filt.frequency.linearRampToValueAtTime(700, end);
    filt.connect(g);
    g.connect(Music._dest('pad'));
    var n = Math.min(4, freqs.length);
    for (var i = 0; i < n; i++) {
      var a = Music._osc(wave, freqs[i], t, end + 0.05, -cents);
      var b = Music._osc(wave, freqs[i], t, end + 0.05, cents);
      var vg = c.createGain(); vg.gain.value = 1 / n;
      a.connect(vg); b.connect(vg); vg.connect(filt);
    }
  },

  // Melody voice: the note plus a quiet octave, through a bandpass that gives
  // it a formant-ish edge so it cuts through the pad without being loud.
  _lead: function (f, t, dur, peak, wave) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var end = t + dur;
    var bp = c.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(Math.min(9000, f * 2.2), t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(120, f * 1.1), end);
    var g = Music._env(t, dur, peak, 0.03, Music._dest('lead'));
    bp.connect(g);
    var o1 = Music._osc(wave || 'sawtooth', f, t, end + 0.03, 5);
    o1.connect(bp);
    var o2 = Music._osc('triangle', f * 2, t, end + 0.03, -6);
    var g2 = c.createGain(); g2.gain.value = 0.30;
    o2.connect(g2); g2.connect(bp);
  },

  // ---- drum kit ----
  _kick: function (t, vel, soft) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var dur = soft ? 0.34 : 0.18;
    var end = t + dur;
    var g = Music._env(t, dur, 0.85 * vel, 0.004, Music._dest('drum'));
    var o = Music._osc('sine', soft ? 110 : 150, t, end + 0.02);
    o.frequency.exponentialRampToValueAtTime(soft ? 32 : 44, end);
    o.connect(g);
    var o2 = Music._osc('triangle', soft ? 70 : 92, t, end + 0.02);
    o2.frequency.exponentialRampToValueAtTime(30, end);
    var g2 = c.createGain(); g2.gain.value = 0.4;
    o2.connect(g2); g2.connect(g);
    // beater click
    var s = Music._noise(t, t + 0.022);
    if (s) {
      var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
      var cg = Music._env(t, 0.02, 0.22 * vel, 0.001, Music._dest('drum'));
      s.connect(hp); hp.connect(cg);
    }
  },

  _snare: function (t, vel) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var dur = 0.15;
    var s = Music._noise(t, t + dur + 0.02);
    if (s) {
      var hp = c.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(1400, t);
      hp.frequency.exponentialRampToValueAtTime(700, t + dur);
      var g = Music._env(t, dur, 0.5 * vel, 0.002, Music._dest('drum'));
      s.connect(hp); hp.connect(g);
    }
    // the shell: two detuned triangles under the noise
    var tg = Music._env(t, 0.09, 0.30 * vel, 0.002, Music._dest('drum'));
    var o1 = Music._osc('triangle', 190, t, t + 0.11);
    o1.frequency.exponentialRampToValueAtTime(120, t + 0.09);
    o1.connect(tg);
    var o2 = Music._osc('triangle', 258, t, t + 0.11);
    o2.frequency.exponentialRampToValueAtTime(160, t + 0.09);
    var g2 = c.createGain(); g2.gain.value = 0.6;
    o2.connect(g2); g2.connect(tg);
  },

  _hat: function (t, vel, open) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var dur = open ? 0.18 : 0.038;
    var s = Music._noise(t, t + dur + 0.01);
    if (!s) return;
    // One filter, not two: hats are the most frequent event in the whole
    // engine, so this is the cheapest place to save allocations.
    var hp = c.createBiquadFilter();
    hp.type = 'highpass';
    hp.Q.value = 0.9;
    hp.frequency.value = open ? 6400 : 8200;
    var g = Music._env(t, dur, 0.22 * vel, 0.001, Music._dest('drum'));
    s.connect(hp); hp.connect(g);
  },

  _crash: function (t, dur, peak) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var s = Music._noise(t, t + dur + 0.02);
    if (s) {
      var hp = c.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(3200, t);
      hp.frequency.exponentialRampToValueAtTime(1100, t + dur);
      var g = Music._env(t, dur, peak, 0.004, Music._dest('drum'));
      s.connect(hp); hp.connect(g);
    }
    // a little metal, so it is a cymbal and not just a noise swell
    var mg = Music._env(t, dur * 0.55, peak * 0.28, 0.003, Music._dest('drum'));
    var r = [1, 1.51, 2.37];
    for (var i = 0; i < r.length; i++) {
      var o = Music._osc('square', 620 * r[i], t, t + dur * 0.55 + 0.02);
      var og = c.createGain(); og.gain.value = 0.33;
      o.connect(og); og.connect(mg);
    }
  },

  _tom: function (t, f, peak) {
    if (!Sound.ready() || !Music.bus) return;
    var dur = 0.22;
    var g = Music._env(t, dur, peak, 0.004, Music._dest('drum'));
    var o = Music._osc('sine', f, t, t + dur + 0.02);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, f * 0.45), t + dur);
    o.connect(g);
    var o2 = Music._osc('triangle', f * 1.5, t, t + dur * 0.6 + 0.02);
    o2.frequency.exponentialRampToValueAtTime(Math.max(40, f * 0.6), t + dur * 0.6);
    var g2 = Sound.ctx.createGain(); g2.gain.value = 0.35;
    o2.connect(g2); g2.connect(g);
  },

  // Boss phase change: a short rising stab dropped in wherever we are in the
  // bar. Deliberately not a bar-aligned event — it should feel like the fight
  // interrupting the music.
  _stabHit: function (t, root) {
    if (!Sound.ready() || !Music.bus) return;
    var c = Sound.ctx;
    var dur = 0.42;
    var g = Music._env(t, dur, 0.5, 0.006, Music._dest('lead'));
    var o1 = Music._osc('sawtooth', root * 2, t, t + dur + 0.03);
    o1.frequency.exponentialRampToValueAtTime(root * 6, t + dur);
    o1.connect(g);
    var o2 = Music._osc('square', root * 3, t, t + dur + 0.03, 12);
    o2.frequency.exponentialRampToValueAtTime(root * 9, t + dur);
    var g2 = c.createGain(); g2.gain.value = 0.4;
    o2.connect(g2); g2.connect(g);
    var s = Music._noise(t, t + dur + 0.02);
    if (s) {
      var bp = c.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 2;
      bp.frequency.setValueAtTime(400, t);
      bp.frequency.exponentialRampToValueAtTime(6000, t + dur);
      var ng = Music._env(t, dur, 0.24, 0.05, Music._dest('drum'));
      s.connect(bp); bp.connect(ng);
    }
  },

  // ---------------------------------------------------------------- voidbirth
  // The ascension. A one-off swell that is NOT part of the sequencer: it is
  // scheduled straight onto the audio clock, ducks the bed underneath itself,
  // and restores the bus gain when it is done. Safe to call at any time,
  // including with music stopped.
  voidbirth: function () {
    if (!Sound.ready() || Sound.muted) return;
    var c = Sound.ctx;
    var t = c.currentTime + 0.02;
    var LEN = 3.4;

    // Duck the bed so the swell owns the moment, then bring it back.
    if (Music.bus) {
      var bg = Music.bus.gain;
      bg.cancelScheduledValues(t);
      // Anchor on the CURRENT value, not the resting one — two overlapping
      // cues would otherwise step the gain and click.
      bg.setValueAtTime(Math.max(0.0001, bg.value), t);
      bg.linearRampToValueAtTime(Music._base * 0.25, t + 0.25);
      bg.linearRampToValueAtTime(Music._base * 0.25, t + LEN * 0.6);
      bg.linearRampToValueAtTime(Music._base, t + LEN);
    }

    var out = c.createGain();
    out.gain.value = 0.5;
    out.connect(Sound.master);

    // 1. A rising stack of fifths, entering one at a time and gliding up.
    var stack = [55, 82.41, 110, 164.81, 220, 329.63, 440];
    for (var i = 0; i < stack.length; i++) {
      var st = t + i * 0.16;
      var d = LEN - i * 0.22;
      if (d < 0.4) d = 0.4;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(0.09 - i * 0.008, st + d * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, st + d);
      g.connect(out);
      var o = c.createOscillator();
      o.type = i < 3 ? 'sawtooth' : 'triangle';
      o.frequency.setValueAtTime(stack[i], st);
      o.frequency.exponentialRampToValueAtTime(stack[i] * 2, st + d);
      o.connect(g);
      o.start(st); o.stop(st + d + 0.05);
    }

    // 2. A noise riser sweeping up into the peak.
    if (Sound.noiseBuf) {
      var s = c.createBufferSource();
      s.buffer = Sound.noiseBuf; s.loop = true;
      var bp = c.createBiquadFilter();
      bp.type = 'bandpass'; bp.Q.value = 3;
      bp.frequency.setValueAtTime(220, t);
      bp.frequency.exponentialRampToValueAtTime(9000, t + LEN * 0.62);
      var ng = c.createGain();
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.linearRampToValueAtTime(0.22, t + LEN * 0.6);
      ng.gain.exponentialRampToValueAtTime(0.0001, t + LEN * 0.95);
      s.connect(bp); bp.connect(ng); ng.connect(out);
      s.start(t); s.stop(t + LEN);
    }

    // 3. The bell at the top of the swell — inharmonic partials, long tail.
    var peak = t + LEN * 0.62;
    var bell = [1, 2.01, 2.99, 4.21, 5.43];
    for (var j = 0; j < bell.length; j++) {
      var bd = 1.6 - j * 0.22;
      var bgn = c.createGain();
      bgn.gain.setValueAtTime(0.0001, peak);
      bgn.gain.linearRampToValueAtTime(0.07 / (j + 1), peak + 0.01);
      bgn.gain.exponentialRampToValueAtTime(0.0001, peak + bd);
      bgn.connect(out);
      var bo = c.createOscillator();
      bo.type = 'sine';
      bo.frequency.setValueAtTime(440 * bell[j], peak);
      bo.connect(bgn);
      bo.start(peak); bo.stop(peak + bd + 0.05);
    }

    // 4. Sub drop under the bell, so the swell has a floor.
    var sg = c.createGain();
    sg.gain.setValueAtTime(0.0001, peak);
    sg.gain.linearRampToValueAtTime(0.30, peak + 0.02);
    sg.gain.exponentialRampToValueAtTime(0.0001, peak + 1.4);
    sg.connect(out);
    var so = c.createOscillator();
    so.type = 'sine';
    so.frequency.setValueAtTime(110, peak);
    so.frequency.exponentialRampToValueAtTime(27.5, peak + 1.2);
    so.connect(sg);
    so.start(peak); so.stop(peak + 1.45);
  }
};

// ---------------------------------------------------------------------------
// SFX
// ---------------------------------------------------------------------------
// One builder per sound name. `Sound.play(name)` consults this table before its
// own switch, so a name here overrides the built-in.
//
// Two pools:
//   slot(dur)  — for sounds the game fires constantly (laser, hit, ...). Takes
//                ONE voice from Sound.claimVoice per SOUND, so a thick sound no
//                longer eats several slots the way per-oscillator claiming did.
//   free()     — for rare, important sounds (tier reveals, boss phase, death).
//                Not voice-limited, because being cut off is worse than being
//                loud, and they cannot stack by their nature.
// Everything is wrapped in an IIFE so the helpers do not become globals and
// every key of SFX really is a sound name.

const SFX = (function () {

  function live() {
    return Sound.ready() && !Sound.muted && !!Sound.sfxBus;
  }
  // Rate-limited entry: returns the start time, or null if the voice pool is
  // full or audio is not available.
  function slot(dur) {
    if (!live()) return null;
    var t = Sound.ctx.currentTime;
    if (!Sound.claimVoice(t + dur)) return null;
    return t;
  }
  // Unlimited entry, for rare sounds.
  function free() {
    if (!live()) return null;
    return Sound.ctx.currentTime;
  }

  function env(t, dur, peak, atk, dest) {
    var g = Sound.ctx.createGain();
    var a = Math.min(atk, dur * 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(dest || Sound.sfxBus);
    return g;
  }

  // A single oscillator with an optional pitch sweep, wired into `dest`.
  function osc(type, f0, f1, t, dur, peak, dest, atk, cents) {
    var o = Sound.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(8, f0), t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(8, f1), t + dur);
    if (cents) o.detune.setValueAtTime(cents, t);
    var g = (peak === null) ? dest : env(t, dur, peak, atk === undefined ? 0.005 : atk, dest);
    o.connect(g);
    o.start(t);
    o.stop(t + dur + 0.03);
    return o;
  }

  // Filtered noise. `loop` is set so durations longer than the shared 1s
  // buffer are not silently truncated.
  function hiss(t, dur, peak, ftype, f0, f1, q, dest, atk) {
    if (!Sound.noiseBuf) return;
    var c = Sound.ctx;
    var s = c.createBufferSource();
    s.buffer = Sound.noiseBuf;
    s.loop = true;
    var f = c.createBiquadFilter();
    f.type = ftype || 'lowpass';
    f.Q.value = q || 1;
    f.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    var g = env(t, dur, peak, atk === undefined ? 0.003 : atk, dest);
    s.connect(f); f.connect(g);
    s.start(t);
    s.stop(t + dur + 0.02);
  }

  // Inharmonic metal — the basis of every "something broke" sound here.
  function metal(t, dur, peak, base, ratios, dest, type) {
    var c = Sound.ctx;
    var g = env(t, dur, peak, 0.002, dest);
    for (var i = 0; i < ratios.length; i++) {
      var o = c.createOscillator();
      o.type = type || 'square';
      o.frequency.setValueAtTime(Math.max(8, base * ratios[i]), t);
      o.frequency.exponentialRampToValueAtTime(Math.max(8, base * ratios[i] * 0.72), t + dur);
      var vg = c.createGain();
      vg.gain.value = 1 / (i + 1.4);
      o.connect(vg); vg.connect(g);
      o.start(t); o.stop(t + dur + 0.03);
    }
  }

  // A private bus for the big one-shots, so a tier reveal can be genuinely
  // loud without fighting the SFX bus compressor for headroom.
  function bigBus(gain) {
    var g = Sound.ctx.createGain();
    g.gain.value = gain;
    // Tier reveals and the voidbirth cue are ceremony, not combat, so they
    // ride the ambient fader rather than bypassing the mixer entirely.
    g.connect(Sound.ambientBus || Sound.master);
    return g;
  }

  // Duck the music bed under a big cue and restore it.
  function duck(t, depth, len) {
    if (!Music || !Music.bus) return;
    var g = Music.bus.gain;
    var base = Music._base;
    g.cancelScheduledValues(t);
    // Anchor on the current value so overlapping ducks do not step the gain.
    g.setValueAtTime(Math.max(0.0001, g.value), t);
    g.linearRampToValueAtTime(base * depth, t + 0.05);
    g.linearRampToValueAtTime(base * depth, t + len * 0.6);
    g.linearRampToValueAtTime(base, t + len);
  }

  // ----- the escalating tier ladder ---------------------------------------
  // Eleven steps. Every tier is the previous one plus one more idea, so the
  // ladder is audible rather than just louder: more chord tones, more octaves,
  // then a riser, then a bell, then a sub drop, then echoes, and finally
  // DYNACLOCKED which fires all of it plus a pre-roll and a tail.
  var TIERS = [
    // chord (semitones), octaves, note gap, dur, peak, wave, riser, bell, sub, echoes, bus
    { ch: [0, 7],              oct: 1, gap: 0.06, dur: 0.30, pk: 0.16, w: 'triangle', riser: 0,   bell: 0, sub: 0,    ech: 0, bus: 0.5 },
    { ch: [0, 4, 7],           oct: 1, gap: 0.06, dur: 0.36, pk: 0.17, w: 'triangle', riser: 0,   bell: 0, sub: 0,    ech: 0, bus: 0.55 },
    { ch: [0, 4, 7, 12],       oct: 1, gap: 0.06, dur: 0.46, pk: 0.17, w: 'sawtooth', riser: 0,   bell: 0, sub: 0,    ech: 0, bus: 0.6 },
    { ch: [0, 4, 7, 11, 14],   oct: 2, gap: 0.06, dur: 0.60, pk: 0.16, w: 'sawtooth', riser: 0.3, bell: 0, sub: 0,    ech: 0, bus: 0.65 },
    { ch: [0, 4, 7, 11, 14],   oct: 2, gap: 0.07, dur: 0.80, pk: 0.16, w: 'sawtooth', riser: 0.5, bell: 1, sub: 0,    ech: 0, bus: 0.7 },
    { ch: [0, 4, 7, 11, 14, 18], oct: 2, gap: 0.07, dur: 1.00, pk: 0.15, w: 'sawtooth', riser: 0.7, bell: 1, sub: 0.9, ech: 0, bus: 0.75 },
    { ch: [0, 4, 7, 11, 14, 18], oct: 2, gap: 0.07, dur: 1.25, pk: 0.15, w: 'sawtooth', riser: 0.9, bell: 1, sub: 1.1, ech: 1, bus: 0.8 },
    { ch: [0, 4, 7, 11, 14, 18, 21], oct: 3, gap: 0.06, dur: 1.50, pk: 0.14, w: 'sawtooth', riser: 1.1, bell: 1, sub: 1.3, ech: 1, bus: 0.85 },
    { ch: [0, 4, 7, 11, 14, 18, 21], oct: 3, gap: 0.06, dur: 1.80, pk: 0.14, w: 'sawtooth', riser: 1.3, bell: 2, sub: 1.5, ech: 2, bus: 0.9 },
    { ch: [0, 4, 7, 11, 14, 18, 21, 24], oct: 3, gap: 0.055, dur: 2.20, pk: 0.13, w: 'sawtooth', riser: 1.5, bell: 2, sub: 1.8, ech: 2, bus: 0.95 }
  ];

  function reveal(i) {
    var t = free();
    if (t === null) return;
    var cfg = TIERS[i];
    var c = Sound.ctx;
    var bus = bigBus(cfg.bus);
    var ROOT = 261.63;                     // C4
    duck(t, 0.45, cfg.dur + 0.6);

    // Riser into the hit.
    if (cfg.riser) {
      var rt = t;
      t = t + cfg.riser;                   // the chord lands after the riser
      hiss(rt, cfg.riser + 0.05, 0.20, 'bandpass', 300, 7000, 3, bus, cfg.riser * 0.8);
    }

    // The chord, arpeggiated upward across `oct` octaves.
    var n = 0;
    for (var o = 0; o < cfg.oct; o++) {
      for (var k = 0; k < cfg.ch.length; k++) {
        var f = ROOT * Math.pow(2, (cfg.ch[k] + 12 * o) / 12);
        if (f > 9000) continue;
        var st = t + n * cfg.gap;
        var d = cfg.dur - n * cfg.gap * 0.35;
        if (d < 0.2) d = 0.2;
        var g = env(st, d, cfg.pk, 0.006, bus);
        osc(cfg.w, f, null, st, d, null, g, 0, -6);
        osc('triangle', f * 2, null, st, d * 0.7, null, g, 0, 7);
        n++;
      }
    }

    // Bell on top.
    if (cfg.bell) {
      var bt = t + 0.02;
      var rat = [1, 2.01, 2.99, 4.19, 5.41];
      var bg = env(bt, 1.2 + cfg.bell * 0.6, 0.16, 0.004, bus);
      for (var b = 0; b < rat.length; b++) {
        var bo = c.createOscillator();
        bo.type = 'sine';
        bo.frequency.setValueAtTime(ROOT * 4 * rat[b], bt);
        var vg = c.createGain(); vg.gain.value = 1 / (b + 1.5);
        bo.connect(vg); vg.connect(bg);
        bo.start(bt); bo.stop(bt + 1.2 + cfg.bell * 0.6 + 0.05);
      }
    }

    // Sub drop.
    if (cfg.sub) {
      osc('sine', 130, 30, t, cfg.sub, 0.42, bus, 0.01);
      osc('triangle', 65, 24, t, cfg.sub * 0.8, 0.14, bus, 0.01);
    }

    // Echo stabs, an eighth apart, decaying.
    for (var e = 1; e <= cfg.ech; e++) {
      var et = t + 0.28 * e;
      var eg = env(et, 0.35, 0.10 / e, 0.004, bus);
      osc(cfg.w, ROOT * 2, null, et, 0.35, null, eg, 0, -5);
      osc(cfg.w, ROOT * 3, null, et, 0.35, null, eg, 0, 5);
    }
  }

  // The top of the ladder. Deliberately structured as an event rather than a
  // sound: pre-roll, gap, impact, chord, bell, sub drop, tail.
  function dyna() {
    var t0 = free();
    if (t0 === null) return;
    var c = Sound.ctx;
    var bus = bigBus(1.0);
    var ROOT = 261.63;
    duck(t0, 0.15, 5.2);

    // 1. Pre-roll: a reverse-swell riser plus a rising, detuning drone.
    hiss(t0, 1.30, 0.30, 'bandpass', 200, 9000, 3.5, bus, 1.15);
    osc('sawtooth', 55, 220, t0, 1.30, 0.16, bus, 1.1, -14);
    osc('sawtooth', 55, 220, t0, 1.30, 0.16, bus, 1.1, 14);

    // 2. A beat of near-silence, then the impact.
    var t = t0 + 1.42;

    // 3. Impact: sub drop, gong, and a body of noise.
    osc('sine', 160, 18, t, 2.6, 0.55, bus, 0.006);
    osc('triangle', 80, 20, t, 2.0, 0.22, bus, 0.006);
    hiss(t, 2.4, 0.34, 'lowpass', 6000, 90, 1, bus, 0.004);
    hiss(t, 2.8, 0.22, 'highpass', 2600, 900, 1, bus, 0.004);
    metal(t, 2.6, 0.26, 180, [1, 1.73, 2.41, 3.62, 5.11, 7.03], bus, 'square');

    // 4. The chord: four octaves of a lydian stack, twelve voices.
    var ch = [0, 4, 7, 11, 14, 18, 21, 24];
    var g = env(t, 3.0, 0.10, 0.012, bus);
    var placed = 0;
    for (var o = 0; o < 4 && placed < 16; o++) {
      for (var k = 0; k < ch.length && placed < 16; k++) {
        var f = ROOT * Math.pow(2, (ch[k] + 12 * (o - 1)) / 12);
        if (f < 60 || f > 9000) continue;
        if ((o + k) % 2 === 1) continue;              // thin it out, keep it wide
        osc('sawtooth', f, null, t + placed * 0.012, 3.0, null, g, 0, (placed % 2 ? 8 : -8));
        placed++;
      }
    }

    // 5. Bell tower on top — five inharmonic partials, very long.
    var rat = [1, 2.01, 2.99, 4.19, 5.41, 7.02];
    var bg = env(t + 0.03, 3.4, 0.20, 0.004, bus);
    for (var b = 0; b < rat.length; b++) {
      var bo = c.createOscillator();
      bo.type = 'sine';
      bo.frequency.setValueAtTime(ROOT * 4 * rat[b], t + 0.03);
      var vg = c.createGain(); vg.gain.value = 1 / (b + 1.4);
      bo.connect(vg); vg.connect(bg);
      bo.start(t + 0.03); bo.stop(t + 3.5);
    }

    // 5b. A second bell an octave down, and a second sub layer — this is the
    // one sound in the game that is allowed to be too much.
    var lg = env(t + 0.05, 4.0, 0.16, 0.006, bus);
    for (var b2 = 0; b2 < 4; b2++) {
      var lo = c.createOscillator();
      lo.type = 'sine';
      lo.frequency.setValueAtTime(ROOT * 2 * rat[b2], t + 0.05);
      var lvg = c.createGain(); lvg.gain.value = 1 / (b2 + 1.2);
      lo.connect(lvg); lvg.connect(lg);
      lo.start(t + 0.05); lo.stop(t + 4.1);
    }
    osc('sine', 55, 16.5, t + 0.02, 3.6, 0.34, bus, 0.02);
    hiss(t + 0.5, 3.0, 0.10, 'bandpass', 9000, 400, 2, bus, 0.4);

    // 6. Three decaying echo stabs, then a final low toll.
    for (var e = 1; e <= 3; e++) {
      var et = t + 0.34 * e;
      var eg = env(et, 0.5, 0.14 / e, 0.004, bus);
      osc('sawtooth', ROOT * 2, null, et, 0.5, null, eg, 0, -6);
      osc('sawtooth', ROOT * 3, null, et, 0.5, null, eg, 0, 6);
    }
    metal(t + 1.6, 1.8, 0.14, 90, [1, 2.03, 3.11, 4.4], bus, 'sine');

    // 7. Aftershock. Nothing else in the game gets a second impact.
    var at = t + 3.05;
    osc('sine', 120, 17, at, 2.0, 0.40, bus, 0.006);
    hiss(at, 1.8, 0.22, 'lowpass', 3800, 60, 1, bus, 0.004);
    metal(at, 1.6, 0.16, 130, [1, 1.73, 2.41, 3.62], bus, 'square');
    osc('sawtooth', ROOT, null, at, 2.2, 0.09, bus, 0.02, -10);
    osc('sawtooth', ROOT * 1.5, null, at, 2.2, 0.09, bus, 0.02, 10);
  }

let state = 'start'; // start | play | shop | dying | dead
let score = 0, lives = 3, level = 1;

let dyingTimer = 0;

// ---- ROGUELIKE RUN STATE (Task 8) ----
let runUpgrades = [];       // [{id, stacks}] — this run only
let scrap = 0, scrapSpent = 0;
// Kept as a player-facing statistic only. It used to scale boss HP, which
// meant buying upgrades could make your own run harder — a punishment for
// playing the game. Boss health is now fixed per level (RLCore.bossHp), so
// getting stronger only ever helps.
let scrapOnUpgrades = 0;
// How many times this run has ascended. Drives the tier floor, the odds
// vector, the shop cadence, and every upgrade's name and strength.
let voidbirths = 0;
let stats = null;           // resolved by recomputeStats()
let overchargeCount = 0, killsSinceLife = 0, killsSinceShield = 0;
// KINETIC VERDICT fires once per level; UNDYING once per run.
let verdictSpent = false, revivedThisRun = false;
// WARDEN's per-level grace: hits that cost a life but no upgrade.
let graceLeft = 0;
// WRAITH's cloak works by freezing where the enemy THINKS you are. Shots go to
// your last known position rather than becoming harmless, so a cloaked run
// still has to dodge everything already in the air.
let lastSeenX = W / 2, lastSeenY = H - 120;

function enemyAimAngle(fromX, fromY) {
  const cloaked = player.cloak > 0;
  const tx = cloaked ? lastSeenX : player.x;
  const ty = cloaked ? lastSeenY : player.y;
  return Math.atan2(ty - fromY, tx - fromX);
}
// Timed boons from meteors. Both are read by the shot builder and the enemy
// step respectively, so a pickup that says OVERDRIVE does overdrive.
let boostRage = 0, boostFreeze = 0;
let scrapDrip = 0;          // MIDAS FIELD's fractional carry

// ---- HUD build-list cache (Task 15) ----
// runUpgrades mutates in place on purchase (stacks++ / push) rather than
// getting a new array reference, so we can't detect changes by identity —
// every call site that changes it bumps this counter instead. drawHUD
// rebuilds the resolved {name, color, stacks} list only when the version
// it last cached at is stale, so a 60fps draw loop never re-runs
// RLCore.UPGRADES.find() per entry per frame.
let runUpgradesVersion = 0;
let buildCache = [];
let buildCacheVersion = -1;

function rebuildBuildCache() {
  buildCache = runUpgrades.map(o => {
    const u = RLCore.byId(o.id);
    if (!u) return null; // unknown id in the catalog: skip, don't throw
    const r = RLCore.resolve(u, voidbirths);
    return { name: r.name, color: RLCore.tierOf(r.tier).color, stacks: o.stacks };
  }).filter(Boolean);
  buildCacheVersion = runUpgradesVersion;
}

// ===== SETTINGS =====
// Opened with the pause key from anywhere. Three volumes, a rebindable key for
// every action, and the autoskip toggle. Everything writes straight through to
// the save, so a change survives the tab being closed mid-run.

let settingsReturn = 'start';   // where ESC came from, so ESC goes back to it
let settingsSel = 0;
let settingsRebind = null;      // action id currently listening for a key
let settingsScroll = 0;

const SET_VOL = [
  { id: 'volMusic',   label: 'MUSIC' },
  { id: 'volAmbient', label: 'AMBIENCE' },
  { id: 'volAttack',  label: 'ATTACKS' }
];

// Rows are: three volumes, the autoskip toggle, then one row per binding.
function settingsRows() {
  return SET_VOL.map(v => ({ kind: 'vol', id: v.id, label: v.label }))
    .concat([{ kind: 'toggle', id: 'autoSkip', label: 'AUTO-SKIP SHOPS' }])
    .concat(RLCore.BIND_ORDER.map(k => ({ kind: 'bind', id: k, label: RLCore.BIND_LABELS[k] })))
    .concat([{ kind: 'reset', id: 'reset', label: 'RESET TO DEFAULTS' }]);
}

function openSettings(from) {
  settingsReturn = from;
  settingsSel = 0;
  settingsScroll = 0;
  settingsRebind = null;
  state = 'settings';
  Sound.play('uiMove');
}

function closeSettings() {
  Save.data.settings = RLCore.normalizeSettings(Save.data.settings);
  Save.write();
  Sound.applySettings();
  state = settingsReturn;
  Sound.play('uiMove');
}

function settingsAdjust(row, dir) {
  const st = Save.data.settings;
  if (row.kind === 'vol') {
    st[row.id] = Math.max(0, Math.min(1, Math.round((st[row.id] + dir * 0.05) * 100) / 100));
    Sound.applySettings();
    // Play the sound on the bus being adjusted, so you hear what you changed.
    Sound.play(row.id === 'volAttack' ? 'laser' : 'uiMove');
  } else if (row.kind === 'toggle') {
    st[row.id] = !st[row.id];
    Sound.play('uiBuy');
  }
  Save.write();
}

function settingsActivate(row) {
  if (row.kind === 'bind') {
    settingsRebind = row.id;
    Sound.play('uiMove');
  } else if (row.kind === 'reset') {
    Save.data.settings = RLCore.defaultSettings();
    Save.write();
    Sound.applySettings();
    Sound.play('uiBuy');
  } else {
    settingsAdjust(row, 1);
  }
}

// Captures the next key for the row that asked for it. Escape cancels rather
// than binding, because a binding of Escape would trap the player in here.
function settingsCaptureKey(key) {
  if (key === 'Escape') { settingsRebind = null; Sound.play('uiDeny'); return; }
  const st = Save.data.settings;
  // A key can only mean one thing at a time, so taking it removes it from
  // wherever it was. If that empties another action, that action falls back
  // to its default rather than becoming unreachable.
  RLCore.BIND_ORDER.forEach(k => {
    if (k === settingsRebind) return;
    st.binds[k] = st.binds[k].filter(x => x !== key);
    if (!st.binds[k].length) st.binds[k] = RLCore.DEFAULT_BINDS[k].slice();
  });
  st.binds[settingsRebind] = [key];
  settingsRebind = null;
  Save.data.settings = RLCore.normalizeSettings(st);
  Save.write();
  Sound.play('uiBuy');
}

function keyName(k) {
  if (k === ' ') return 'SPACE';
  if (k.startsWith('Arrow')) return k.slice(5).toUpperCase();
  return k.length === 1 ? k.toUpperCase() : k.toUpperCase();
}

const SET_ROW_H = 26;
const SET_TOP = 118;
const SET_VISIBLE = 15;

function drawSettings() {
  ctx.fillStyle = '#02040a';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9fe8ff';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('SETTINGS', W/2, 60);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#5a7a8a';
  ctx.fillText('UP/DOWN CHOOSE   LEFT/RIGHT ADJUST   ENTER SELECT   ESC BACK', W/2, 84);

  const rows = settingsRows();
  if (settingsSel < settingsScroll) settingsScroll = settingsSel;
  if (settingsSel >= settingsScroll + SET_VISIBLE) settingsScroll = settingsSel - SET_VISIBLE + 1;

  for (let i = 0; i < SET_VISIBLE && i + settingsScroll < rows.length; i++) {
    const r = rows[i + settingsScroll];
    const y = SET_TOP + i * SET_ROW_H;
    const on = (i + settingsScroll) === settingsSel;

    if (on) {
      ctx.fillStyle = 'rgba(60,150,200,0.20)';
      ctx.fillRect(30, y - 15, W - 60, SET_ROW_H - 4);
    }
    ctx.textAlign = 'left';
    ctx.font = (on ? 'bold ' : '') + '12px monospace';
    ctx.fillStyle = on ? '#ffffff' : '#8aa4b4';
    ctx.fillText(r.label, 44, y);

    ctx.textAlign = 'right';
    if (r.kind === 'vol') {
      const v = Save.data.settings[r.id];
      const bx = W - 160, bw = 110;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(bx, y - 8, bw, 9);
      ctx.fillStyle = on ? '#66e0ff' : '#3d7d94';
      ctx.fillRect(bx, y - 8, bw * v, 9);
      ctx.fillStyle = on ? '#ffffff' : '#8aa4b4';
      ctx.fillText(Math.round(v * 100) + '%', W - 44, y);
    } else if (r.kind === 'toggle') {
      const v = Save.data.settings[r.id];
      ctx.fillStyle = v ? '#66ffaa' : '#775c5c';
      ctx.fillText(v ? 'ON' : 'OFF', W - 44, y);
    } else if (r.kind === 'bind') {
      const listening = settingsRebind === r.id;
      ctx.fillStyle = listening ? '#ffdd44' : (on ? '#ffffff' : '#8aa4b4');
      ctx.fillText(listening ? 'PRESS A KEY…' : Save.data.settings.binds[r.id].map(keyName).join(' / '), W - 44, y);
    } else {
      ctx.fillStyle = on ? '#ff8888' : '#7a5555';
      ctx.fillText('↵', W - 44, y);
    }
  }

  if (rows.length > SET_VISIBLE) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#3d5a68';
    ctx.font = '9px monospace';
    if (settingsScroll > 0) ctx.fillText('▲', W/2, SET_TOP - 22);
    if (settingsScroll + SET_VISIBLE < rows.length) ctx.fillText('▼', W/2, SET_TOP + SET_VISIBLE * SET_ROW_H);
  }
  ctx.textAlign = 'left';
}

// ===== THE BESTIARY =====
// Everything the galaxy contains and how much of it you have met. Two halves:
// the fleet you fight and the cards you fight with. Anything unmet is drawn as
// a silhouette with its name withheld, so the gaps are the point.

let bestTab = 0;               // 0 = ships, 1 = upgrades
let bestBand = 0;              // which band / tier column is open
let bestScroll = 0;
let bestSel = 0;

function upgradeTabs() {
  // OVERCLOCKED and everything above it stays hidden until one has actually
  // turned up. A tab you have no idea exists is a better surprise than a tab
  // full of question marks.
  return RLCore.LADDER.filter(t => {
    const idx = RLCore.tierIndexOf(t.id);
    return idx < 7 || tierEverSeen(t.id);
  }).map(t => t.id).concat(tierEverSeen('SECRET') ? ['SECRET'] : []);
}

function openBestiary() {
  state = 'bestiary';
  bestTab = 0; bestBand = 0; bestScroll = 0; bestSel = 0;
  Sound.play('uiMove');
}

function bestiaryEntries() {
  if (bestTab === 0) {
    const bands = RLCore.ENEMY_BANDS.length;
    if (bestBand < bands) {
      return RLCore.ENEMY_BANDS[bestBand].map(d => ({
        id: d.id, name: d.name, art: d.art, r: d.r,
        seen: !!Save.data.seenEnemies[d.id],
        sub: d.beh.toUpperCase() + '  ·  ' + d.hp + ' BASE HP'
      }));
    }
    // The last column is the boss roll.
    return RLCore.BOSS_TABLE.map(b => ({
      id: b.key, name: b.name, boss: true,
      seen: !!Save.data.bossesKilled[b.key],
      sub: 'LEVEL ' + b.level + '  ·  ' + b.hp.toLocaleString() + ' HP'
    }));
  }
  const tabs = upgradeTabs();
  const tier = tabs[Math.min(bestBand, tabs.length - 1)];
  return RLCore.UPGRADES.filter(u => u.tier === tier).map(u => ({
    id: u.id, name: u.name, tier: u.tier,
    seen: !!Save.data.seenUpgrades[u.id],
    sub: u.desc
  }));
}

function bestiaryColumns() {
  if (bestTab === 0) return RLCore.BAND_THEMES.concat(['BOSSES']);
  return upgradeTabs();
}

const BEST_ROW_H = 30;
const BEST_TOP = 150;
const BEST_VISIBLE = 15;

function drawBestiary() {
  ctx.fillStyle = '#020308';
  ctx.fillRect(0, 0, W, H);

  const cols = bestiaryColumns();
  bestBand = Math.max(0, Math.min(cols.length - 1, bestBand));
  const entries = bestiaryEntries();
  const found = entries.filter(e => e.seen).length;

  ctx.textAlign = 'center';
  ctx.fillStyle = '#9fe8ff';
  ctx.font = 'bold 20px monospace';
  ctx.fillText('BESTIARY', W/2, 48);

  // Tabs.
  ['THE FLEET', 'THE CARDS'].forEach((t, i) => {
    const x = W/2 + (i === 0 ? -80 : 80);
    ctx.font = (bestTab === i ? 'bold ' : '') + '12px monospace';
    ctx.fillStyle = bestTab === i ? '#ffffff' : '#4d6a78';
    ctx.fillText(t, x, 72);
    if (bestTab === i) { ctx.fillStyle = '#66e0ff'; ctx.fillRect(x - 42, 78, 84, 2); }
  });

  ctx.font = '11px monospace';
  ctx.fillStyle = '#ffcc55';
  ctx.fillText('◄  ' + cols[bestBand] + '  ►', W/2, 104);
  ctx.font = '10px monospace';
  ctx.fillStyle = '#5a7a8a';
  ctx.fillText(found + ' / ' + entries.length + ' DISCOVERED', W/2, 122);

  bestSel = Math.max(0, Math.min(entries.length - 1, bestSel));
  if (bestSel < bestScroll) bestScroll = bestSel;
  if (bestSel >= bestScroll + BEST_VISIBLE) bestScroll = bestSel - BEST_VISIBLE + 1;

  for (let i = 0; i < BEST_VISIBLE && i + bestScroll < entries.length; i++) {
    const e = entries[i + bestScroll];
    const y = BEST_TOP + i * BEST_ROW_H;
    const on = (i + bestScroll) === bestSel;
    if (on) { ctx.fillStyle = 'rgba(60,150,200,0.18)'; ctx.fillRect(20, y - 16, W - 40, BEST_ROW_H - 4); }

    // The thumbnail. An unmet ship is drawn as a flat silhouette, which is
    // still its real geometry — you can see the shape of the thing you have
    // not met yet, just not its colours or its name.
    if (e.art) {
      ctx.save();
      ctx.translate(44, y - 2);
      const k = 11 / (e.r * 0.62);
      ctx.scale(k, k);
      if (e.seen) drawRosterHull({}, e.art, e.r * 0.62, () => {});
      else {
        ctx.globalAlpha = 0.30;
        drawRosterHull({}, { ...e.art, c0: '#2a3644', c1: '#1b232e', c2: '#101720' }, e.r * 0.62, () => {});
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    } else if (e.boss) {
      ctx.fillStyle = e.seen ? '#ff6688' : '#2a2030';
      ctx.beginPath(); ctx.arc(44, y - 2, 10, 0, Math.PI*2); ctx.fill();
    } else {
      const t = RLCore.tierOf(e.tier);
      ctx.fillStyle = e.seen ? t.color : '#232a33';
      ctx.fillRect(36, y - 12, 16, 16);
      ctx.strokeStyle = e.seen ? t.color2 : '#151a20';
      ctx.lineWidth = 1.5; ctx.strokeRect(36, y - 12, 16, 16);
    }

    ctx.textAlign = 'left';
    ctx.font = (on ? 'bold ' : '') + '12px monospace';
    ctx.fillStyle = e.seen ? (on ? '#ffffff' : '#c8dae4') : '#3d4a56';
    ctx.fillText(e.seen ? e.name : '?????????', 66, y - 2);
    ctx.font = '9px monospace';
    ctx.fillStyle = e.seen ? '#6a8a9a' : '#2d3843';
    ctx.fillText(e.seen ? e.sub : 'NOT YET ENCOUNTERED', 66, y + 10);
    ctx.textAlign = 'center';
  }

  ctx.font = '9px monospace';
  ctx.fillStyle = '#3d5a68';
  ctx.fillText('LEFT/RIGHT PAGE   UP/DOWN SCROLL   TAB SWITCH   ESC BACK', W/2, H - 26);
  ctx.textAlign = 'left';
}

// ===== THE BESTIARY LEDGER =====
// Three sets of "you have met this". Written sparingly -- localStorage is
// synchronous, and writing on every kill would stutter the frame -- so the
// flush is deferred to the next natural pause.

let ledgerDirty = false;

function noteEnemySeen(id) {
  if (!id || Save.data.seenEnemies[id]) return;
  Save.data.seenEnemies[id] = 1;
  ledgerDirty = true;
}

function noteMeteorSeen(id) {
  if (!id || Save.data.seenMeteors[id]) return;
  Save.data.seenMeteors[id] = 1;
  ledgerDirty = true;
}

// Recorded when a card is OFFERED, not when it is bought: the bestiary is a
// record of what this galaxy contains, and a card you turned down is still
// one you have seen. Tier is stored so the OVERCLOCKED+ tabs know whether
// they have ever had a reason to exist.
function noteUpgradeSeen(id, tier) {
  if (!id) return;
  if (Save.data.seenUpgrades[id]) return;
  Save.data.seenUpgrades[id] = tier || 1;
  ledgerDirty = true;
}

function noteBossSeen(key) {
  if (!key || Save.data.bossesKilled[key]) return;
  Save.data.bossesKilled[key] = 1;
  ledgerDirty = true;
}

function flushLedger() {
  if (!ledgerDirty) return;
  ledgerDirty = false;
  Save.write();
}

// Has the player ever met a card at or above this tier? Gates the deep tabs.
function tierEverSeen(tierId) {
  const ids = Object.keys(Save.data.seenUpgrades);
  for (let i = 0; i < ids.length; i++) {
    const u = RLCore.byId(ids[i]);
    if (!u) continue;
    const stored = Save.data.seenUpgrades[ids[i]];
    if (stored === tierId || u.tier === tierId) return true;
  }
  return false;
}

function recomputeStats() {
  const ship = currentShip();
  stats = RLCore.resolveStats(ship, runUpgrades, voidbirths, level);
  // SCAVENGER's cut. Applied after resolution rather than inside it so the
  // pure core stays a function of (ship stats, upgrades, depth) and never has
  // to know about per-hull specials.
  if (ship.scrapBonus) stats.scrapMul += ship.scrapBonus;
  player.speed = stats.speed;
  // Evasion Field shrinks the hitbox relative to the ship's base size.
  // Recomputed here (not applyShip) so it updates live whenever the build
  // changes, since applyShip runs once at game start before stats exist.
  player.w = ship.hitW * stats.hitScale;
  player.h = ship.hitH * stats.hitScale;
  // Drone count can change mid-run (gained or stripped), so keep the visible
  // drones[] array in sync with stats.drones every time stats are resolved.
  syncDrones();
}

// Impact feedback. Kept separate from game state so nothing here can change
// the outcome of a run — it only changes how the run feels.
const FX = {
  hitStopFrames: 0,
  shake: 0, shakeX: 0, shakeY: 0,
  slowMoFrames: 0, slowMoFactor: 1, slowAcc: 0,
  rings: [], glows: [],
  MAX_RINGS: 24, MAX_GLOWS: 24,

  reset() {
    FX.hitStopFrames = 0; FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0;
    FX.slowMoFrames = 0; FX.slowMoFactor = 1; FX.slowAcc = 0;
    FX.rings = []; FX.glows = [];
  },

  // Freezing the simulation for a few frames while the explosion stays on
  // screen is the cheapest way to make a kill feel like it landed.
  hitStop(f) { FX.hitStopFrames = Math.max(FX.hitStopFrames, f); },
  addShake(a) { FX.shake = Math.max(FX.shake, a); },
  slowMo(frames, factor) { FX.slowMoFrames = frames; FX.slowMoFactor = factor; FX.slowAcc = 0; },

  explode(x, y, size, color) {
    FX.rings.push({ x, y, r: size*0.25, maxR: size*2.1, life: 24, maxLife: 24, color });
    FX.glows.push({ x, y, r: size*1.5, life: 9, maxLife: 9, color });
    const chunks = Math.max(4, Math.round(size*0.5));
    for (let i = 0; i < chunks; i++) {
      const a = Math.random()*Math.PI*2;
      const sp = 1 + Math.random()*size*0.14;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 26 + Math.random()*28, maxLife: 54,
        r: 1.5 + Math.random()*size*0.10,
        color, type: 'chunk',
        rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.35
      });
    }
    spawnParticles(x, y, color, Math.max(4, Math.round(size*0.45)));
    if (FX.rings.length > FX.MAX_RINGS) FX.rings.splice(0, FX.rings.length - FX.MAX_RINGS);
    if (FX.glows.length > FX.MAX_GLOWS) FX.glows.splice(0, FX.glows.length - FX.MAX_GLOWS);
  },

  step() {
    FX.rings.forEach(r => { r.life--; r.r += (r.maxR - r.r) * 0.18; });
    FX.rings = FX.rings.filter(r => r.life > 0);
    FX.glows.forEach(g => { g.life--; });
    FX.glows = FX.glows.filter(g => g.life > 0);
    if (FX.shake > 0) {
      FX.shake -= 1.2;
      FX.shakeX = (Math.random()-0.5)*FX.shake;
      FX.shakeY = (Math.random()-0.5)*FX.shake;
    } else { FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0; }
  }
};

// Keep array lengths bounded so a chaotic screen can't sink the frame rate.
function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
  return arr;
}
function capAll() {
  capArray(particles, CFG.caps.particles);
  capArray(bullets, CFG.caps.bullets);
  capArray(enemyBullets, CFG.caps.enemyBullets);
  capArray(enemies, CFG.caps.enemies);
}

// Screen-space rects, tested against pointer positions converted to canvas coords.
const MUTE_RECT_START = { x: W - 48, y: 14, w: 34, h: 34 };
const MUTE_RECT_PLAY  = { x: W - 40, y: H - 42, w: 30, h: 30 };
const CHEV_L   = { x: 62,      y: 148, w: 46, h: 48 };
const CHEV_R   = { x: W - 108, y: 148, w: 46, h: 48 };
const BUY_RECT = { x: W/2 - 78, y: 322, w: 156, h: 30 };
function muteRect() { return state === 'play' ? MUTE_RECT_PLAY : MUTE_RECT_START; }
function pointInRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function canvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) * (W / rect.width), y: (clientY - rect.top) * (H / rect.height) };
}
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  Music.setMuted(Sound.muted);
  Save.data.muted = Sound.muted;
  Save.write();
}

function cycleShip(dir) {
  selIndex = (selIndex + dir + CFG.ships.length) % CFG.ships.length;
  const def = CFG.ships[selIndex];
  // Selecting an owned ship makes it the one you fly.
  if (shipOwned(def.id)) { Save.data.selectedShip = def.id; Save.write(); }
  Sound.play('uiMove');
}

function shipLocked(def) {
  return !!def.requiresVoidbirth && !Save.data.ascendantEarned;
}

function tryBuyShip() {
  const def = CFG.ships[selIndex];
  if (shipOwned(def.id) || Save.data.credits < def.cost) return false;
  if (shipLocked(def)) { Sound.play('uiDeny'); return false; }
  Save.data.credits -= def.cost;
  Save.data.unlocked.push(def.id);
  Save.data.selectedShip = def.id;
  Save.write();
  Sound.play('uiBuy');
  return true;
}

// Launch is only legal on a ship you own.
function tryLaunch() {
  if (!shipOwned(CFG.ships[selIndex].id)) return false;
  startGame();
  return true;
}

// ---- INPUT ----
const keys = {};

// Every action is looked up through the bindings rather than compared against
// a hardcoded key, so a rebind takes effect everywhere at once. Matching is
// case-insensitive on single characters: binding 'a' should not stop working
// the moment caps lock is on.
function bindsFor(action) {
  const st = Save.data.settings || RLCore.defaultSettings();
  return st.binds[action] || RLCore.DEFAULT_BINDS[action] || [];
}

function keyMatches(key, action) {
  const low = key.length === 1 ? key.toLowerCase() : key;
  return bindsFor(action).some(k => (k.length === 1 ? k.toLowerCase() : k) === low);
}

// Held-key test for the movement loop, which asks every frame.
function held(action) {
  return bindsFor(action).some(k => keys[k] ||
    (k.length === 1 ? (keys[k.toLowerCase()] || keys[k.toUpperCase()]) : false));
}

document.addEventListener('keydown', e => {
  Sound.unlock();
  keys[e.key] = true;

  // The rebinder swallows everything while it is listening, or you could
  // never bind a key that already means something.
  if (state === 'settings' && settingsRebind) {
    e.preventDefault();
    settingsCaptureKey(e.key);
    return;
  }

  if (keyMatches(e.key, 'pause')) {
    if (state === 'settings') closeSettings();
    else if (state === 'bestiary') { state = 'start'; Sound.play('uiMove'); }
    else if (state === 'shop') closeShop();
    else if (state === 'play' || state === 'start' || state === 'dead') openSettings(state);
    e.preventDefault();
    return;
  }

  if (state === 'settings') {
    const rows = settingsRows();
    if (e.key === 'ArrowUp')   { settingsSel = (settingsSel - 1 + rows.length) % rows.length; Sound.play('uiMove'); }
    if (e.key === 'ArrowDown') { settingsSel = (settingsSel + 1) % rows.length; Sound.play('uiMove'); }
    if (e.key === 'ArrowLeft')  settingsAdjust(rows[settingsSel], -1);
    if (e.key === 'ArrowRight') settingsAdjust(rows[settingsSel], 1);
    if (e.key === ' ' || e.key === 'Enter') settingsActivate(rows[settingsSel]);
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    return;
  }

  if (state === 'bestiary') {
    const cols = bestiaryColumns();
    const entries = bestiaryEntries();
    if (e.key === 'ArrowLeft')  { bestBand = (bestBand - 1 + cols.length) % cols.length; bestSel = 0; bestScroll = 0; Sound.play('uiMove'); }
    if (e.key === 'ArrowRight') { bestBand = (bestBand + 1) % cols.length; bestSel = 0; bestScroll = 0; Sound.play('uiMove'); }
    if (e.key === 'ArrowUp')    { bestSel = Math.max(0, bestSel - 1); }
    if (e.key === 'ArrowDown')  { bestSel = Math.min(entries.length - 1, bestSel + 1); }
    if (e.key === 'Tab')        { bestTab = 1 - bestTab; bestBand = 0; bestSel = 0; bestScroll = 0; Sound.play('uiMove'); }
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Tab'].includes(e.key)) e.preventDefault();
    return;
  }

  if (state === 'start') {
    if (e.key === 'ArrowLeft')  cycleShip(-1);
    if (e.key === 'ArrowRight') cycleShip(1);
    if (e.key === 'b' || e.key === 'B') tryBuyShip();
    if (e.key === 'c' || e.key === 'C') openBestiary();
    if (e.key === ' ' || e.key === 'Enter') tryLaunch();
  } else if (state === 'dead') {
    if (e.key === ' ' || e.key === 'Enter') state = 'start';
  } else if (state === 'shop') {
    const n = shopSlots.length;
    if (n > 0) {
      if (e.key === 'ArrowLeft')  { shopSel = (shopSel - 1 + n) % n; Sound.play('uiMove'); }
      if (e.key === 'ArrowRight') { shopSel = (shopSel + 1) % n; Sound.play('uiMove'); }
    }
    if (e.key === ' ' || e.key === 'Enter') tryBuySlot(shopSel);
    if (keyMatches(e.key, 'reroll')) tryReroll();
    if (e.key === 'd' || e.key === 'D') closeShop();
    // SKIP and DEPART do the same thing; both exist because at depth you are
    // often saving for a tier this shop cannot show you, and clicking past
    // three cards you do not want is friction rather than a decision.
    if (keyMatches(e.key, 'skip')) {
      // S skips this shop. SHIFT+S says "stop asking" — it flips the
      // auto-skip setting on and skips, so the quick setting is reachable
      // from the place you actually want it rather than only from a menu.
      if (e.shiftKey) {
        Save.data.settings.autoSkip = true;
        Save.write();
        Sound.play('uiBuy');
      } else {
        Sound.play('uiMove');
      }
      closeShop();
    }
  }
  if (keyMatches(e.key, 'mute')) toggleMute();
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// A tap on a control acts on that control; a tap anywhere else launches.
const SETTINGS_RECT = { x: W - 92, y: 14, w: 34, h: 34 };
const BESTIARY_RECT = { x: W - 136, y: 14, w: 34, h: 34 };

function handlePointer(p) {
  // Both full-screen panels close on any tap that is not a control, which is
  // the behaviour a phone player expects from a menu.
  if (state === 'settings') { closeSettings(); return true; }
  if (state === 'bestiary') { state = 'start'; Sound.play('uiMove'); return true; }
  if (pointInRect(p, muteRect())) { toggleMute(); return true; }
  if (state === 'start') {
    if (pointInRect(p, SETTINGS_RECT)) { openSettings('start'); return true; }
    if (pointInRect(p, BESTIARY_RECT)) { openBestiary(); return true; }
  }
  if (state === 'shop') {
    const rects = slotRects(shopSlots.length);
    for (let i = 0; i < shopSlots.length; i++) {
      if (pointInRect(p, rects[i])) { shopSel = i; tryBuySlot(i); return true; }
    }
    if (pointInRect(p, REROLL_RECT)) { tryReroll(); return true; }
    if (pointInRect(p, DEPART_RECT)) { closeShop(); return true; }
    if (pointInRect(p, SKIP_RECT))   { Sound.play('uiMove'); closeShop(); return true; }
    return true;
  }
  // The voidbirth sequence owns the screen; a stray tap must not skip it.
  if (state === 'voidbirth') return true;
  if (state === 'start') {
    if (pointInRect(p, CHEV_L)) { cycleShip(-1); return true; }
    if (pointInRect(p, CHEV_R)) { cycleShip(1); return true; }
    if (!shipOwned(CFG.ships[selIndex].id) && pointInRect(p, BUY_RECT)) { tryBuyShip(); return true; }
    tryLaunch();
    return true;
  }
  if (state === 'dead') { state = 'start'; return true; }
  return false;
}

canvas.addEventListener('touchstart', e => {
  Sound.unlock();
  const t = e.touches[0];
  if (handlePointer(canvasPos(t.clientX, t.clientY))) return;
  touchX = t.clientX;
}, {passive:true});
canvas.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', () => { touchX = null; });

// Mouse equivalent so every control is clickable on desktop too.
canvas.addEventListener('mousedown', e => {
  Sound.unlock();
  handlePointer(canvasPos(e.clientX, e.clientY));
});

function currentShip() {
  return CFG.ships.find(s => s.id === Save.data.selectedShip) || CFG.ships[0];
}

function shipOwned(id) { return Save.data.unlocked.includes(id); }

// Ships differ only in these handling stats — no ship changes any other system.
function applyShip(def) {
  player.speed = def.speed;
  player.w = def.hitW;
  player.h = def.hitH;
  player.canPhase = def.phase;
  player.phaseReady = def.phase;
  lives = def.lives;
  // WARDEN's grace refills each level, like Phantom's phase.
  graceLeft = def.graceHits || 0;
  player.cloak = 0;
  // Bulwark's starting shield charge is added in startGame, after
  // player.shieldCharges is set from stats — applyShip runs first and would
  // otherwise have its bonus wiped out by that assignment.
}

function startGame() {
  const ship = currentShip();
  state = 'play';
  score = 0; level = 1; frame = 0; runKills = 0;
  player.x = W/2; player.y = H - 120; player.invincible = 0; player.shieldCharges = 0; player.shieldRegenTimer = 0; player.trail = [];
  player.phaseCharge = 0; player.phaseDriveTimer = 0;
  applyShip(ship);
  bullets = []; enemyBullets = []; asteroids = []; enemies = []; particles = []; flashText = [];
  drones = []; singularity = null;
  spawnTimer = 0; asteroidTimer = 0; levelTimer = 0; spawnCycle = 0; combo = 0; comboTimer = 0; levelBanner = null;
  player.muzzle = 0;
  shootTimer = 0;
  dyingTimer = 0;
  boss = null; bossActive = false; bossWarning = 0;
  runUpgrades = []; scrap = 0; scrapSpent = 0; scrapOnUpgrades = 0;
  pickups = []; boostRage = 0; boostFreeze = 0;
  // Ascension is per-run, like the upgrades it governs. A new run starts at
  // the bottom of the ladder however deep the last one got.
  voidbirths = 0;
  vbInfo = null; vbCards = []; vbTick = 0;
  runUpgradesVersion++;
  overchargeCount = 0; killsSinceLife = 0; killsSinceShield = 0;
  verdictSpent = false; revivedThisRun = false; scrapDrip = 0;
  recomputeStats();
  // ASCENDANT begins the run already ascended, so the floor tier, the odds,
  // the shop cadence and every upgrade's strength all start one rung up.
  // Set before the first recomputeStats below so its stats resolve at depth.
  if (ship.startVoidbirth) {
    voidbirths = RLCore.clampVoidbirth(ship.startVoidbirth);
    recomputeStats();
  }
  // REVENANT opens every run holding something good.
  if (ship.startTier) {
    const pick = RLCore.rollSlot(1, voidbirths, [], Math.random, []);
    const pool = RLCore.eligible(ship.startTier, [], voidbirths);
    const u = pool.length ? pool[Math.floor(Math.random() * pool.length)] : pick;
    if (u) {
      runUpgrades.push({ id: u.id, stacks: 1 });
      runUpgradesVersion++;
      recomputeStats();
    }
  }
  lives += stats.extraLives;
  player.shieldCharges = stats.shieldCharges;
  // BULWARK comes out of the gate armoured.
  if (ship.startShield) player.shieldCharges = Math.min(RLCore.MAX_SHIELD_CHARGES, player.shieldCharges + ship.startShield);
  // PETTY CASH through THE MINT: some builds open the first shop with money.
  scrap += stats.startScrap;
  FX.reset();
  Music.setBoss(false);
  Music.setIntensity(1);
  Music.start();
}

const LEVEL_CLEAR_SCRAP = 500;

function levelUp() {
  // Spec: kills pay scrap, and clearing a level pays a flat bonus on top.
  // Awarded here because levelUp is the single point every level completion
  // passes through, boss levels included (the boss dying clears bossActive,
  // which lets levelTimer run out and call this).
  // Flat, deliberately: SCRAP MAGNET and SALVAGE RIG are both worded "+% scrap
  // from kills", and a level clear is not a kill.
  // Clearing a level pays a flat bonus that grows with depth, plus whatever
  // SCRAP HOPPER contributes. Flat rather than multiplied, deliberately:
  // SCRAP MAGNET and SALVAGE RIG are both worded "+% scrap from kills", and a
  // level clear is not a kill.
  flushLedger();
  const clearPay = LEVEL_CLEAR_SCRAP + Math.round(LEVEL_CLEAR_SCRAP * Math.pow(level, 0.55) - LEVEL_CLEAR_SCRAP)
                 + (stats ? stats.scrapPerLevel : 0);
  scrap += clearPay;
  const cleared = level;
  levelTimer = 0; level++;
  Music.setIntensity(level);
  const shipNow = currentShip();
  if (player.canPhase) player.phaseReady = true;   // Phantom recharges each level
  graceLeft = shipNow.graceHits || 0;              // Warden's grace refills too
  // TITAN knits a life back every few levels, never past its own maximum.
  if (shipNow.regenEvery && cleared % shipNow.regenEvery === 0 && lives < shipNow.lives) {
    lives++;
    addFlashText('+1 LIFE', W/2, H/2 - 70, '#5fffaa');
  }

  // Ascension takes priority over shopping: clearing a voidbirth level ends
  // the segment, and there is nothing to spend scrap on when it is about to
  // be burned anyway.
  // Ascension takes priority over shopping, and it is not offered -- clearing
  // a boss at level 50 or beyond simply ends the segment. There is nothing to
  // spend scrap on when 95% of it is about to be burned anyway.
  const vb = RLCore.voidbirthAfterClearing(cleared, voidbirths);
  if (vb) { beginVoidbirth(vb); return; }

  // The boss spawn and level banner fire from closeShop, once play resumes,
  // so they are never drawn behind the shop panel.
  if (RLCore.shopOpensAfter(cleared, voidbirths)) openShop();
  else closeShop();
}

// ===== VOIDBIRTH =====
// The run does not continue past a voidbirth level — it ascends. You keep your
// score, credits and ships; you lose every upgrade and all unspent scrap; and
// the entire rarity ladder shifts up one rung, permanently, for the rest of
// the run.

let vbTick = 0, vbInfo = null, vbCards = [];
const VB_CARD_FRAMES = 12;
const VB_BURN_START = 50;
const VB_FLASH_HOLD = 26;

function vbBurnEnd() { return VB_BURN_START + vbCards.length * VB_CARD_FRAMES; }
function vbTotal() { return vbBurnEnd() + VB_FLASH_HOLD + 170; }

function beginVoidbirth(info) {
  vbInfo = info;
  vbTick = 0;
  // Snapshot the build at its CURRENT depth so the sequence burns the cards
  // the player actually earned, not their promoted successors.
  vbCards = runUpgrades.map(o => {
    const u = RLCore.byId(o.id);
    if (!u) return null;
    const r = RLCore.resolve(u, voidbirths);
    return { name: r.name, color: RLCore.tierOf(r.tier).color, stacks: o.stacks, burned: false };
  }).filter(Boolean);
  enemies = []; enemyBullets = []; bullets = []; boss = null; bossActive = false;
  levelBanner = null;
  state = 'voidbirth';
  Music.setBoss(false);
  // The track gets its own ascension cue on top of the sound effect — the
  // sequence runs for about six seconds and silence under it would be flat.
  if (Music.voidbirth) Music.voidbirth();
  Sound.play('voidbirth');
}

// Committed exactly once, on the flash frame. Split out from the animation so
// a dropped frame or a backgrounded tab can never apply it twice or skip it.
function commitVoidbirth() {
  voidbirths = RLCore.clampVoidbirth(vbInfo.to);
  runUpgrades = [];
  runUpgradesVersion++;
  // A sliver of the treasury survives. Ascending used to leave you at zero on
  // level 1 with nothing, which made the reward for beating a boss feel like
  // a punishment for the next ten minutes.
  scrap = RLCore.scrapAfterVoidbirth(scrap);
  // Back to the beginning. The ladder is the same ladder -- the cards you
  // climb it with are a tier better, and that is the whole prestige loop.
  level = 1;
  levelTimer = 0;
  spawnTimer = 0; asteroidTimer = 0; spawnCycle = 0;
  asteroids = []; pickups = []; drones = [];
  verdictSpent = false;
  boostRage = 0; boostFreeze = 0;
  Save.data.voidbirths = voidbirths;
  Save.data.bestVoidbirth = Math.max(Save.data.bestVoidbirth || 0, voidbirths);
  // Only unlock a ship that actually exists in the roster. Handing out an id
  // with no CFG.ships entry would strand the player on an unrenderable hull.
  // ASCENDANT is bought with credits like every other hull, but the hangar
  // will not SELL it until a run has reached the top of the ladder. It used
  // to be purchasable the moment you could afford it, which made its own
  // blurb a lie.
  if (voidbirths >= RLCore.MAX_VOIDBIRTH && !Save.data.ascendantEarned) {
    Save.data.ascendantEarned = true;
    addFlashText('ASCENDANT UNLOCKED IN THE HANGAR', W/2, H/2 + 180, '#ffee88');
  }
  Save.write();
  recomputeStats();
  // A fresh hull for the new segment: shields are gone with the upgrades that
  // granted them, so leaving stale charges behind would be a free ride.
  player.shieldCharges = 0;
  player.invincible = 90;
  FX.addShake(26);
}

function updateVoidbirth() {
  vbTick++;
  const idx = Math.floor((vbTick - VB_BURN_START) / VB_CARD_FRAMES);
  if (idx >= 0 && idx < vbCards.length && !vbCards[idx].burned) {
    vbCards[idx].burned = true;
    spawnParticles(W/2, 250 + (idx % 6) * 22, vbCards[idx].color, 12);
    Sound.play('strip');
  }
  if (vbTick === vbBurnEnd() + 1) commitVoidbirth();
  if (vbTick >= vbTotal()) {
    vbInfo = null; vbCards = [];
    state = 'play';
    levelBanner = { text: 'LEVEL ' + level, life: 120 };
    Music.setIntensity(level);
    Sound.play('levelUp');
  }
}

function drawVoidbirth() {
  drawBg();
  const burnEnd = vbBurnEnd();
  const flashT = vbTick - burnEnd;

  // 1. the build comes apart, card by card
  if (vbTick <= burnEnd + 4) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('THE VOID TAKES WHAT YOU BUILT', W/2, 200);
    vbCards.forEach((c, i) => {
      if (c.burned) return;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = c.color;
      ctx.font = 'bold 12px monospace';
      ctx.fillText(c.name + (c.stacks > 1 ? ' ×' + c.stacks : ''), W/2, 250 + (i % 6) * 22 + Math.floor(i / 6) * 0);
      ctx.globalAlpha = 1;
    });
  }

  // 2. the flash and the title
  if (flashT >= 0 && flashT < VB_FLASH_HOLD) {
    ctx.fillStyle = `rgba(255,255,255,${1 - flashT / VB_FLASH_HOLD})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (flashT >= 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px monospace';
    ctx.fillText('VOIDBIRTH', W/2, H/2 - 40);
    ctx.fillStyle = '#00ffee';
    ctx.font = 'bold 56px monospace';
    ctx.fillText(vbInfo ? vbInfo.numeral : '', W/2, H/2 + 20);

    // 3. the ladder redraws with its new floor and its new summit
    const floor = RLCore.TIERS[RLCore.floorTierIndex(voidbirths)];
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('THE LADDER RISES', W/2, H/2 + 70);
    ctx.fillStyle = floor.color;
    ctx.fillText('FLOOR  ' + floor.name, W/2, H/2 + 94);
    const unlocked = RLCore.tierUnlockedAt(voidbirths);
    if (unlocked) {
      const t = RLCore.tierOf(unlocked);
      const pulse = 0.6 + 0.4 * Math.sin(vbTick * 0.15);
      ctx.fillStyle = pulse > 0.8 ? t.color2 : t.color;
      ctx.font = 'bold 15px monospace';
      ctx.fillText('UNLOCKED  ' + t.name, W/2, H/2 + 120);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('EVERY UPGRADE YOU FIND FROM NOW ON IS ONE TIER STRONGER', W/2, H/2 + 150);
  }
}

function endRun() {
  // 'dying' holds the camera on the wreck for a slow-motion beat before the
  // game-over screen takes over.
  state = 'dying';
  dyingTimer = 75;
  hiScore = Math.max(hiScore, score);
  Save.data.hiScore = hiScore;
  Save.data.bestLevel = Math.max(Save.data.bestLevel, level);
  Save.data.totalRuns += 1;
  Save.data.totalKills += runKills;
  // SCAVENGER banks a bigger share of the run.
  runCredits = Math.floor(RLCore.creditsForScore(score) * (currentShip().creditMul || 1));
  Save.data.bestScrapSpent = Math.max(Save.data.bestScrapSpent, scrapSpent);
  creditsShown = 0;
  Save.data.credits += runCredits;
  Save.write();
  FX.explode(player.x, player.y, 46, '#ff8800');
  FX.explode(player.x - 12, player.y + 8, 26, '#ffdd44');
  FX.addShake(26);
  FX.hitStop(6);
  FX.slowMo(75, 0.3);
  boss = null; bossActive = false; bossWarning = 0;
  Music.stop();
  Music.setBoss(false);
  Sound.play('bigExplode');
  Sound.play('death');
}

// ===== ENTITIES =====

// ===== SHIP HULLS =====
// One entry per ship id. Each draws the body around the origin, nose at -y,
// roughly bounded by that ship's hitW/hitH so the menu preview and the
// in-game sprite agree. Colours arrive from the ship's own `hull` triple and
// `trim`, so a hull reads as itself without hardcoding any palette.
const SHIP_ART = {};

SHIP_ART.vanguard = function (c0, c1, c2, trim) {
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(10, 10); ctx.lineTo(10, 18);
  ctx.lineTo(-10, 18); ctx.lineTo(-10, 10); ctx.lineTo(-14, 14); ctx.closePath();
  const hullG = ctx.createLinearGradient(-14, -18, 14, 18);
  hullG.addColorStop(0, c0); hullG.addColorStop(0.5, c1); hullG.addColorStop(1, c2);
  ctx.fillStyle = hullG; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0, -4, 6, 8, 0, 0, Math.PI*2);
  const cg = ctx.createRadialGradient(0, -6, 1, 0, -4, 8);
  cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.4, c0); cg.addColorStop(1, c2);
  ctx.fillStyle = cg; ctx.fill();

  ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(-22, 18); ctx.lineTo(-10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 6); ctx.lineTo(22, 18); ctx.lineTo(10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();

  ctx.fillStyle = c0;
  ctx.fillRect(-13, -4, 4, 14); ctx.fillRect(9, -4, 4, 14);
};

// ===== SHIP HULLS =====
// One silhouette per ship. Nose points at -y. Drawn around the origin with the
// canvas already translated to the ship's centre. No engine flames, shields,
// phase rings or cloak shimmer — drawShip owns all of that.

// --- NEEDLE ---------------------------------------------------------------
// A dart. Almost no frontal area: a 5px-wide spine twenty-two pixels long,
// with fins swept so far back they trail past the tail.
SHIP_ART.needle = function (c0, c1, c2, trim) {
  // Rear fins first so the spine sits on top of them.
  ctx.beginPath();
  ctx.moveTo(-2.5, -2); ctx.lineTo(-11, 15); ctx.lineTo(-9.5, 18); ctx.lineTo(-2, 9);
  ctx.closePath();
  ctx.fillStyle = c2; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 0.9; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2.5, -2); ctx.lineTo(11, 15); ctx.lineTo(9.5, 18); ctx.lineTo(2, 9);
  ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.stroke();

  // Forward canards — tiny, just enough to read as "aimed".
  ctx.beginPath();
  ctx.moveTo(-2, -12); ctx.lineTo(-6.5, -2); ctx.lineTo(-2, -4); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2, -12); ctx.lineTo(6.5, -2); ctx.lineTo(2, -4); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();

  // The spine.
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(2.4, -9); ctx.lineTo(3.2, 9); ctx.lineTo(2.4, 17);
  ctx.lineTo(-2.4, 17); ctx.lineTo(-3.2, 9); ctx.lineTo(-2.4, -9);
  ctx.closePath();
  var ng = ctx.createLinearGradient(-3.2, -20, 3.2, 17);
  ng.addColorStop(0, c0); ng.addColorStop(0.45, c1); ng.addColorStop(1, c2);
  ctx.fillStyle = ng; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.1; ctx.stroke();

  // Cockpit is a slit, not a bubble.
  ctx.beginPath(); ctx.ellipse(0, -8, 1.4, 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();

  // Lit leading edge.
  ctx.beginPath(); ctx.moveTo(0, -19); ctx.lineTo(0, 12);
  ctx.strokeStyle = c0; ctx.lineWidth = 0.8; ctx.stroke();
};

// --- BULWARK --------------------------------------------------------------
// A slab with a blunt nose and bolted-on side armour. Widest thing in the
// early roster and it should look like it.
function bulwarkBolt(x, y, c0, c2) {
  ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2);
  ctx.fillStyle = c2; ctx.fill();
  ctx.beginPath(); ctx.arc(x - 0.4, y - 0.4, 0.7, 0, Math.PI * 2);
  ctx.fillStyle = c0; ctx.fill();
}
SHIP_ART.bulwark = function (c0, c1, c2, trim) {
  // Main slab. Flat nose, straight flanks.
  ctx.beginPath();
  ctx.moveTo(-9, -20); ctx.lineTo(9, -20);

  ctx.lineTo(-10, 20); ctx.lineTo(-13, 12); ctx.lineTo(-13, -12);

  ctx.fillStyle = bg; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.6; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(-13, -10); ctx.lineTo(-18, -6); ctx.lineTo(-18, 12); ctx.lineTo(-13, 15);
  ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.strokeStyle = trim; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(13, -10); ctx.lineTo(18, -6); ctx.lineTo(18, 12); ctx.lineTo(13, 15);
  ctx.closePath();

  ctx.beginPath();

  ctx.closePath();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-6, -9, 12, 3.5);
  ctx.fillStyle = c2;

  bulwarkBolt(-15.5, -3, c0, c2); bulwarkBolt(-15.5, 4, c0, c2); bulwarkBolt(-15.5, 11, c0, c2);
  bulwarkBolt(15.5, -3, c0, c2); bulwarkBolt(15.5, 4, c0, c2); bulwarkBolt(15.5, 11, c0, c2);

// --- PHANTOM --------------------------------------------------------------
// A small delta with the middle cut clean out. The hole is the whole point:
// you should see stars through this ship.
SHIP_ART.phantom = function (c0, c1, c2, trim) {
  ctx.beginPath();
  // Outer delta.
  ctx.moveTo(0, -16); ctx.lineTo(11, 12); ctx.lineTo(8, 14); ctx.lineTo(0, 8);
  ctx.lineTo(-8, 14); ctx.lineTo(-11, 12);
  ctx.closePath();
  // Inner hole, wound the same way — even-odd punches it out.
  ctx.moveTo(0, -6); ctx.lineTo(6, 8); ctx.lineTo(0, 4); ctx.lineTo(-6, 8);
  ctx.closePath();
  var pg = ctx.createLinearGradient(0, -16, 0, 14);
  pg.addColorStop(0, c0); pg.addColorStop(0.55, c1); pg.addColorStop(1, c2);
  ctx.fillStyle = pg; ctx.fill('evenodd');

  // Outline both rims so the hollow reads at 40px.
  ctx.beginPath();
  ctx.moveTo(0, -16); ctx.lineTo(11, 12); ctx.lineTo(8, 14); ctx.lineTo(0, 8);
  ctx.lineTo(-8, 14); ctx.lineTo(-11, 12); ctx.closePath();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.4; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(6, 8); ctx.lineTo(0, 4); ctx.lineTo(-6, 8); ctx.closePath();
  ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();

  // Wingtip winglets, turned up.
  ctx.beginPath(); ctx.moveTo(-11, 12); ctx.lineTo(-12, 5); ctx.lineTo(-9, 10); ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(11, 12); ctx.lineTo(12, 5); ctx.lineTo(9, 10); ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.stroke();

  // Nose sensor.
  ctx.beginPath(); ctx.ellipse(0, -11, 1.6, 2.6, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-3, -8); ctx.lineTo(3, -8);
  ctx.strokeStyle = c0; ctx.lineWidth = 0.8; ctx.stroke();
};

// --- WARDEN ---------------------------------------------------------------
// Rounded hull holding a riot shield out in front of it. The shield is wider
// than the ship and overlaps the nose — that overhang is the read.
SHIP_ART.warden = function (c0, c1, c2, trim) {
  // Rounded body.
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.bezierCurveTo(7, -12, 10, -2, 10, 8);
  ctx.lineTo(9, 18); ctx.lineTo(-9, 18);
  ctx.lineTo(-10, 8);
  ctx.bezierCurveTo(-10, -2, -7, -12, 0, -14);
  ctx.closePath();

  wg.addColorStop(0, c0); wg.addColorStop(0.5, c1); wg.addColorStop(1, c2);

  ctx.fillStyle = c1; ctx.fill();

  ctx.moveTo(-8, -12); ctx.lineTo(-8, -9);
  ctx.moveTo(0, -15); ctx.lineTo(0, -10);
  ctx.moveTo(8, -12); ctx.lineTo(8, -9);
  ctx.strokeStyle = c2; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -13, 3, 0, Math.PI * 2);
  ctx.fillStyle = c0; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 0.9; ctx.stroke();

  ctx.beginPath(); ctx.ellipse(0, -2, 4, 5.5, 0, 0, Math.PI * 2);

// --- SCAVENGER ------------------------------------------------------------

  ctx.moveTo(11, -9); ctx.lineTo(17, -7); ctx.lineTo(17, 3); ctx.lineTo(11, 2);

  ctx.closePath();
  ctx.fillStyle = c0; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-13, -4, 3.7, Math.PI * 0.62, Math.PI * 1.72);
  ctx.strokeStyle = c2; ctx.lineWidth = 1; ctx.stroke();

// --- REVENANT -------------------------------------------------------------
// More frame than skin: a bare spine, four pairs of exposed ribs, and wings
// swept FORWARD so it leans into the fight.
SHIP_ART.revenant = function (c0, c1, c2, trim) {
  // Forward-swept wings — tips are ahead of the roots.
  ctx.beginPath();
  ctx.moveTo(-2, 10); ctx.lineTo(-12, -6); ctx.lineTo(-13, -1); ctx.lineTo(-3, 14);
  ctx.closePath();
  ctx.fillStyle = c2; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.1; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(2, 10); ctx.lineTo(12, -6); ctx.lineTo(13, -1); ctx.lineTo(3, 14);
  ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.stroke();

  // Exposed ribcage — struts, no plating between them.
  ctx.strokeStyle = c1; ctx.lineWidth = 1.6;
  for (var i = 0; i < 4; i++) {
    var ry = -3 + i * 4.6, rx = 9 - i * 1.2;
    ctx.beginPath();
    ctx.moveTo(-2, ry - 2); ctx.quadraticCurveTo(-rx, ry, -rx * 0.6, ry + 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(2, ry - 2); ctx.quadraticCurveTo(rx, ry, rx * 0.6, ry + 4);
    ctx.stroke();
  }

  // The spine itself.
  ctx.beginPath();
  ctx.moveTo(0, -17); ctx.lineTo(3, -8); ctx.lineTo(3, 12); ctx.lineTo(2, 17);
  ctx.lineTo(-2, 17); ctx.lineTo(-3, 12); ctx.lineTo(-3, -8);
  ctx.closePath();
  var rg = ctx.createLinearGradient(0, -17, 0, 17);
  rg.addColorStop(0, c0); rg.addColorStop(0.5, c1); rg.addColorStop(1, c2);
  ctx.fillStyle = rg; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.2; ctx.stroke();

  // Vertebrae.
  ctx.fillStyle = c0;
  ctx.fillRect(-1.2, -5, 2.4, 2); ctx.fillRect(-1.2, 0, 2.4, 2); ctx.fillRect(-1.2, 5, 2.4, 2);

  // Skull-plate nose.
  ctx.beginPath();
  ctx.moveTo(0, -19); ctx.lineTo(4, -11); ctx.lineTo(0, -9); ctx.lineTo(-4, -11);
  ctx.closePath();
  ctx.fillStyle = c0; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -12, 1.3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
};

// --- TITAN ----------------------------------------------------------------
// A carrier. Layered deck plating and four separate engine housings across a
// squared-off stern — the biggest, heaviest outline in the hangar.
SHIP_ART.titan = function (c0, c1, c2, trim) {
  // Lower hull, widest layer.
  ctx.beginPath();
  ctx.moveTo(-8, -18); ctx.lineTo(8, -18);
  ctx.lineTo(16, 0); ctx.lineTo(18, 16); ctx.lineTo(-18, 16); ctx.lineTo(-16, 0);

  ctx.fillStyle = tg; ctx.fill(); ctx.stroke();

  ctx.closePath();
  ctx.fillStyle = c0; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();

  for (var i = 0; i < 4; i++) {

    ctx.fillRect(ex[i], 13, 5, 8);
    ctx.strokeStyle = trim; ctx.lineWidth = 0.9;
    ctx.strokeRect(ex[i], 13, 5, 8);
    ctx.fillStyle = c2;
    ctx.fillRect(ex[i] + 1, 18, 3, 3);
  }

  // Shoulder pylons.
  ctx.beginPath(); ctx.moveTo(-12, -2); ctx.lineTo(-19, 2); ctx.lineTo(-16, 8); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(19, 2); ctx.lineTo(16, 8); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();

  // Bridge.
  ctx.beginPath(); ctx.ellipse(0, -12, 3.2, 5, 0, 0, Math.PI * 2);

// --- ORACLE ---------------------------------------------------------------
// An instrument more than a fighter: a hollow sensor ring mounted ahead of a
// slim fuselage, with a pair of antennae raked up and out.
SHIP_ART.oracle = function (c0, c1, c2, trim) {
  // Antennae, drawn first so the ring overlaps their roots.
  ctx.beginPath();
  ctx.moveTo(-5, 4); ctx.lineTo(-13, -14);
  ctx.moveTo(5, 4); ctx.lineTo(13, -14);
  ctx.strokeStyle = trim; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(-13, -14, 1.8, 0, Math.PI * 2);
  ctx.fillStyle = c0; ctx.fill();
  ctx.beginPath(); ctx.arc(13, -14, 1.8, 0, Math.PI * 2);
  ctx.fillStyle = c0; ctx.fill();

  // Slim fuselage.
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(6, 2); ctx.lineTo(6, 14); ctx.lineTo(4, 18);
  ctx.lineTo(-4, 18); ctx.lineTo(-6, 14); ctx.lineTo(-6, 2);
  ctx.closePath();
  var og = ctx.createLinearGradient(0, -6, 0, 18);
  og.addColorStop(0, c0); og.addColorStop(0.5, c1); og.addColorStop(1, c2);
  ctx.fillStyle = og; ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.2; ctx.stroke();

  // Low swept fins.
  ctx.beginPath(); ctx.moveTo(-6, 6); ctx.lineTo(-12, 17); ctx.lineTo(-6, 15); ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 6); ctx.lineTo(12, 17); ctx.lineTo(6, 15); ctx.closePath();
  ctx.fillStyle = c2; ctx.fill(); ctx.stroke();

  // Mount struts up to the ring.
  ctx.beginPath();
  ctx.moveTo(-3, -5); ctx.lineTo(-6, -10);
  ctx.moveTo(3, -5); ctx.lineTo(6, -10);
  ctx.strokeStyle = c2; ctx.lineWidth = 1.8; ctx.stroke();

  // The ring: an annulus punched out with even-odd, so it reads hollow.
  ctx.beginPath();
  ctx.arc(0, -12, 8.5, 0, Math.PI * 2);
  ctx.arc(0, -12, 5.1, 0, Math.PI * 2);
  ctx.fillStyle = c1; ctx.fill('evenodd');
  ctx.beginPath(); ctx.arc(0, -12, 8.5, 0, Math.PI * 2);
  ctx.strokeStyle = trim; ctx.lineWidth = 1.3; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -12, 5.1, 0, Math.PI * 2);
  ctx.strokeStyle = c0; ctx.lineWidth = 0.9; ctx.stroke();

  // The lens, slung under the ring, blinking slowly.
  ctx.beginPath(); ctx.arc(0, -12, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff'; ctx.fill();
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.25 * Math.sin(frame * 0.05);
  ctx.beginPath(); ctx.arc(0, -12, 3.8, 0, Math.PI * 2);
  ctx.strokeStyle = c0; ctx.lineWidth = 0.8; ctx.stroke();
  ctx.restore();
};

// --- WRAITH ---------------------------------------------------------------
