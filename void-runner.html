// Impact feedback. Kept separate from game state so nothing here can change
// the outcome of a run — it only changes how the run feels.
const FX = {
  hitStopFrames: 0,
  shake: 0, shakeX: 0, shakeY: 0,
  slowMoFrames: 0, slowMoFactor: 1, slowAcc: 0,
  rings: [], glows: [],
  MAX_RINGS: 24, MAX_GLOWS: 24,

  reset() {
    FX.hitStopFrames = 0; FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0;
    FX.slowMoFrames = 0; FX.slowMoFactor = 1; FX.slowAcc = 0;
    FX.rings = []; FX.glows = [];
  },

  // Freezing the simulation for a few frames while the explosion stays on
  // screen is the cheapest way to make a kill feel like it landed.
  hitStop(f) { FX.hitStopFrames = Math.max(FX.hitStopFrames, f); },
  addShake(a) { FX.shake = Math.max(FX.shake, a); },
  slowMo(frames, factor) { FX.slowMoFrames = frames; FX.slowMoFactor = factor; FX.slowAcc = 0; },

  explode(x, y, size, color) {
    FX.rings.push({ x, y, r: size*0.25, maxR: size*2.1, life: 24, maxLife: 24, color });
    FX.glows.push({ x, y, r: size*1.5, life: 9, maxLife: 9, color });
    const chunks = Math.max(4, Math.round(size*0.5));
    for (let i = 0; i < chunks; i++) {
      const a = Math.random()*Math.PI*2;
      const sp = 1 + Math.random()*size*0.14;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 26 + Math.random()*28, maxLife: 54,
        r: 1.5 + Math.random()*size*0.10,
        color, type: 'chunk',
        rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.35
      });
    }
    spawnParticles(x, y, color, Math.max(4, Math.round(size*0.45)));
    if (FX.rings.length > FX.MAX_RINGS) FX.rings.splice(0, FX.rings.length - FX.MAX_RINGS);
    if (FX.glows.length > FX.MAX_GLOWS) FX.glows.splice(0, FX.glows.length - FX.MAX_GLOWS);
  },

  step() {
    FX.rings.forEach(r => { r.life--; r.r += (r.maxR - r.r) * 0.18; });
    FX.rings = FX.rings.filter(r => r.life > 0);
    FX.glows.forEach(g => { g.life--; });
    FX.glows = FX.glows.filter(g => g.life > 0);
    if (FX.shake > 0) {
      FX.shake -= 1.2;
      FX.shakeX = (Math.random()-0.5)*FX.shake;
      FX.shakeY = (Math.random()-0.5)*FX.shake;
    } else { FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0; }
  }
};

// Keep array lengths bounded so a chaotic screen can't sink the frame rate.
function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
  return arr;
}
function capAll() {
  capArray(particles, CFG.caps.particles);
  capArray(bullets, CFG.caps.bullets);
  capArray(enemyBullets, CFG.caps.enemyBullets);
  capArray(enemies, CFG.caps.enemies);
}

// ---- UI HIT TESTING ----
// Screen-space rects, tested against pointer positions converted to canvas coords.
const MUTE_RECT_START = { x: W - 48, y: 14, w: 34, h: 34 };
const MUTE_RECT_PLAY  = { x: W - 40, y: H - 42, w: 30, h: 30 };
const CHEV_L   = { x: 62,      y: 148, w: 46, h: 48 };
const CHEV_R   = { x: W - 108, y: 148, w: 46, h: 48 };
const BUY_RECT = { x: W/2 - 78, y: 322, w: 156, h: 30 };
function muteRect() { return state === 'play' ? MUTE_RECT_PLAY : MUTE_RECT_START; }
function pointInRect(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function canvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: (clientX - rect.left) * (W / rect.width), y: (clientY - rect.top) * (H / rect.height) };
}
function toggleMute() {
  Sound.setMuted(!Sound.muted);
  Music.setMuted(Sound.muted);
  Save.data.muted = Sound.muted;
  Save.write();
}

function cycleShip(dir) {
  selIndex = (selIndex + dir + CFG.ships.length) % CFG.ships.length;
  const def = CFG.ships[selIndex];
  // Selecting an owned ship makes it the one you fly.
  if (shipOwned(def.id)) { Save.data.selectedShip = def.id; Save.write(); }
  Sound.play('uiMove');
}

function tryBuyShip() {
  const def = CFG.ships[selIndex];
  if (shipOwned(def.id) || Save.data.credits < def.cost) return false;
  Save.data.credits -= def.cost;
  Save.data.unlocked.push(def.id);
  Save.data.selectedShip = def.id;
  Save.write();
  Sound.play('uiBuy');
  return true;
}

// Launch is only legal on a ship you own.
function tryLaunch() {
  if (!shipOwned(CFG.ships[selIndex].id)) return false;
  startGame();
  return true;
}

// ---- INPUT ----
const keys = {};
document.addEventListener('keydown', e => {
  Sound.unlock();
  keys[e.key] = true;
  if (state === 'start') {
    if (e.key === 'ArrowLeft')  cycleShip(-1);
    if (e.key === 'ArrowRight') cycleShip(1);
    if (e.key === 'b' || e.key === 'B') tryBuyShip();
    if (e.key === ' ' || e.key === 'Enter') tryLaunch();
  } else if (state === 'dead') {
    if (e.key === ' ' || e.key === 'Enter') state = 'start';
  } else if (state === 'shop') {
    const n = shopSlots.length;
    if (n > 0) {
      if (e.key === 'ArrowLeft')  { shopSel = (shopSel - 1 + n) % n; Sound.play('uiMove'); }
      if (e.key === 'ArrowRight') { shopSel = (shopSel + 1) % n; Sound.play('uiMove'); }
    }
    if (e.key === ' ' || e.key === 'Enter') tryBuySlot(shopSel);
    if (e.key === 'r' || e.key === 'R') tryReroll();
    if (e.key === 'd' || e.key === 'D' || e.key === 'Escape') closeShop();
    // SKIP and DEPART do the same thing; both exist because at depth you are
    // often saving for a tier this shop cannot show you, and clicking past
    // three cards you do not want is friction rather than a decision.
    if (e.key === 's' || e.key === 'S') { Sound.play('uiMove'); closeShop(); }
  }
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// A tap on a control acts on that control; a tap anywhere else launches.
function handlePointer(p) {
  if (pointInRect(p, muteRect())) { toggleMute(); return true; }
  if (state === 'shop') {
    const rects = slotRects(shopSlots.length);
    for (let i = 0; i < shopSlots.length; i++) {
      if (pointInRect(p, rects[i])) { shopSel = i; tryBuySlot(i); return true; }
    }
    if (pointInRect(p, REROLL_RECT)) { tryReroll(); return true; }
    if (pointInRect(p, DEPART_RECT)) { closeShop(); return true; }
    if (pointInRect(p, SKIP_RECT))   { Sound.play('uiMove'); closeShop(); return true; }
    return true;
  }
  // The voidbirth sequence owns the screen; a stray tap must not skip it.
  if (state === 'voidbirth') return true;
  if (state === 'start') {
    if (pointInRect(p, CHEV_L)) { cycleShip(-1); return true; }
    if (pointInRect(p, CHEV_R)) { cycleShip(1); return true; }
    if (!shipOwned(CFG.ships[selIndex].id) && pointInRect(p, BUY_RECT)) { tryBuyShip(); return true; }
    tryLaunch();
    return true;
  }
  if (state === 'dead') { state = 'start'; return true; }
  return false;
}

canvas.addEventListener('touchstart', e => {
  Sound.unlock();
  const t = e.touches[0];
  if (handlePointer(canvasPos(t.clientX, t.clientY))) return;
  touchX = t.clientX;
}, {passive:true});
canvas.addEventListener('touchmove', e => { touchX = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', () => { touchX = null; });

// Mouse equivalent so every control is clickable on desktop too.
canvas.addEventListener('mousedown', e => {
  Sound.unlock();
  handlePointer(canvasPos(e.clientX, e.clientY));
});

function currentShip() {
  return CFG.ships.find(s => s.id === Save.data.selectedShip) || CFG.ships[0];
}

function shipOwned(id) { return Save.data.unlocked.includes(id); }

// Ships differ only in these handling stats — no ship changes any other system.
function applyShip(def) {
  player.speed = def.speed;
  player.w = def.hitW;
  player.h = def.hitH;
  player.canPhase = def.phase;
  player.phaseReady = def.phase;
  lives = def.lives;
  // Bulwark's starting shield charge is added in startGame, after
  // player.shieldCharges is set from stats — applyShip runs first and would
  // otherwise have its bonus wiped out by that assignment.
}

function startGame() {
  const ship = currentShip();
  state = 'play';
  score = 0; level = 1; frame = 0; runKills = 0;
  player.x = W/2; player.y = H - 120; player.invincible = 0; player.shieldCharges = 0; player.shieldRegenTimer = 0; player.trail = [];
  player.phaseCharge = 0; player.phaseDriveTimer = 0;
  applyShip(ship);
  bullets = []; enemyBullets = []; asteroids = []; enemies = []; particles = []; flashText = [];
  drones = []; singularity = null;
  spawnTimer = 0; asteroidTimer = 0; levelTimer = 0; spawnCycle = 0; combo = 0; comboTimer = 0; levelBanner = null;
  player.muzzle = 0;
  shootTimer = 0;
  dyingTimer = 0;
  boss = null; bossActive = false; bossWarning = 0;
  runUpgrades = []; scrap = 0; scrapSpent = 0; scrapOnUpgrades = 0;
  // Ascension is per-run, like the upgrades it governs. A new run starts at
  // the bottom of the ladder however deep the last one got.
  voidbirths = 0;
  vbInfo = null; vbCards = []; vbTick = 0;
  runUpgradesVersion++;
  overchargeCount = 0; killsSinceLife = 0;
  recomputeStats();
  lives += stats.extraLives;
  player.shieldCharges = stats.shieldCharges;
  // Bulwark starts each run with one shield charge already up. Added here,
  // after the stats-based assignment above, so it isn't wiped out by it.
  if (ship.id === 'bulwark') player.shieldCharges += 1;
  FX.reset();
  Music.setBoss(false);
  Music.setIntensity(1);
  Music.start();
}

const LEVEL_CLEAR_SCRAP = 500;

function levelUp() {
  // Spec: kills pay scrap, and clearing a level pays a flat bonus on top.
  // Awarded here because levelUp is the single point every level completion
  // passes through, boss levels included (the boss dying clears bossActive,
  // which lets levelTimer run out and call this).
  // Flat, deliberately: SCRAP MAGNET and SALVAGE RIG are both worded "+% scrap
  // from kills", and a level clear is not a kill.
  // Clearing a level pays a flat bonus that grows with depth, plus whatever
  // SCRAP HOPPER contributes. Flat rather than multiplied, deliberately:
  // SCRAP MAGNET and SALVAGE RIG are both worded "+% scrap from kills", and a
  // level clear is not a kill.
  const clearPay = LEVEL_CLEAR_SCRAP + Math.round(LEVEL_CLEAR_SCRAP * Math.pow(level, 0.55) - LEVEL_CLEAR_SCRAP)
                 + (stats ? stats.scrapPerLevel : 0);
  scrap += clearPay;
  const cleared = level;
  levelTimer = 0; level++;
  Music.setIntensity(level);
  if (player.canPhase) player.phaseReady = true;   // Phantom recharges each level

  // Ascension takes priority over shopping: clearing a voidbirth level ends
  // the segment, and there is nothing to spend scrap on when it is about to
  // be burned anyway.
  const vb = RLCore.voidbirthAfterClearing(cleared, voidbirths);
  if (vb) { beginVoidbirth(vb); return; }

  // The boss spawn and level banner fire from closeShop, once play resumes,
  // so they are never drawn behind the shop panel.
  if (RLCore.shopOpensAfter(cleared, voidbirths)) openShop();
  else closeShop();
}

// ===== VOIDBIRTH =====
// The run does not continue past a voidbirth level — it ascends. You keep your
// score, credits and ships; you lose every upgrade and all unspent scrap; and
// the entire rarity ladder shifts up one rung, permanently, for the rest of
// the run.

let vbTick = 0, vbInfo = null, vbCards = [];
const VB_CARD_FRAMES = 12;
const VB_BURN_START = 50;
const VB_FLASH_HOLD = 26;

function vbBurnEnd() { return VB_BURN_START + vbCards.length * VB_CARD_FRAMES; }
function vbTotal() { return vbBurnEnd() + VB_FLASH_HOLD + 170; }

function beginVoidbirth(info) {
  vbInfo = info;
  vbTick = 0;
  // Snapshot the build at its CURRENT depth so the sequence burns the cards
  // the player actually earned, not their promoted successors.
  vbCards = runUpgrades.map(o => {
    const u = RLCore.byId(o.id);
    if (!u) return null;
    const r = RLCore.resolve(u, voidbirths);
    return { name: r.name, color: RLCore.tierOf(r.tier).color, stacks: o.stacks, burned: false };
  }).filter(Boolean);
  enemies = []; enemyBullets = []; bullets = []; boss = null; bossActive = false;
  levelBanner = null;
  state = 'voidbirth';
  Music.setBoss(false);
  Sound.play('voidbirth');
}

// Committed exactly once, on the flash frame. Split out from the animation so
// a dropped frame or a backgrounded tab can never apply it twice or skip it.
function commitVoidbirth() {
  voidbirths = RLCore.clampVoidbirth(vbInfo.to);
  runUpgrades = [];
  runUpgradesVersion++;
  scrap = 0;
  Save.data.voidbirths = voidbirths;
  Save.data.bestVoidbirth = Math.max(Save.data.bestVoidbirth || 0, voidbirths);
  // Only unlock a ship that actually exists in the roster. Handing out an id
  // with no CFG.ships entry would strand the player on an unrenderable hull.
  if (voidbirths >= 3 && CFG.ships.some(s => s.id === 'ascendant') &&
      Save.data.unlocked.indexOf('ascendant') === -1) {
    Save.data.unlocked.push('ascendant');
  }
  Save.write();
  recomputeStats();
  // A fresh hull for the new segment: shields are gone with the upgrades that
  // granted them, so leaving stale charges behind would be a free ride.
  player.shieldCharges = 0;
  player.invincible = 90;
  FX.addShake(26);
}

function updateVoidbirth() {
  vbTick++;
  const idx = Math.floor((vbTick - VB_BURN_START) / VB_CARD_FRAMES);
  if (idx >= 0 && idx < vbCards.length && !vbCards[idx].burned) {
    vbCards[idx].burned = true;
    spawnParticles(W/2, 250 + (idx % 6) * 22, vbCards[idx].color, 12);
    Sound.play('strip');
  }
  if (vbTick === vbBurnEnd() + 1) commitVoidbirth();
  if (vbTick >= vbTotal()) {
    vbInfo = null; vbCards = [];
    state = 'play';
    levelBanner = { text: 'LEVEL ' + level, life: 120 };
    Music.setIntensity(level);
    Sound.play('levelUp');
  }
}

function drawVoidbirth() {
  drawBg();
  const burnEnd = vbBurnEnd();
  const flashT = vbTick - burnEnd;

  // 1. the build comes apart, card by card
  if (vbTick <= burnEnd + 4) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('THE VOID TAKES WHAT YOU BUILT', W/2, 200);
    vbCards.forEach((c, i) => {
      if (c.burned) return;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = c.color;
      ctx.font = 'bold 12px monospace';
      ctx.fillText(c.name + (c.stacks > 1 ? ' ×' + c.stacks : ''), W/2, 250 + (i % 6) * 22 + Math.floor(i / 6) * 0);
      ctx.globalAlpha = 1;
    });
  }

  // 2. the flash and the title
  if (flashT >= 0 && flashT < VB_FLASH_HOLD) {
    ctx.fillStyle = `rgba(255,255,255,${1 - flashT / VB_FLASH_HOLD})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (flashT >= 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 40px monospace';
    ctx.fillText('VOIDBIRTH', W/2, H/2 - 40);
    ctx.fillStyle = '#00ffee';
    ctx.font = 'bold 56px monospace';
    ctx.fillText(vbInfo ? vbInfo.numeral : '', W/2, H/2 + 20);

    // 3. the ladder redraws with its new floor and its new summit
    const floor = RLCore.TIERS[RLCore.floorTierIndex(voidbirths)];
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.fillText('THE LADDER RISES', W/2, H/2 + 70);
    ctx.fillStyle = floor.color;
    ctx.fillText('FLOOR  ' + floor.name, W/2, H/2 + 94);
    const unlocked = RLCore.tierUnlockedAt(voidbirths);
    if (unlocked) {
      const t = RLCore.tierOf(unlocked);
      const pulse = 0.6 + 0.4 * Math.sin(vbTick * 0.15);
      ctx.fillStyle = pulse > 0.8 ? t.color2 : t.color;
      ctx.font = 'bold 15px monospace';
      ctx.fillText('UNLOCKED  ' + t.name, W/2, H/2 + 120);
    }
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = 'bold 11px monospace';
    ctx.fillText('EVERY UPGRADE YOU FIND FROM NOW ON IS ONE TIER STRONGER', W/2, H/2 + 150);
  }
}

function endRun() {
  // 'dying' holds the camera on the wreck for a slow-motion beat before the
  // game-over screen takes over.
  state = 'dying';
  dyingTimer = 75;
  hiScore = Math.max(hiScore, score);
  Save.data.hiScore = hiScore;
  Save.data.bestLevel = Math.max(Save.data.bestLevel, level);
  Save.data.totalRuns += 1;
  Save.data.totalKills += runKills;
  runCredits = RLCore.creditsForScore(score);
  Save.data.bestScrapSpent = Math.max(Save.data.bestScrapSpent, scrapSpent);
  creditsShown = 0;
  Save.data.credits += runCredits;
  Save.write();
  FX.explode(player.x, player.y, 46, '#ff8800');
  FX.explode(player.x - 12, player.y + 8, 26, '#ffdd44');
  FX.addShake(26);
  FX.hitStop(6);
  FX.slowMo(75, 0.3);
  boss = null; bossActive = false; bossWarning = 0;
  Music.stop();
  Music.setBoss(false);
  Sound.play('bigExplode');
  Sound.play('death');
}

// ===== ENTITIES =====

function drawShip(x, y, invincible, shield, t, muzzle, shipDef) {
  const def = shipDef || currentShip();
  const [c0, c1, c2] = def.hull;
  const trim = def.trim;
  ctx.save();
  ctx.translate(x, y);
  if (invincible && Math.floor(t/4)%2 === 0) { ctx.restore(); return; }

  // Engine flames
  const flameLen = 16, flameW = 7;
  ctx.save();
  let gL = ctx.createLinearGradient(0,0,0,flameLen);
  gL.addColorStop(0,'rgba(0,200,255,0.9)'); gL.addColorStop(0.4,'rgba(255,140,0,0.7)'); gL.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gL;
  ctx.beginPath(); ctx.ellipse(-9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  let gR = ctx.createLinearGradient(0,0,0,flameLen);
  gR.addColorStop(0,'rgba(0,200,255,0.9)'); gR.addColorStop(0.4,'rgba(255,140,0,0.7)'); gR.addColorStop(1,'rgba(255,60,0,0)');
  ctx.fillStyle = gR;
  ctx.beginPath(); ctx.ellipse(9, 18+flameLen/2, flameW/2, flameLen/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Hull
  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(10, 10); ctx.lineTo(10, 18);
  ctx.lineTo(-10, 18); ctx.lineTo(-10, 10); ctx.lineTo(-14, 14); ctx.closePath();
  let hullG = ctx.createLinearGradient(-14, -18, 14, 18);
  hullG.addColorStop(0, c0); hullG.addColorStop(0.5, c1); hullG.addColorStop(1, c2);
  ctx.fillStyle = hullG;
  ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 1.5; ctx.stroke();

  // Cockpit
  ctx.beginPath(); ctx.ellipse(0, -4, 6, 8, 0, 0, Math.PI*2);
  let cg = ctx.createRadialGradient(0,-6,1,0,-4,8);
  cg.addColorStop(0,'#ffffff'); cg.addColorStop(0.4, c0); cg.addColorStop(1, c2);
  ctx.fillStyle = cg; ctx.fill();

  // Wings
  ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(-22, 18); ctx.lineTo(-10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.strokeStyle = trim; ctx.lineWidth=1; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 6); ctx.lineTo(22, 18); ctx.lineTo(10, 14); ctx.closePath();
  ctx.fillStyle = c1; ctx.fill(); ctx.stroke();

  // Cannons
  ctx.fillStyle = c0;
  ctx.fillRect(-13, -4, 4, 14); ctx.fillRect(9, -4, 4, 14);

  // Phase charge indicator
  if (def.phase && player.phaseReady && !shipDef) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.25*Math.sin(t*0.12);
    ctx.strokeStyle = '#cc88ff'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  // Muzzle flash
  if (muzzle > 0) {
    const a = muzzle / 3;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    [-11, 11].forEach(mx => {
      const mg = ctx.createRadialGradient(mx, -6, 0, mx, -6, 9);
      mg.addColorStop(0, `rgba(255,255,255,${0.9*a})`);
      mg.addColorStop(0.4, `rgba(120,230,255,${0.6*a})`);
      mg.addColorStop(1, 'rgba(0,150,255,0)');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(mx, -6, 9, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  }

  // Shield charges — `shield` is now a charge count, not a frame timer.
  // One ring per charge, capped at 3 so it can't visually run away.
  if (shield > 0) {
    let alpha = 0.3 + 0.2*Math.sin(t*0.2);
    const rings = Math.min(shield, 3);
    for (let i = 0; i < rings; i++) {
      ctx.beginPath(); ctx.arc(0, 0, 26 + i*5, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,255,255,${alpha})`; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.fillStyle = `rgba(0,200,255,${alpha*0.15})`;
    ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
  ctx.beginPath();
  for (let i = 0; i < a.verts.length; i++) {
    let v = a.verts[i];
    i === 0 ? ctx.moveTo(v.x, v.y) : ctx.lineTo(v.x, v.y);
  }
  ctx.closePath();
  let ag = ctx.createRadialGradient(0,0,2,0,0,a.r);
  ag.addColorStop(0,'#aaa'); ag.addColorStop(1,'#444');
  ctx.fillStyle = ag; ctx.fill();
  ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5; ctx.stroke();
  if (a.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.28*a.flash})`; ctx.fill(); }
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const flashFill = () => { if (e.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${0.30*e.flash})`; ctx.fill(); } };

  switch (e.kind) {
    case 'elite': {
      ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(16,0); ctx.lineTo(0,16); ctx.lineTo(-16,0); ctx.closePath();
      const eg = ctx.createRadialGradient(0,0,2,0,0,18);
      eg.addColorStop(0,'#ffaa00'); eg.addColorStop(1,'#880000');
      ctx.fillStyle = eg; ctx.fill();
      ctx.strokeStyle = '#ff4400'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.moveTo(0,-8); ctx.lineTo(0,8);
      ctx.strokeStyle='rgba(255,200,0,0.6)'; ctx.lineWidth=1; ctx.stroke();
      break;
    }

    case 'kamikaze': {
      // Narrow dart with a burning trail — reads as "this one is coming for you".
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const tg = ctx.createLinearGradient(0,-22,0,-4);
      tg.addColorStop(0,'rgba(255,60,80,0)'); tg.addColorStop(1,'rgba(255,120,60,0.75)');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.ellipse(0,-13,4,10,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.beginPath();
      ctx.moveTo(0,16); ctx.lineTo(9,-6); ctx.lineTo(3,-2); ctx.lineTo(0,-12);
      ctx.lineTo(-3,-2); ctx.lineTo(-9,-6); ctx.closePath();
      const kg = ctx.createLinearGradient(0,-12,0,16);
      kg.addColorStop(0,'#ff88aa'); kg.addColorStop(1,'#aa0022');
      ctx.fillStyle = kg; ctx.fill();
      ctx.strokeStyle = '#ff2255'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    case 'turret': {
      // Barrel first so the platform sits on top of it.
      ctx.save();
      ctx.rotate(e.aim - Math.PI/2);
      ctx.fillStyle = '#667788';
      ctx.fillRect(-4, 0, 8, 22);
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 1; ctx.strokeRect(-4, 0, 8, 22);
      ctx.restore();
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i/6)*Math.PI*2 + Math.PI/6;
        const px = Math.cos(a)*18, py = Math.sin(a)*15;
        i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.closePath();
      const hg = ctx.createLinearGradient(0,-15,0,15);
      hg.addColorStop(0,'#c3d8ee'); hg.addColorStop(1,'#3a4a5c');
      ctx.fillStyle = hg; ctx.fill();
      ctx.strokeStyle = '#99bbdd'; ctx.lineWidth = 2; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2);
      ctx.fillStyle = e.phase === 'hold' ? '#ff5533' : '#335577'; ctx.fill();
      ctx.strokeStyle = '#001122'; ctx.lineWidth = 1; ctx.stroke();
      // Health pips so its 8 HP doesn't feel arbitrary.
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillRect(-14, -22, 28*(e.hp/ENEMY.turret.hp), 2.5);
      break;
    }

    case 'mine': {
      const arming = e.arming > 0;
      const pulse = arming ? 1 + 0.5*Math.sin((30-e.arming)*0.9) : 1;
      if (arming) {
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.35*Math.sin((30-e.arming)*0.9);
        ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 60*(1 - e.arming/30), 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      ctx.strokeStyle = arming ? '#ff5533' : '#8a7a33'; ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const a = (i/8)*Math.PI*2 + frame*0.01;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*8, Math.sin(a)*8);
        ctx.lineTo(Math.cos(a)*15*pulse, Math.sin(a)*15*pulse);
        ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(0,0,9,0,Math.PI*2);
      const mg = ctx.createRadialGradient(-3,-3,1,0,0,10);
      mg.addColorStop(0, arming ? '#ffdd88' : '#8a8a6a');
      mg.addColorStop(1, arming ? '#992200' : '#33332a');
      ctx.fillStyle = mg; ctx.fill();
      ctx.strokeStyle = arming ? '#ff7744' : '#ffcc00'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      break;
    }

    default: { // grunt
      ctx.beginPath(); ctx.moveTo(0,18); ctx.lineTo(14,-10); ctx.lineTo(8,-4); ctx.lineTo(0,-14); ctx.lineTo(-8,-4); ctx.lineTo(-14,-10); ctx.closePath();
      const bg = ctx.createLinearGradient(-14,-14,14,18);
      bg.addColorStop(0,'#ff6600'); bg.addColorStop(1,'#aa0000');
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 1.5; ctx.stroke();
      flashFill();
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2);
      ctx.fillStyle='#ffdd00'; ctx.fill();
    }
  }
  ctx.restore();
}

function drawBoss(b) {
  const dying = b.dying > 0;
  ctx.save();
  ctx.translate(b.x, b.y);
  if (dying && Math.floor(b.deathTick/3) % 2 === 0) ctx.globalAlpha = 0.55;

  // Charging beam telegraph — a thin targeting line before the real thing.
  if (b.laser && b.laser.charge > 0) {
    ctx.save();
    ctx.globalAlpha = 0.35 + 0.4*Math.sin(b.laser.charge*0.5);
    ctx.strokeStyle = '#ff3355'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, BOSS_H/2); ctx.lineTo(0, H); ctx.stroke();
    ctx.restore();
  }

  // Hull
  ctx.beginPath();
  ctx.moveTo(-BOSS_W/2, -6);
  ctx.lineTo(-BOSS_W/2 + 18, -BOSS_H/2);
  ctx.lineTo(BOSS_W/2 - 18, -BOSS_H/2);
  ctx.lineTo(BOSS_W/2, -6);
  ctx.lineTo(BOSS_W/2 - 26, BOSS_H/2);
  ctx.lineTo(BOSS_W/2 - 40, BOSS_H/2 - 8);
  ctx.lineTo(0, BOSS_H/2 + 10);
  ctx.lineTo(-BOSS_W/2 + 40, BOSS_H/2 - 8);
  ctx.lineTo(-BOSS_W/2 + 26, BOSS_H/2);
  ctx.closePath();
  const hg = ctx.createLinearGradient(0, -BOSS_H/2, 0, BOSS_H/2);
  hg.addColorStop(0, '#4a5a72'); hg.addColorStop(0.5, '#22293a'); hg.addColorStop(1, '#0d1119');
  ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = b.phase === 3 ? '#ff4433' : b.phase === 2 ? '#ffaa33' : '#66aaff';
  ctx.lineWidth = 2.5; ctx.stroke();
  if (b.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.7, 0.10*b.flash)})`; ctx.fill(); }

  // Armour ribs
  ctx.strokeStyle = 'rgba(140,170,210,0.30)'; ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.moveTo(i*20, -BOSS_H/2 + 6); ctx.lineTo(i*20, BOSS_H/2 - 6); ctx.stroke();
  }

  // Three glowing cores, brighter as the fight escalates.
  const coreCol = b.phase === 3 ? '#ff3311' : b.phase === 2 ? '#ffaa00' : '#33ccff';
  [-32, 0, 32].forEach((cx, i) => {
    const pulse = 0.6 + 0.4*Math.sin(frame*0.09 + i);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createRadialGradient(cx, 4, 0, cx, 4, 16);
    cg.addColorStop(0, coreCol); cg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = pulse;
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, 4, 16, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx, 4, i === 1 ? 8 : 6, 0, Math.PI*2);
    ctx.fillStyle = coreCol; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
  });

  ctx.restore();

  // Firing beam, drawn in world space so it spans the screen.
  if (b.laser && b.laser.fire > 0) {
    const w = 13 + 4*Math.sin(frame*0.7);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(b.laser.x - w, 0, b.laser.x + w, 0);
    lg.addColorStop(0, 'rgba(255,40,80,0)');
    lg.addColorStop(0.5, 'rgba(255,220,240,0.95)');
    lg.addColorStop(1, 'rgba(255,40,80,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(b.laser.x - w, b.y, w*2, H - b.y);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(b.laser.x - 2, b.y, 4, H - b.y);
    ctx.restore();
  }
}

function drawBossBar(b) {
  const pad = 14, barW = W - pad*2, y = 52;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,20,0.65)';
  ctx.fillRect(pad, y, barW, 10);
  const frac = Math.max(0, b.hp / b.maxHp);
  const col = b.phase === 3 ? '#ff3322' : b.phase === 2 ? '#ffaa22' : '#33ccff';
  ctx.fillStyle = col;
  ctx.fillRect(pad, y, barW*frac, 10);
  // Phase boundaries at 66% and 33%.
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
  [0.33, 0.66].forEach(f => {
    ctx.beginPath(); ctx.moveTo(pad + barW*f, y); ctx.lineTo(pad + barW*f, y+10); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
  ctx.strokeRect(pad, y, barW, 10);
  ctx.fillStyle = col;
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'left';
  ctx.fillText('DREADNOUGHT MK.' + b.tier, pad, y - 4);
  ctx.textAlign = 'right';
  ctx.fillText('PHASE ' + b.phase, W - pad, y - 4);
  ctx.restore();
}

function drawBossWarning() {
  const t = bossWarning / 90;
  ctx.save();
  // Red pulse around the screen edge.
  ctx.globalAlpha = 0.35 + 0.35*Math.sin(frame*0.35);
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.72);
  vg.addColorStop(0, 'rgba(255,0,0,0)');
  vg.addColorStop(1, 'rgba(255,20,20,0.75)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = Math.min(1, t*2.2);
  ctx.fillStyle = 'rgba(30,0,0,0.72)';
  ctx.fillRect(0, H/2 - 44, W, 88);
  ctx.strokeStyle = '#ff3322'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, H/2-44); ctx.lineTo(W, H/2-44);
  ctx.moveTo(0, H/2+44); ctx.lineTo(W, H/2+44); ctx.stroke();
  ctx.fillStyle = Math.floor(frame/6) % 2 ? '#ff5544' : '#ffdd88';
  ctx.font = 'bold 38px monospace'; ctx.textAlign = 'center';
  ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 24;
  ctx.fillText('WARNING', W/2, H/2 + 2);
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = '#ffaa88'; ctx.shadowBlur = 0;
  ctx.fillText('CAPITAL SHIP INBOUND', W/2, H/2 + 28);
  ctx.restore();
}

function makeAsteroid(big) {
  let r = big ? 22+Math.random()*14 : 10+Math.random()*8;
  let verts = [];
  let n = 7 + Math.floor(Math.random()*4);
  for (let i = 0; i < n; i++) {
    let angle = (i/n)*Math.PI*2;
    let dist = r * (0.7 + Math.random()*0.5);
    verts.push({x: Math.cos(angle)*dist, y: Math.sin(angle)*dist});
  }
  return {
    x: r + Math.random()*(W-2*r), y: -r-10,
    vx: (Math.random()-0.5)*1.2,
    vy: (difficulty().enemySpeed * (big ? 1.2 : 0.8)),
    r, verts, rot: 0, rotSpeed: (Math.random()-0.5)*0.04, big, hp: big ? 3 : 1, flash: 0
  };
}

// Per-kind stats. Everything that differs between enemy types lives here so
// the update and render paths only branch on behaviour, not on numbers.
const ENEMY = {
  grunt:    { hp: 2, points: 100, r: 22, color: '#ff5500', boom: 24, shake: 5,  hitStop: 0 },
  elite:    { hp: 4, points: 200, r: 24, color: '#ffaa00', boom: 40, shake: 12, hitStop: 3 },
  kamikaze: { hp: 1, points: 120, r: 18, color: '#ff2255', boom: 28, shake: 8,  hitStop: 0 },
  turret:   { hp: 8, points: 300, r: 26, color: '#99bbdd', boom: 44, shake: 12, hitStop: 3 },
  mine:     { hp: 2, points:  80, r: 20, color: '#ffcc00', boom: 46, shake: 14, hitStop: 0 }
};

// Which kinds can appear, and how often, at a given level.
function enemyWeights() {
  return [
    ['grunt',    Math.max(3, 12 - level)],
    ['elite',    level >= 3 ? Math.min(8, level - 1) : 0],
    ['kamikaze', level >= 3 ? Math.min(7, level)     : 0],
    ['mine',     level >= 4 ? Math.min(5, level - 2) : 0],
    ['turret',   level >= 6 ? Math.min(5, level - 4) : 0]
  ];
}

function pickEnemyKind() {
  const w = enemyWeights();
  const total = w.reduce((s, e) => s + e[1], 0);
  let r = Math.random() * total;
  for (const [kind, weight] of w) { r -= weight; if (r <= 0) return kind; }
  return 'grunt';
}

function makeEnemy(kind) {
  const d = difficulty();
  const e = {
    kind, x: 30 + Math.random()*(W-60), y: -30,
    vx: 0, vy: d.enemySpeed * 0.8,
    hp: RLCore.enemyHp(kind, level), maxHp: RLCore.enemyHp(kind, level),
    scale: RLCore.enemyScale(level), flash: 0, dead: false,
    shootTimer: 0, zigzag: 0, zigzagDir: 1,
    formationId: 0, sweep: false, baseX: 0
  };
  switch (kind) {
    case 'grunt':
    case 'elite':
      e.vx = (Math.random()-0.5)*2;
      e.shootTimer = Math.floor(Math.random()*80);
      break;
    case 'kamikaze':
      // Locks a target column at spawn, then commits to it.
      e.vy = d.enemySpeed * 2.6;
      e.targetX = player.x;
      break;
    case 'turret':
      e.vy = d.enemySpeed * 0.9;
      e.holdY = 120 + Math.random()*50;
      e.holdTimer = 480;
      e.phase = 'descend';
      e.aim = Math.PI/2;
      e.burstLeft = 0; e.burstTimer = 0;
      break;
    case 'mine':
      e.vy = 0.6;
      e.vx = (Math.random()-0.5)*0.4;
      e.arming = 0;
      break;
  }
  return e;
}

// ---- BOSS ----

const BOSS_W = 112, BOSS_H = 54;

function bossMaxHp(lv) {
  // Hand-set per boss, fitted so a reasonable build at that level kills it in
  // its target time. See the boss table in the pure core.
  return RLCore.bossHp(lv);
}

function spawnBoss(lv) {
  const def = RLCore.bossFor(lv);
  const hp = def ? def.hp : RLCore.fittedBossHp(lv);
  boss = {
    x: W/2, y: -70, targetY: 150,
    hp, maxHp: hp,
    key: def ? def.key : 'scrapjaw',
    name: def ? def.name : 'UNKNOWN CONTACT',
    maxPhases: def ? def.phases : 3,
    tier: Math.max(1, Math.round(lv / 10)),
    phase: 1, entering: true, flash: 0,
    attackTimer: 0, minionTimer: 0,
    laser: null, beamCooldown: 0,
    dying: 0, deathTick: 0
  };
  bossActive = true;
  bossWarning = 90;
  levelBanner = null;          // the warning owns the screen
  Sound.play('warning');
  Music.setBoss(true);
}

// Phases are even slices of the health bar, so a seven-phase mothership and a
// two-phase Scrapjaw both change at predictable, readable moments.
function bossPhaseFor(b) {
  const n = Math.max(1, b.maxPhases || 3);
  const f = b.hp / b.maxHp;
  return Math.min(n, Math.max(1, n - Math.floor(f * n)));
}

function updateBoss() {
  const b = boss;
  const diff = difficulty();

  // ---- death cascade ----
  if (b.dying > 0) {
    b.dying--;
    b.deathTick++;
    if (b.deathTick % 5 === 0) {
      FX.explode(b.x + (Math.random()-0.5)*BOSS_W, b.y + (Math.random()-0.5)*BOSS_H, 26 + Math.random()*18, '#ffbb33');
      FX.addShake(10);
      Sound.play('explode');
    }
    if (b.dying === 0) {
      FX.explode(b.x, b.y, 90, '#ffdd66');
      FX.addShake(30);
      FX.hitStop(8);
      FX.slowMo(60, 0.3);
      Sound.play('bigExplode');
      const pts = 2000 * b.tier;
      score += pts;
      // The boss is the biggest kill in the game and used to pay no scrap at
      // all, because it never went through killEnemy. Routed through
      // scrapForKill so SCRAP MAGNET and SALVAGE RIG apply here too.
      const bossScrap = RLCore.scrapForKill(pts, stats.scrapMul, level);
      scrap += bossScrap;
      addFlashText('+' + pts.toLocaleString(), b.x, b.y, '#ffdd44');
      addFlashText('+' + bossScrap.toLocaleString() + ' SCRAP', b.x, b.y + 24, '#ffdd44');
      levelBanner = { text: 'BOSS DOWN', life: 120 };
      boss = null; bossActive = false;
      Music.setBoss(false);
    }
    return;
  }

  if (b.flash > 0) b.flash--;

  // ---- movement ----
  if (b.entering) {
    b.y += 1.6;
    if (b.y >= b.targetY) { b.y = b.targetY; b.entering = false; }
    return;                              // no attacks until it's in position
  }
  if (b.laser && b.laser.fire > 0) {
    // While the beam is up the ship itself sweeps, so the beam always
    // emanates from the hull instead of drifting free of it.
    b.x += b.laser.dir * 2.6;
    if (b.x < BOSS_W/2 + 8 || b.x > W - BOSS_W/2 - 8) b.laser.dir *= -1;
  } else {
    b.x += Math.sign(player.x - b.x) * Math.min(1.2, Math.abs(player.x - b.x));
  }
  b.x = Math.max(BOSS_W/2, Math.min(W - BOSS_W/2, b.x));

  // ---- phase transitions ----
  const p = bossPhaseFor(b);
  if (p !== b.phase) {
    b.phase = p;
    b.flash = 10;
    b.attackTimer = 0;
    b.laser = null;
    FX.addShake(14);
    Sound.play('levelUp');
  }

  b.attackTimer++;

  if (b.phase === 1) {
    // Radial bullet ring.
    if (b.attackTimer >= 120) {
      b.attackTimer = 0;
      const spd = diff.bulletSpeed * 0.85 * stats.enemyBulletMul;
      for (let i = 0; i < 12; i++) {
        const a = (i/12)*Math.PI*2;
        enemyBullets.push({x: b.x, y: b.y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r: 5, elite: true, dead: false});
      }
      Sound.play('hit');
    }

  } else if (b.phase === 2) {
    // Telegraphed charge, then a sweeping vertical beam.
    if (!b.laser && b.attackTimer >= 90) {
      b.attackTimer = 0;
      b.laser = { charge: 45, fire: 0, x: b.x, dir: player.x < b.x ? 1 : -1 };
      Sound.play('warning');
    }
    if (b.laser) {
      if (b.laser.charge > 0) {
        b.laser.charge--;
        b.laser.x = b.x;
        if (b.laser.charge === 0) b.laser.fire = 90;
      } else if (b.laser.fire > 0) {
        b.laser.fire--;
        b.laser.x = b.x;                 // locked to the hull
        if (b.beamCooldown > 0) b.beamCooldown--;
        if (Math.abs(player.x - b.laser.x) < 16 && player.y > b.y && b.beamCooldown === 0) {
          b.beamCooldown = 30;   // at most one hit per half second
          hitPlayer();
        }
        if (b.laser.fire === 0) b.laser = null;
      }
    }

  } else {
    // Minion swarm plus aimed spreads.
    b.minionTimer++;
    if (b.minionTimer >= 90) {
      b.minionTimer = 0;
      const m = makeEnemy('grunt');
      m.x = b.x + (Math.random()-0.5)*BOSS_W; m.y = b.y + 20;
      enemies.push(m);
    }
    if (b.attackTimer >= 70) {
      b.attackTimer = 0;
      const a = Math.atan2(player.y - b.y, player.x - b.x);
      const spd = diff.bulletSpeed * stats.enemyBulletMul;
      [-0.22, 0, 0.22].forEach(o => {
        enemyBullets.push({x: b.x, y: b.y + 20, vx: Math.cos(a+o)*spd, vy: Math.sin(a+o)*spd, r: 5, elite: true, dead: false});
      });
    }
  }

  // ---- taking fire ----
  bullets.forEach(bl => {
    if (bl.dead) return;
    if (Math.abs(bl.x - b.x) < BOSS_W/2 && Math.abs(bl.y - b.y) < BOSS_H/2) {
      if (bl.pierce > 0) bl.pierce--; else bl.dead = true;
      b.hp -= bl.damage;
      b.flash = Math.max(b.flash, 2);
      spawnParticles(bl.x, bl.y, '#ffaa44', 3);

      // FLAK BURST / CHAIN LIGHTNING / SPLIT SHOT during a boss fight.
      // applySplash/applyChain only ever touch the `enemies` array, so this
      // cannot double-damage the boss itself — it lets those upgrades still
      // do something (hit whatever minions the boss has spawned) instead of
      // going dead silent for the entire fight.
      if (bl.splash > 0) applySplash(bl.x, bl.y, bl.splash, bl.damage * 0.6);
      if (stats.chain > 0) applyChain(bl.x, bl.y, stats.chain, bl.damage * 0.5);
      if (bl.split && !bl.isSplit) {
        [-0.5, 0.5].forEach(a => bullets.push({
          x: bl.x, y: bl.y,
          vx: Math.sin(a) * BULLET_SPEED, vy: -Math.cos(a) * BULLET_SPEED,
          w: 3, h: 10, pierce: 0, damage: bl.damage * 0.5, homing: 0, splash: 0,
          split: false, isSplit: true, crit: false, dead: false
        }));
      }

      if (b.hp <= 0 && b.dying === 0) {
        b.hp = 0;
        b.dying = 45; b.deathTick = 0;
        runKills++;
        enemyBullets = [];
        Sound.play('explode');
      }
    }
  });
}

let nextFormationId = 1;

// Coordinated waves. Members share a formationId so clearing the whole group
// can be rewarded.
function spawnFormation(type) {
  const id = nextFormationId++;
  const d = difficulty();
  if (type === 'vee') {
    const cx = 100 + Math.random()*(W - 200);
    for (let i = -2; i <= 2; i++) {
      const e = makeEnemy('grunt');
      e.x = cx + i*38;
      e.y = -30 - Math.abs(i)*28;
      e.vx = 0; e.vy = d.enemySpeed * 0.85;
      e.zigzagDir = 0; e.formationId = id;
      enemies.push(e);
    }
  } else {
    for (let i = 0; i < 4; i++) {
      const e = makeEnemy('grunt');
      e.baseX = 80 + i*((W - 160)/3);
      e.x = e.baseX; e.y = -30 - i*10;
      e.vx = 0; e.vy = d.enemySpeed * 0.55;
      e.zigzagDir = 0; e.sweep = true; e.formationId = id;
      enemies.push(e);
    }
  }
  return id;
}

const BULLET_SPEED = 11;

function fireWeapon() {
  overchargeCount++;
  const crit = stats.overcharge > 0 && overchargeCount % stats.overcharge === 0;
  const dmg = stats.damage * (crit ? 3 : 1);
  RLCore.buildShots(stats).forEach(s => {
    bullets.push({
      x: player.x + s.dx, y: player.y + s.dy,
      vx: Math.sin(s.a) * BULLET_SPEED,
      vy: -Math.cos(s.a) * BULLET_SPEED,
      w: 3, h: 10,
      pierce: stats.pierce, damage: dmg, homing: stats.homing,
      splash: stats.splash, split: stats.split, crit,
      dead: false
    });
  });
  player.muzzle = 3;
  Sound.play('laser');
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random()*Math.PI*2;
    let speed = 1.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 30 + Math.random()*30, maxLife: 60,
      r: 1.5+Math.random()*3,
      color, type: Math.random() < 0.3 ? 'spark' : 'dot'
    });
  }
}

// ---- ORBITAL DRONE ----
// stats.drones can rise (upgrade picked up) or fall (a hit strips it), so this
// must reconcile the drones[] array in both directions, not just grow it.
function syncDrones() {
  while (drones.length < stats.drones) drones.push({ angle: drones.length * Math.PI, fire: 0 });
  while (drones.length > stats.drones) drones.pop();
}

function updateDrones() {
  drones.forEach(d => {
    d.angle += 0.03;
    d.x = player.x + Math.cos(d.angle) * 46;
    d.y = player.y + Math.sin(d.angle) * 32;
    if (--d.fire <= 0) {
      d.fire = 22;
      // Carries the full bullet field set the collision code in update()
      // reads (pierce/damage/homing/splash/split/crit/dead) — matching
      // fireWeapon()'s shape so a drone bullet can't leave any of these
      // undefined and corrupt the damage arithmetic.
      bullets.push({
        x: d.x, y: d.y - 6, vx: 0, vy: -BULLET_SPEED,
        w: 2, h: 8, pierce: 0, damage: stats.damage * 0.5,
        homing: 0, splash: 0, split: false, crit: false, dead: false
      });
    }
  });
}

function drawDrones() {
  drones.forEach(d => {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.fillStyle = '#ffaa22';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffdd88'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  });
}

// ---- SINGULARITY ----
// Drags nearby enemies inward and grinds them down at close range. Damage is
// routed through damageEnemy (not a direct e.hp-- / killEnemy) so mines still
// arm instead of dying outright — see damageEnemy's comment for why that
// decision must live in exactly one place.
function updateSingularity() {
  if (!stats.singularity) { singularity = null; return; }
  if (!singularity) singularity = { angle: 0 };
  singularity.angle += 0.02;
  singularity.x = player.x + Math.cos(singularity.angle) * 70;
  singularity.y = player.y + Math.sin(singularity.angle) * 52;
  enemies.forEach(e => {
    if (e.dead) return;
    const dx = singularity.x - e.x, dy = singularity.y - e.y;
    const d = Math.max(Math.hypot(dx, dy), 0.001); // guard against div-by-zero if exactly co-located
    if (d < 120) {
      e.x += (dx / d) * 1.6; e.y += (dy / d) * 1.6;
      if (d < 26) damageEnemy(e, 0.5);
    }
  });
}

function drawSingularity() {
  if (!singularity) return;
  ctx.save();
  ctx.translate(singularity.x, singularity.y);
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
  g.addColorStop(0, '#000000');
  g.addColorStop(0.6, 'rgba(120,0,200,0.7)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,120,255,0.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(frame*0.1)*2, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

// Single definition of "what happens when an enemy takes damage". Every path
// that can hurt an enemy — the direct bullet/enemy collision, applySplash and
// applyChain — routes through here so they can't disagree about it. In
// particular: a mine is supposed to arm (not die outright) once its hp hits
// zero, however that damage arrived. Before this existed, applySplash and
// applyChain called killEnemy directly with no mine check at all, so FLAK
// BURST/CHAIN LIGHTNING silently killed mines instead of letting them arm and
// detonate — including a *directly*-hit mine, since a mine's 2 hp is often
// wiped out by the splash from its own impact before a per-site special case
// would ever get a turn to run.
function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = 4;
  if (e.hp <= 0) {
    if (e.kind === 'mine') { e.hp = 1; if (e.arming === 0) e.arming = 30; }
    else killEnemy(e);
  }
}

// Flak Burst: on-impact AoE against nearby enemies. Deliberately does not
// call itself (or trigger further splash) — one blast per impact.
function applySplash(x, y, radius, damage) {
  if (radius <= 0) return;
  enemies.forEach(e => {
    if (e.dead) return;
    if ((e.x - x) ** 2 + (e.y - y) ** 2 <= radius * radius) {
      damageEnemy(e, damage);
    }
  });
  FX.explode(x, y, radius * 0.7, '#ffaa44');
}

// Chain Lightning: arcs to the nearest un-hit enemy within range, up to `hops`
// times. Bounded by the hop count, so it cannot recurse indefinitely.
function applyChain(x, y, hops, damage) {
  let from = { x, y };
  const hit = [];
  for (let i = 0; i < hops; i++) {
    let best = null, bestD = 1e9;
    enemies.forEach(e => {
      if (e.dead || hit.includes(e)) return;
      const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2;
      // Skip anything essentially co-located with the current arc origin —
      // on hop 0 that's the enemy the bullet just hit directly, and without
      // this the chain wastes its first hop re-hitting the same target
      // instead of arcing out to a nearby one.
      if (d < 4) return;
      if (d < bestD && d < 160 * 160) { bestD = d; best = e; }
    });
    if (!best) return;
    hit.push(best);
    spawnParticles(best.x, best.y, '#88ddff', 6);
    damageEnemy(best, damage);
    from = best;
  }
}

function comboMultiplier() {
  return Math.max(1, Math.min(CFG.maxComboMultiplier, Math.floor(combo/3)));
}

function killEnemy(e) {
  const st = ENEMY[e.kind];
  e.dead = true;
  runKills++;
  FX.explode(e.x, e.y, st.boom, st.color);
  FX.addShake(st.shake);
  if (st.hitStop) FX.hitStop(st.hitStop);
  Sound.play('explode');

  const multiplier = comboMultiplier();
  score += st.points * multiplier;
  // Scrap deliberately ignores the combo multiplier — score rewards a hot
  // streak, but the shop economy stays predictable only if scrap does not.
  scrap += RLCore.scrapForKill(st.points, stats.scrapMul, level);
  // Vampiric Core: a life back every stats.lifePerKills kills.
  if (stats.lifePerKills > 0) {
    killsSinceLife++;
    if (killsSinceLife >= stats.lifePerKills) {
      killsSinceLife = 0; lives++;
      addFlashText('+1 LIFE', player.x, player.y - 40, '#44ff88');
    }
  }
  combo++; comboTimer = 120;
  addFlashText('+' + st.points*multiplier, e.x, e.y - 10, st.color);

  // Clearing an entire formation pays a bonus.
  if (e.formationId) {
    const remaining = enemies.some(o => o !== e && !o.dead && o.formationId === e.formationId);
    if (!remaining) {
      score += 500;
      addFlashText('FORMATION! +500', W/2, e.y - 34, '#66ffcc');
      FX.hitStop(3);
      Sound.play('levelUp');
    }
  }
}

function addFlashText(text, x, y, color) {
  flashText.push({text, x, y, life: 60, color, vy: -1.2});
}

function hitPlayer() {
  if (player.invincible > 0) return;
  // Phase Drive: a banked free hit that recharges on its own clock. Spent
  // before the shield and before Phantom's once-per-level slip, because it is
  // the only one of the three that comes back by itself.
  if (stats.phaseDrive && player.phaseCharge > 0) {
    player.phaseCharge = 0;
    player.phaseDriveTimer = 0;
    player.invincible = 70;
    addFlashText('PHASE DRIVE', player.x, player.y - 34, '#aa66ff');
    spawnParticles(player.x, player.y, '#aa66ff', 18);
    FX.addShake(8);
    Sound.play('shieldBreak');
    return;
  }
  // Plating / Fortress / Kinetic Barrier all just add to this same charge
  // count — one system, no separate timer.
  if (player.shieldCharges > 0) {
    player.shieldCharges--;
    player.invincible = 60;
    FX.addShake(10);
    FX.explode(player.x, player.y, 22, '#00ffff');
    Sound.play('shieldBreak');
    return;
  }
  // Phantom slips through one hit per level.
  if (player.phaseReady) {
    player.phaseReady = false;
    player.invincible = 70;
    addFlashText('PHASED', player.x, player.y - 34, '#cc88ff');
    spawnParticles(player.x, player.y, '#cc88ff', 16);
    FX.addShake(6);
    Sound.play('shieldBreak');
    return;
  }
  // ---- Task 8: hit penalty ----
  // Only a hit that actually lands (past both the shield and phase early
  // returns above) strips an upgrade. Self-contained on purpose: a later
  // task's shield logic will touch the rest of hitPlayer, not this block.
  // ABSOLUTION (HYPERCLOCKED) switches this off entirely; GREED ENGINE makes
  // it cost two. Both read through stats so the rule stays in one place.
  if (!stats.noStrip) {
    const res = RLCore.stripN(runUpgrades, stats.strips);
    runUpgrades = res.owned;
    if (res.removed) {
      runUpgradesVersion++;
      const t = RLCore.tierOf(RLCore.effectiveTier(RLCore.byId(res.removed.id), voidbirths));
      const u = RLCore.resolve(RLCore.byId(res.removed.id), voidbirths);
      addFlashText('-' + u.name, player.x, player.y - 30, t.color);
      recomputeStats();
    }
  }
  lives--;
  player.invincible = 120;
  FX.addShake(20);
  FX.explode(player.x, player.y, 24, '#ff4400');
  combo = 0; comboTimer = 0;
  if (lives <= 0) endRun();
  else Sound.play('explode');
}

function aabbCircle(rx, ry, rw, rh, cx, cy, cr) {
  let nx = Math.max(rx-rw/2, Math.min(cx, rx+rw/2));
  let ny = Math.max(ry-rh/2, Math.min(cy, ry+rh/2));
  return (nx-cx)*(nx-cx)+(ny-cy)*(ny-cy) < cr*cr;
}

// ===== UPDATE =====

// Advances only presentation-layer things: particles, rings, floating text,
// shake. Runs during 'dying' and 'dead' too, so the wreck keeps burning while
// the game-over screen is up.
function updateEffects() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--;
    if (p.type === 'chunk') { p.rot += p.rotSpeed; p.vy += 0.04; }
    else p.r *= 0.97;
  });
  particles = particles.filter(p => p.life > 0);

  flashText.forEach(f => { f.y += f.vy; f.life--; });
  flashText = flashText.filter(f => f.life > 0);

  FX.step();
  capArray(particles, CFG.caps.particles);
}

function update() {
  // The clock stops during a boss fight — the fight is the level.
  if (!bossActive) {
    levelTimer++;
    if (levelTimer > 60*CFG.levelSeconds) levelUp();
  }
  if (bossWarning > 0) bossWarning--;

  // Stars
  starLayers.forEach(layer => layer.forEach(s => {
    s.y += s.speed; if (s.y > H+2) { s.y = -2; s.x = Math.random()*W; }
  }));

  // Nebulae
  nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

  // Player movement
  let dx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (touchX !== null) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = W / rect.width;
    let tx = (touchX - rect.left) * scaleX;
    if (tx < player.x - 15) dx = -1;
    else if (tx > player.x + 15) dx = 1;
  }
  player.x = Math.max(20, Math.min(W-20, player.x + dx*player.speed));

  // Player trail
  player.trail.push({x: player.x, y: player.y, life: 12});
  if (player.trail.length > 12) player.trail.shift();
  player.trail.forEach(t => t.life--);
  player.trail = player.trail.filter(t => t.life > 0);

  if (player.invincible > 0) player.invincible--;

  // Phase Drive: recharge the banked hit. The timer only runs while the charge
  // is spent, so an unused charge doesn't quietly bank a second one.
  if (stats.phaseDrive) {
    if (player.phaseCharge <= 0) {
      player.phaseDriveTimer++;
      if (player.phaseDriveTimer >= RLCore.PHASE_DRIVE_FRAMES) {
        player.phaseDriveTimer = 0;
        player.phaseCharge = 1;
        addFlashText('PHASE READY', player.x, player.y - 44, '#aa66ff');
      }
    }
  } else {
    player.phaseCharge = 0; player.phaseDriveTimer = 0;
  }

  // Kinetic Barrier: regenerate one shield charge every stats.shieldRegen
  // frames. Capped so it can't grow without bound if it's left to regen
  // uninterrupted for a whole run.
  if (stats.shieldRegen > 0) {
    player.shieldRegenTimer = (player.shieldRegenTimer || 0) + 1;
    if (player.shieldRegenTimer >= stats.shieldRegen) {
      player.shieldRegenTimer = 0;
      player.shieldCharges = Math.min(player.shieldCharges + 1, stats.shieldCharges + 3);
    }
  }

  // Shooting (auto-fire). The interval is entirely upgrade-driven now.
  shootTimer++;
  const fireRate = Math.max(RLCore.MIN_FIRE_RATE, Math.round(stats.fireRate));
  if (shootTimer >= fireRate) {
    shootTimer = 0;
    fireWeapon();
  }

  // Orbital Drone / Singularity: pushed here (same as fireWeapon above) so any
  // new drone bullet moves this frame along with everything else, and so the
  // singularity's drag/grind against enemies happens once per frame.
  updateDrones();
  updateSingularity();

  // Normal spawning is suspended for the duration of a boss fight; the boss
  // supplies its own minions in phase 3.
  if (!bossActive) {
    asteroidTimer++;
    if (asteroidTimer >= difficulty().asteroidRate) {
      asteroidTimer = 0;
      asteroids.push(makeAsteroid(Math.random() < 0.4));
    }

    spawnTimer++;
    if (spawnTimer >= difficulty().spawnRate) {
      spawnTimer = 0;
      spawnCycle++;
      if (level >= 3 && spawnCycle % 3 === 0) {
        spawnFormation(Math.random() < 0.5 ? 'vee' : 'line');
      } else if (Math.random() < 0.7) {
        enemies.push(makeEnemy(pickEnemyKind()));
      }
    }
  }

  if (boss) updateBoss();

  // Hunter Rounds: steer bullets toward the nearest live enemy. b.homing is a
  // turn-rate cap in radians/frame, so shots curve rather than snap onto target.
  bullets.forEach(b => {
    if (b.homing > 0) {
      let best = null, bestD = 1e9;
      enemies.forEach(e => {
        if (e.dead) return;
        const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = e; }
      });
      // The boss is not in `enemies`, so without this a boss fight steers
      // homing shots onto the minions it spawns in phase 3 — curving a
      // 900-scrap upgrade's bullets away from the only target that matters.
      if (boss && !boss.entering && boss.dying === 0) {
        const d = (boss.x - b.x) ** 2 + (boss.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = boss; }
      }
      if (best) {
        const want = Math.atan2(best.x - b.x, -(best.y - b.y));
        const cur  = Math.atan2(b.vx, -b.vy);
        let diff = want - cur;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.max(-b.homing, Math.min(b.homing, diff));
        const a = cur + turn;
        b.vx = Math.sin(a) * BULLET_SPEED;
        b.vy = -Math.cos(a) * BULLET_SPEED;
      }
    }
  });

  // Move bullets
  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Move enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });

  // Asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    bullets.forEach(b => {
      if (b.dead || a.hp <= 0) return;
      if (Math.abs(b.x - a.x) < a.r + 2 && Math.abs(b.y - a.y) < a.r + 2) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        a.hp -= b.damage;
        a.flash = 3;
        spawnParticles(b.x, b.y, '#aaaaaa', 4);
        Sound.play('hit');
        if (a.hp <= 0) {
          if (a.big) {
            for (let i = 0; i < 2; i++) asteroids.push({...makeAsteroid(false), x: a.x + (i?15:-15), y: a.y, vy: a.vy*1.2});
          }
          FX.explode(a.x, a.y, a.big ? 30 : 16, '#9a9a9a');
          if (a.big) FX.addShake(6);
          Sound.play(a.big ? 'explode' : 'hit');
          score += a.big ? 50 : 20;
          combo++; comboTimer = 120;
          if (combo > 2) addFlashText('x'+combo+'!', a.x, a.y, '#ffff00');
        }
      }
    });
    if (a.hp > 0 && aabbCircle(player.x, player.y, player.w, player.h, a.x, a.y, a.r)) hitPlayer();
  });

  // Enemies
  const diff = difficulty();
  enemies.forEach(e => {
    const st = ENEMY[e.kind];

    // ---- movement ----
    switch (e.kind) {
      case 'kamikaze':
        e.x += Math.sign(e.targetX - e.x) * Math.min(1.5, Math.abs(e.targetX - e.x));
        e.y += e.vy;
        break;

      case 'turret':
        if (e.phase === 'descend') {
          e.y += e.vy;
          if (e.y >= e.holdY) { e.y = e.holdY; e.phase = 'hold'; }
        } else if (e.phase === 'hold') {
          e.holdTimer--;
          if (e.holdTimer <= 0) e.phase = 'retreat';
        } else {
          e.y -= 2.2;
        }
        e.aim = Math.atan2(player.y - e.y, player.x - e.x);
        break;

      case 'mine':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 16 || e.x > W-16) e.vx *= -1;
        break;

      default: // grunt, elite
        if (e.sweep) {
          e.x = e.baseX + Math.sin(frame*0.02)*70;   // whole line moves as one
          e.y += e.vy;
        } else {
          e.zigzag += 0.04;
          e.x += e.vx + Math.sin(e.zigzag)*2.5*e.zigzagDir;
          e.y += e.vy;
          if (e.x < 20 || e.x > W-20) e.vx *= -1;
        }
    }

    // ---- firing ----
    if (e.kind === 'grunt' || e.kind === 'elite') {
      e.shootTimer++;
      const eRate = e.kind === 'elite' ? 55 : 90;
      if (e.shootTimer >= eRate) {
        e.shootTimer = 0;
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        const spd2 = diff.bulletSpeed * stats.enemyBulletMul;
        enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle)*spd2, vy: Math.sin(angle)*spd2, r: 4, elite: e.kind === 'elite', dead: false});
        if (e.kind === 'elite') {
          [-0.3, 0.3].forEach(o => {
            enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle+o)*spd2, vy: Math.sin(angle+o)*spd2, r: 4, elite: true, dead: false});
          });
        }
      }
    } else if (e.kind === 'turret' && e.phase === 'hold') {
      e.shootTimer++;
      if (e.shootTimer >= 90) { e.shootTimer = 0; e.burstLeft = 3; e.burstTimer = 0; }
      if (e.burstLeft > 0) {
        e.burstTimer--;
        if (e.burstTimer <= 0) {
          e.burstTimer = 8;
          e.burstLeft--;
          const spd2 = diff.bulletSpeed * 1.15 * stats.enemyBulletMul;
          enemyBullets.push({x: e.x, y: e.y + 12, vx: Math.cos(e.aim)*spd2, vy: Math.sin(e.aim)*spd2, r: 4.5, elite: true, dead: false});
        }
      }
    }

    // ---- mine proximity trigger ----
    if (e.kind === 'mine' && !e.dead) {
      const dx2 = player.x - e.x, dy2 = player.y - e.y;
      if (e.arming === 0 && dx2*dx2 + dy2*dy2 < 45*45) { e.arming = 30; Sound.play('hit'); }
      if (e.arming > 0) {
        e.arming--;
        if (e.arming === 0) {
          const ddx = player.x - e.x, ddy = player.y - e.y;
          if (ddx*ddx + ddy*ddy < 60*60) hitPlayer();
          FX.explode(e.x, e.y, st.boom, st.color);
          FX.addShake(st.shake);
          Sound.play('explode');
          e.dead = true;
        }
      }
    }

    // ---- taking fire ----
    bullets.forEach(b => {
      if (b.dead || e.dead) return;
      if (Math.abs(b.x-e.x) < st.r*0.8 && Math.abs(b.y-e.y) < st.r*0.8) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        spawnParticles(b.x, b.y, st.color, 4);
        Sound.play('hit');
        // damageEnemy applies the hp loss and decides mine-arms-vs-dies; see
        // its definition for why that decision lives in one place.
        damageEnemy(e, b.damage);

        // On-impact bullet behaviours (Task 12). These fire on every hit,
        // independent of whether this hit kills the enemy. Split children
        // re-enter this same collision path on their own later hits, so
        // CHAIN LIGHTNING (which reads the global stats.chain rather than a
        // per-bullet flag) will trigger off them too — that's intentional
        // and bounded by the hop count, not something to guard against.
        if (b.splash > 0) applySplash(e.x, e.y, b.splash, b.damage * 0.6);
        if (stats.chain > 0) applyChain(e.x, e.y, stats.chain, b.damage * 0.5);
        if (b.split && !b.isSplit) {
          [-0.5, 0.5].forEach(a => bullets.push({
            x: e.x, y: e.y,
            vx: Math.sin(a) * BULLET_SPEED, vy: -Math.cos(a) * BULLET_SPEED,
            w: 3, h: 10, pierce: 0, damage: b.damage * 0.5, homing: 0, splash: 0,
            split: false, isSplit: true, crit: false, dead: false
          }));
        }
      }
    });

    // ---- ramming the player ---- (scaled by the ship's own hitbox)
    if (!e.dead &&
        Math.abs(player.x-e.x) < st.r*0.6 + player.w*0.35 &&
        Math.abs(player.y-e.y) < st.r*0.6 + player.h*0.28) {
      hitPlayer();
      if (e.kind === 'kamikaze') {
        FX.explode(e.x, e.y, st.boom, st.color);
        Sound.play('explode');
        e.dead = true;
      }
    }
  });

  // Enemy bullets hit player
  enemyBullets.forEach(b => {
    if (b.dead) return;
    if (Math.abs(b.x-player.x) < b.r + player.w*0.30 && Math.abs(b.y-player.y) < b.r + player.h*0.26) {
      b.dead = true;
      hitPlayer();
    }
  });

  // Hit-flash decay
  enemies.forEach(e => { if (e.flash > 0) e.flash--; });
  asteroids.forEach(a => { if (a.flash > 0) a.flash--; });
  if (player.muzzle > 0) player.muzzle--;

  // Reap everything in one place, after all collision passes have run.
  // Player bullets aren't all forward-firing any more (rear cannon fires
  // downward, side pods fire sideways), so cull on all four edges rather
  // than only the top or they'd fly off-screen forever and just pile up
  // until capArray trims them from the front of the array.
  bullets = bullets.filter(b => !b.dead && b.y > -20 && b.y < H+20 && b.x > -20 && b.x < W+20);
  enemyBullets = enemyBullets.filter(b => !b.dead && b.y < H+20 && b.x > -20 && b.x < W+20);
  asteroids = asteroids.filter(a => a.y < H + 60 && a.hp > 0);
  // Turrets retreat off the top, so cull in both directions.
  enemies = enemies.filter(e => !e.dead && e.y < H+50 && e.y > -120);
  capAll();

  // Level banner
  if (levelBanner) { levelBanner.life--; if (levelBanner.life <= 0) levelBanner = null; }

  // Combo timer
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }

  updateEffects();

  score++;
}

// ===== RENDER =====

function drawBg() {
  ctx.fillStyle = '#020818';
  ctx.fillRect(0, 0, W, H);

  nebulae.forEach(n => {
    let ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.rx);
    ng.addColorStop(0, `hsla(${n.hue},70%,40%,0.07)`);
    ng.addColorStop(1, 'transparent');
    ctx.fillStyle = ng;
    ctx.beginPath(); ctx.ellipse(n.x, n.y, n.rx, n.ry, 0, 0, Math.PI*2); ctx.fill();
  });

  starLayers.forEach((layer, li) => {
    const col = li===2 ? `rgba(200,220,255,0.9)` : li===1 ? `rgba(180,200,255,0.6)` : `rgba(160,180,255,0.4)`;
    layer.forEach(s => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
  });
}

function draw() {
  // The shop owns the whole frame: it draws its own background and does not
  // want the screen-shake transform or the play HUD drawn under/over it.
  if (state === 'shop') { drawShop(); return; }
  if (state === 'voidbirth') { drawVoidbirth(); return; }

  ctx.save();
  ctx.translate(FX.shakeX, FX.shakeY);

  drawBg();

  if (state !== 'start') {
    player.trail.forEach(t => {
      let alpha = (t.life/12)*0.3;
      ctx.beginPath(); ctx.arc(t.x, t.y, 5, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,150,255,${alpha})`; ctx.fill();
    });

    asteroids.forEach(drawAsteroid);
    enemies.forEach(drawEnemy);
    if (boss) drawBoss(boss);

    bullets.forEach(b => {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI/2);   // point along travel
      const bg2 = ctx.createLinearGradient(0, 0, 0, b.h);
      bg2.addColorStop(0, '#ffffff');
      bg2.addColorStop(0.3, b.crit ? '#ffdd33' : b.isSplit ? '#88ddff' : b.pierce > 0 ? '#ffbbff' : '#88ffff');
      bg2.addColorStop(1, 'rgba(0,200,255,0)');
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.roundRect(-b.w/2, -b.h, b.w, b.h, 2); ctx.fill();
      ctx.restore();
    });

    enemyBullets.forEach(b => {
      ctx.save(); ctx.translate(b.x, b.y);
      let eg = ctx.createRadialGradient(0,0,1,0,0,b.r);
      eg.addColorStop(0, b.elite ? '#ffffff' : '#ffcc00');
      eg.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    if (state === 'play') {
      drawShip(player.x, player.y, player.invincible, player.shieldCharges, frame, player.muzzle);
      drawDrones();
      drawSingularity();
    }

    particles.forEach(p => {
      let alpha = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if (p.type === 'spark') {
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillRect(-p.r*3, -p.r/2, p.r*3, p.r);
      } else if (p.type === 'chunk') {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
        ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 0.8;
        ctx.strokeRect(-p.r, -p.r*0.7, p.r*2, p.r*1.4);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });

    // Shockwave rings and the additive flash at the heart of each blast.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    FX.glows.forEach(g => {
      const a = g.life / g.maxLife;
      const gr = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r);
      gr.addColorStop(0, `rgba(255,255,255,${0.45*a})`);
      gr.addColorStop(0.35, g.color);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = a*0.55;
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();

    FX.rings.forEach(r => {
      const a = r.life / r.maxLife;
      ctx.save();
      ctx.globalAlpha = a*0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 1 + 3*a;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    });

    flashText.forEach(f => {
      let alpha = f.life / 60;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = f.color; ctx.shadowBlur = 8;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    drawHUD();
    if (boss && boss.dying === 0) drawBossBar(boss);
    if (bossWarning > 0) drawBossWarning();

    if (levelBanner) {
      let alpha = Math.min(1, levelBanner.life < 30 ? levelBanner.life/30 : (120-levelBanner.life)/30);
      if (alpha > 1) alpha = 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = 'rgba(0,0,40,0.7)';
      ctx.fillRect(0, H/2-30, W, 60);
      ctx.fillStyle = '#00ffff';
      ctx.font = 'bold 32px monospace';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 20;
      ctx.fillText(levelBanner.text, W/2, H/2+12);
      ctx.restore();
    }
  }

  ctx.restore(); // end shake

  // Colour drains out of the scene across the dying beat.
  if (state === 'dying') {
    const t = 1 - (dyingTimer / 75);
    ctx.save();
    ctx.fillStyle = `rgba(12,2,0,${0.55*t})`;
    ctx.fillRect(0, 0, W, H);
    const vg = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(0,0,0,${0.7*t})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (state === 'start') drawStart();
  if (state === 'dead') drawGameOver();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,30,0.6)';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = '#00ffff';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE: ' + score.toLocaleString(), 10, 18);
  ctx.fillStyle = '#6688bb';
  ctx.font = '11px monospace';
  ctx.fillText('BEST: ' + hiScore.toLocaleString(), 10, 34);

  ctx.fillStyle = '#ffdd44';
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LV ' + level, W/2, 18);

  // Combo meter — drains as the window closes, colour steps with the multiplier.
  if (combo > 1) {
    const mult = comboMultiplier();
    const tierCol = mult >= 6 ? '#ff44aa' : mult >= 4 ? '#ff8800' : mult >= 2 ? '#ffdd00' : '#66ddff';
    const bw = 74, bx = W/2 - bw/2, by = 26;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = tierCol;
    ctx.fillRect(bx, by, bw*(comboTimer/120), 4);
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('x' + mult + '  (' + combo + ')', W/2, by + 15);
  }

  // Lives are no longer capped at the ship's 2-4 starting lives: REPAIR KIT
  // adds up to 2, IMMORTAL ENGINE 1, and VAMPIRIC CORE has no ceiling at all.
  // Draw up to LIVES_PIP_CAP pips and collapse the rest into "+N", the same
  // way drawScrapAndBuild handles a build list that outgrows its column.
  const LIVES_PIP_CAP = 5;
  const pipSlots = Math.max(3, Math.min(lives, LIVES_PIP_CAP));
  const overflowLives = Math.max(0, lives - LIVES_PIP_CAP);
  for (let i = 0; i < pipSlots; i++) {
    let lx = W - 20 - i*26;
    ctx.save(); ctx.translate(lx, 18); ctx.scale(0.6, 0.6);
    if (i < lives) {
      ctx.fillStyle = '#3399ff';
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.fill();
    } else {
      ctx.strokeStyle = '#224466'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,8); ctx.lineTo(-10,8); ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }
  if (overflowLives > 0) {
    ctx.fillStyle = '#3399ff';
    ctx.font = 'bold 10px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('+' + overflowLives, W - 20 - pipSlots*26 + 12, 22);
  }

  // Shield/phase readouts drop below the boss health bar when a fight is live.
  let barY = (boss && boss.dying === 0) ? 70 : 48;
  // Shield is a charge count now, not a fraction of a timer, so it draws as
  // one pip per charge rather than a draining bar.
  if (player.shieldCharges > 0) {
    ctx.fillStyle = '#00ccff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('SHIELD', 8, barY+9);
    for (let i = 0; i < player.shieldCharges; i++) {
      ctx.beginPath(); ctx.arc(54 + i*14, barY+5, 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,200,255,0.35)'; ctx.fill();
      ctx.strokeStyle = '#00ccff'; ctx.lineWidth = 1; ctx.stroke();
    }
    barY += 20;
  }
  // Phase Drive: a lit pip when the free hit is banked, a filling bar while it
  // recharges, so the player can tell whether they are covered right now.
  if (stats.phaseDrive) {
    ctx.fillStyle = '#aa66ff'; ctx.font='9px monospace'; ctx.textAlign='left';
    ctx.fillText('PHASE', 8, barY+9);
    if (player.phaseCharge > 0) {
      ctx.beginPath(); ctx.arc(54, barY+5, 5, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(170,102,255,0.45)'; ctx.fill();
      ctx.strokeStyle = '#aa66ff'; ctx.lineWidth = 1; ctx.stroke();
    } else {
      const frac = player.phaseDriveTimer / RLCore.PHASE_DRIVE_FRAMES;
      ctx.strokeStyle = 'rgba(170,102,255,0.5)'; ctx.lineWidth = 1;
      ctx.strokeRect(48, barY+1, 60, 8);
      ctx.fillStyle = 'rgba(170,102,255,0.55)';
      ctx.fillRect(48, barY+1, 60*frac, 8);
    }
    barY += 20;
  }

  drawScrapAndBuild();
  drawMuteIcon(MUTE_RECT_PLAY);
}

// Scrap readout plus the current build (owned upgrades), drawn down the
// left side under the boss/shield/phase readouts. Fixed anchor at y=124: the
// rows above it top out around y=109 in the worst case (boss bar + shield
// + phase all live at once), so this always clears them with margin.
// The player only ever moves horizontally at a fixed y=H-120=600, and the
// list is capped well short of that, so it can never sit over the ship.
function drawScrapAndBuild() {
  ctx.textAlign = 'left';
  ctx.font = 'bold 12px monospace';
  ctx.fillStyle = '#5577aa';
  ctx.fillText('SCRAP', 14, 124);
  ctx.fillStyle = '#ffdd44';
  ctx.fillText(Math.floor(scrap).toLocaleString(), 62, 124);

  if (buildCacheVersion !== runUpgradesVersion) rebuildBuildCache();
  const n = buildCache.length;
  if (n === 0) return;

  ctx.font = '8px monospace';
  ctx.fillStyle = 'rgba(150,175,200,0.55)';
  ctx.fillText('BUILD', 14, 138);

  // Two columns of up to 8 rows (16 slots). Six COMMON and six UNCOMMON
  // upgrades can each stack to 5, plus up to ~17 non-stacking uniques, so a
  // maxed-out run can hold ~29 distinct entries -- far more than fits on a
  // 720px canvas. Past the cap, the last slot collapses into "+N MORE"
  // instead of letting the list run off the bottom of the screen.
  const perCol = 8, maxSlots = perCol * 2, rowH = 12, startY = 150, colX = [14, 180];
  const overflow = n > maxSlots;
  const showCount = overflow ? maxSlots - 1 : n;

  for (let i = 0; i < showCount; i++) {
    const col = i < perCol ? 0 : 1;
    const row = i % perCol;
    const x = colX[col], rowTop = startY + row * rowH;
    const o = buildCache[i];
    ctx.fillStyle = o.color;
    ctx.fillRect(x, rowTop, 6, 6);
    ctx.fillStyle = 'rgba(200,220,240,0.75)';
    ctx.fillText(o.name + (o.stacks > 1 ? ' x' + o.stacks : ''), x + 10, rowTop + 6);
  }

  if (overflow) {
    const row = (maxSlots - 1) % perCol;
    const rowTop = startY + row * rowH;
    ctx.fillStyle = 'rgba(150,175,200,0.7)';
    ctx.fillText('+' + (n - showCount) + ' MORE', colX[1] + 10, rowTop + 6);
  }
}

function drawMuteIcon(r) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  const on = !Sound.muted;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = on ? 'rgba(0,200,255,0.75)' : 'rgba(120,140,160,0.55)';
  ctx.fillStyle   = on ? 'rgba(0,200,255,0.75)' : 'rgba(120,140,160,0.55)';
  ctx.lineWidth = 1.6;
  // Speaker body
  ctx.beginPath();
  ctx.moveTo(-7, -3); ctx.lineTo(-3, -3); ctx.lineTo(1, -8);
  ctx.lineTo(1, 8); ctx.lineTo(-3, 3); ctx.lineTo(-7, 3);
  ctx.closePath(); ctx.fill();
  if (on) {
    // Two arcs of sound
    ctx.beginPath(); ctx.arc(2, 0, 5, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(2, 0, 9, -0.9, 0.9); ctx.stroke();
  } else {
    // Crossed out
    ctx.beginPath(); ctx.moveTo(4, -5); ctx.lineTo(11, 5);
    ctx.moveTo(11, -5); ctx.lineTo(4, 5); ctx.stroke();
  }
  ctx.restore();
}

function drawChevron(r, dir, enabled) {
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  ctx.save();
  ctx.strokeStyle = enabled ? 'rgba(0,220,255,0.85)' : 'rgba(90,110,130,0.35)';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // dir -1 points left, +1 points right: the apex sits on the dir side.
  ctx.beginPath();
  ctx.moveTo(cx - dir*5, cy - 10);
  ctx.lineTo(cx + dir*5, cy);
  ctx.lineTo(cx - dir*5, cy + 10);
  ctx.stroke();

}
