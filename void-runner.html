      const hg = ctx.createRadialGradient(0, 0, 20, 0, 0, 82);
      hg.addColorStop(0, 'rgba(80,255,140,0)');
      hg.addColorStop(1, 'rgba(80,255,140,' + (0.30 * a).toFixed(2) + ')');
      ctx.fillStyle = hg;
      ctx.fill();
    }
  },

  // Threads from every live brood member back to the mother, so the source of
  // the healing is a thing you can see rather than a number you have to infer.
  paintWorld(b) {
    if (b.healGlow <= 0.03) return;
    ctx.save();
    ctx.lineWidth = 1.4;
    let drawn = 0;
    for (let i = 0; i < enemies.length && drawn < 16; i++) {
      const e = enemies[i];
      if (e.dead) continue;
      drawn++;
      ctx.strokeStyle = 'rgba(110,255,150,' + (0.10 + 0.28 * b.healGlow).toFixed(2) + ')';
      ctx.beginPath();
      ctx.moveTo(b.x, b.y + 20);
      const mx = (b.x + e.x) / 2 + Math.sin(frame * 0.05 + i) * 18;
      const my = (b.y + e.y) / 2;
      ctx.quadraticCurveTo(mx, my, e.x, e.y);
      ctx.stroke();
    }
    ctx.restore();
  },

  title(b) {
    const n = hiveempressBrood();
    if (n > 0) return 'REGENERATING — BROOD ' + n + ' ALIVE';
    return 'BROOD CLEARED — SHE CANNOT HEAL';
  }
};


// ---------------------------------------------------------------------------
// L200 — THE CARTOGRAPHER
// Mechanic: it surveys the arena and then deletes parts of it. A 4x6 grid is
// projected over the play area; a pattern of cells lights, pulses for ~50
// frames while projector beams walk out to them, and then detonates. Standing
// in a lit cell at the moment of detonation costs a life.
//
// Fairness is enforced structurally, not by eye: no pattern may light more
// than half the grid, and at least three cells in the bottom two rows — the
// band the player actually lives in — are always guaranteed safe.
// ---------------------------------------------------------------------------

const CARTOGRAPHER_COLS = 4;
const CARTOGRAPHER_ROWS = 6;
const CARTOGRAPHER_Y0 = 240;
const CARTOGRAPHER_CW = 480 / CARTOGRAPHER_COLS;   // 120
const CARTOGRAPHER_CH = (720 - CARTOGRAPHER_Y0) / CARTOGRAPHER_ROWS; // 80

function cartographerMul(px) { return px / Math.max(0.001, difficulty().bulletSpeed); }

function cartographerIndex(c, r) { return r * CARTOGRAPHER_COLS + c; }
function cartographerCX(c) { return c * CARTOGRAPHER_CW + CARTOGRAPHER_CW / 2; }
function cartographerCY(r) { return CARTOGRAPHER_Y0 + r * CARTOGRAPHER_CH + CARTOGRAPHER_CH / 2; }

// Cells in spiral order, computed once, used by the phase-3 pattern.
const CARTOGRAPHER_SPIRAL = (function () {
  const order = [];
  let top = 0, bottom = CARTOGRAPHER_ROWS - 1, left = 0, right = CARTOGRAPHER_COLS - 1;
  while (top <= bottom && left <= right) {
    for (let c = left; c <= right; c++) order.push(cartographerIndex(c, top));
    top++;
    for (let r = top; r <= bottom; r++) order.push(cartographerIndex(right, r));
    right--;
    if (top <= bottom) { for (let c = right; c >= left; c--) order.push(cartographerIndex(c, bottom)); bottom--; }
    if (left <= right) { for (let r = bottom; r >= top; r--) order.push(cartographerIndex(left, r)); left++; }
  }
  return order;
})();

function cartographerBuild(ph) {
  const total = CARTOGRAPHER_COLS * CARTOGRAPHER_ROWS;
  const cells = [];
  for (let i = 0; i < total; i++) cells.push(false);

  const menu = ph <= 1 ? ['ROWS', 'COLUMNS']
             : ph === 2 ? ['CHECKER', 'CROSS', 'COLUMNS']
             : ph === 3 ? ['DIAGONAL', 'SPIRAL', 'CHECKER']
             : ['SPIRAL', 'CROSS', 'DIAGONAL', 'CHECKER'];
  const name = menu[Math.floor(Math.random() * menu.length)];
  const k = Math.floor(Math.random() * 2);
  let c, r;

  if (name === 'ROWS') {
    for (r = 0; r < CARTOGRAPHER_ROWS; r++) {
      if ((r + k) % 2 === 0) for (c = 0; c < CARTOGRAPHER_COLS; c++) cells[cartographerIndex(c, r)] = true;
    }
  } else if (name === 'COLUMNS') {
    for (c = 0; c < CARTOGRAPHER_COLS; c++) {
      if ((c + k) % 2 === 0) for (r = 0; r < CARTOGRAPHER_ROWS; r++) cells[cartographerIndex(c, r)] = true;
    }
  } else if (name === 'CHECKER') {
    for (r = 0; r < CARTOGRAPHER_ROWS; r++) for (c = 0; c < CARTOGRAPHER_COLS; c++) {
      if ((r + c + k) % 2 === 0) cells[cartographerIndex(c, r)] = true;
    }
  } else if (name === 'CROSS') {
    const rr = 1 + Math.floor(Math.random() * (CARTOGRAPHER_ROWS - 2));
    const cc = Math.floor(Math.random() * CARTOGRAPHER_COLS);
    for (c = 0; c < CARTOGRAPHER_COLS; c++) cells[cartographerIndex(c, rr)] = true;
    for (r = 0; r < CARTOGRAPHER_ROWS; r++) cells[cartographerIndex(cc, r)] = true;
  } else if (name === 'DIAGONAL') {
    for (r = 0; r < CARTOGRAPHER_ROWS; r++) for (c = 0; c < CARTOGRAPHER_COLS; c++) {
      if ((r + c + k) % 3 === 0) cells[cartographerIndex(c, r)] = true;
    }
  } else { // SPIRAL
    const start = Math.floor(Math.random() * total);
    const len = 9;
    for (let i = 0; i < len; i++) cells[CARTOGRAPHER_SPIRAL[(start + i) % total]] = true;
  }

  // --- fairness pass ----------------------------------------------------
  const maxLit = 8 + Math.min(4, ph);          // 9..12 of 24, never over half
  const litList = function () {
    const out = [];
    for (let i = 0; i < total; i++) if (cells[i]) out.push(i);
    return out;
  };
  let lit = litList();
  while (lit.length > maxLit) {
    const pick = Math.floor(Math.random() * lit.length);
    cells[lit[pick]] = false;
    lit.splice(pick, 1);
  }

  // Guarantee three safe cells in the bottom two rows — the band the player
  // flies in. Without this a pattern could technically be survivable and still
  // read as "nowhere to go".
  const bottomStart = cartographerIndex(0, CARTOGRAPHER_ROWS - 2);
  const countSafeBottom = function () {
    let n = 0;
    for (let i = bottomStart; i < total; i++) if (!cells[i]) n++;
    return n;
  };
  let guard = 0;
  while (countSafeBottom() < 3 && guard++ < 40) {
    const opts = [];
    for (let i = bottomStart; i < total; i++) if (cells[i]) opts.push(i);
    if (!opts.length) break;
    cells[opts[Math.floor(Math.random() * opts.length)]] = false;
  }
  // Absolute backstop: something is always safe.
  let anySafe = false;
  for (let i = 0; i < total; i++) if (!cells[i]) anySafe = true;
  if (!anySafe) cells[total - 1] = false;

  return { cells: cells, name: name };
}

BOSS.cartographer = {
  w: 132, h: 66,

  init(b) {
    b.cells = [];
    for (let i = 0; i < CARTOGRAPHER_COLS * CARTOGRAPHER_ROWS; i++) b.cells.push(false);
    b.gstate = 'idle';
    b.gt = 0;
    b.idleFor = 46;
    b.surveyFor = 54;
    b.patName = 'IDLE';
    b.hitCd = 0;
    b.reticle = 0;
    b.pinTimer = 0;
    b.arm = 0;
  },

  onPhase(b, ph) {
    // Later phases survey faster and rest less, but the telegraph never drops
    // below 40 frames — it is the whole contract of the fight.
    b.surveyFor = Math.max(40, 56 - (ph - 1) * 5);
    b.idleFor = Math.max(26, 50 - (ph - 1) * 7);
    b.gstate = 'idle';
    b.gt = 0;
    for (let i = 0; i < b.cells.length; i++) b.cells[i] = false;
  },

  move(b) {
    // It tracks you slowly and precisely, like an instrument being aimed.
    b.x += (player.x - b.x) * 0.012;
    b.x = Math.max(76, Math.min(W - 76, b.x));
    b.y = 150;
  },

  think(b, ph) {
    b.gt++;
    b.reticle += 0.03;
    b.arm += 0.02;
    if (b.hitCd > 0) b.hitCd--;

    if (b.gstate === 'idle') {
      if (b.gt >= b.idleFor) {
        const built = cartographerBuild(ph);
        b.cells = built.cells;
        b.patName = built.name;
        b.gstate = 'survey';
        b.gt = 0;
        Sound.play('warning');
      }

    } else if (b.gstate === 'survey') {
      if (b.gt === Math.floor(b.surveyFor * 0.55)) Sound.play('laser');
      if (b.gt >= b.surveyFor) {
        b.gstate = 'fire';
        b.gt = 0;
        // --- detonation ---------------------------------------------------
        const c = Math.max(0, Math.min(CARTOGRAPHER_COLS - 1, Math.floor(player.x / CARTOGRAPHER_CW)));
        const rRaw = Math.floor((player.y - CARTOGRAPHER_Y0) / CARTOGRAPHER_CH);
        if (rRaw >= 0 && rRaw < CARTOGRAPHER_ROWS && b.cells[cartographerIndex(c, rRaw)] && b.hitCd <= 0) {
          b.hitCd = 50;
          hitPlayer();
        }
        for (let i = 0; i < b.cells.length; i++) {
          if (!b.cells[i]) continue;
          const cc = i % CARTOGRAPHER_COLS, rr = Math.floor(i / CARTOGRAPHER_COLS);
          if (Math.random() < 0.34) FX.explode(cartographerCX(cc), cartographerCY(rr), 24, '#cfefff');
        }
        FX.addShake(16);
        Sound.play('explode');
      }

    } else { // fire — the afterimage, then reset
      if (b.gt >= 18) {
        for (let i = 0; i < b.cells.length; i++) b.cells[i] = false;
        b.gstate = 'idle';
        b.gt = 0;
        b.patName = 'IDLE';
      }
    }

    // A sparse secondary: survey pins, thin and slow, so the fight is not
    // purely a dance. They are never the thing that kills you.
    b.pinTimer++;
    if (ph >= 2 && b.pinTimer >= 168 - ph * 14) {
      b.pinTimer = 0;
      bossAimed(b.x, b.y + 26, ph >= 4 ? [-0.3, 0, 0.3] : [0], cartographerMul(4.0), 4);
      Sound.play('hit');
    }
  },

  paint(b) {
    const line = bossTint(b, '#7fe3ff', '#a9d0ff', '#ffd3e6');

    // spar — a wide, thin instrument boom
    ctx.fillStyle = '#0e1620';
    ctx.fillRect(-64, -6, 128, 12);
    ctx.strokeStyle = line;
    ctx.lineWidth = 1.6;
    ctx.strokeRect(-64, -6, 128, 12);

    // calipers, opening and closing
    const open = 14 + Math.sin(b.arm) * 8;
    ctx.strokeStyle = line;
    ctx.lineWidth = 3;
    [-1, 1].forEach(sd => {
      ctx.beginPath();
      ctx.moveTo(sd * 60, 0);
      ctx.lineTo(sd * (74 + open * 0.3), -22);
      ctx.moveTo(sd * 60, 0);
      ctx.lineTo(sd * (74 + open * 0.3), 22);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sd * (74 + open * 0.3), 0, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#04121a';
      ctx.fill();
      ctx.stroke();
    });

    // body — a cold hexagonal instrument housing
    ctx.beginPath();
    ctx.moveTo(-34, -12);
    ctx.lineTo(-16, -30);
    ctx.lineTo(16, -30);
    ctx.lineTo(34, -12);
    ctx.lineTo(26, 24);
    ctx.lineTo(-26, 24);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -30, 0, 24);
    g.addColorStop(0, '#26394c');
    g.addColorStop(1, '#060b12');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = line;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    bossFlash(b);

    // graduations along the boom
    ctx.strokeStyle = 'rgba(160,220,255,0.5)';
    ctx.lineWidth = 1;
    for (let i = -6; i <= 6; i++) {
      if (i === 0) continue;
      ctx.beginPath();
      ctx.moveTo(i * 9.5, -6);
      ctx.lineTo(i * 9.5, i % 3 === 0 ? 2 : -1);
      ctx.stroke();
    }

    // projector aperture with a rotating reticle
    const charged = b.gstate === 'survey' ? Math.min(1, b.gt / Math.max(1, b.surveyFor)) : 0;
    ctx.beginPath();
    ctx.arc(0, 2, 13, 0, Math.PI * 2);
    ctx.fillStyle = b.gstate === 'fire' ? '#ffffff' : 'rgba(10,26,40,0.95)';
    ctx.fill();
    ctx.strokeStyle = line;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (charged > 0) {
      ctx.fillStyle = 'rgba(190,240,255,' + (0.25 + 0.6 * charged).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(0, 2, 3 + charged * 9, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.save();
    ctx.translate(0, 2);
    ctx.rotate(b.reticle);
    ctx.strokeStyle = 'rgba(190,240,255,0.75)';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 15, Math.sin(a) * 15);
      ctx.lineTo(Math.cos(a) * 21, Math.sin(a) * 21);
      ctx.stroke();
    }
    ctx.restore();

    // antennae
    ctx.strokeStyle = 'rgba(190,240,255,0.65)';
    ctx.lineWidth = 1.4;
    [-1, 1].forEach(sd => {
      ctx.beginPath();
      ctx.moveTo(sd * 12, -30);
      ctx.lineTo(sd * 20, -46);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sd * 20, -48, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = charged > 0.5 ? '#ffffff' : '#3d7a99';
      ctx.fill();
    });
  },

  // The survey grid itself.
  paintWorld(b) {
    ctx.save();

    // baseline lattice — always visible, so the cells are a place you already
    // know the shape of before anything lights up
    ctx.strokeStyle = 'rgba(120,190,225,0.16)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= CARTOGRAPHER_COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CARTOGRAPHER_CW, CARTOGRAPHER_Y0);
      ctx.lineTo(c * CARTOGRAPHER_CW, H);
      ctx.stroke();
    }
    for (let r = 0; r <= CARTOGRAPHER_ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, CARTOGRAPHER_Y0 + r * CARTOGRAPHER_CH);
      ctx.lineTo(W, CARTOGRAPHER_Y0 + r * CARTOGRAPHER_CH);
      ctx.stroke();
    }

    const surveying = b.gstate === 'survey';
    const firing = b.gstate === 'fire';
    if (!surveying && !firing) { ctx.restore(); return; }

    const t = surveying ? Math.min(1, b.gt / Math.max(1, b.surveyFor)) : 1;
    const pulse = 0.5 + 0.5 * Math.sin(b.gt * (0.18 + t * 0.35));

    for (let i = 0; i < b.cells.length; i++) {
      if (!b.cells[i]) continue;
      const c = i % CARTOGRAPHER_COLS, r = Math.floor(i / CARTOGRAPHER_COLS);
      const x = c * CARTOGRAPHER_CW, y = CARTOGRAPHER_Y0 + r * CARTOGRAPHER_CH;

      if (firing) {
        const f = 1 - b.gt / 18;
        ctx.fillStyle = 'rgba(230,248,255,' + (0.72 * f).toFixed(3) + ')';
        ctx.fillRect(x, y, CARTOGRAPHER_CW, CARTOGRAPHER_CH);
        ctx.strokeStyle = 'rgba(255,255,255,' + f.toFixed(2) + ')';
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 1.5, y + 1.5, CARTOGRAPHER_CW - 3, CARTOGRAPHER_CH - 3);
        continue;
      }

      // telegraph: fills in from the top as the survey completes and pulses
      // harder the closer it gets to firing
      const a = 0.10 + 0.30 * t + 0.16 * pulse * t;
      ctx.fillStyle = 'rgba(90,200,255,' + a.toFixed(3) + ')';
      ctx.fillRect(x, y, CARTOGRAPHER_CW, CARTOGRAPHER_CH);
      ctx.strokeStyle = 'rgba(190,240,255,' + (0.35 + 0.5 * t).toFixed(2) + ')';
      ctx.lineWidth = 1.6;
      ctx.strokeRect(x + 1, y + 1, CARTOGRAPHER_CW - 2, CARTOGRAPHER_CH - 2);

      // corner brackets — the "this one is armed" mark
      const bl = 12 + 8 * t;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.3 + 0.55 * t).toFixed(2) + ')';
      ctx.lineWidth = 2;
      [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(s => {
        const cx = s[0] > 0 ? x + 3 : x + CARTOGRAPHER_CW - 3;
        const cy = s[1] > 0 ? y + 3 : y + CARTOGRAPHER_CH - 3;
        ctx.beginPath();
        ctx.moveTo(cx + s[0] * bl, cy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx, cy + s[1] * bl);
        ctx.stroke();
      });

      // projector beam walking out from the aperture
      if (t > 0.25) {
        ctx.strokeStyle = 'rgba(150,225,255,' + (0.06 + 0.14 * t).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + 2);
        ctx.lineTo(cartographerCX(c), cartographerCY(r));
        ctx.stroke();
      }
    }

    // safe cells get a quiet green tick so "where do I stand" is legible at a
    // glance rather than by elimination
    if (surveying && t > 0.35) {
      ctx.strokeStyle = 'rgba(120,255,180,' + (0.18 + 0.22 * t).toFixed(2) + ')';
      ctx.lineWidth = 2;
      for (let i = 0; i < b.cells.length; i++) {
        if (b.cells[i]) continue;
        const c = i % CARTOGRAPHER_COLS, r = Math.floor(i / CARTOGRAPHER_COLS);
        const cx = cartographerCX(c), cy = cartographerCY(r);
        ctx.beginPath();
        ctx.moveTo(cx - 7, cy);
        ctx.lineTo(cx - 2, cy + 5);
        ctx.lineTo(cx + 7, cy - 6);
        ctx.stroke();
      }
    }

    ctx.restore();
  },

  title(b) {
    if (b.gstate === 'survey') {
      const left = Math.max(0, Math.ceil((b.surveyFor - b.gt) / 60 * 10) / 10);
      return 'SURVEY ' + b.patName + ' — DETONATION IN ' + left.toFixed(1) + 's';
    }
    if (b.gstate === 'fire') return 'CELLS DELETED';
    return 'PLOTTING — STAND CLEAR OF LIT CELLS';
  }
};


// ---------------------------------------------------------------------------
// L250 — NULLPOINT
// Mechanic: it jams your upgrades. Every so often it spools a null field and
// switches ONE of your stats off for six seconds. Never two at once, never
// damage to zero, always announced by name.
//
// The whole risk of this boss is a jam outliving the fight and permanently
// corrupting a run, so the release is deliberately over-engineered:
//
//   * the jam remembers the exact object it wrote to (stats is reassigned by
//     recomputeStats(), so writing back to "whatever stats is now" is wrong);
//   * think() releases on timeout, onPhase() releases on every phase change;
//   * damage() releases the instant a hit is lethal, because think() is never
//     called again once dying starts;
//   * paint() and paintWorld() both release unconditionally when b.dying > 0
//     or b.hp <= 0 — and those two run every frame of the death cascade, so
//     they are the backstop that catches anything the others miss;
//   * every one of those paths also releases if the jam has simply been alive
//     longer than its own hard deadline, so a stalled state machine cannot
//     hold a stat hostage.
// ---------------------------------------------------------------------------

function nullpointMul(px) { return px / Math.max(0.001, difficulty().bulletSpeed); }

// Only stats that are (a) numeric, (b) actually doing something for this
// player, and (c) safe to suppress without making the boss unkillable.
function nullpointCandidates(s) {
  const out = [];
  if (!s) return out;
  const num = k => typeof s[k] === 'number' && isFinite(s[k]);
  // Damage is only ever halved, never removed: a jam must slow you down, not
  // stop the fight.
  if (num('damage') && s.damage > 0) out.push({ key: 'damage', label: 'DAMAGE', to: s.damage * 0.45 });
  if (num('fireRate') && s.fireRate > 0) out.push({ key: 'fireRate', label: 'FIRE RATE', to: s.fireRate * 1.75 });
  if (num('pierce') && s.pierce > 0) out.push({ key: 'pierce', label: 'PIERCE', to: 0 });
  if (num('homing') && s.homing > 0) out.push({ key: 'homing', label: 'HOMING', to: 0 });
  if (num('splash') && s.splash > 0) out.push({ key: 'splash', label: 'FLAK BURST', to: 0 });
  if (num('chain') && s.chain > 0) out.push({ key: 'chain', label: 'CHAIN', to: 0 });
  if (num('critChance') && s.critChance > 0) out.push({ key: 'critChance', label: 'CRIT', to: 0 });
  if (num('extraShots') && s.extraShots > 0) out.push({ key: 'extraShots', label: 'MULTISHOT', to: 0 });
  if (num('drones') && s.drones > 0) out.push({ key: 'drones', label: 'DRONES', to: 0 });
  if (num('bossDamageMul') && s.bossDamageMul > 1.005) out.push({ key: 'bossDamageMul', label: 'SIEGE OPTICS', to: 1 });
  if (num('ricochet') && s.ricochet > 0) out.push({ key: 'ricochet', label: 'RICOCHET', to: 0 });
  if (num('burn') && s.burn > 0) out.push({ key: 'burn', label: 'INCENDIARY', to: 0 });
  return out;
}

// The single point of truth for undoing a jam. Idempotent, never throws, and
// writes back to the object the jam was taken from rather than to whatever
// `stats` happens to point at now.
function nullpointRelease(b, quiet) {
  if (!b || !b.jam) return;
  const j = b.jam;
  b.jam = null;
  try {
    if (j.obj && typeof j.obj === 'object') j.obj[j.key] = j.orig;
  } catch (e) { /* nothing here is worth taking the frame down for */ }
  if (!quiet) {
    try {
      addFlashText(j.label + ' RESTORED', player.x, player.y - 46, '#88ffcc');
      Sound.play('shieldBreak');
    } catch (e) { /* cosmetic only */ }
  }
}

// Called from paint/paintWorld/damage: the paths that still run when think()
// no longer does.
function nullpointGuard(b) {
  if (!b || !b.jam) return;
  if (b.dying > 0 || b.hp <= 0) { nullpointRelease(b, true); return; }
  if (typeof b.jam.deadline === 'number' && frame > b.jam.deadline) nullpointRelease(b, true);
}

BOSS.nullpoint = {
  w: 122, h: 118,

  init(b) {
    b.jam = null;
    // Cycle: 48 frames spooling, 360 jammed, then a clear window. Phase 1
    // leaves you unjammed 55% of the time and phase 4 about 45%, so the fight
    // escalates and you always get your ship back long enough to notice.
    b.jamCd = 300;          // first jam is telegraphed well after the entrance
    b.spool = 0;            // 0 = idle, otherwise counts up to spoolFor
    b.spoolFor = 48;
    b.jamFor = 360;         // six seconds at 60fps
    b.spin = 0;
    b.implode = null;
    b.implodeCd = 150;
    b.lanceCd = 220;
    b.hover = 0;
    b.jamCount = 0;
  },

  onPhase(b, ph) {
    // A phase change is a state change; nothing survives it.
    nullpointRelease(b, true);
    b.spool = 0;
    b.jamCd = Math.max(280, 440 - ph * 40);
    b.implodeCd = Math.max(110, 170 - ph * 14);
    b.implode = null;
  },

  move(b) {
    b.hover += 0.011;
    const tx = W / 2 + Math.sin(b.hover) * 108;
    b.x += (tx - b.x) * 0.02 + Math.sign(player.x - b.x) * 0.18;
    b.x = Math.max(72, Math.min(W - 72, b.x));
    b.y = 156 + Math.cos(b.hover * 1.6) * 12;
  },

  think(b, ph) {
    b.spin += 0.012;

    // --- jam lifecycle ----------------------------------------------------
    if (b.jam) {
      b.jam.left--;
      if (b.jam.left <= 0 || frame > b.jam.deadline || b.dying > 0 || b.hp <= 0) {
        nullpointRelease(b, false);
        b.jamCd = Math.max(280, 440 - ph * 40);
      }
    } else if (b.spool > 0) {
      b.spool++;
      if (b.spool === 2) { Sound.play('warning'); addFlashText('NULL FIELD', b.x, b.y - 70, '#c9a8ff'); }
      if (b.spool >= b.spoolFor) {
        b.spool = 0;
        const s = stats;
        const opts = nullpointCandidates(s);
        if (opts.length) {
          const pick = opts[Math.floor(Math.random() * opts.length)];
          b.jam = {
            obj: s,                    // the exact object written to
            key: pick.key,
            label: pick.label,
            orig: s[pick.key],
            left: b.jamFor,
            deadline: frame + b.jamFor + 180   // hard wall-clock backstop
          };
          try { s[pick.key] = pick.to; } catch (e) { b.jam = null; }
          if (b.jam) {
            b.jamCount++;
            addFlashText('JAMMED: ' + pick.label, player.x, player.y - 46, '#c9a8ff');
            FX.addShake(18);
            Sound.play('laser');
            spawnParticles(player.x, player.y, '#aa88ff', 22);
          }
        } else {
          b.jamCd = 120;
        }
      }
    } else {
      b.jamCd--;
      if (b.jamCd <= 0) { b.spool = 1; }
    }

    // --- imploding rings ---------------------------------------------------
    // A hollow thing pulls space in around you. The circle is marked on the
    // arena for 42 frames — full ring, every shot's position, every shot's
    // path — and only then does anything spawn. The answer is to walk out of
    // it: the radius is 150 and you get 42 frames, which at the player's own
    // speed is over 200px of travel. Staying put is a choice.
    if (b.implode) {
      b.implode.t++;
      if (b.implode.t >= 42) {
        const n = b.implode.n, rad = b.implode.r, cx = b.implode.cx, cy = b.implode.cy;
        for (let i = 0; i < n; i++) {
          const a = b.implode.off + (i / n) * Math.PI * 2;
          bossShot(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, a + Math.PI, nullpointMul(2.9), 7);
        }
        FX.addShake(12);
        Sound.play('explode');
        b.implode = null;
        b.implodeCd = Math.max(110, 170 - ph * 14);
      }
    } else {
      b.implodeCd--;
      if (b.implodeCd <= 0) {
        const rad = 150;
        // Clamped so the whole ring lands inside the arena — enemyBullets are
        // culled past the edges, and half a ring is not a readable attack.
        b.implode = {
          t: 0,
          n: 9 + ph * 2,
          r: rad,
          cx: Math.max(rad, Math.min(W - rad, player.x)),
          cy: Math.max(H * 0.45, Math.min(H - rad - 20, player.y)),
          off: Math.random() * Math.PI * 2
        };
        Sound.play('warning');
      }
    }

    // --- erasure lances ----------------------------------------------------
    // Slow, fat, aimed. Charged for 40 frames on the hull first (drawn as the
    // inner void collapsing) so it is never a surprise.
    b.lanceCd--;
    if (b.lanceCd === 40) { b.charge = 1; }
    if (b.lanceCd <= 0) {
      b.charge = 0;
      b.lanceCd = Math.max(130, 240 - ph * 24);
      const spread = ph >= 3 ? [-0.34, -0.11, 0.11, 0.34] : [-0.2, 0.2];
      bossAimed(b.x, b.y + 30, spread, nullpointMul(4.6), 9);
      Sound.play('laser');
    }
    if (b.charge) b.charge++;
  },

  damage(b, bl, dmg) {
    // The killing blow never reaches think(): updateBoss starts the death
    // cascade inside the same loop that calls this. Release here.
    if (b.jam && (b.hp - dmg <= 0 || b.dying > 0)) nullpointRelease(b, true);
    else nullpointGuard(b);
    return dmg;
  },

  paint(b) {
    nullpointGuard(b);            // runs every frame, including while dying

    const edge = b.jam ? '#d9b6ff' : bossTint(b, '#7a8ce0', '#9c7ae0', '#c96ad8');
    const chargeK = b.charge ? Math.min(1, b.charge / 40) : 0;

    // Outer frame: a hollow rotating diamond, drawn as line only.
    ctx.save();
    ctx.rotate(b.spin);
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(0, -58); ctx.lineTo(52, 0); ctx.lineTo(0, 58); ctx.lineTo(-52, 0);
    ctx.closePath();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200,170,255,0.35)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -44); ctx.lineTo(39, 0); ctx.lineTo(0, 44); ctx.lineTo(-39, 0);
    ctx.closePath();
    ctx.stroke();
    // inward chevrons — the shape is always pulling toward its own absence
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
      const k = 30 + ((frame * 0.7 + i * 14) % 26);
      ctx.strokeStyle = 'rgba(190,150,255,' + (0.55 - (k - 30) / 26 * 0.45).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.24) * k, Math.sin(a - 0.24) * k);
      ctx.lineTo(Math.cos(a) * (k - 9), Math.sin(a) * (k - 9));
      ctx.lineTo(Math.cos(a + 0.24) * k, Math.sin(a + 0.24) * k);
      ctx.stroke();
    }
    ctx.restore();

    // The absence itself: a ship silhouette cut as a hole. Filled with the
    // deadest black on the canvas and outlined, never shaded.
    ctx.beginPath();
    ctx.moveTo(0, -34);
    ctx.lineTo(15, -6);
    ctx.lineTo(38, 16);
    ctx.lineTo(13, 10);
    ctx.lineTo(9, 30);
    ctx.lineTo(0, 21);
    ctx.lineTo(-9, 30);
    ctx.lineTo(-13, 10);
    ctx.lineTo(-38, 16);
    ctx.lineTo(-15, -6);
    ctx.closePath();
    ctx.fillStyle = '#000000';
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.stroke();
    bossFlash(b);

    // charging an erasure lance: the hole brightens from the inside
    if (chargeK > 0) {
      ctx.beginPath();
      ctx.arc(0, 6, 4 + chargeK * 13, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(220,190,255,' + (0.25 + 0.55 * chargeK).toFixed(2) + ')';
      ctx.fill();
    }

    // spooling a jam: a ring closes on the hull over the whole 48-frame wind-up
    if (b.spool > 0) {
      const t = b.spool / b.spoolFor;
      ctx.strokeStyle = 'rgba(215,170,255,' + (0.35 + 0.55 * t).toFixed(2) + ')';
      ctx.lineWidth = 2 + t * 3;
      ctx.beginPath();
      ctx.arc(0, 0, 96 - t * 44, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash && ctx.setLineDash([]);
    }
    if (b.jam) {
      ctx.strokeStyle = 'rgba(230,200,255,' + (0.3 + 0.3 * Math.sin(frame * 0.2)).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 70, 0, Math.PI * 2);
      ctx.stroke();
    }
  },

  paintWorld(b) {
    nullpointGuard(b);            // second every-frame backstop

    ctx.save();

    // The null field. Colour is genuinely drained inside it via the
    // 'saturation' blend mode where the browser supports it, with a plain grey
    // wash underneath so the effect still reads if it does not.
    const rad = b.jam ? 300 : 200;
    ctx.save();
    try { ctx.globalCompositeOperation = 'saturation'; } catch (e) { /* fall through */ }
    const sg = ctx.createRadialGradient(b.x, b.y, 20, b.x, b.y, rad);
    sg.addColorStop(0, 'rgba(128,128,128,1)');
    sg.addColorStop(0.7, 'rgba(128,128,128,0.75)');
    sg.addColorStop(1, 'rgba(128,128,128,0)');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const wg = ctx.createRadialGradient(b.x, b.y, 20, b.x, b.y, rad);
    wg.addColorStop(0, 'rgba(18,14,26,0.30)');
    wg.addColorStop(1, 'rgba(18,14,26,0)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
    ctx.fill();

    // the imploding ring, marked before it exists
    if (b.implode) {
      const t = b.implode.t / 42;
      const n = b.implode.n, rr = b.implode.r;
      const cx = b.implode.cx, cy = b.implode.cy;
      // the circle you have to be outside of
      ctx.strokeStyle = 'rgba(215,170,255,' + (0.25 + 0.6 * t).toFixed(2) + ')';
      ctx.lineWidth = 1.4 + 2 * t;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.stroke();
      // and the dead centre it is closing on
      ctx.strokeStyle = 'rgba(255,120,160,' + (0.2 + 0.5 * t).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy);
      ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9);
      ctx.stroke();
      for (let i = 0; i < n; i++) {
        const a = b.implode.off + (i / n) * Math.PI * 2;
        const mx = cx + Math.cos(a) * rr, my = cy + Math.sin(a) * rr;
        ctx.fillStyle = 'rgba(235,205,255,' + (0.3 + 0.7 * t).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(mx, my, 2 + 5 * t, 0, Math.PI * 2);
        ctx.fill();
        // the line each shot will travel, so the gaps are readable early
        ctx.strokeStyle = 'rgba(200,160,255,' + (0.08 + 0.22 * t).toFixed(3) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(cx, cy);
        ctx.stroke();
      }
    }

    // While jammed, a tether from the boss to your ship — the fight tells you
    // where the interference is coming from.
    if (b.jam) {
      ctx.strokeStyle = 'rgba(200,150,255,' + (0.16 + 0.14 * Math.sin(frame * 0.18)).toFixed(2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y + 20);
      ctx.quadraticCurveTo((b.x + player.x) / 2 + Math.sin(frame * 0.05) * 40, (b.y + player.y) / 2, player.x, player.y);
      ctx.stroke();
    }

    ctx.restore();
  },

  title(b) {
    if (b.jam) return 'JAMMED: ' + b.jam.label + ' — ' + (Math.max(0, b.jam.left) / 60).toFixed(1) + 's';
    if (b.spool > 0) return 'NULL FIELD SPOOLING';
    return 'SYSTEMS NOMINAL — ' + b.jamCount + ' JAMS SURVIVED';
  }
};
// ---- end boss pack: boss_b ----

const BOSS_W = 112, BOSS_H = 54;

function bossMaxHp(lv) {
  // Hand-set per boss, fitted so a reasonable build at that level kills it in
  // its target time. See the boss table in the pure core.
  return RLCore.bossHp(lv);
}

function bossDef(b) { return (b && BOSS[b.key]) || BOSS.generic; }

function spawnBoss(lv) {
  const info = RLCore.bossFor(lv);
  const hp = info ? info.hp : RLCore.fittedBossHp(lv);
  boss = {
    x: W/2, y: -70, targetY: 150,
    hp, maxHp: hp,
    key: info ? info.key : 'generic',
    name: info ? info.name : 'UNKNOWN CONTACT',
    maxPhases: info ? info.phases : 3,
    composite: info ? info.composite : null,
    ascendant: info ? info.ascendant : 0,
    tier: Math.max(1, Math.round(lv / 10)),
    phase: 1, entering: true, flash: 0,
    attackTimer: 0, minionTimer: 0,
    laser: null, beamCooldown: 0,
    dying: 0, deathTick: 0
  };
  const def = bossDef(boss);
  if (def.init) def.init(boss);
  bossActive = true;
  bossWarning = 110;
  levelBanner = null;          // the warning owns the screen
  Sound.play('warning');
  Music.setBoss(true);
}

// Phases are even slices of the health bar, so a seven-phase mothership and a
// two-phase Scrapjaw both change at predictable, readable moments.
function bossPhaseFor(b) {
  const n = Math.max(1, b.maxPhases || 3);
  const f = b.hp / b.maxHp;
  return Math.min(n, Math.max(1, n - Math.floor(f * n)));
}

function updateBoss() {
  const b = boss;
  const def = bossDef(b);

  // ---- death cascade ----
  if (b.dying > 0) {
    b.dying--;
    b.deathTick++;
    if (b.deathTick % 5 === 0) {
      FX.explode(b.x + (Math.random()-0.5)*bossHalfW(b)*2, b.y + (Math.random()-0.5)*bossHalfH(b)*2, 26 + Math.random()*18, '#ffbb33');
      FX.addShake(10);
      Sound.play('explode');
    }
    if (b.dying === 0) {
      FX.explode(b.x, b.y, 90, '#ffdd66');
      FX.addShake(30);
      FX.hitStop(8);
      FX.slowMo(60, 0.3);
      Sound.play('bigExplode');
      const pts = 2000 * b.tier;
      score += pts;
      // The boss is the biggest kill in the game and used to pay no scrap at
      // all, because it never went through killEnemy. Routed through
      // scrapForKill so SCRAP MAGNET and SALVAGE RIG apply here too.
      const bossScrap = RLCore.scrapForKill(pts, stats.scrapMul, level);
      scrap += bossScrap;
      addFlashText('+' + pts.toLocaleString(), b.x, b.y, '#ffdd44');
      addFlashText('+' + bossScrap.toLocaleString() + ' SCRAP', b.x, b.y + 24, '#ffdd44');
      levelBanner = { text: b.name.length > 22 ? 'BOSS DOWN' : b.name + ' DOWN', life: 140 };
      Save.data.bossesKilled[b.key] = (Save.data.bossesKilled[b.key] || 0) + 1;
      Save.write();
      boss = null; bossActive = false;
      Music.setBoss(false);
    }
    return;
  }

  if (b.flash > 0) b.flash--;

  // ---- entrance ----
  if (b.entering) {
    b.y += 1.6;
    if (b.y >= b.targetY) { b.y = b.targetY; b.entering = false; }
    return;                              // no attacks until it's in position
  }

  // ---- movement ----
  // A boss may override this entirely; the default is a lazy drift toward the
  // player so it stays a presence rather than a stationary target.
  if (def.move) def.move(b);
  else {
    b.x += Math.sign(player.x - b.x) * Math.min(1.2, Math.abs(player.x - b.x));
    b.x = Math.max(bossHalfW(b), Math.min(W - bossHalfW(b), b.x));
  }

  // ---- phase transitions ----
  const p = bossPhaseFor(b);
  if (p !== b.phase) {
    b.phase = p;
    b.flash = 10;
    b.attackTimer = 0;
    b.laser = null;
    FX.addShake(14);
    Sound.play('bossPhase');
    // No generic "PHASE n" banner here: the bar already shows the phase, and
    // several bosses announce something far more useful of their own. Two
    // overlapping captions is worse than one good one.
    if (def.onPhase) def.onPhase(b, p);
  }

  b.attackTimer++;
  def.think(b, b.phase);

  // Death is checked HERE as well as in the bullet loop below. A boss may damage
  // itself — Voidgate weakens as its mirrors die — and if the only death check
  // lived in the bullet loop, such a boss could sit at zero health with an empty
  // bar and keep fighting until a shot happened to clip its hull.
  if (b.hp <= 0 && b.dying === 0) bossBeginDeath(b);

  // ---- taking fire ----
  const hw = bossHalfW(b), hh = bossHalfH(b);
  bullets.forEach(bl => {
    if (bl.dead) return;
    if (Math.abs(bl.x - b.x) < hw && Math.abs(bl.y - b.y) < hh) {
      if (bl.pierce > 0) bl.pierce--; else bl.dead = true;
      // SIEGE OPTICS / SIEGE ENGINE only ever apply here, which is the whole
      // point of them: they are a boss-fight investment, not a general one.
      let dmg = bl.damage * stats.bossDamageMul;
      // A boss may absorb, deflect, or ignore a hit entirely — plates, shield
      // gaps, hangar bays. Returning 0 means "nothing landed".
      if (def.damage) dmg = def.damage(b, bl, dmg);
      if (dmg > 0) {
        // No boss is deleted in a single frame, whatever the build. A fight
        // that ends before its first phase change is not a fight.
        b.hp -= RLCore.capDamage(dmg, b.maxHp, true);
        b.flash = Math.max(b.flash, 2);
        spawnParticles(bl.x, bl.y, '#ffaa44', 3);
      }

      // FLAK BURST / CHAIN LIGHTNING / SPLIT SHOT during a boss fight.
      // applySplash/applyChain only ever touch the `enemies` array, so this
      // cannot double-damage the boss itself — it lets those upgrades still
      // do something (hit whatever minions the boss has spawned) instead of
      // going dead silent for the entire fight.
      if (bl.splash > 0) applySplash(bl.x, bl.y, bl.splash, bl.damage * 0.6);
      if (stats.chain > 0) applyChain(bl.x, bl.y, stats.chain, bl.damage * 0.5);
      if (bl.split && !bl.isSplit) {
        [-0.5, 0.5].forEach(a => bullets.push({
          x: bl.x, y: bl.y,
          vx: Math.sin(a) * BULLET_SPEED, vy: -Math.cos(a) * BULLET_SPEED,
          w: 3, h: 10, pierce: 0, damage: bl.damage * 0.5, homing: 0, splash: 0,
          burn: 0, chill: 0, bounces: 0,
          split: false, isSplit: true, crit: false, dead: false
        }));
      }

      if (b.hp <= 0 && b.dying === 0) bossBeginDeath(b);
    }
  });
}

// One place where a boss starts dying, so every path that can kill one — a
// bullet, splash, or the boss damaging itself — behaves identically.
function bossBeginDeath(b) {
  b.hp = 0;
  b.dying = 45; b.deathTick = 0;
  runKills++;
  noteBossSeen(b.key);
  enemyBullets = [];
  // Bosses that displace the pilot (Magnetar drags you around on a magnetic
  // leash) stop thinking the instant they start dying, so the release has to
  // happen here or the offset would persist for the rest of the run.
  releasePlayerPosition();
  Sound.play('explode');
}

// The pilot's resting position. Anything that moves the player as a mechanic
// must be undone against this, not against wherever the ship happened to be.
const PLAYER_HOME_Y = H - 120;

function releasePlayerPosition() { player.y = PLAYER_HOME_Y; }

let nextFormationId = 1;

// Coordinated waves. Members share a formationId so clearing the whole group
// can be rewarded.
function spawnFormation(type) {
  const id = nextFormationId++;
  const d = difficulty();
  // A formation flies the band's own light hull, not a hardcoded 'grunt'.
  // Otherwise every band from 11 up would keep sending level-1 ships at you
  // in formation, which is exactly the "the enemies never change" problem
  // this roster exists to solve.
  const roster = RLCore.rosterFor(level);
  const kind = roster.reduce((a, b) => (a.hp <= b.hp ? a : b)).id;
  if (type === 'vee') {
    const cx = 100 + Math.random()*(W - 200);
    for (let i = -2; i <= 2; i++) {
      const e = makeEnemy(kind);
      e.x = cx + i*38;
      e.y = -30 - Math.abs(i)*28;
      e.vx = 0; e.vy = d.enemySpeed * 0.85;
      e.zigzagDir = 0; e.formationId = id;
      enemies.push(e);
    }
  } else {
    for (let i = 0; i < 4; i++) {
      const e = makeEnemy(kind);
      e.baseX = 80 + i*((W - 160)/3);
      e.x = e.baseX; e.y = -30 - i*10;
      e.vx = 0; e.vy = d.enemySpeed * 0.55;
      e.zigzagDir = 0; e.sweep = true; e.formationId = id;
      enemies.push(e);
    }
  }
  return id;
}

const BULLET_SPEED = 11;

// Nearest live target, boss included. Shared by GIMBAL MOUNT and TRACER
// ROUNDS so the line you are shown and the line you shoot always agree.
function nearestTarget(x, y) {
  let best = null, bestD = 1e9;
  enemies.forEach(e => {
    if (e.dead) return;
    const d = (e.x - x) ** 2 + (e.y - y) ** 2;
    if (d < bestD) { bestD = d; best = e; }
  });
  if (boss && !boss.entering && boss.dying === 0) {
    const d = (boss.x - x) ** 2 + (boss.y - y) ** 2;
    if (d < bestD) { bestD = d; best = boss; }
  }
  return best;
}

function fireWeapon() {
  overchargeCount++;
  // OVERCHARGE (every Nth shot) and the crit stat are one system: whichever
  // fires, the shot crits once and pays out once. Rolling them separately
  // would let a single bullet multiply twice.
  const timed = stats.overcharge > 0 && overchargeCount % stats.overcharge === 0;
  const rolled = stats.critChance > 0 && Math.random() < stats.critChance;
  const crit = timed || rolled;
  // EMBERROCK's OVERDRIVE is a timed window, not a permanent stat, so it is
  // applied here rather than resolved into stats.
  const rage = boostRage > 0 ? 2.2 : 1;
  const dmg = stats.damage * (crit ? stats.critMul : 1) * rage;
  const speed = BULLET_SPEED * stats.bulletSpeedMul;
  // HOWITZER's hull and the BULK ROUNDS line both widen the shot. Bigger
  // bullets hit from further away — see the collision test, which reads b.w.
  const size = stats.bulletSize * (currentShip().bulletSizeMul || 1);

  // GIMBAL MOUNT: the whole pattern rotates toward the nearest enemy, but
  // only up to aimCone. It closes the gap on a target off to your side
  // without ever becoming the auto-aim that HUNTER ROUNDS is.
  let bias = 0;
  if (stats.aimCone > 0) {
    const t = nearestTarget(player.x, player.y);
    if (t) {
      const want = Math.atan2(t.x - player.x, -(t.y - player.y));
      bias = Math.max(-stats.aimCone, Math.min(stats.aimCone, want));
    }
  }

  RLCore.buildShots(stats).forEach(s => {
    const a = s.a + (s.needle ? 0 : bias);
    bullets.push({
      x: player.x + s.dx, y: player.y + s.dy,
      vx: Math.sin(a) * speed,
      vy: -Math.cos(a) * speed,
      // THE NEEDLE is one screen-height lance that never stops.
      w: (s.needle ? 7 : 3) * size, h: (s.needle ? 26 : 10) * (1 + (size - 1) * 0.4),
      pierce: s.needle ? 9999 : stats.pierce,
      damage: s.needle ? dmg * 2.2 : dmg,
      homing: stats.homing,
      splash: stats.splash, split: stats.split, crit,
      burn: stats.burn, chill: stats.chill,
      bounces: stats.ricochet,
      needle: !!s.needle,
      dead: false
    });
  });
  player.muzzle = 3;
  Sound.play('laser');
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    let angle = Math.random()*Math.PI*2;
    let speed = 1.5 + Math.random()*4;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 30 + Math.random()*30, maxLife: 60,
      r: 1.5+Math.random()*3,
      color, type: Math.random() < 0.3 ? 'spark' : 'dot'
    });
  }
}

// ---- ORBITAL DRONE ----
// stats.drones can rise (upgrade picked up) or fall (a hit strips it), so this
// must reconcile the drones[] array in both directions, not just grow it.
function syncDrones() {
  while (drones.length < stats.drones) drones.push({ angle: drones.length * Math.PI, fire: 0 });
  while (drones.length > stats.drones) drones.pop();
}

function updateDrones() {
  drones.forEach(d => {
    d.angle += 0.03;
    d.x = player.x + Math.cos(d.angle) * 46;
    d.y = player.y + Math.sin(d.angle) * 32;
    if (--d.fire <= 0) {
      d.fire = stats.dronesCopyGun ? Math.max(8, Math.round(stats.fireRate)) : 22;
      // Carries the full bullet field set the collision code in update()
      // reads (pierce/damage/homing/splash/split/crit/burn/chill/bounces/dead)
      // — matching fireWeapon()'s shape so a drone bullet can't leave any of
      // these undefined and corrupt the damage arithmetic.
      //
      // MIRROR WING / IRON SWARM give the drones your actual gun instead of
      // the stock peashooter, which is what makes them worth their tier.
      const copy = stats.dronesCopyGun;
      bullets.push({
        x: d.x, y: d.y - 6, vx: 0, vy: -BULLET_SPEED * (copy ? stats.bulletSpeedMul : 1),
        w: copy ? 3 : 2, h: copy ? 10 : 8,
        pierce: copy ? stats.pierce : 0,
        damage: stats.damage * (copy ? 0.75 : 0.5),
        homing: copy ? stats.homing : 0,
        splash: copy ? stats.splash : 0,
        split: copy ? stats.split : false,
        burn: copy ? stats.burn : 0,
        chill: copy ? stats.chill : 0,
        bounces: copy ? stats.ricochet : 0,
        crit: false, dead: false
      });
    }
  });
}

function drawDrones() {
  drones.forEach(d => {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.fillStyle = '#ffaa22';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffdd88'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.restore();
  });
}

// ---- SINGULARITY ----
// Drags nearby enemies inward and grinds them down at close range. Damage is
// routed through damageEnemy (not a direct e.hp-- / killEnemy) so mines still
// arm instead of dying outright — see damageEnemy's comment for why that
// decision must live in exactly one place.
// EVENT HORIZON runs three of these at once, evenly spaced on the same orbit.
// `singularity` stays the first one so drawSingularity and anything else that
// reads a single hole keeps working; the rest live in singularityExtra.
let singularityExtra = [];

function updateSingularity() {
  const n = stats.singularityCount;
  if (n <= 0) { singularity = null; singularityExtra = []; return; }
  if (!singularity) singularity = { angle: 0 };
  singularity.angle += 0.02;

  const holes = [];
  for (let i = 0; i < n; i++) {
    const a = singularity.angle + (i * Math.PI * 2) / n;
    holes.push({ x: player.x + Math.cos(a) * 70, y: player.y + Math.sin(a) * 52 });
  }
  singularity.x = holes[0].x; singularity.y = holes[0].y;
  singularityExtra = holes.slice(1);

  enemies.forEach(e => {
    if (e.dead) return;
    holes.forEach(h => {
      if (e.dead) return;
      const dx = h.x - e.x, dy = h.y - e.y;
      const d = Math.max(Math.hypot(dx, dy), 0.001); // guard div-by-zero if exactly co-located
      if (d < 120) {
        e.x += (dx / d) * 1.6; e.y += (dy / d) * 1.6;
        // Scales with your damage so it does not become a rounding error at
        // depth, the way a flat 0.5 did.
        if (d < 26) damageEnemy(e, Math.max(0.5, stats.damage * 0.05));
      }
    });
  });
}

function drawOneSingularity(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
  g.addColorStop(0, '#000000');
  g.addColorStop(0.6, 'rgba(120,0,200,0.7)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,120,255,0.8)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(frame*0.1)*2, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

function drawSingularity() {
  if (!singularity) return;
  drawOneSingularity(singularity);
  singularityExtra.forEach(drawOneSingularity);
}

// TRACER ROUNDS: shows where the nearest target is, and nothing more. All of
// the information HUNTER ROUNDS gives you, none of the aiming — which is why
// one is a RARE and the other is an APEX.
function drawTracer() {
  if (!stats || !stats.tracer) return;
  const t = nearestTarget(player.x, player.y);
  if (!t) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(120,255,200,0.30)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 12);
  ctx.lineTo(t.x, t.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(120,255,200,0.6)';
  ctx.beginPath(); ctx.arc(t.x, t.y, 14, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

// Single definition of "what happens when an enemy takes damage". Every path
// that can hurt an enemy — the direct bullet/enemy collision, applySplash and
// applyChain — routes through here so they can't disagree about it. In
// particular: a mine is supposed to arm (not die outright) once its hp hits
// zero, however that damage arrived. Before this existed, applySplash and
// applyChain called killEnemy directly with no mine check at all, so FLAK
// BURST/CHAIN LIGHTNING silently killed mines instead of letting them arm and
// detonate — including a *directly*-hit mine, since a mine's 2 hp is often
// wiped out by the splash from its own impact before a per-site special case
// would ever get a turn to run.
// The single damage path. `hitX` is optional and only the BULWARK DRONE reads
// it: a shield plate covers its underside, so shots landing under its centre
// hit the plate while shots landing on its flanks reach the hull. That is the
// answer to "how do I deal with the thing sitting off to my side" — you go
// wide and shoot in, rather than sitting under it.
function damageEnemy(e, dmg, hitX) {
  if (e.dead) return;
  // Plates started as BULWARK's own trick and are now handed out by SHIELDER
  // too, so the rule reads off the plate itself rather than off a hull name.
  if (e.plate > 0) {
    const er = (ENEMY[e.kind] || ENEMY.skiff).r;
    const flank = typeof hitX === 'number' && Math.abs(hitX - e.x) > er * 0.55 * (e.scale || 1);
    if (!flank) {
      e.plate -= dmg;
      e.flash = 3;
      if (e.plate <= 0) {
        e.plate = 0;
        spawnParticles(e.x, e.y + 12, '#88ffaa', 16);
        FX.addShake(8);
        Sound.play('shieldBreak');
      }
      return;                       // the plate ate it; the hull is untouched
    }
  }
  // KINETIC VERDICT: the first hit of each level bites a flat slice out of
  // whatever it lands on, however large. One per level, tracked on the run.
  if (stats.verdict > 0 && !verdictSpent) {
    verdictSpent = true;
    dmg += e.maxHp * stats.verdict;
    addFlashText('VERDICT', e.x, e.y - 20, '#ffffff');
    FX.addShake(10);
  }
  // Nothing is instakilled. A hull worth naming is worth at least a couple
  // of trigger pulls, however large the multiplier stack behind the shot.
  e.hp -= RLCore.capDamage(dmg, e.maxHp, false);
  e.flash = 4;

  // EXECUTIONER / THE LAST WORD: below the threshold it simply ends.
  if (e.hp > 0 && stats.execute > 0 && e.maxHp > 0 && e.hp / e.maxHp < stats.execute) {
    e.hp = 0;
    spawnParticles(e.x, e.y, '#ffffff', 10);
  }

  if (e.hp <= 0) {
    if (e.beh === 'mine') { e.hp = 1; if (e.arming === 0) e.arming = 30; }
    else killEnemy(e);
  }
}

// INCENDIARY and CRYO ROUNDS. Applied after the hit lands so a killing blow
// does not waste them, and stored on the enemy so the pure core stays out of
// per-frame state.
function applyOnHitEffects(e, b) {
  if (e.dead) return;
  if (b.burn > 0) { e.burnDps = Math.max(e.burnDps || 0, b.damage * b.burn / 2); e.burnLeft = 120; }
  if (b.chill > 0) { e.chill = Math.max(e.chill || 0, b.chill); e.chillLeft = 120; }
}

function tickStatusEffects() {
  enemies.forEach(e => {
    if (e.dead) return;
    if (e.burnLeft > 0) {
      e.burnLeft--;
      damageEnemy(e, e.burnDps / 60);
      if (frame % 8 === 0) spawnParticles(e.x, e.y, '#ff8833', 1);
    }
    if (e.chillLeft > 0) e.chillLeft--; else e.chill = 0;
  });
}

// Flak Burst: on-impact AoE against nearby enemies. Deliberately does not
// call itself (or trigger further splash) — one blast per impact.
function applySplash(x, y, radius, damage) {
  if (radius <= 0) return;
  enemies.forEach(e => {
    if (e.dead) return;
    if ((e.x - x) ** 2 + (e.y - y) ** 2 <= radius * radius) {
      damageEnemy(e, damage);
    }
  });
  FX.explode(x, y, radius * 0.7, '#ffaa44');
}

// Chain Lightning: arcs to the nearest un-hit enemy within range, up to `hops`
// times. Bounded by the hop count, so it cannot recurse indefinitely.
function applyChain(x, y, hops, damage) {
  let from = { x, y };
  const hit = [];
  for (let i = 0; i < hops; i++) {
    let best = null, bestD = 1e9;
    enemies.forEach(e => {
      if (e.dead || hit.includes(e)) return;
      const d = (e.x - from.x) ** 2 + (e.y - from.y) ** 2;
      // Skip anything essentially co-located with the current arc origin —
      // on hop 0 that's the enemy the bullet just hit directly, and without
      // this the chain wastes its first hop re-hitting the same target
      // instead of arcing out to a nearby one.
      if (d < 4) return;
      if (d < bestD && d < 160 * 160) { bestD = d; best = e; }
    });
    if (!best) return;
    hit.push(best);
    spawnParticles(best.x, best.y, '#88ddff', 6);
    damageEnemy(best, damage);
    from = best;
  }
}

function comboMultiplier() {
  return Math.max(1, Math.min(CFG.maxComboMultiplier, Math.floor(combo/3)));
}

function killEnemy(e) {
  const st = ENEMY[e.kind] || ENEMY.skiff;
  e.dead = true;
  runKills++;
  // Bestiary: you have now seen this one die, so it stops being a silhouette.
  noteEnemySeen(e.kind);

  // OVERKILL / CASCADE / DOMINO: damage past the kill rolls into whatever is
  // closest instead of evaporating. Capped by the same no-instakill rule, so
  // a chain of these thins a wave rather than deleting it.
  const overkill = Math.max(stats.overkill, currentShip().overkillStart || 0);
  if (overkill > 0 && e.hp < 0) {
    const spill = Math.min(-e.hp, e.maxHp) * overkill;
    if (spill > 0) {
      let best = null, bestD = 1e9;
      enemies.forEach(o => {
        if (o.dead || o === e) return;
        const d = (o.x-e.x)**2 + (o.y-e.y)**2;
        if (d < bestD && d < 240*240) { bestD = d; best = o; }
      });
      if (best) {
        spawnParticles(best.x, best.y, '#ffdd88', 6);
        damageEnemy(best, spill);
      }
    }
  }

  // SPLITTER hulls die into two smaller copies, once. Killing one badly is
  // supposed to make the next few seconds worse.
  if (e.beh === 'splitter' && e.splitsLeft > 0 && enemies.length < CFG.caps.enemies - 2) {
    for (let i = 0; i < 2; i++) {
      const c = makeEnemy(e.kind);
      c.splitsLeft = 0;
      c.x = e.x + (i ? 20 : -20); c.y = e.y;
      c.vx = (i ? 1 : -1) * 1.6;
      c.scale = (e.scale || 1) * 0.62;
      c.maxHp = Math.max(1, Math.round(e.maxHp * 0.3));
      c.hp = c.maxHp;
      c.plate = 0; c.showBar = false;
      enemies.push(c);
    }
    spawnParticles(e.x, e.y, st.color, 14);
  }
  FX.explode(e.x, e.y, st.boom, st.color);
  FX.addShake(st.shake);
  if (st.hitStop) FX.hitStop(st.hitStop);
  Sound.play('explode');

  const multiplier = comboMultiplier();
  score += st.points * multiplier;
  // Scrap deliberately ignores the combo multiplier — score rewards a hot
  // streak, but the shop economy stays predictable only if scrap does not.
  scrap += RLCore.scrapForKill(st.points, stats.scrapMul, level);
  // Vampiric Core: a life back every stats.lifePerKills kills.
  if (stats.lifePerKills > 0) {
    killsSinceLife++;
    if (killsSinceLife >= stats.lifePerKills) {
      killsSinceLife = 0; lives++;
      addFlashText('+1 LIFE', player.x, player.y - 40, '#44ff88');
    }
  }
  // KILL SHIELD: a charge back every N kills, capped by the same ceiling
  // every other shield source respects.
  if (stats.shieldPerKills > 0) {
    killsSinceShield++;
    if (killsSinceShield >= stats.shieldPerKills) {
      killsSinceShield = 0;
      if (player.shieldCharges < RLCore.MAX_SHIELD_CHARGES) {
        player.shieldCharges++;
        addFlashText('+SHIELD', player.x, player.y - 40, '#66ddff');
      }
    }
  }
  combo++; comboTimer = 120;
  // WRAITH: every kill drops it off enemy targeting for a couple of seconds.
  const cloakShip = currentShip();
  if (cloakShip.cloakFrames) player.cloak = cloakShip.cloakFrames;
  addFlashText('+' + st.points*multiplier, e.x, e.y - 10, st.color);

  // A kill can shake something loose. The rocks are the reliable source of
  // drops; this is the occasional bonus on top of one.
  if (Math.random() < 0.06 + stats.dropBonus * 0.01) {
    spawnPickup(e.x, e.y, 'scrap', Math.round(st.points * 0.9));
  }

  // Clearing an entire formation pays a bonus.
  if (e.formationId) {
    const remaining = enemies.some(o => o !== e && !o.dead && o.formationId === e.formationId);
    if (!remaining) {
      score += 500;
      addFlashText('FORMATION! +500', W/2, e.y - 34, '#66ffcc');
      FX.hitStop(3);
      Sound.play('levelUp');
    }
  }
}

function addFlashText(text, x, y, color) {
  flashText.push({text, x, y, life: 60, color, vy: -1.2});
}

function hitPlayer() {
  if (player.invincible > 0) return;
  // Phase Drive: a banked free hit that recharges on its own clock. Spent
  // before the shield and before Phantom's once-per-level slip, because it is
  // the only one of the three that comes back by itself.
  if (stats.phaseDrive && player.phaseCharge > 0) {
    player.phaseCharge = 0;
    player.phaseDriveTimer = 0;
    player.invincible = 70;
    addFlashText('PHASE DRIVE', player.x, player.y - 34, '#aa66ff');
    spawnParticles(player.x, player.y, '#aa66ff', 18);
    FX.addShake(8);
    Sound.play('shieldBreak');
    return;
  }
  // Plating / Fortress / Kinetic Barrier all just add to this same charge
  // count — one system, no separate timer.
  if (player.shieldCharges > 0) {
    // BULWARK FIELD sometimes gives the charge straight back.
    if (!(stats.shieldRefund > 0 && Math.random() < stats.shieldRefund)) {
      player.shieldCharges--;
    } else {
      addFlashText('HELD', player.x, player.y - 34, '#88ffcc');
    }
    // PHALANX widens the window after a break so a burst cannot strip every
    // charge in a handful of frames.
    player.invincible = Math.max(60, stats.shieldIframes);
    FX.addShake(10);
    FX.explode(player.x, player.y, 22, '#00ffff');
    // REACTIVE ARMOUR turns a blocked hit into a counterattack.
    if (stats.thorns) {
      applySplash(player.x, player.y, 110, stats.damage * 6);
      spawnParticles(player.x, player.y, '#ffdd66', 22);
      FX.addShake(14);
    }
    Sound.play('shieldBreak');
    return;
  }
  // Phantom slips through one hit per level.
  if (player.phaseReady) {
    player.phaseReady = false;
    player.invincible = 70;
    addFlashText('PHASED', player.x, player.y - 34, '#cc88ff');
    spawnParticles(player.x, player.y, '#cc88ff', 16);
    FX.addShake(6);
    Sound.play('shieldBreak');
    return;
  }
  // ---- Task 8: hit penalty ----
  // Only a hit that actually lands (past both the shield and phase early
  // returns above) strips an upgrade. Self-contained on purpose: a later
  // task's shield logic will touch the rest of hitPlayer, not this block.
  // ABSOLUTION (HYPERCLOCKED) switches this off entirely; GREED ENGINE makes
  // it cost two. Both read through stats so the rule stays in one place.
  // WARDEN: the first hit each level still costs a life, but not an upgrade.
  if (graceLeft > 0) {
    graceLeft--;
    addFlashText('GRACE', player.x, player.y - 30, '#88bbff');
  } else if (stats.scrapLoss > 0 && scrap > 0) {
    const before = scrap;
    scrap = RLCore.scrapAfterHit(scrap, stats.scrapLoss);
    addFlashText('-' + (before - scrap).toLocaleString() + ' SCRAP', player.x, player.y - 30, '#ffcc44');
    Sound.play('strip');
  }
  // GRUDGE / SPITE / THE ANSWER: a hit that lands answers in kind. Fired
  // before the life is deducted so it still goes off on your last one.
  if (stats.revengeShots > 0) {
    const n = Math.min(220, stats.revengeShots);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      bullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(a) * BULLET_SPEED * 0.8, vy: Math.sin(a) * BULLET_SPEED * 0.8,
        w: 4, h: 8, pierce: 1, damage: stats.damage * 0.9, homing: 0,
        splash: stats.splash, split: false, crit: false,
        burn: stats.burn, chill: stats.chill, bounces: 0, needle: false, dead: false
      });
    }
    addFlashText('GRUDGE', player.x, player.y - 46, '#ff8866');
  }

  lives--;
  // SECOND WIND buys breathing room after a hit that actually landed.
  player.invincible = Math.max(120, Math.round(stats.graceSeconds * 60));
  FX.addShake(20);
  FX.explode(player.x, player.y, 24, '#ff4400');
  combo = 0; comboTimer = 0;
  if (lives <= 0 && stats.reviveOnDeath > 0 && !revivedThisRun) {
    // UNDYING: death hands one life back, once per run.
    revivedThisRun = true;
    lives = stats.reviveOnDeath;
    player.invincible = 180;
    enemyBullets = [];
    addFlashText('UNDYING', player.x, player.y - 44, '#ffffff');
    FX.addShake(30);
    Sound.play('apex');
    return;
  }
  if (lives <= 0) endRun();
  else Sound.play('explode');
}

function aabbCircle(rx, ry, rw, rh, cx, cy, cr) {
  let nx = Math.max(rx-rw/2, Math.min(cx, rx+rw/2));
  let ny = Math.max(ry-rh/2, Math.min(cy, ry+rh/2));
  return (nx-cx)*(nx-cx)+(ny-cy)*(ny-cy) < cr*cr;
}

// ===== UPDATE =====

// Advances only presentation-layer things: particles, rings, floating text,
// shake. Runs during 'dying' and 'dead' too, so the wreck keeps burning while
// the game-over screen is up.
function updateEffects() {
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life--;
    if (p.type === 'chunk') { p.rot += p.rotSpeed; p.vy += 0.04; }
    else p.r *= 0.97;
  });
  particles = particles.filter(p => p.life > 0);

  flashText.forEach(f => { f.y += f.vy; f.life--; });
  flashText = flashText.filter(f => f.life > 0);

  FX.step();
  capArray(particles, CFG.caps.particles);
}

function update() {
  // The clock stops during a boss fight — the fight is the level.
  if (!bossActive) {
    levelTimer++;
    if (levelTimer > 60*CFG.levelSeconds) levelUp();
  }
  if (bossWarning > 0) bossWarning--;

  // Stars
  starLayers.forEach(layer => layer.forEach(s => {
    s.y += s.speed; if (s.y > H+2) { s.y = -2; s.x = Math.random()*W; }
  }));

  // Nebulae
  nebulae.forEach(n => { n.y += n.speed; if (n.y - n.ry > H) n.y = -n.ry; });

  // Player movement
  let dx = 0;
  if (held('left'))  dx -= 1;
  if (held('right')) dx += 1;
  // THROUGH THE LOOKING GLASS. The whole world is mirrored, so the controls
  // have to be too, or the joke is just a broken game.
  if (stats && stats.mirrored) dx = -dx;
  if (touchX !== null) {
    let rect = canvas.getBoundingClientRect();
    let scaleX = W / rect.width;
    let tx = (touchX - rect.left) * scaleX;
    if (stats && stats.mirrored) tx = W - tx;
    if (tx < player.x - 15) dx = -1;
    else if (tx > player.x + 15) dx = 1;
  }
  player.x = Math.max(20, Math.min(W-20, player.x + dx*player.speed));

  // The ship has NO vertical control — ArrowUp/ArrowDown are swallowed but
  // never move it. So any boss that displaces the pilot vertically (Magnetar
  // drags you on a magnetic leash) would otherwise leave a permanent offset
  // for the rest of the run. Easing back to the resting line here means the
  // displacement self-heals and no boss has to remember to release it; a boss
  // that keeps pulling simply wins against the spring while it is alive.
  // Enemies only refresh where they think you are while you are visible.
  if (player.cloak > 0) player.cloak--;
  else { lastSeenX = player.x; lastSeenY = player.y; }

  player.y = Math.max(90, Math.min(H - 24, player.y));
  if (player.y !== PLAYER_HOME_Y) {
    player.y += (PLAYER_HOME_Y - player.y) * 0.06;
    if (Math.abs(player.y - PLAYER_HOME_Y) < 0.4) player.y = PLAYER_HOME_Y;
  }

  // Player trail
  player.trail.push({x: player.x, y: player.y, life: 12});
  if (player.trail.length > 12) player.trail.shift();
  player.trail.forEach(t => t.life--);
  player.trail = player.trail.filter(t => t.life > 0);

  if (player.invincible > 0) player.invincible--;

  // Phase Drive: recharge the banked hit. The timer only runs while the charge
  // is spent, so an unused charge doesn't quietly bank a second one.
  if (stats.phaseDrive) {
    if (player.phaseCharge <= 0) {
      player.phaseDriveTimer++;
      if (player.phaseDriveTimer >= RLCore.PHASE_DRIVE_FRAMES) {
        player.phaseDriveTimer = 0;
        player.phaseCharge = 1;
        addFlashText('PHASE READY', player.x, player.y - 44, '#aa66ff');
      }
    }
  } else {
    player.phaseCharge = 0; player.phaseDriveTimer = 0;
  }

  // Kinetic Barrier: regenerate one shield charge every stats.shieldRegen
  // frames. Capped so it can't grow without bound if it's left to regen
  // uninterrupted for a whole run.
  if (stats.shieldRegen > 0) {
    player.shieldRegenTimer = (player.shieldRegenTimer || 0) + 1;
    if (player.shieldRegenTimer >= stats.shieldRegen) {
      player.shieldRegenTimer = 0;
      player.shieldCharges = Math.min(player.shieldCharges + 1, stats.shieldCharges + 3);
    }
  }

  // Shooting (auto-fire). The interval is entirely upgrade-driven now.
  shootTimer++;
  const fireRate = Math.max(RLCore.MIN_FIRE_RATE, Math.round(stats.fireRate));
  if (shootTimer >= fireRate) {
    shootTimer = 0;
    fireWeapon();
  }

  // Orbital Drone / Singularity: pushed here (same as fireWeapon above) so any
  // new drone bullet moves this frame along with everything else, and so the
  // singularity's drag/grind against enemies happens once per frame.
  updateDrones();
  updateSingularity();
  tickStatusEffects();

  // MIDAS FIELD: enemies bleed scrap while they are alive, so a screen full
  // of tanky things at depth is income rather than only a threat. Fractions
  // are carried in scrapDrip so a low rate still pays out.
  if (stats.scrapPerSecond > 0 && enemies.length) {
    scrapDrip += (stats.scrapPerSecond * Math.min(enemies.length, 12)) / 60;
    if (scrapDrip >= 1) { const whole = Math.floor(scrapDrip); scrap += whole; scrapDrip -= whole; }
  }

  // CHRONOSTALL: holding fire slows the world. Re-armed every frame the
  // trigger is down, so it decays the moment you stop shooting.
  if (stats.chronostall > 0 && (held('fire') || touchX !== null)) {
    FX.slowMo(4, 1 - stats.chronostall);
  }

  // Normal spawning is suspended for the duration of a boss fight; the boss
  // supplies its own minions in phase 3.
  if (!bossActive) {
    asteroidTimer++;
    if (asteroidTimer >= difficulty().asteroidRate) {
      asteroidTimer = 0;
      asteroids.push(makeAsteroid(Math.random() < 0.4));
    }

    spawnTimer++;
    if (spawnTimer >= difficulty().spawnRate) {
      spawnTimer = 0;
      spawnCycle++;
      if (level >= 3 && spawnCycle % 3 === 0) {
        spawnFormation(Math.random() < 0.5 ? 'vee' : 'line');
      } else if (Math.random() < 0.7) {
        enemies.push(makeEnemy(pickEnemyKind()));
      }
    }
  }

  if (boss) updateBoss();

  // Hunter Rounds: steer bullets toward the nearest live enemy. b.homing is a
  // turn-rate cap in radians/frame, so shots curve rather than snap onto target.
  bullets.forEach(b => {
    if (b.homing > 0) {
      let best = null, bestD = 1e9;
      enemies.forEach(e => {
        if (e.dead) return;
        const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = e; }
      });
      // The boss is not in `enemies`, so without this a boss fight steers
      // homing shots onto the minions it spawns in phase 3 — curving a
      // 900-scrap upgrade's bullets away from the only target that matters.
      if (boss && !boss.entering && boss.dying === 0) {
        const d = (boss.x - b.x) ** 2 + (boss.y - b.y) ** 2;
        if (d < bestD) { bestD = d; best = boss; }
      }
      if (best) {
        const want = Math.atan2(best.x - b.x, -(best.y - b.y));
        const cur  = Math.atan2(b.vx, -b.vy);
        let diff = want - cur;
        while (diff >  Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.max(-b.homing, Math.min(b.homing, diff));
        const a = cur + turn;
        b.vx = Math.sin(a) * BULLET_SPEED;
        b.vy = -Math.cos(a) * BULLET_SPEED;
      }
    }
  });

  // Move bullets. RICOCHET reflects off the side walls a limited number of
  // times, which is what lets a shot reach something tucked against an edge.
  bullets.forEach(b => {
    b.x += b.vx; b.y += b.vy;
    if (b.bounces > 0) {
      if (b.x < 4)     { b.x = 4;     b.vx = Math.abs(b.vx);  b.bounces--; }
      else if (b.x > W-4) { b.x = W-4; b.vx = -Math.abs(b.vx); b.bounces--; }
      else if (b.y < 4)   { b.y = 4;   b.vy = Math.abs(b.vy);  b.bounces--; }
    }
  });

  // Move enemy bullets
  enemyBullets.forEach(b => {
    b.x += b.vx; b.y += b.vy;
    // BOMBER's payload: it sits, blinks faster, then opens into a ring. The
    // fuse is the warning, so it is drawn as one (see drawEnemyBullets).
    if (b.fuse !== undefined && !b.dead) {
      b.vx *= 0.965; b.vy *= 0.965;
      if (--b.fuse <= 0) {
        b.dead = true;
        const spd = difficulty().bulletSpeed * 0.7 * stats.enemyBulletMul;
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          enemyBullets.push({x: b.x, y: b.y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r: 4, elite: true, dead: false});
        }
        FX.explode(b.x, b.y, 34, '#ffaa55');
        Sound.play('explode');
      }
    }
  });

  // Asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.rot += a.rotSpeed;
    bullets.forEach(b => {
      if (b.dead || a.hp <= 0) return;
      if (Math.abs(b.x - a.x) < a.r + 2 && Math.abs(b.y - a.y) < a.r + 2) {
        if (b.pierce > 0) b.pierce--; else b.dead = true;
        a.hp -= b.damage;
        a.flash = 3;
        spawnParticles(b.x, b.y, '#aaaaaa', 4);
        // Rock sounds like rock, not like hitting a ship.
        Sound.play('meteorImpact');
        if (a.hp <= 0) {
          const cls = meteorPayload(a);
          noteMeteorSeen(a.cls);
          if (a.big) {
            for (let i = 0; i < 2; i++) asteroids.push({...makeAsteroid(false), x: a.x + (i?15:-15), y: a.y, vy: a.vy*1.2, cls: a.cls});
          }
          FX.explode(a.x, a.y, a.big ? 30 : 16, cls.col[1]);
          if (a.big) FX.addShake(6);
          Sound.play(a.big ? 'explode' : 'hit');
          score += a.big ? 50 : 20;
          combo++; comboTimer = 120;
          if (combo > 2) addFlashText('x'+combo+'!', a.x, a.y, '#ffff00');
        }
      }
    });
    if (a.hp > 0 && aabbCircle(player.x, player.y, player.w, player.h, a.x, a.y, a.r)) hitPlayer();
  });

  // Enemies
  const diff = difficulty();
  enemies.forEach(e => {
    const st = ENEMY[e.kind];

    // CRYO ROUNDS slow whatever they hit. Applied by scaling the velocity for
    // the duration of the movement step and restoring it after, so every
    // movement branch is chilled without each one having to know about it.
    // SLIP FIELD / GLACIER's hull: anything close to you moves through
    // treacle. Folded into the same chill factor every movement branch
    // already respects, so no branch has to know about it.
    const ship = currentShip();
    const field = Math.max(stats.slowField, ship.slowStart || 0);
    let slow = e.chill || 0;
    if (field > 0) {
      const d2 = (e.x - player.x) ** 2 + (e.y - player.y) ** 2;
      if (d2 < 170 * 170) slow = Math.max(slow, field * (1 - Math.sqrt(d2) / 170));
    }
    if (boostFreeze > 0) slow = Math.max(slow, 0.6);
    const chillF = slow > 0 ? Math.max(0.03, 1 - slow) : 1;
    const _cvx = e.vx, _cvy = e.vy;
    if (chillF !== 1) { e.vx *= chillF; e.vy *= chillF; }

    // ---- movement ----
    switch (e.beh) {
      case 'charger':
        e.x += Math.sign(e.targetX - e.x) * Math.min(1.5, Math.abs(e.targetX - e.x));
        e.y += e.vy;
        break;

      case 'turret':
        if (e.phase === 'descend') {
          e.y += e.vy;
          if (e.y >= e.holdY) { e.y = e.holdY; e.phase = 'hold'; }
        } else if (e.phase === 'hold') {
          e.holdTimer--;
          if (e.holdTimer <= 0) e.phase = 'retreat';
        } else {
          e.y -= 2.2;
        }
        e.aim = enemyAimAngle(e.x, e.y);
        break;

      case 'mine':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 16 || e.x > W-16) e.vx *= -1;
        break;

      case 'lancer':
        // Slides toward the player's column, then commits. The slide IS the
        // warning: it cannot shoot until it is nearly lined up.
        e.x += Math.sign(player.x - e.x) * Math.min(1.1, Math.abs(player.x - e.x) * 0.05);
        e.y += e.vy;
        break;

      case 'weaver':
        e.weavePhase += 0.045;
        {
          const nx = e.baseX + Math.sin(e.weavePhase) * e.weaveAmp;
          e.bank = (nx - e.x) * 0.12;      // banks into the turn
          e.x = nx;
        }
        e.y += e.vy;
        if (e.x < 24) e.baseX += 3; if (e.x > W-24) e.baseX -= 3;
        break;

      case 'bulwark':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 34 || e.x > W-34) e.vx *= -1;
        break;

      case 'swarm':
        e.jitter += 0.3;
        e.x += e.vx + Math.sin(e.jitter) * 1.6;
        e.y += e.vy;
        if (e.x < 12 || e.x > W-12) e.vx *= -1;
        break;

      case 'harbinger':
        e.x += e.vx; e.y += Math.max(0, e.vy * (e.y < 130 ? 1 : 0.12));
        if (e.x < 50 || e.x > W-50) e.vx *= -1;
        break;

      // ---- the six new behaviours ----------------------------------------
      case 'orbiter': {
        // Falls to its ring, then walks around it. The ring is centred on you,
        // so backing off does not break the lock — turning does.
        if (!e.settled) {
          e.y += e.vy;
          if (e.y > player.y - e.orbitR) e.settled = true;
        }
        e.orbitA += e.orbitDir * 0.018;
        const tx = player.x + Math.cos(e.orbitA) * e.orbitR;
        const ty = player.y + Math.sin(e.orbitA) * e.orbitR * 0.6;
        e.x += (tx - e.x) * (e.settled ? 0.06 : 0.02);
        if (e.settled) e.y += (ty - e.y) * 0.06;
        break;
      }

      case 'sniper':
        if (e.phase === 'descend') {
          e.y += e.vy;
          if (e.y >= e.holdY) { e.y = e.holdY; e.phase = 'hold'; }
        } else {
          // Drifts slowly along the top, so it is never quite where it was.
          e.x += Math.sin(frame * 0.011 + e.holdY) * 1.1;
        }
        if (e.charge === 0) e.aim = enemyAimAngle(e.x, e.y);
        break;

      case 'splitter':
        e.x += e.vx; e.y += e.vy;
        if (e.x < 26 || e.x > W-26) e.vx *= -1;
        break;

      case 'shielder':
        e.x += e.vx; e.y += Math.max(0, e.vy * (e.y < 150 ? 1 : 0.25));
        if (e.x < 34 || e.x > W-34) e.vx *= -1;
        break;

      case 'bomber':
        e.x += e.vx; e.y += Math.max(0, e.vy * (e.y < 170 ? 1 : 0.2));
        if (e.x < 28 || e.x > W-28) e.vx *= -1;
        break;

      case 'blinker':
        // Between blinks it barely moves. The blink itself is in the firing
        // block below, so the ghost and the jump stay together.
        e.y += e.vy * 0.25;
        e.blinkGhost = Math.max(0, e.blinkGhost - 1);
        break;

      default: // drifter
        if (e.sweep) {
          e.x = e.baseX + Math.sin(frame*0.02)*70;   // whole line moves as one
          e.y += e.vy;
        } else {
          e.zigzag += 0.04;
          e.x += e.vx + Math.sin(e.zigzag)*2.5*e.zigzagDir;
          e.y += e.vy;
          if (e.x < 20 || e.x > W-20) e.vx *= -1;
        }
    }

    // Engage, don't leave. A drifter or weaver that reaches the lower third
    // slows to a hover and holds there, so the screen stays a fight rather
    // than a procession. The behaviours that are SUPPOSED to run past you
    // are deliberately exempt.
    if ((e.beh === 'drifter' || e.beh === 'weaver') && e.y > H * 0.58) {
      e.y -= Math.max(0, e.vy) * 0.92;
      if (e.y > H * 0.72) e.y -= 0.6;
    }

    if (chillF !== 1) { e.vx = _cvx; e.vy = _cvy; }

    // ---- firing ----
    // The side-attack fix. Past ARC_FROM_LEVEL a grunt, elite, or lancer may
    // only shoot within a cone of straight-down, so one sitting off to your
    // flank physically cannot hit you — it has to commit to your column
    // first, and that commitment is something you can see coming.
    if (e.beh === 'drifter' || e.beh === 'lancer') {
      e.shootTimer++;
      const eRate = st.elite ? 55 : e.beh === 'lancer' ? 75 : 90;
      if (e.shootTimer >= eRate) {
        const angle = enemyAimAngle(e.x, e.y);
        // Straight down is +PI/2; measure the deviation from it, wrapped.
        let off = angle - Math.PI/2;
        while (off > Math.PI) off -= Math.PI*2;
        while (off < -Math.PI) off += Math.PI*2;
        if (!RLCore.canFireAt(e.beh, level, off)) {
          // Out of arc: hold the shot rather than firing sideways. Timer is
          // left charged so it fires the instant it does line up.
          e.shootTimer = eRate;
        } else {
          e.shootTimer = 0;
          const spd2 = diff.bulletSpeed * stats.enemyBulletMul;
          if (e.beh === 'lancer') {
            // One heavy, fast round straight down its own nose.
            enemyBullets.push({x: e.x, y: e.y + 14, vx: 0, vy: spd2*1.9, r: 5.5, elite: true, dead: false});
          } else {
            enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle)*spd2, vy: Math.sin(angle)*spd2, r: 4, elite: !!st.elite, dead: false});
            if (st.elite) {
              [-0.3, 0.3].forEach(o => {
                enemyBullets.push({x: e.x, y: e.y + 10, vx: Math.cos(angle+o)*spd2, vy: Math.sin(angle+o)*spd2, r: 4, elite: true, dead: false});
              });
            }
          }
        }
      }
    } else if (e.beh === 'weaver') {
      // Not arc-limited: dodging it is the point, and it fires while moving.
      e.shootTimer++;
      if (e.shootTimer >= 80) {
        e.shootTimer = 0;
        const angle = enemyAimAngle(e.x, e.y);
        const spd2 = diff.bulletSpeed * 0.9 * stats.enemyBulletMul;
        [-0.16, 0.16].forEach(o => {
          enemyBullets.push({x: e.x, y: e.y + 8, vx: Math.cos(angle+o)*spd2, vy: Math.sin(angle+o)*spd2, r: 4, elite: false, dead: false});
        });
      }
    } else if (e.beh === 'harbinger') {
      e.shootTimer++;
      e.broodTimer--;
      if (e.broodTimer <= 0) {
        e.broodTimer = 150;
        for (let i = -1; i <= 1; i++) {
          // The brood is the band's own lightest hull, so a WARR CATHEDRAL
          // does not hatch level-1 swarmlings.
          const broodKind = RLCore.rosterFor(level).reduce((x, y) => (x.hp <= y.hp ? x : y)).id;
          const m = makeEnemy(broodKind);
          m.x = e.x + i*24; m.y = e.y + 26;
          enemies.push(m);
        }
      }
      if (e.shootTimer >= 100) {
        e.shootTimer = 0;
        const spd2 = diff.bulletSpeed * 0.85 * stats.enemyBulletMul;
        for (let i = 0; i < 10; i++) {
          const a = (i/10)*Math.PI*2 + frame*0.01;
          enemyBullets.push({x: e.x, y: e.y, vx: Math.cos(a)*spd2, vy: Math.sin(a)*spd2, r: 4.5, elite: true, dead: false});
        }
      }
    } else if (e.beh === 'turret' && e.phase === 'hold') {
      e.shootTimer++;
      if (e.shootTimer >= 90) { e.shootTimer = 0; e.burstLeft = 3; e.burstTimer = 0; }
      if (e.burstLeft > 0) {
        e.burstTimer--;
        if (e.burstTimer <= 0) {
          e.burstTimer = 8;
          e.burstLeft--;
          const spd2 = diff.bulletSpeed * 1.15 * stats.enemyBulletMul;
          enemyBullets.push({x: e.x, y: e.y + 12, vx: Math.cos(e.aim)*spd2, vy: Math.sin(e.aim)*spd2, r: 4.5, elite: true, dead: false});
        }
      }
    } else if (e.beh === 'orbiter') {
      e.shootTimer++;
      if (e.shootTimer >= 95) {
        e.shootTimer = 0;
        const angle = enemyAimAngle(e.x, e.y);
        const spd2 = diff.bulletSpeed * 0.95 * stats.enemyBulletMul;
        enemyBullets.push({x: e.x, y: e.y, vx: Math.cos(angle)*spd2, vy: Math.sin(angle)*spd2, r: 4.5, elite: !!st.elite, dead: false});
      }
    } else if (e.beh === 'sniper' && e.phase === 'hold') {
      // Charge, hold the line visible, then one fast round down it. The aim
      // is frozen the moment the charge starts, so stepping out of the line
      // during the wind-up always works.
      if (e.charge > 0) {
        e.charge--;
        if (e.charge === 0) {
          const spd2 = diff.bulletSpeed * 2.2 * stats.enemyBulletMul;
          enemyBullets.push({x: e.x, y: e.y + 12, vx: Math.cos(e.aim)*spd2, vy: Math.sin(e.aim)*spd2, r: 6, elite: true, dead: false});
          Sound.play('enemyShot');
        }
      } else {
        e.shootTimer++;
        if (e.shootTimer >= 130) { e.shootTimer = 0; e.charge = 50; e.aim = enemyAimAngle(e.x, e.y); }
      }
    } else if (e.beh === 'shielder') {
      // Plates every nearby hull that does not already have one. Kill the
      // shielder or spend the whole wave chewing through plates.
      e.auraTimer++;
      if (e.auraTimer >= 90) {
        e.auraTimer = 0;
        let given = 0;
        enemies.forEach(o => {
