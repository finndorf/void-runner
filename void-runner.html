const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 480, H = 720;

function fitCanvas() {

  canvas.style.height = (H * scale) + 'px';

window.addEventListener('resize', fitCanvas);

// ===== CONFIG =====

const CFG = {
  maxComboMultiplier: 8,   // uncapped, a long streak runs score into the millions
  levelSeconds: 24,

  caps: { particles: 400, bullets: 200, enemyBullets: 300, enemies: 40 },

  // Ship roster. `id` is the persisted key.
  ships: [
    { id: 'vanguard', name: 'VANGUARD', cost: 0,    lives: 3, speed: 5.5, fireMul: 1.00, hitW: 28, hitH: 36, spreadMul: 1.0, phase: false,

    { id: 'needle',   name: 'NEEDLE',   cost: 500,  lives: 2, speed: 7.5, fireMul: 0.62, hitW: 22, hitH: 32, spreadMul: 0.8, phase: false,
      hull: ['#ffe0a0', '#ff9933', '#bb4400'], trim: '#ffcc33',
      blurb: 'Fast and fragile. Fires far quicker.' },
    { id: 'bulwark',  name: 'BULWARK',  cost: 1200, lives: 4, speed: 4.0, fireMul: 1.25, hitW: 34, hitH: 40, spreadMul: 1.6, phase: false,
      hull: ['#c8ffd0', '#33bb66', '#116633'], trim: '#44ffaa',
      blurb: 'Slow tank. Starts each run shielded.' },
    { id: 'phantom',  name: 'PHANTOM',  cost: 3000, lives: 3, speed: 6.0, fireMul: 0.92, hitW: 18, hitH: 28, spreadMul: 1.0, phase: true,
      hull: ['#e8ccff', '#9955ff', '#4400aa'], trim: '#cc88ff',
      blurb: 'Tiny hitbox. Phases one hit per level.' }
  ]
};

// ===== ROGUELIKE CORE (PURE) =====
// No DOM, no canvas, no game globals. Randomness arrives as an injected rnd().
// tests/roguelike.test.mjs extracts and evaluates everything between these
// sentinels, so keeping it pure is what makes the game testable at all.

const RLCore = {};

RLCore.SAVE_VERSION = 2;

// Upgrading rather than resetting is the whole point: the old loader threw away
// any save whose version did not match, which would wipe every player's credits
// and ships the moment the format changed.
RLCore.migrateSave = function (parsed, defaults) {
  if (!parsed || typeof parsed !== 'object') return { data: defaults, ok: false };
  const v = parsed.version;
  if (v !== 1 && v !== RLCore.SAVE_VERSION) return { data: defaults, ok: false };

  const data = Object.assign({}, defaults, parsed);
  data.version = RLCore.SAVE_VERSION;
  if (v === 1) {
    data.bestScrapSpent = 0;
    data.apexFound = 0;
  }
  if (!Array.isArray(data.unlocked) || !data.unlocked.length) data.unlocked = ['vanguard'];
  if (typeof data.selectedShip !== 'string' || !data.unlocked.includes(data.selectedShip)) data.selectedShip = 'vanguard';
  return { data, ok: true };
};

RLCore.TIERS = [
  { id: 'COMMON',    name: 'COMMON',    price:  240, color: '#b8c4d0', stackLimit: 5 },
  { id: 'UNCOMMON',  name: 'UNCOMMON',  price:  500, color: '#44dd77', stackLimit: 5 },
  { id: 'RARE',      name: 'RARE',      price:  900, color: '#3399ff', stackLimit: 1 },
  { id: 'EPIC',      name: 'EPIC',      price: 2100, color: '#aa66ff', stackLimit: 1 },
  { id: 'LEGENDARY', name: 'LEGENDARY', price: 4500, color: '#ffaa22', stackLimit: 1 },
  { id: 'APEX',      name: 'APEX',      price: 9000, color: '#00ffee', stackLimit: 1 }
];

RLCore.BASE_WEIGHTS = { COMMON: 52, UNCOMMON: 27, RARE: 13, EPIC: 6, LEGENDARY: 1.7, APEX: 0.3 };

// Depth drift takes weight off COMMON and spreads it across UNCOMMON..LEGENDARY
// in proportion to their base weights. APEX is deliberately excluded: it is the
// one probability the player can rely on never changing.
RLCore.rarityWeights = function (level) {
  const w = Object.assign({}, RLCore.BASE_WEIGHTS);
  const steps = Math.max(0, Math.min(level, 12) - 2);
  const drift = 1.5 * steps;
  if (drift <= 0) return w;
  w.COMMON -= drift;
  const mid = ['UNCOMMON', 'RARE', 'EPIC', 'LEGENDARY'];
  const midTotal = mid.reduce((a, k) => a + RLCore.BASE_WEIGHTS[k], 0);
  mid.forEach(k => { w[k] += drift * (RLCore.BASE_WEIGHTS[k] / midTotal); });
  return w;
};

RLCore.rollRarity = function (level, rnd) {
  const w = RLCore.rarityWeights(level);
  let r = rnd() * 100;
  for (const t of RLCore.TIERS) {
    r -= w[t.id];
    if (r < 0) return t.id;
  }
  return 'COMMON';
};

// Effect keys are read by RLCore.resolveStats. Multiplicative keys end in Mul
// and are summed then applied once; flags are booleans or counts.
RLCore.UPGRADES = [
  // --- COMMON ---
  { id: 'reload_coil',  tier: 'COMMON', name: 'RELOAD COIL',  desc: '+8% fire rate',      effect: { fireRateMul: 0.08 } },
  { id: 'heavy_rounds', tier: 'COMMON', name: 'HEAVY ROUNDS', desc: '+10% damage',        effect: { damageMul: 0.10 } },
  { id: 'thrusters',    tier: 'COMMON', name: 'THRUSTERS',    desc: '+8% move speed',     effect: { speedMul: 0.08 } },
  { id: 'plating',      tier: 'COMMON', name: 'PLATING',      desc: '+1 shield charge',   effect: { shieldCharges: 1 } },
  { id: 'scrap_magnet', tier: 'COMMON', name: 'SCRAP MAGNET', desc: '+10% scrap',         effect: { scrapMul: 0.10 } },
  { id: 'tight_barrel', tier: 'COMMON', name: 'TIGHT BARREL', desc: '-10% shot spread',   effect: { spreadMul: -0.10 } },

  // --- UNCOMMON ---
  { id: 'twin_feed',    tier: 'UNCOMMON', name: 'TWIN FEED',    desc: '+15% fire rate',        effect: { fireRateMul: 0.15 } },
  { id: 'ap_rounds',    tier: 'UNCOMMON', name: 'AP ROUNDS',    desc: '+18% damage',           effect: { damageMul: 0.18 } },
  { id: 'repair_kit',   tier: 'UNCOMMON', name: 'REPAIR KIT',   desc: '+1 life',               effect: { lives: 1 } },
  { id: 'evasion',      tier: 'UNCOMMON', name: 'EVASION FIELD',desc: '+12% speed, -10% size', effect: { speedMul: 0.12, hitScaleMul: -0.10 } },
  { id: 'salvage_rig',  tier: 'UNCOMMON', name: 'SALVAGE RIG',  desc: '+20% scrap',            effect: { scrapMul: 0.20 } },
  { id: 'wide_mount',   tier: 'UNCOMMON', name: 'WIDE MOUNT',   desc: '+1 shot',               effect: { extraShots: 1 } },

  // --- RARE ---
  { id: 'piercing',     tier: 'RARE', name: 'PIERCING ROUNDS', desc: 'shots pass through one enemy', effect: { pierce: 1 } },
  { id: 'split_shot',   tier: 'RARE', name: 'SPLIT SHOT',      desc: 'shots split in two on impact', effect: { split: true } },
  { id: 'overcharge',   tier: 'RARE', name: 'OVERCHARGE',      desc: 'every 5th shot triples',       effect: { overcharge: 5 } },
  { id: 'kinetic_barrier', tier: 'RARE', name: 'KINETIC BARRIER', desc: 'a shield regrows every 20s', effect: { shieldRegen: 1200 } },
  { id: 'hunter_rounds',tier: 'RARE', name: 'HUNTER ROUNDS',   desc: 'shots steer toward enemies',   effect: { homing: 0.045 } },

  // --- EPIC ---
  { id: 'rear_cannon',  tier: 'EPIC', name: 'REAR CANNON',  desc: 'you also fire backwards',    effect: { rear: true } },
  { id: 'side_pods',    tier: 'EPIC', name: 'SIDE PODS',    desc: 'you also fire left and right',effect: { sides: true } },
  { id: 'flak_burst',   tier: 'EPIC', name: 'FLAK BURST',   desc: 'shots explode on impact',    effect: { splash: 30 } },
  { id: 'phase_drive',  tier: 'EPIC', name: 'PHASE DRIVE',  desc: 'boost grants invulnerability',effect: { phaseBoost: true } },
  { id: 'vampiric',     tier: 'EPIC', name: 'VAMPIRIC CORE',desc: 'a life back every 30 kills', effect: { lifePerKills: 30 } },

  // --- LEGENDARY ---
  { id: 'orbital_drone',tier: 'LEGENDARY', name: 'ORBITAL DRONE', desc: 'a drone fights beside you',   effect: { drones: 1 } },
  { id: 'chain',        tier: 'LEGENDARY', name: 'CHAIN LIGHTNING',desc: 'hits arc to two enemies',    effect: { chain: 2 } },
  { id: 'time_dilation',tier: 'LEGENDARY', name: 'TIME DILATION', desc: 'enemy bullets 35% slower',    effect: { enemyBulletMul: -0.35 } },
  { id: 'fortress',     tier: 'LEGENDARY', name: 'FORTRESS',      desc: 'start each level shielded',   effect: { fortress: 2 } },

  // --- APEX ---
  { id: 'twin_core',    tier: 'APEX', name: 'TWIN CORE',       desc: 'every weapon effect fires twice', effect: { twinCore: true } },
  { id: 'singularity',  tier: 'APEX', name: 'SINGULARITY',     desc: 'a black hole orbits you',         effect: { singularity: true } },
  { id: 'immortal',     tier: 'APEX', name: 'IMMORTAL ENGINE', desc: 'your first death is survivable',  effect: { extraLife: 1 } }
];

RLCore.tierOf = function (id) {
  const t = RLCore.TIERS.find(t => t.id === id);
  if (!t) throw new Error(`RLCore.tierOf: unknown tier id "${id}"`);
  return t;
};

RLCore.eligible = function (tier, owned) {
  const limit = RLCore.tierOf(tier).stackLimit;
  return RLCore.UPGRADES.filter(u => {
    if (u.tier !== tier) return false;
    const have = owned.find(o => o.id === u.id);
    return !have || have.stacks < limit;
  });
};

RLCore.rollSlot = function (level, owned, rnd, exclude) {
  const skip = exclude || [];
  const poolFor = (tierId) => RLCore.eligible(tierId, owned).filter(u => !skip.includes(u.id));

  // rollRarity consumes rnd() and must be called exactly once per slot: calling
  // it inside a loop predicate would re-invoke it (with a fresh random draw)
  // for every tier checked, which is not a single stable roll.
  const rarity = RLCore.rollRarity(level, rnd);
  const startIdx = RLCore.TIERS.findIndex(t => t.id === rarity);
  const legendaryIdx = RLCore.TIERS.length - 2; // TIERS is COMMON..APEX; APEX is the last entry.

  // A shop slot must never come up empty while eligible upgrades remain, so
  // an exhausted tier promotes to a rarer one first: maxing out cheap
  // upgrades should make shops show better goods, not filler-then-nothing.
  // The walk stops at LEGENDARY -- never promote INTO APEX -- so its 0.3%
  // rate stays a fixed promise to the player. A roll that lands on APEX
  // directly (rarity === 'APEX') still checks its own pool normally; that's
  // not promotion, it's the roll rollRarity already made.
  const upperCap = rarity === 'APEX' ? RLCore.TIERS.length - 1 : legendaryIdx;
  for (let idx = startIdx; idx <= upperCap; idx++) {
    const pool = poolFor(RLCore.TIERS[idx].id);
    if (pool.length) return pool[Math.floor(rnd() * pool.length)];
  }

  // Nothing eligible at or above the rolled tier (within the APEX-safe
  // range): fall back downward toward COMMON.
  for (let idx = startIdx - 1; idx >= 0; idx--) {
    const pool = poolFor(RLCore.TIERS[idx].id);
    if (pool.length) return pool[Math.floor(rnd() * pool.length)];
  }

  return null;
};

RLCore.rollShop = function (level, owned, rnd) {
  const out = [];
  for (let i = 0; i < 3; i++) {
    const u = RLCore.rollSlot(level, owned, rnd, out.map(o => o.id));
    if (u) out.push(u);
  }
  return out;
};

RLCore.BASE_FIRE_RATE = 10;
RLCore.MIN_FIRE_RATE = 4;

RLCore.resolveStats = function (ship, owned) {
  const sum = key => owned.reduce((acc, o) => {
    const u = RLCore.UPGRADES.find(x => x.id === o.id);
    const v = u && u.effect[key];
    return acc + (typeof v === 'number' ? v * o.stacks : 0);
  }, 0);
  const has = key => owned.some(o => {
    const u = RLCore.UPGRADES.find(x => x.id === o.id);
    return u && u.effect[key] === true;
  });
  const max = key => owned.reduce((acc, o) => {
    const u = RLCore.UPGRADES.find(x => x.id === o.id);
    const v = u && u.effect[key];
    return typeof v === 'number' ? Math.max(acc, v) : acc;
  }, 0);

  // Fire rate is an interval in frames, so a bonus divides rather than multiplies.
  const rate = RLCore.BASE_FIRE_RATE * ship.fireMul / (1 + sum('fireRateMul'));

  return {
    fireRate: Math.max(RLCore.MIN_FIRE_RATE, rate),
    damage: 1 * (1 + sum('damageMul')),
    speed: ship.speed * (1 + sum('speedMul')),
    spread: ship.spreadMul * (1 + sum('spreadMul')),
    hitScale: 1 + sum('hitScaleMul'),
    shieldCharges: sum('shieldCharges'),
    extraShots: sum('extraShots'),
    extraLives: sum('lives') + sum('extraLife'),
    scrapMul: 1 + sum('scrapMul'),
    pierce: sum('pierce'),
    homing: max('homing'),
    splash: max('splash'),
    shieldRegen: max('shieldRegen'),
    overcharge: max('overcharge'),
    lifePerKills: max('lifePerKills'),
    drones: sum('drones'),
    chain: max('chain'),
    fortress: max('fortress'),
    enemyBulletMul: 1 + sum('enemyBulletMul'),
    split: has('split'),
    rear: has('rear'),
    sides: has('sides'),
    phaseBoost: has('phaseBoost'),
    twinCore: has('twinCore'),
    singularity: has('singularity')
  };
};

RLCore.CREDIT_DIVISOR = 100;

// Cheapest-first is what lets commons act as armour around a rare build: three
// stacks of a 240-scrap upgrade are three hits the Orbital Drone does not take.
RLCore.stripCheapest = function (owned) {
  if (!owned.length) return { owned, removed: null };
  const rank = id => RLCore.TIERS.findIndex(t => t.id === id);
  let best = -1;
  owned.forEach((o, i) => {
    const u = RLCore.UPGRADES.find(x => x.id === o.id);
    if (!u) return;
    if (best === -1) { best = i; return; }
    const bu = RLCore.UPGRADES.find(x => x.id === owned[best].id);
    // Lower tier wins; ties go to the most recently acquired, which is the later index.
    if (rank(u.tier) < rank(bu.tier) || (rank(u.tier) === rank(bu.tier) && i > best)) best = i;
  });
  if (best === -1) return { owned, removed: null };

  const target = owned[best];
  const u = RLCore.UPGRADES.find(x => x.id === target.id);
  const next = owned.map((o, i) => (i === best ? { id: o.id, stacks: o.stacks - 1 } : o))
                    .filter(o => o.stacks > 0);
  return { owned: next, removed: { id: target.id, tier: u.tier } };
};

// Firing pattern: the two base shots fly parallel until WIDE MOUNT adds more,
// at which point the whole pattern fans out (narrower with TIGHT BARREL).
RLCore.buildShots = function (s) {
  const n = 2 + s.extraShots;
  const step = 0.085 * s.spread;
  const fan = s.extraShots > 0;   // the two base shots fly parallel, as they do today
  const shots = [];
  // Centre the pattern on straight-up and keep its total width at 20px, so the
  // muzzles stay on the hull no matter how many shots there are.
  for (let i = 0; i < n; i++) {
    const off = i - (n - 1) / 2;
    shots.push({ dx: off * (n > 1 ? 20 / (n - 1) : 0), dy: -10, a: fan ? off * step : 0 });
  }
  if (s.rear)  shots.push({ dx: -6, dy: 12, a: Math.PI }, { dx: 6, dy: 12, a: -Math.PI });
  if (s.sides) shots.push({ dx: -14, dy: 0, a: -Math.PI/2 }, { dx: 14, dy: 0, a: Math.PI/2 });
  return s.twinCore ? shots.concat(shots.map(x => ({ dx: x.dx * 0.6, dy: x.dy + 4, a: x.a }))) : shots;
};

RLCore.scrapForKill = function (points, scrapMul) { return Math.round(points * scrapMul); };
RLCore.creditsForScore = function (score) { return Math.floor(score / RLCore.CREDIT_DIVISOR); };
RLCore.rerollCost = function (uses) { return 300 * Math.pow(2, uses); };

// Spent, not earned: hoarding scrap should not summon a tougher boss, only
// actually being stronger should. The 12,000-scrap cap is provisional and will
// be tuned during Task 16 playtesting.
RLCore.bossHpMultiplier = function (scrapSpent) {
  return 1 + 1.5 * Math.min(1, scrapSpent / 12000);
};

// ===== END ROGUELIKE CORE (PURE) =====

// ===== SAVE =====

const Save = {
  KEY: 'voidrunner.save',
  VERSION: RLCore.SAVE_VERSION,
  ok: true,
  data: null,

  defaults() {
    return {
      version: RLCore.SAVE_VERSION,
      hiScore: 0, bestLevel: 1, totalRuns: 0, totalKills: 0,
      credits: 0, unlocked: ['vanguard'], selectedShip: 'vanguard', muted: false,
      bestScrapSpent: 0, apexFound: 0
    };
  },

  load() {
    Save.data = Save.defaults();
    try {
      const raw = localStorage.getItem(Save.KEY);
      if (raw) {
        const { data, ok } = RLCore.migrateSave(JSON.parse(raw), Save.defaults());
        Save.data = data;
        if (!CFG.ships.some(s => s.id === Save.data.selectedShip)) Save.data.selectedShip = 'vanguard';
        // Only persist over the stored bytes when migration actually recognized
        // the save. An unrecognized version runs on defaults for this session
        // but leaves the original data untouched, so it stays recoverable by a
        // later version or by hand rather than being silently overwritten.
        if (ok) Save.write();
      }
    } catch (e) {
      Save.ok = false;
      Save.data = Save.defaults();
    }
  },

  write() {
    try {
      localStorage.setItem(Save.KEY, JSON.stringify(Save.data));
    } catch (e) {
      Save.ok = false;
    }
  }
};

Save.load();

// ===== AUDIO =====
// Everything here is synthesized at runtime — no asset files, so the game stays
// a single portable document. If the AudioContext can't be created the module
// goes inert and the game runs silent rather than failing.

const Sound = {
  ctx: null, master: null, sfxBus: null,
  dead: false, muted: Save.data.muted,
  noiseBuf: null,
  voiceEnds: [], MAX_VOICES: 12,

  // Browsers refuse to start audio before a user gesture, so this is called
  // from the first keydown / pointer event rather than at load.
  unlock() {
    if (Sound.ctx || Sound.dead) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { Sound.dead = true; return; }
      Sound.ctx = new AC();

      // Compressor on the way out so stacked explosions duck instead of clipping.
      const comp = Sound.ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 12;
      comp.ratio.value = 6;
      comp.attack.value = 0.004;
      comp.release.value = 0.18;
      comp.connect(Sound.ctx.destination);

      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = Sound.muted ? 0 : 1;
      Sound.master.connect(comp);

      Sound.sfxBus = Sound.ctx.createGain();
      Sound.sfxBus.gain.value = 1.3;
      Sound.sfxBus.connect(Sound.master);

      // One second of white noise, reused by every percussive sound.
      const len = Math.floor(Sound.ctx.sampleRate);
      const buf = Sound.ctx.createBuffer(1, len, Sound.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      Sound.noiseBuf = buf;

      Music.init();
      if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
    } catch (e) {
      Sound.dead = true;
      Sound.ctx = null;
    }
  },

  setMuted(m) {
    Sound.muted = m;
    if (Sound.master) Sound.master.gain.value = m ? 0 : 1;
  },

  ready() { return !!Sound.ctx && !Sound.dead; },

  // Voice limiting by scheduled end time rather than by an 'ended' event.
  // An event that never fires would leak the counter and silence the game
  // permanently; expired end times always clear themselves.
  claimVoice(endTime) {
    const now = Sound.ctx.currentTime;
    Sound.voiceEnds = Sound.voiceEnds.filter(t => t > now);
    if (Sound.voiceEnds.length >= Sound.MAX_VOICES) return false;
    Sound.voiceEnds.push(endTime);
    return true;
  },

  tone(freq, dur, type, gain, freqEnd, delay) {
    if (!Sound.ready()) return;
    const t = Sound.ctx.currentTime + (delay || 0);
    if (!Sound.claimVoice(t + dur)) return;
    const o = Sound.ctx.createOscillator();
    const g = Sound.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Sound.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, filtFreq, gain, filtEnd, delay) {
    if (!Sound.ready() || !Sound.noiseBuf) return;
    const t = Sound.ctx.currentTime + (delay || 0);
    if (!Sound.claimVoice(t + dur)) return;
    const s = Sound.ctx.createBufferSource();
    s.buffer = Sound.noiseBuf;
    const f = Sound.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(filtFreq, t);
    if (filtEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, filtEnd), t + dur);
    const g = Sound.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(Sound.sfxBus);
    s.start(t); s.stop(t + dur);
  },

  play(name) {
    if (!Sound.ready()) return;
    switch (name) {
      case 'laser':
        Sound.tone(900, 0.08, 'square', 0.10, 240);
        break;
      case 'hit':
        Sound.noise(0.05, 3200, 0.22, 700);
        break;
      case 'explode':
        Sound.noise(0.34, 1400, 0.40, 70);
        Sound.tone(130, 0.28, 'sawtooth', 0.14, 42);
        break;
      case 'bigExplode':
        Sound.noise(0.85, 1000, 0.42, 40);
        Sound.tone(85, 0.7, 'sawtooth', 0.16, 26);
        Sound.noise(0.5, 400, 0.2, 30, 0.12);
        break;
      case 'powerup':
        [523.25, 659.25, 783.99].forEach((f, i) => Sound.tone(f, 0.11, 'triangle', 0.12, null, i*0.055));
        break;
      case 'weaponUp':

// Procedural soundtrack: a 16-step sequencer scheduled ahead of the audio clock,
// so it never depends on the render loop's timing.
const Music = {
  bus: null, playing: false, timer: null,
  // `wanted` is whether a run wants music at all; `playing` is whether it is
  // actually being scheduled. Mute separates the two so unmuting mid-run can
  // resume without a run having to restart the track.
  wanted: false,
  step: 0, bar: 0, nextTime: 0,
  level: 1, boss: false,

  ROOTS:      [55.00, 43.65, 65.41, 48.99], // A1  F1  C2  G1
  BOSS_ROOTS: [55.00, 58.27, 55.00, 51.91], // A1  Bb1 A1  Ab1

  init() {
    if (!Sound.ready()) return;
    // Deliberately well under the SFX bus — the track is a bed, not the focus.
    Music.bus = Sound.ctx.createGain();
    Music.bus.gain.value = 0.14;
    Music.bus.connect(Sound.master);
  },

  start() {
    Music.wanted = true;
    if (!Sound.ready() || !Music.bus) return;
    Music.playing = !Sound.muted;
    Music.step = 0; Music.bar = 0;
    Music.nextTime = Sound.ctx.currentTime + 0.08;
    if (!Music.timer) Music.timer = setInterval(Music.tick, 25);
  },

  stop() { Music.wanted = false; Music.playing = false; },

  // Muting stops scheduling outright rather than only zeroing the output gain,
  // so a muted game does no audio work at all. Unmuting picks the track up from
  // where it was, and rebases nextTime so the silent gap is not scheduled as a
  // backlog of notes all landing at once.
  setMuted(m) {
    if (m) { Music.playing = false; return; }
    if (!Music.wanted || !Sound.ready() || !Music.bus) return;
    Music.playing = true;
    Music.nextTime = Sound.ctx.currentTime + 0.08;
  },
  setIntensity(lv) { Music.level = lv; },
  setBoss(b) { Music.boss = b; },

  stepDur() {
    return Music.boss ? 0.112 : Math.max(0.105, 0.16 - Music.level*0.004);
  },

  tick() {
    if (!Music.playing || !Sound.ready()) return;
    const dur = Music.stepDur();
    // Schedule a little ahead of the clock so timing survives a busy main thread.
    while (Music.nextTime < Sound.ctx.currentTime + 0.15) {
      Music.schedule(Music.step, Music.nextTime);
      Music.nextTime += dur;
      Music.step++;
      if (Music.step >= 16) { Music.step = 0; Music.bar++; }
    }
  },

  note(freq, dur, type, gain, t, freqEnd) {
    if (!Sound.ready() || !Music.bus) return;
    const o = Sound.ctx.createOscillator();
    const g = Sound.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Music.bus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  perc(dur, filt, gain, t, filtEnd) {
    if (!Sound.ready() || !Music.bus || !Sound.noiseBuf) return;
    const s = Sound.ctx.createBufferSource();
    s.buffer = Sound.noiseBuf;
    const f = Sound.ctx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.setValueAtTime(filt, t);
    if (filtEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, filtEnd), t + dur);
    const g = Sound.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(Music.bus);
    s.start(t); s.stop(t + dur);
  },

  schedule(step, t) {
    const roots = Music.boss ? Music.BOSS_ROOTS : Music.ROOTS;
    const root = roots[Music.bar % roots.length];
    const lv = Music.level;

    // Kick — always present, the spine of the track.
    if (step === 0 || step === 8 || (Music.boss && step === 11)) {
      Music.note(130, 0.16, 'sine', 0.5, t, 40);
    }
    // Bass
    if ([0, 3, 6, 8, 11, 14].includes(step)) {
      Music.note(root, 0.16, 'square', 0.16, t);
    }
    // Arpeggio from level 3 — minor triad above the root.
    if (lv >= 3 && step % 2 === 1) {
      const ratios = [2, 2.378, 3, 4]; // octave, minor 3rd, 5th, two octaves
      const f = root * ratios[(step >> 1) % ratios.length];
      Music.note(f, 0.10, 'triangle', 0.075, t);
    }
    // Hi-hat from level 6.
    if (lv >= 6 && step % 2 === 0) {
      Music.perc(0.035, 7000, 0.10, t);
    }
    // Snare backbeat from level 4.
    if (lv >= 4 && (step === 4 || step === 12)) {
      Music.perc(0.09, 1600, 0.16, t, 600);
    }
  }
};

  player.w = ship.hitW * stats.hitScale;

  // drones[] array in sync with stats.drones every time stats are resolved.
  syncDrones();
}

// Impact feedback. Kept separate from game state so nothing here can change
// the outcome of a run — it only changes how the run feels.
const FX = {
  hitStopFrames: 0,
  shake: 0, shakeX: 0, shakeY: 0,
  slowMoFrames: 0, slowMoFactor: 1, slowAcc: 0,
  rings: [], glows: [],
  MAX_RINGS: 24, MAX_GLOWS: 24,

  reset() {
    FX.hitStopFrames = 0; FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0;
    FX.slowMoFrames = 0; FX.slowMoFactor = 1; FX.slowAcc = 0;
    FX.rings = []; FX.glows = [];
  },

  // Freezing the simulation for a few frames while the explosion stays on
  // screen is the cheapest way to make a kill feel like it landed.
  hitStop(f) { FX.hitStopFrames = Math.max(FX.hitStopFrames, f); },
  addShake(a) { FX.shake = Math.max(FX.shake, a); },
  slowMo(frames, factor) { FX.slowMoFrames = frames; FX.slowMoFactor = factor; FX.slowAcc = 0; },

  explode(x, y, size, color) {
    FX.rings.push({ x, y, r: size*0.25, maxR: size*2.1, life: 24, maxLife: 24, color });
    FX.glows.push({ x, y, r: size*1.5, life: 9, maxLife: 9, color });
    const chunks = Math.max(4, Math.round(size*0.5));
    for (let i = 0; i < chunks; i++) {
      const a = Math.random()*Math.PI*2;
      const sp = 1 + Math.random()*size*0.14;
      particles.push({
        x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 26 + Math.random()*28, maxLife: 54,
        r: 1.5 + Math.random()*size*0.10,
        color, type: 'chunk',
        rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.35
      });
    }
    spawnParticles(x, y, color, Math.max(4, Math.round(size*0.45)));
    if (FX.rings.length > FX.MAX_RINGS) FX.rings.splice(0, FX.rings.length - FX.MAX_RINGS);
    if (FX.glows.length > FX.MAX_GLOWS) FX.glows.splice(0, FX.glows.length - FX.MAX_GLOWS);
  },

  step() {
    FX.rings.forEach(r => { r.life--; r.r += (r.maxR - r.r) * 0.18; });
    FX.rings = FX.rings.filter(r => r.life > 0);
    FX.glows.forEach(g => { g.life--; });
    FX.glows = FX.glows.filter(g => g.life > 0);
    if (FX.shake > 0) {
      FX.shake -= 1.2;
      FX.shakeX = (Math.random()-0.5)*FX.shake;
      FX.shakeY = (Math.random()-0.5)*FX.shake;
    } else { FX.shake = 0; FX.shakeX = 0; FX.shakeY = 0; }
  }
};

// Keep array lengths bounded so a chaotic screen can't sink the frame rate.
function capArray(arr, max) {
  if (arr.length > max) arr.splice(0, arr.length - max);
  return arr;
}
function capAll() {
  capArray(particles, CFG.caps.particles);
  capArray(bullets, CFG.caps.bullets);
  capArray(enemyBullets, CFG.caps.enemyBullets);
  capArray(enemies, CFG.caps.enemies);
}
