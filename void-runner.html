// ===== ROGUELIKE CORE (PURE) =====
// No DOM, no canvas, no game globals. Randomness arrives as an injected rnd().
// tests/roguelike.test.mjs extracts and evaluates everything between these
// sentinels, so keeping it pure is what makes the game testable at all.

const RLCore = {};

RLCore.SAVE_VERSION = 4;

// Upgrading rather than resetting is the whole point: a loader that throws away
// any save whose version does not match would wipe every player's credits and
// ships the moment the format changed. v1 and v2 both upgrade in place.
// ---------------------------------------------------------------------------
// SETTINGS
// ---------------------------------------------------------------------------
// Three independent volumes and a rebindable key for every action. Kept pure
// so a corrupt or half-written settings blob can never brick the game -- the
// normalizer always returns something playable.

RLCore.DEFAULT_BINDS = {
  left:  ['ArrowLeft', 'a'],
  right: ['ArrowRight', 'd'],
  up:    ['ArrowUp', 'w'],
  down:  ['ArrowDown', 's'],
  fire:  [' ', 'j'],
  skip:  ['s', 'x'],
  reroll:['r'],
  mute:  ['m'],
  pause: ['Escape', 'p']
};

RLCore.BIND_ORDER = ['left', 'right', 'up', 'down', 'fire', 'skip', 'reroll', 'mute', 'pause'];

RLCore.BIND_LABELS = {
  left: 'MOVE LEFT', right: 'MOVE RIGHT', up: 'MOVE UP', down: 'MOVE DOWN',
  fire: 'FIRE', skip: 'SKIP SHOP', reroll: 'REROLL', mute: 'MUTE', pause: 'SETTINGS'
};

RLCore.defaultSettings = function () {
  const binds = {};
  RLCore.BIND_ORDER.forEach(k => { binds[k] = RLCore.DEFAULT_BINDS[k].slice(); });
  return { volMusic: 0.7, volAmbient: 0.6, volAttack: 0.8, autoSkip: false, binds };
};

RLCore.normalizeSettings = function (raw) {
  const out = RLCore.defaultSettings();
  if (!raw || typeof raw !== 'object') return out;
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? Math.max(0, Math.min(1, v)) : d;
  out.volMusic = num(raw.volMusic, out.volMusic);
  out.volAmbient = num(raw.volAmbient, out.volAmbient);
  out.volAttack = num(raw.volAttack, out.volAttack);
  out.autoSkip = raw.autoSkip === true;
  if (raw.binds && typeof raw.binds === 'object') {
    RLCore.BIND_ORDER.forEach(k => {
      const v = raw.binds[k];
      // A rebind that saved an empty list would leave the action unreachable
      // with no way to fix it from inside the game, so an empty list falls
      // back to the default rather than being honoured.
      if (Array.isArray(v) && v.length && v.every(x => typeof x === 'string')) out.binds[k] = v.slice(0, 3);
    });
  }
  return out;
};

RLCore.migrateSave = function (parsed, defaults) {
  // The failure path returns a COPY: handing back the caller's own defaults
  // object means anything that later writes to the result corrupts the
  // defaults for the rest of the session.
  const fresh = () => ({ data: Object.assign({}, defaults), ok: false });
  if (!parsed || typeof parsed !== 'object') return fresh();
  const v = parsed.version;
  if ([1, 2, 3, RLCore.SAVE_VERSION].indexOf(v) === -1) return fresh();

  const data = Object.assign({}, defaults, parsed);
  data.version = RLCore.SAVE_VERSION;
  if (v === 1) { data.bestScrapSpent = 0; data.apexFound = 0; }
  if (v === 1 || v === 2) {
    data.voidbirths = 0;
    data.bestLevel = Math.max(1, data.bestLevel || 1);
    data.bestVoidbirth = 0;
    data.tiersFound = {};
    data.bossesKilled = {};
  }
  // v4 adds the bestiary and the settings panel. Both default to "nothing
  // seen, everything at full volume", which is exactly right for an old save:
  // the player has not opened a settings screen that did not exist, and the
  // bestiary fills in from here rather than pretending to be complete.
  if (v === 1 || v === 2 || v === 3) {
    data.seenUpgrades = {}; data.seenEnemies = {}; data.seenMeteors = {};
    data.settings = null;
  }
  if (!data.seenUpgrades || typeof data.seenUpgrades !== 'object') data.seenUpgrades = {};
  if (!data.seenEnemies || typeof data.seenEnemies !== 'object') data.seenEnemies = {};
  if (!data.seenMeteors || typeof data.seenMeteors !== 'object') data.seenMeteors = {};
  data.settings = RLCore.normalizeSettings(data.settings);
  if (!data.tiersFound || typeof data.tiersFound !== 'object') data.tiersFound = {};
  if (!data.bossesKilled || typeof data.bossesKilled !== 'object') data.bossesKilled = {};
  if (!Array.isArray(data.unlocked) || !data.unlocked.length) data.unlocked = ['vanguard'];
  if (typeof data.selectedShip !== 'string' || !data.unlocked.includes(data.selectedShip)) data.selectedShip = 'vanguard';
  return { data, ok: true };
};

// ---------------------------------------------------------------------------
// RARITY
// ---------------------------------------------------------------------------

RLCore.TIERS = [
  { id: 'COMMON',       name: 'COMMON',       price:   240, color: '#b8c4d0', color2: '#8c98a4', stackLimit: 5 },
  { id: 'UNCOMMON',     name: 'UNCOMMON',     price:   500, color: '#44dd77', color2: '#22aa55', stackLimit: 5 },
  { id: 'RARE',         name: 'RARE',         price:   900, color: '#3399ff', color2: '#1166cc', stackLimit: 3 },
  { id: 'EPIC',         name: 'EPIC',         price:  2100, color: '#aa66ff', color2: '#7733cc', stackLimit: 2 },
  { id: 'LEGENDARY',    name: 'LEGENDARY',    price:  4500, color: '#ffaa22', color2: '#cc7700', stackLimit: 1 },
  { id: 'MYTHIC',       name: 'MYTHIC',       price:  7000, color: '#ff3388', color2: '#aa0055', stackLimit: 1 },
  { id: 'APEX',         name: 'APEX',         price: 11000, color: '#00ffee', color2: '#ffdd33', stackLimit: 1 },
  { id: 'OVERCLOCKED',  name: 'OVERCLOCKED',  price: 20000, color: '#ffffff', color2: '#ff66ff', stackLimit: 1 },
  { id: 'HYPERCLOCKED', name: 'HYPERCLOCKED', price: 34000, color: '#ff00cc', color2: '#00ffcc', stackLimit: 1 },
  { id: 'UBERCLOCKED',  name: 'UBERCLOCKED',  price: 55000, color: '#ffcc00', color2: '#ff3300', stackLimit: 1 },
  { id: 'DYNACLOCKED',  name: 'DYNACLOCKED',  price: 90000, color: '#ffffff', color2: '#000000', stackLimit: 1 },
  // SECRET sits OFF the ladder. Voidbirth drift never reaches it, an exhausted
  // tier never promotes into it, and it costs one scrap -- the joke only works
  // if finding it at all is the entire price. See SECRET_CHANCE.
  { id: 'SECRET',       name: '???',          price:     1, color: '#00ff88', color2: '#ff00aa', stackLimit: 1, offLadder: true }
];

// Everything that walks, drifts or promotes up the ladder stops below SECRET.
RLCore.LADDER = RLCore.TIERS.filter(t => !t.offLadder);
RLCore.MAX_TIER_INDEX = RLCore.LADDER.length - 1;
RLCore.SECRET_TIER = 'SECRET';

// One in a million, rolled before the ladder and independent of depth. A
// player on their first run has exactly the same odds as one at voidbirth V,
// which is what makes it a story rather than a milestone.
RLCore.SECRET_CHANCE = 1 / 1000000;

// The odds, expressed once. Position i of this vector is the weight of the
// tier `i` rungs above the current floor -- so a voidbirth shifts the whole
// vector one rung up the ladder and every tier inherits the odds of the tier
// below it, which is exactly the rule the design asks for.
RLCore.WEIGHT_VECTOR = [51.5, 27, 13, 6, 1.7, 0.49, 0.30, 0.01];

// Ascension is no longer gated to five fixed levels. The first one is handed
// to you the moment the level-50 boss dies, and after that EVERY boss is an
// ascension point -- so the ladder is climbed by beating things, not by
// arriving at a particular number.
RLCore.FIRST_VOIDBIRTH_LEVEL = 50;
RLCore.MAX_VOIDBIRTH = 5;

// The three deepest positions of the vector never drift with depth. They are
// the one set of odds a player can rely on never moving, which is what makes
// an APEX feel earned rather than inevitable.
RLCore.UNDRIFTABLE_POSITIONS = 3;
RLCore.DRIFT_PER_LEVEL = 0.5;
RLCore.DRIFT_MAX = 20;

RLCore.clampVoidbirth = function (vb) {
  return Math.max(0, Math.min(RLCore.MAX_VOIDBIRTH, Math.floor(vb || 0)));
};

// Index of the lowest tier still offered at this voidbirth depth.
RLCore.floorTierIndex = function (vb) {
  return Math.min(RLCore.MAX_TIER_INDEX, RLCore.clampVoidbirth(vb));
};

// How many levels into the current voidbirth segment `level` sits. An
// ascension now drops you back to level 1, so the segment always starts there
// and this is simply how far you have climbed since -- which also means drift
// restarts from zero every time, as it always did.
RLCore.levelsIntoSegment = function (level, vb) {
  return Math.max(0, (level || 1) - 1);
};

RLCore.rarityWeights = function (level, vb) {
  const v = RLCore.clampVoidbirth(vb);
  const w = {};
  RLCore.TIERS.forEach(t => { w[t.id] = 0; });

  // Shift the vector up by the voidbirth count. Anything that would fall off
  // the top of the ladder piles onto the last tier, so the weights always sum
  // to exactly 100 no matter how deep the player is.
  const V = RLCore.WEIGHT_VECTOR;
  for (let i = 0; i < V.length; i++) {
    const idx = Math.min(RLCore.MAX_TIER_INDEX, i + v);
    w[RLCore.TIERS[idx].id] += V[i];
  }

  // Depth drift: weight moves off the floor tier into the four rungs above it.
  const drift = Math.min(RLCore.DRIFT_MAX, RLCore.DRIFT_PER_LEVEL * RLCore.levelsIntoSegment(level, v));
  if (drift <= 0) return w;

  const floorIdx = RLCore.floorTierIndex(v);
  const floorId = RLCore.TIERS[floorIdx].id;
  const topDriftable = Math.min(RLCore.MAX_TIER_INDEX, v + V.length - 1 - RLCore.UNDRIFTABLE_POSITIONS);
  const mid = [];
  for (let idx = floorIdx + 1; idx <= topDriftable; idx++) mid.push(RLCore.TIERS[idx].id);
  if (!mid.length) return w;

  const midTotal = mid.reduce((a, id) => a + w[id], 0);
  if (midTotal <= 0) return w;

  const actual = Math.min(drift, w[floorId]);
  w[floorId] -= actual;
  mid.forEach(id => { w[id] += actual * (w[id] / midTotal); });
  return w;
};

RLCore.rollRarity = function (level, vb, rnd) {
  // The secret draw happens first and outside the ladder entirely, so it can
  // never be crowded out by a deep voidbirth stacking weight into the top.
  if (rnd() < RLCore.SECRET_CHANCE) return RLCore.SECRET_TIER;
  const w = RLCore.rarityWeights(level, vb);
  let r = rnd() * 100;
  for (const t of RLCore.LADDER) {
    r -= w[t.id];
    if (r < 0) return t.id;
  }
  return RLCore.LADDER[RLCore.floorTierIndex(vb)].id;
};

// ---------------------------------------------------------------------------
// THE HP ECONOMY
// ---------------------------------------------------------------------------
// Anchored on three numbers: a base shot deals 10, a level-1 grunt has 20 HP,
// and the level-2500 mothership has 10,000,000 and takes about four minutes.
// Everything between those anchors is fitted, not guessed --
// docs/superpowers/specs/2026-08-08-void-ascension-design.md shows the fit.

RLCore.BASE_DAMAGE = 10;
RLCore.BASE_FIRE_RATE = 10;   // frames between shots; lower is faster
RLCore.MIN_FIRE_RATE = 6;     // 10 shots/sec, so aiming never stops mattering
RLCore.HP_EXPONENT = 0.95;

// The baseline a bare ship deals at this depth. THIS is what lets a level-10
// boss have 1,000 HP and the level-2500 Mothership have 1,000,000,000 in the
// same game: enemy health and the floor of your damage climb on the SAME
// exponent, so your build is a multiplier over the baseline rather than a
// footrace against it. Without this, honouring both numbers would mean a
// final fight lasting somewhere north of five hours.
//
// A voidbirth drops you back to level 1, so this drops with you. That is the
// point: the ladder you climb again is the same ladder, with better cards.
RLCore.baseDamageAt = function (level) {
  return RLCore.BASE_DAMAGE * Math.pow(Math.max(1, level || 1), RLCore.HP_EXPONENT);
};

// Legacy per-kind table, kept because the boss minions and a handful of tests
// still name these. The band roster below is what the spawner actually reads.
RLCore.ENEMY_HP = {
  swarmling: 8, kamikaze: 14, grunt: 20, mine: 24, weaver: 35,
  lancer: 45, elite: 60, turret: 90, bulwark: 160, harbinger: 400
};

RLCore.enemyHp = function (kind, level) {
  const band = RLCore.ENEMY_BY_ID && RLCore.ENEMY_BY_ID[kind];
  const base = band ? band.hp : RLCore.ENEMY_HP[kind];
  if (typeof base !== 'number') throw new Error('RLCore.enemyHp: unknown kind "' + kind + '"');
  return Math.max(1, Math.round(base * Math.pow(Math.max(1, level), RLCore.HP_EXPONENT)));
};

// Nothing is deleted in a single frame. An enemy tough enough to be worth
// naming should always be worth at least a couple of trigger pulls, and a
// boss should never evaporate to one lucky crit stack -- which is exactly
// what an unbounded damage multiplier plus EXECUTE could do.
RLCore.MIN_BOSS_HITS = 14;
RLCore.MIN_ENEMY_HITS = 2;
RLCore.FRAGILE_HP = 16;   // at or under this, a thing may still pop in one hit

RLCore.capDamage = function (dmg, maxHp, isBoss) {
  if (!(maxHp > 0)) return dmg;
  if (isBoss) return Math.min(dmg, maxHp / RLCore.MIN_BOSS_HITS);
  if (maxHp <= RLCore.FRAGILE_HP) return dmg;
  return Math.min(dmg, maxHp / RLCore.MIN_ENEMY_HITS);
};

// Enemies grow as well as toughen, so a deep-run grunt reads as a real ship
// rather than the same sprite with a bigger number behind it.
// Divisor set so the cap is actually approached inside the playable range:
// at 22 it only reached 1.70x at level 2500 and would not have hit 2.4x until
// somewhere past level 17,000, which is not a size curve anyone would ever see.
RLCore.ENEMY_SCALE_CAP = 2.4;
RLCore.enemyScale = function (level) {
  return Math.min(RLCore.ENEMY_SCALE_CAP, 1 + Math.pow(Math.max(1, level), 0.35) / 11);
};

// ---------------------------------------------------------------------------
// DIFFICULTY CURVE
// ---------------------------------------------------------------------------
// Speeds saturate. The original curves were linear in level and unbounded:
// `1.2 + level*0.2` and `2.5 + level*0.15`. That is fine for eight levels and
// catastrophic for 2,500 — at the Mothership an enemy bullet moved 377 px per
// frame and crossed the whole 720px screen in under two frames. Not "hard":
// literally undodgeable, and invisible on the way. Everything past roughly
// level 150 was unplayable.
//
// Both curves are unchanged up to their knee, so the early game plays exactly
// as it was tuned, and then creep gently so depth still reads as faster
// without ever outrunning reaction time. Enemy bullets stay slower than the
// player's own (11 px/frame) at every depth.

RLCore.PLAYER_BULLET_SPEED = 11;
RLCore.ENEMY_SPEED_KNEE = 24;    // where 1.2 + 0.2*level reaches the cap
RLCore.ENEMY_SPEED_CAP = 6.0;
RLCore.BULLET_SPEED_KNEE = 50;   // where 2.5 + 0.15*level reaches the cap
RLCore.BULLET_SPEED_CAP = 10.0;

RLCore.difficultyAt = function (level) {
  const lv = Math.max(1, level || 1);
  const enemySpeed = lv <= RLCore.ENEMY_SPEED_KNEE
    ? 1.2 + lv * 0.2
    : RLCore.ENEMY_SPEED_CAP + Math.min(1.5, (lv - RLCore.ENEMY_SPEED_KNEE) * 0.002);
  const bulletSpeed = lv <= RLCore.BULLET_SPEED_KNEE
    ? 2.5 + lv * 0.15
    : RLCore.BULLET_SPEED_CAP + Math.min(0.5, (lv - RLCore.BULLET_SPEED_KNEE) * 0.0004);
  return {
    spawnRate: Math.max(35, 90 - lv * 5),
    asteroidRate: Math.max(50, 120 - lv * 6),
    enemySpeed, bulletSpeed
  };
};

RLCore.ENEMY_BY_ID = {};
RLCore.ENEMY_ROSTER.forEach(e => { RLCore.ENEMY_BY_ID[e.id] = e; });

RLCore.BAND_SIZE = 10;
RLCore.CYCLE_FROM = 4;   // past level 100 the roster loops over bands 4..9

RLCore.bandIndex = function (level) {
  const b = Math.floor((Math.max(1, level || 1) - 1) / RLCore.BAND_SIZE);
  if (b < RLCore.ENEMY_BANDS.length) return b;
  const span = RLCore.ENEMY_BANDS.length - RLCore.CYCLE_FROM;
  return RLCore.CYCLE_FROM + ((b - RLCore.ENEMY_BANDS.length) % span);
};

RLCore.rosterFor = function (level) {
  return RLCore.ENEMY_BANDS[RLCore.bandIndex(level)];
};

RLCore.bandTheme = function (level) {
  return RLCore.BAND_THEMES[RLCore.bandIndex(level)];
};

// Weight inside a band: the cheap hulls are common early in the band and the
// heavy ones crowd in by the end of it, so a band has its own arc rather than
// being a flat ten levels of the same mix.
RLCore.enemyWeightsFor = function (level) {
  const roster = RLCore.rosterFor(level);
  const into = ((Math.max(1, level || 1) - 1) % RLCore.BAND_SIZE) / (RLCore.BAND_SIZE - 1);
  const maxHp = roster.reduce((a, e) => Math.max(a, e.hp), 1);
  return roster.map(e => {
    const heavy = e.hp / maxHp;          // 0 = lightest hull, 1 = heaviest
    return [e.id, Math.max(0.35, 1 - heavy * (1 - into) * 0.9)];
  });
};

RLCore.meteorsFor = function (level) {
  return RLCore.METEORS.filter(m => level >= m.from);
};

RLCore.rollMeteor = function (level, rnd) {
  const pool = RLCore.meteorsFor(level);
  if (!pool.length) return RLCore.METEORS[0];
  const total = pool.reduce((a, m) => a + m.weight, 0);
  let r = rnd() * total;
  for (const m of pool) { r -= m.weight; if (r < 0) return m; }
  return pool[0];
};

// Rocks harden with depth on the same exponent as everything else, so a
// starglass at level 400 is still worth a burst rather than being scenery.
RLCore.meteorHp = function (id, level) {
  const m = RLCore.METEORS.find(x => x.id === id);
  if (!m) throw new Error('RLCore.meteorHp: unknown meteor "' + id + '"');
  return Math.max(1, Math.round(m.hp * Math.pow(Math.max(1, level), RLCore.HP_EXPONENT) / 4));
};

// BOSSES
// ---------------------------------------------------------------------------
// Seventeen hand-built fights. Each `key` selects a distinct update and draw
// path -- these deliberately share no attack code, which is the whole point.

// Health follows one curve, hp = 1000 * (level/10)^2.5, fitted to two fixed
// points: the first boss has 1,000 and the Mothership has 1,000,000,000. The
// exponent is steeper than the enemy curve on purpose -- bosses are meant to
// pull further ahead of ordinary traffic the deeper you go.
//
// The ORDER is deliberate too. Both fights built around a damage-blocking
// layer -- HALO WARDEN's rotating ring and SCRAPJAW's armour plates -- sit

RLCore.ARMADA_INTERVAL = 100;

RLCore.isBossLevel = function (level) {
  if (!(level > 0)) return false;
  if (RLCore.BOSS_TABLE.some(b => b.level === level)) return true;
  return level > 1000 && level % RLCore.ARMADA_INTERVAL === 0;
};

// The curve the table was fitted from. Used for the ARMADA escorts that fill
// the 1100-2400 stretch, so their health sits on the same line as the
// hand-set bosses rather than on a second, disagreeing one.
RLCore.BOSS_HP_BASE = 1000;      // the level-10 boss, exactly
RLCore.BOSS_HP_EXPONENT = 2.5;   // carries it to 1,000,000,000 at level 2500

RLCore.fittedBossHp = function (level) {
  const raw = RLCore.BOSS_HP_BASE * Math.pow(Math.max(1, level) / 10, RLCore.BOSS_HP_EXPONENT);
  if (raw < 10000) return Math.round(raw / 100) * 100;
  if (raw < 1000000) return Math.round(raw / 1000) * 1000;
  return Math.round(raw / 100000) * 100000;
};

RLCore.bossFor = function (level) {
  const exact = RLCore.BOSS_TABLE.find(b => b.level === level);
  if (exact) return exact;
  if (!RLCore.isBossLevel(level)) return null;

  // Past the Mothership it returns, harder and with another phase, every
  // hundred levels -- the run does not simply stop having a summit.
  if (level > 2500) {
    const n = Math.floor((level - 2500) / RLCore.ARMADA_INTERVAL);
    const base = RLCore.BOSS_TABLE[RLCore.BOSS_TABLE.length - 1];
    return {
      level, key: 'mothership', name: 'SCOURGE ASCENDANT ×' + n,
      hp: Math.round(base.hp * Math.pow(1.6, n)),
      phases: Math.min(12, base.phases + n),
      mechanic: base.mechanic, ascendant: n
    };
  }

  // 1100-2400: a WARR ARMADA escort, compositing two earlier bosses into a
  // fight neither of them was. Honestly combinatorial rather than bespoke,
  // and labelled as such so it reads as a system, not a recolour.
  const pool = RLCore.BOSS_TABLE.filter(b => b.level <= 1000);
  const n = (level - 1100) / RLCore.ARMADA_INTERVAL;
  const a = pool[n % pool.length];
  const b = pool[(n * 7 + 3) % pool.length];
  return {
    level, key: 'armada', name: 'WARR ARMADA — ' + a.name + ' / ' + b.name,
    hp: RLCore.fittedBossHp(level),
    phases: 4, mechanic: a.mechanic + ', and ' + b.mechanic,
    composite: [a.key, b.key]
  };
};

RLCore.bossHp = function (level) {
  const b = RLCore.bossFor(level);
  return b ? b.hp : 0;
};

// Both sources have to be consulted, not just the table: past level 1000 the
// every-100 rule supplies bosses the table does not list, and scanning the
// table alone reported the next boss after 1000 as 2500 -- skipping fourteen
// real fights.
RLCore.nextBossLevel = function (level) {
  const table = RLCore.BOSS_TABLE.find(b => b.level > level);
  const cycle = level >= 1000 ? (Math.floor(level / RLCore.ARMADA_INTERVAL) + 1) * RLCore.ARMADA_INTERVAL : null;
  if (table && cycle) return Math.min(table.level, cycle);
  if (table) return table.level;
  if (cycle) return cycle;
  return (Math.floor(level / RLCore.ARMADA_INTERVAL) + 1) * RLCore.ARMADA_INTERVAL;
};

// ---------------------------------------------------------------------------
// SHOP CADENCE
// ---------------------------------------------------------------------------
// Shops thin out as you ascend, so each visit carries more weight. Scrap
// income rises to match (see scrapForKill), keeping purchasing power per
// level roughly flat rather than starving the deep game.

RLCore.SHOP_EVERY = [1, 2, 4, 8, 8, 8];

RLCore.shopEvery = function (vb) {
  return RLCore.SHOP_EVERY[RLCore.clampVoidbirth(vb)];
};

// Called after clearing `level`. A shop always opens before a boss, whatever
// the cadence says -- walking into SEVEN ANGLES with no chance to prepare
// would be a difficulty spike made of bookkeeping rather than design.
RLCore.shopOpensAfter = function (level, vb) {
  if (RLCore.isBossLevel(level + 1)) return true;
  return level % RLCore.shopEvery(vb) === 0;
};

// ---------------------------------------------------------------------------
// VOIDBIRTH
// ---------------------------------------------------------------------------

// Any boss from level 50 up is an ascension point. The first one is not
// optional and not delayed: the frame the level-50 boss dies, the run ascends.
RLCore.isVoidbirthLevel = function (level) {
  return level >= RLCore.FIRST_VOIDBIRTH_LEVEL && RLCore.isBossLevel(level);
};

// A voidbirth is earned by killing the boss, so it always lands on a summit
// rather than in the middle of a wave.
RLCore.voidbirthAfterClearing = function (level, vb) {
  if (!RLCore.isVoidbirthLevel(level)) return null;
  const v = RLCore.clampVoidbirth(vb);
  if (v >= RLCore.MAX_VOIDBIRTH) return null;   // the ladder is fully climbed
  return { to: v + 1, numeral: RLCore.ROMAN[v], unlocks: RLCore.tierUnlockedAt(v + 1) };
};

// What survives an ascension. Upgrades burn and the level resets, but a
// sliver of the treasury carries over so a deep run does not restart on
// literally nothing.
RLCore.VOIDBIRTH_SCRAP_KEPT = 0.05;
RLCore.scrapAfterVoidbirth = function (scrap) {
  return Math.floor(Math.max(0, scrap || 0) * RLCore.VOIDBIRTH_SCRAP_KEPT);
};

RLCore.ROMAN = ['I', 'II', 'III', 'IV', 'V'];

// Which tier becomes reachable for the first time at this voidbirth depth.
RLCore.tierUnlockedAt = function (vb) {
  const v = RLCore.clampVoidbirth(vb);
  const idx = v + RLCore.WEIGHT_VECTOR.length - 1;
  return idx <= RLCore.MAX_TIER_INDEX ? RLCore.TIERS[idx].id : null;
};

RLCore.tierReachable = function (tierId, vb) {
  return RLCore.rarityWeights(1, vb)[tierId] > 0;
};

RLCore.tierIndexOf = function (id) {
  const i = RLCore.TIERS.findIndex(t => t.id === id);
  if (i === -1) throw new Error('RLCore.tierIndexOf: unknown tier id "' + id + '"');
  return i;
};

RLCore.tierOf = function (id) {
  return RLCore.TIERS[RLCore.tierIndexOf(id)];
};

// An upgrade's tier climbs with voidbirth depth, capped at the top of the
// ladder. This is what makes the whole catalogue move up together. SECRET
// cards are exempt: they are not ON the ladder, so there is nothing for them
// to climb, and promoting them would quietly cost them their $1 price.
RLCore.effectiveTier = function (upgrade, vb) {
  if (upgrade.tier === RLCore.SECRET_TIER) return RLCore.SECRET_TIER;
  const idx = Math.min(RLCore.MAX_TIER_INDEX, RLCore.tierIndexOf(upgrade.tier) + RLCore.clampVoidbirth(vb));
  return RLCore.LADDER[idx].id;
};

RLCore.effectiveName = function (upgrade, vb) {
  const v = RLCore.clampVoidbirth(vb);
  if (upgrade.line && upgrade.line[v]) return upgrade.line[v];
  return upgrade.name;
};

// Numbers scale with depth; flags do not. Scaling the flags would be
// meaningless and scaling nothing would make a promoted upgrade a downgrade.
// Always returns a fresh object, including at depth 0. Handing back the
// catalogue entry itself meant any caller that wrote into a resolved card's
// effect would permanently rewrite the catalogue for the session -- and it
// made depth 0 behave differently from every other depth.
RLCore.effectiveEffect = function (upgrade, vb) {
  const v = RLCore.clampVoidbirth(vb);
  const mul = v === 0 ? 1 : Math.pow(RLCore.LINEAGE_GROWTH, v);
  const out = {};
  Object.keys(upgrade.effect).forEach(k => {
    const val = upgrade.effect[k];
    out[k] = (typeof val === 'number' && v > 0) ? RLCore.roundEffect(k, val * mul) : val;
  });
  return out;
};

// Counts stay whole; multipliers keep two decimals so a card never reads
// "+0.12000000000000001% damage".
RLCore.INTEGER_EFFECTS = ['shieldCharges', 'extraShots', 'lives', 'extraLife', 'drones', 'chain',
  'fortress', 'pierce', 'overcharge', 'lifePerKills', 'shieldPerKills', 'splash', 'shieldRegen',
  'scrapPerLevel', 'scrapPerSecond', 'ricochet', 'shopSlots', 'freeRerolls', 'strips',
  'singularityCount', 'shieldIframes', 'reviveOnDeath'];

RLCore.roundEffect = function (key, v) {
  // Only positive integer effects are floored at 1 — clamping a zero or a
  // negative up to +1 would invent a bonus that the catalogue never granted.
  if (RLCore.INTEGER_EFFECTS.indexOf(key) !== -1) {
    return v > 0 ? Math.max(1, Math.round(v)) : Math.round(v);
  }
  return Math.round(v * 100) / 100;
};

// A view of an upgrade as it exists at this depth: the shape the shop, the
// HUD, and resolveStats all read.
RLCore.resolve = function (upgrade, vb) {
  return {
    id: upgrade.id,
    tier: RLCore.effectiveTier(upgrade, vb),
    name: RLCore.effectiveName(upgrade, vb),
    desc: upgrade.desc,
    effect: RLCore.effectiveEffect(upgrade, vb)
  };
};

RLCore.byId = function (id) {
  return RLCore.UPGRADES.find(u => u.id === id) || null;
};

RLCore.eligible = function (tier, owned, vb) {
  const limit = RLCore.tierOf(tier).stackLimit;
  return RLCore.UPGRADES.filter(u => {
    if (RLCore.effectiveTier(u, vb) !== tier) return false;
    const have = owned.find(o => o.id === u.id);
    return !have || have.stacks < limit;
  });
};

RLCore.rollSlot = function (level, vb, owned, rnd, exclude, bump) {
  const skip = exclude || [];
  const poolFor = tierId => RLCore.eligible(tierId, owned, vb).filter(u => skip.indexOf(u.id) === -1);

  // rollRarity consumes rnd() and must be called exactly once per slot:
  // calling it inside a loop predicate would re-draw for every tier checked,
  // which is not a single stable roll.
  const rarity = RLCore.rollRarity(level, vb, rnd);
  // A secret draw resolves against its own pool and nothing else. Falling
  // through to the ladder walk below would clamp index 11 down to DYNACLOCKED
  // and silently turn the rarest roll in the game into an ordinary one.
  if (rarity === RLCore.SECRET_TIER) {
    const pool = poolFor(RLCore.SECRET_TIER);
    if (pool.length) return pool[Math.floor(rnd() * pool.length)];
  }
  // ORACLE nudges a roll up the ladder AFTER it is made, so it improves the
  // draw without ever changing the odds themselves — the published rates stay
  // exactly the published rates.
  const startIdx = Math.min(RLCore.MAX_TIER_INDEX, RLCore.tierIndexOf(rarity) + Math.max(0, bump || 0));
  const floorIdx = RLCore.floorTierIndex(vb);

  // A slot must never come up empty while eligible upgrades remain, so an
  // exhausted tier promotes upward first: maxing out the cheap things should
  // make shops show better goods, not filler and then nothing. The walk stops
  // below the three undriftable top positions so their odds stay a fixed
  // promise -- a roll that lands there directly is honoured, promotion into
  // them is not.
  const topPromotable = Math.min(RLCore.MAX_TIER_INDEX,
    RLCore.clampVoidbirth(vb) + RLCore.WEIGHT_VECTOR.length - 1 - RLCore.UNDRIFTABLE_POSITIONS);
  const cap = startIdx > topPromotable ? startIdx : topPromotable;
  for (let idx = startIdx; idx <= cap; idx++) {
    const pool = poolFor(RLCore.TIERS[idx].id);
    if (pool.length) return pool[Math.floor(rnd() * pool.length)];
  }
  for (let idx = startIdx - 1; idx >= floorIdx; idx--) {
    const pool = poolFor(RLCore.TIERS[idx].id);
    if (pool.length) return pool[Math.floor(rnd() * pool.length)];
  }
  return null;
};

RLCore.BASE_SHOP_SLOTS = 3;

RLCore.rollShop = function (level, vb, owned, rnd, slots, bumpFirst) {
  // Only an absent slot count falls back to the default; an explicit 0 means
  // zero and clamps to one card. The old `slots || DEFAULT` read 0 as
  // "unspecified" while the Math.max next to it read it as a number.
  const want = (slots === undefined || slots === null) ? RLCore.BASE_SHOP_SLOTS : slots;
  const n = Math.max(1, want);
  const out = [];
  for (let i = 0; i < n; i++) {
    // Only the first slot is bumped (ORACLE): a whole shop of promoted cards
    // would make the tier ladder meaningless.
    const u = RLCore.rollSlot(level, vb, owned, rnd, out.map(o => o.id), i === 0 ? bumpFirst : 0);
    if (u) out.push(u);
  }
  return out.map(u => RLCore.resolve(u, vb));
};

// ---------------------------------------------------------------------------
// STAT RESOLUTION
// ---------------------------------------------------------------------------

RLCore.PHASE_DRIVE_FRAMES = 720;
RLCore.REPAIR_KIT_MAX = 2;
RLCore.MAX_SHIELD_CHARGES = 4;

RLCore.resolveStats = function (ship, owned, vb, level) {
  const v = RLCore.clampVoidbirth(vb);
  const lv = Math.max(1, level || 1);
  const eff = o => {
    const u = RLCore.byId(o.id);
    return u ? RLCore.effectiveEffect(u, v) : null;
  };
  const apotheosis = owned.some(o => { const e = eff(o); return e && e.apotheosis === true; });
  const dup = apotheosis ? 2 : 1;

  const sum = key => owned.reduce((acc, o) => {
    const e = eff(o); const val = e && e[key];
    return acc + (typeof val === 'number' ? val * o.stacks * dup : 0);
  }, 0);
  const has = key => owned.some(o => { const e = eff(o); return e && e[key] === true; });
  const max = key => owned.reduce((acc, o) => {
    const e = eff(o); const val = e && e[key];
    return typeof val === 'number' ? Math.max(acc, val) : acc;
  }, 0);

  // Fire rate is an interval in frames, so a bonus divides rather than
  // multiplies. Clamped above -0.9 because a few cards trade fire rate away
  // for size or damage, and a sum reaching -1 would divide by zero.
  const rate = RLCore.BASE_FIRE_RATE * ship.fireMul / Math.max(0.1, 1 + sum('fireRateMul'));

  return {
    fireRate: Math.max(RLCore.MIN_FIRE_RATE, rate),
    // Damage rides the same depth curve enemy health does, so your build is a
    // MULTIPLE of the baseline rather than a footrace against it. Without
    // this, a 1,000 HP first boss and a 1,000,000,000 HP Mothership cannot
    // both be true in one game. See RLCore.baseDamageAt.
    damage: RLCore.baseDamageAt(lv) * (1 + sum('damageMul')),
    speed: ship.speed * (1 + sum('speedMul')),
    // Floored: TIGHT BARREL's lineage scales hard with depth, and a negative
    // spread does not mean "very tight", it means the fan crosses over itself
    // and the shot pattern inverts. Every sibling stat has a floor; this one
    // was missing its own.
    spread: Math.max(0.06, ship.spreadMul * (1 + sum('spreadMul'))),
    hitScale: Math.max(0.4, 1 + sum('hitScaleMul')),
    bulletSpeedMul: 1 + sum('bulletSpeedMul'),
    shieldCharges: Math.min(RLCore.MAX_SHIELD_CHARGES, sum('shieldCharges')),
    extraShots: sum('extraShots'),
    extraLives: Math.min(RLCore.REPAIR_KIT_MAX, sum('lives')) + sum('extraLife'),
    scrapMul: 1 + sum('scrapMul'),
    scrapPerLevel: sum('scrapPerLevel'),
    scrapPerSecond: max('scrapPerSecond'),
    critChance: Math.min(1, sum('critChance')),
    critMul: 2 + max('critMul'),
    bossDamageMul: 1 + sum('bossDamageMul'),
    aimCone: max('aimCone'),
    pierce: sum('pierce'),
    homing: max('homing'),
    splash: max('splash'),
    burn: max('burn'),
    chill: max('chill'),
    ricochet: max('ricochet'),
    execute: max('execute'),
    verdict: max('verdict'),
    shieldRegen: max('shieldRegen'),
    shieldPerKills: max('shieldPerKills'),
    shieldRefund: max('shieldRefund'),
    shieldIframes: max('shieldIframes'),
    graceSeconds: max('graceSeconds'),
    overcharge: max('overcharge'),
    lifePerKills: max('lifePerKills'),
    reviveOnDeath: max('reviveOnDeath'),
    drones: sum('drones'),
    chain: max('chain'),
    fortress: max('fortress'),
    singularityCount: has('singularity') ? Math.max(1, max('singularityCount')) : 0,
    chronostall: max('chronostall'),
    priceDiscount: Math.min(0.6, sum('priceDiscount')),
    shopSlots: RLCore.BASE_SHOP_SLOTS + sum('shopSlots'),
    freeRerolls: sum('freeRerolls'),
    // A hit costs scrap now, not an upgrade. ABSOLUTION zeroes it; GREED
    // ENGINE deepens it (it used to read "hits cost two upgrades").
    scrapLoss: has('noStrip') ? 0
      : (sum('strips') > 0 ? RLCore.GREED_SCRAP_LOSS : RLCore.HIT_SCRAP_LOSS),
    enemyBulletMul: Math.max(0.25, 1 + sum('enemyBulletMul')),
    // --- the second catalogue's keys ---------------------------------------
    magnetRange: max('magnetRange'),
    dropBonus: sum('dropBonus'),
    contactDamage: max('contactDamage'),
    bulletSize: 1 + sum('bulletSize'),
    slowField: Math.min(0.97, max('slowField')),
    revengeShots: max('revengeShots'),
    startScrap: sum('startScrap'),
    luck: sum('luck'),
    overkill: max('overkill'),
    // SECRET's two screen-level jokes. Both are read by the renderer.
    upsideDown: has('upsideDown'),
    mirrored: has('mirrored'),
    split: has('split'),
    rear: has('rear'),
    sides: has('sides'),
    tracer: has('tracer'),
    thorns: has('thorns'),
    needle: has('needle'),
    dronesCopyGun: has('dronesCopyGun'),
    phaseDrive: has('phaseDrive'),
    twinCore: has('twinCore'),
    apotheosis: apotheosis,
    singularity: has('singularity')
  };
};

// ---------------------------------------------------------------------------
// ECONOMY
// ---------------------------------------------------------------------------

// Credits buy ships, and ships are the only thing that persists between runs,
// so this is the slowest tap in the game on purpose. It is also COMPRESSIVE
// above the knee: a run that scores ten times as much does not earn ten times
// the credits, because the point of the hangar is that it takes many runs to
// fill rather than one very good one.
RLCore.CREDIT_DIVISOR = 300;
RLCore.CREDIT_KNEE = 50000;
RLCore.CREDIT_TAIL = 900;

RLCore.creditsForScore = function (score) {
  const s = Math.max(0, score || 0);
  if (s <= RLCore.CREDIT_KNEE) return Math.floor(s / RLCore.CREDIT_DIVISOR);
  const base = RLCore.CREDIT_KNEE / RLCore.CREDIT_DIVISOR;
  return Math.floor(base + (s - RLCore.CREDIT_KNEE) / RLCore.CREDIT_TAIL);
};

// Scrap deliberately ignores the combo multiplier: score keeps it, so combo
// stays a scoring skill. If scrap scaled with combo, a hot streak would hand
// out an APEX while a cold run could not afford a common.
//
// Income rises with depth so that thinning shops (see shopEvery) do not also
// mean thinning purchasing power -- fewer visits, each one worth more.
// Tightened, but only by a notch: the exponent drops from 0.55 to 0.50 and a
// flat 0.8 comes off the top, so income at depth is roughly three-quarters of
// what it was. Enough that a shop is a decision again; not so much that the
// deep game starves.
RLCore.SCRAP_RATE = 0.8;
RLCore.SCRAP_DEPTH_EXPONENT = 0.50;

RLCore.scrapForKill = function (points, scrapMul, level) {
  const depth = Math.pow(Math.max(1, level || 1), RLCore.SCRAP_DEPTH_EXPONENT);
  return Math.max(1, Math.round(points * scrapMul * depth * RLCore.SCRAP_RATE));
};

// ---------------------------------------------------------------------------
// THE COST OF A HIT
// ---------------------------------------------------------------------------
// It used to strip an upgrade. That punished the thing you had spent the run
// building and, worse, it punished it silently -- you would look up two hits
// later and your gun was gone. Losing scrap hurts just as much in the moment
// and leaves the build you earned intact, so a bad level costs you the NEXT
// shop rather than the last one.
RLCore.HIT_SCRAP_LOSS = 0.50;
RLCore.GREED_SCRAP_LOSS = 0.75;   // GREED ENGINE's downside, was "two upgrades"

RLCore.scrapAfterHit = function (scrap, fraction) {
  const f = Math.min(1, Math.max(0, fraction === undefined ? RLCore.HIT_SCRAP_LOSS : fraction));
  return Math.floor(Math.max(0, scrap || 0) * (1 - f));
};

RLCore.rerollCost = function (uses) { return 300 * Math.pow(2, uses); };

RLCore.priceFor = function (tierId, priceDiscount) {
  const base = RLCore.tierOf(tierId).price;
  return Math.max(1, Math.round(base * (1 - Math.min(0.6, priceDiscount || 0))));
};

// Firing pattern: the two base shots fly parallel until WIDE MOUNT adds more,
// at which point the whole pattern fans out (narrower with TIGHT BARREL).
RLCore.buildShots = function (s) {
  if (s.needle) return [{ dx: 0, dy: -10, a: 0, needle: true }];
  const n = 2 + s.extraShots;
  const step = 0.085 * s.spread;
  const fan = s.extraShots > 0;
  const shots = [];
  // Centre the pattern on straight-up and keep its total width at 20px, so
  // the muzzles stay on the hull no matter how many shots there are.
  for (let i = 0; i < n; i++) {
    const off = i - (n - 1) / 2;
    shots.push({ dx: off * (n > 1 ? 20 / (n - 1) : 0), dy: -10, a: fan ? off * step : 0 });
  }
  if (s.rear)  shots.push({ dx: -6, dy: 12, a: Math.PI }, { dx: 6, dy: 12, a: -Math.PI });
  if (s.sides) shots.push({ dx: -14, dy: 0, a: -Math.PI / 2 }, { dx: 14, dy: 0, a: Math.PI / 2 });
  return s.twinCore ? shots.concat(shots.map(x => ({ dx: x.dx * 0.6, dy: x.dy + 4, a: x.a }))) : shots;
};

// ---------------------------------------------------------------------------
// ENEMY FIRING ARCS
// ---------------------------------------------------------------------------
// The fix for "they hit me from the side and I can't do anything about it":
// past level 15 a shooting enemy may only fire within a cone of straight-down,
// so it has to commit to your column first. That commitment is a telegraph,
// and a telegraph is something you can read and punish.

RLCore.ARC_FROM_LEVEL = 15;
RLCore.ARC_HALF_ANGLE = 0.70;   // ~40 degrees
RLCore.ARC_KINDS = ['drifter', 'lancer'];

RLCore.canFireAt = function (beh, level, angleFromDown) {
  if (level < RLCore.ARC_FROM_LEVEL) return true;
  if (RLCore.ARC_KINDS.indexOf(beh) === -1) return true;
  return Math.abs(angleFromDown) <= RLCore.ARC_HALF_ANGLE;
};

// ===== SAVE =====

const Save = {
  KEY: 'voidrunner.save',
  VERSION: RLCore.SAVE_VERSION,
  ok: true,
  data: null,

  defaults() {
    return {
      version: RLCore.SAVE_VERSION,
      hiScore: 0, bestLevel: 1, totalRuns: 0, totalKills: 0,
      credits: 0, unlocked: ['vanguard'], selectedShip: 'vanguard', muted: false,
      bestScrapSpent: 0, apexFound: 0,
      voidbirths: 0, bestVoidbirth: 0, tiersFound: {}, bossesKilled: {},
      seenUpgrades: {}, seenEnemies: {}, seenMeteors: {},
      settings: RLCore.defaultSettings()
    };
  },

  load() {
    Save.data = Save.defaults();
    try {
      const raw = localStorage.getItem(Save.KEY);
      if (raw) {
        const { data, ok } = RLCore.migrateSave(JSON.parse(raw), Save.defaults());
        Save.data = data;
        if (!CFG.ships.some(s => s.id === Save.data.selectedShip)) Save.data.selectedShip = 'vanguard';
        // Only persist over the stored bytes when migration actually recognized
        // the save. An unrecognized version runs on defaults for this session
        // but leaves the original data untouched, so it stays recoverable by a
        // later version or by hand rather than being silently overwritten.
        if (ok) Save.write();
      }
    } catch (e) {
      Save.ok = false;
      Save.data = Save.defaults();
    }
  },

  write() {
    try {
      localStorage.setItem(Save.KEY, JSON.stringify(Save.data));
    } catch (e) {
      Save.ok = false;
    }
  }
};

Save.load();

// ===== AUDIO =====
// Everything here is synthesized at runtime — no asset files, so the game stays
// a single portable document. If the AudioContext can't be created the module
// goes inert and the game runs silent rather than failing.

// SFX is declared further down, alongside the music engine. Sound.play reads
// it by reference at call time — long after the whole script has evaluated —
// so the forward reference is safe.

const Sound = {
  ctx: null, master: null, sfxBus: null,
  attackBus: null, ambientBus: null, musicBus: null,

  // Which sounds are "attacks" for the purposes of the volume sliders.
  // Everything else -- menus, level cues, tier reveals, pickups -- is ambient.
  ATTACK: ['laser', 'hit', 'explode', 'bigExplode', 'shieldBreak', 'death',
           'enemyShot', 'meteorImpact', 'plateBreak', 'strip', 'warning'],
  dead: false, muted: Save.data.muted,
  noiseBuf: null,
  voiceEnds: [], MAX_VOICES: 12,

  // Browsers refuse to start audio before a user gesture, so this is called
  // from the first keydown / pointer event rather than at load.
  unlock() {
    if (Sound.ctx || Sound.dead) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { Sound.dead = true; return; }
      Sound.ctx = new AC();

      // Compressor on the way out so stacked explosions duck instead of clipping.
      const comp = Sound.ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 12;
      comp.ratio.value = 6;
      comp.attack.value = 0.004;
      comp.release.value = 0.18;
      comp.connect(Sound.ctx.destination);

      Sound.master = Sound.ctx.createGain();
      Sound.master.gain.value = Sound.muted ? 0 : 1;
      Sound.master.connect(comp);

      // Three independent buses so the settings panel can turn the music
      // down without also turning the guns down. `sfxBus` is a POINTER that
      // Sound.play swaps before dispatching: tone() and noise() read it at
      // call time, so every generator lands on the right bus without any of
      // them having to know which bus they are on.
      Sound.attackBus = Sound.ctx.createGain();
      Sound.attackBus.gain.value = 1.3;
      Sound.attackBus.connect(Sound.master);

      Sound.ambientBus = Sound.ctx.createGain();
      Sound.ambientBus.gain.value = 1.3;
      Sound.ambientBus.connect(Sound.master);

      Sound.musicBus = Sound.ctx.createGain();
      Sound.musicBus.gain.value = 1.0;
      Sound.musicBus.connect(Sound.master);

      Sound.sfxBus = Sound.ambientBus;
      Sound.applySettings();

      // One second of white noise, reused by every percussive sound.
      const len = Math.floor(Sound.ctx.sampleRate);
      const buf = Sound.ctx.createBuffer(1, len, Sound.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
      Sound.noiseBuf = buf;

      Music.init();
      if (Sound.ctx.state === 'suspended') Sound.ctx.resume();
    } catch (e) {
      Sound.dead = true;
      Sound.ctx = null;
    }
  },

  setMuted(m) {
    Sound.muted = m;
    if (!Sound.master) return;
    // Ramped rather than set outright: writing gain.value directly is a step
    // discontinuity in the waveform, which is an audible click on every mute
    // and unmute. 15ms is short enough to feel instant and long enough not
    // to pop.
    const g = Sound.master.gain, now = Sound.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(m ? 0 : 1, now + 0.015);
  },

  ready() { return !!Sound.ctx && !Sound.dead; },

  // Voice limiting by scheduled end time rather than by an 'ended' event.
  // An event that never fires would leak the counter and silence the game
  // permanently; expired end times always clear themselves.
  claimVoice(endTime) {
    const now = Sound.ctx.currentTime;
    Sound.voiceEnds = Sound.voiceEnds.filter(t => t > now);
    if (Sound.voiceEnds.length >= Sound.MAX_VOICES) return false;
    Sound.voiceEnds.push(endTime);
    return true;
  },

  tone(freq, dur, type, gain, freqEnd, delay) {
    if (!Sound.ready()) return;
    const t = Sound.ctx.currentTime + (delay || 0);
    if (!Sound.claimVoice(t + dur)) return;
    const o = Sound.ctx.createOscillator();
    const g = Sound.ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t + dur);
    // The attack must fit inside the sound. For a very short `dur` the two
    // ramps would otherwise be scheduled out of order and the envelope is
    // undefined — no current call site is that short, but uiMove at 0.05s is
    // only eight times the attack, so the guard is cheap insurance.
    const attack = Math.min(0.006, dur * 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(Sound.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise(dur, filtFreq, gain, filtEnd, delay) {
    if (!Sound.ready() || !Sound.noiseBuf) return;
    const t = Sound.ctx.currentTime + (delay || 0);
    if (!Sound.claimVoice(t + dur)) return;
    const s = Sound.ctx.createBufferSource();
    s.buffer = Sound.noiseBuf;
    // The buffer is exactly one second long. Without looping, any request
    // longer than that ended silently at 1.0s while claimVoice still held a
    // slot for the full duration — so the sound was truncated AND it blocked
    // one of only twelve voices for the rest of its nominal life. The
    // voidbirth riser asks for 1.9s and was getting 1.0.
    s.loop = true;
    const f = Sound.ctx.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.setValueAtTime(filtFreq, t);
    if (filtEnd) f.frequency.exponentialRampToValueAtTime(Math.max(30, filtEnd), t + dur);
    const g = Sound.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(Sound.sfxBus);
    s.start(t); s.stop(t + dur);
  },

  // Reads the saved settings and pushes them into the three buses. Safe to
  // call before unlock(): it simply does nothing until the graph exists.
  applySettings() {
    if (!Sound.ctx) return;
    const st = (Save.data && Save.data.settings) || RLCore.defaultSettings();
    const set = (node, v, scale) => {
      if (!node) return;
      const g = node.gain, now = Sound.ctx.currentTime;
      g.cancelScheduledValues(now);
      g.setValueAtTime(g.value, now);
      g.linearRampToValueAtTime(Math.max(0.0001, v * scale), now + 0.03);
    };
    set(Sound.attackBus, st.volAttack, 1.6);
    set(Sound.ambientBus, st.volAmbient, 1.6);
    set(Sound.musicBus, st.volMusic, 1.4);
  },

  play(name) {
    if (!Sound.ready()) return;
    // Route before dispatching. See the bus comment in unlock().
    Sound.sfxBus = (Sound.ATTACK.indexOf(name) !== -1 ? Sound.attackBus : Sound.ambientBus) || Sound.master;
    // The SFX table takes precedence over the built-in switch, so a rebuilt
    // sound overrides the original without either having to know about the
    // other. Unknown names fall through and do nothing, as before.
    const custom = SFX[name];
    if (custom) { custom(); return; }
    switch (name) {
      case 'laser':
        Sound.tone(900, 0.08, 'square', 0.10, 240);
        break;
      case 'enemyShot':
        // Deliberately duller and lower than the player's laser, so a screen
        // full of fire still tells you who is shooting.
        Sound.tone(320, 0.09, 'sawtooth', 0.07, 150);
        Sound.noise(0.05, 1400, 0.05, 400);
        break;
      case 'pickup':
        // Two rising partials, so a handful of drops arpeggiates instead of
        // machine-gunning the same blip.
        Sound.tone(660, 0.09, 'triangle', 0.13, 1180);
        Sound.tone(990, 0.13, 'sine', 0.08, 1760, 0.03);
        break;
      case 'hit':
        Sound.noise(0.05, 3200, 0.22, 700);
        break;
      case 'explode':
        Sound.noise(0.34, 1400, 0.40, 70);
        Sound.tone(130, 0.28, 'sawtooth', 0.14, 42);
        break;
      case 'bigExplode':
        Sound.noise(0.85, 1000, 0.42, 40);
        Sound.tone(85, 0.7, 'sawtooth', 0.16, 26);
        Sound.noise(0.5, 400, 0.2, 30, 0.12);
        break;
      case 'shieldBreak':
        Sound.tone(1500, 0.28, 'triangle', 0.18, 320);
        Sound.noise(0.16, 5200, 0.14, 1100);
        break;
      case 'death':
        Sound.tone(440, 0.9, 'sawtooth', 0.22, 55);
        break;
      case 'warning':
        for (let i = 0; i < 3; i++) {
          Sound.tone(330, 0.28, 'square', 0.11, null, i*0.6);
          Sound.tone(247, 0.28, 'square', 0.11, null, i*0.6 + 0.3);
        }
        break;
      case 'levelUp':
        [523.25, 659.25, 783.99].forEach(f => Sound.tone(f, 0.45, 'triangle', 0.12));
        break;
      case 'apex':
        Sound.tone(880, 0.5, 'sawtooth', 0.16, 1760);
        Sound.tone(1320, 0.7, 'triangle', 0.12, 2640, 0.08);
        break;
      // Heavy, mechanical, and low — the clamps landing should feel like
      // tonnage rather than a UI beep.
      case 'dock':
        Sound.noise(0.18, 900, 0.28, 120);
        Sound.tone(96, 0.34, 'square', 0.20, 60);
        Sound.tone(64, 0.5, 'sine', 0.16, 40, 0.06);
        break;
      // One card coming off the build. Short, downward, slightly sour.
      case 'strip':
        Sound.tone(420, 0.16, 'sawtooth', 0.13, 120);
        Sound.noise(0.09, 1800, 0.10, 400);
        break;
      // A boss changing gear. Two hard stabs and a rising tail.
      case 'bossPhase':
        Sound.tone(220, 0.30, 'sawtooth', 0.20, 880);
        Sound.tone(330, 0.34, 'square',   0.14, 1320, 0.07);
        Sound.noise(0.24, 2400, 0.16, 300);
        break;
      // The ascension. A rising stack of fifths under a long swell.
      case 'voidbirth':
        [110, 165, 220, 330, 440].forEach((f, i) =>
          Sound.tone(f, 1.6 - i * 0.12, i < 2 ? 'sawtooth' : 'triangle', 0.13, f * 4, i * 0.13));
        Sound.noise(1.9, 300, 0.16, 2800, 0.2);
        break;
      case 'uiMove':
        Sound.tone(680, 0.05, 'square', 0.08);
        break;
      case 'uiBuy':
        [523.25, 783.99].forEach((f, i) => Sound.tone(f, 0.14, 'triangle', 0.16, null, i*0.09));
        break;
      case 'uiDeny':
        Sound.tone(180, 0.12, 'square', 0.10, 120);
        break;
    }
  }
};

// Procedural soundtrack: a 16-step sequencer scheduled ahead of the audio clock,
// so it never depends on the render loop's timing.
// ---- audio pack ----
// ===== VOID RUNNER — SOUNDTRACK + SFX ======================================
// Everything below is synthesised at runtime with the Web Audio API. No assets,
// no dependencies, no network. Two top-level bindings only: `Music` and `SFX`.
//
// `Music` is a five-voice lookahead sequencer (sub / bass / pad / lead / drums)
// with six themes selected by depth, plus a per-boss motif bank.
// `SFX` is a table of one-shot builders; `Sound.play(name)` consults it first,
// so any name here overrides the built-in switch.
//
// Two invariants matter more than anything else in this file:
//   1. Every node that is start()ed is also stop()ped, on the same call, with
//      an absolute time. Nothing is ever left running.
//   2. Nothing throws when Sound.ready() is false — the game boots with audio
//      locked until the first user gesture.

// ---------------------------------------------------------------------------
// MUSIC
// ---------------------------------------------------------------------------
// Scheduling model: a 25ms setInterval walks a 16-step bar and schedules any
// step whose time falls inside a 150ms lookahead window. Timing therefore lives
// on the audio clock, not the render loop, and survives a stalled main thread.
//
// `wanted` = a run wants music. `playing` = it is actually being scheduled.
// Mute separates the two: muting stops scheduling outright (and kills the
// interval, so a muted game does literally no audio work), and unmuting rebases
// nextTime onto the audio clock so the silent gap is never replayed as a
// backlog of notes all landing in the same millisecond.

const Music = {
  // ---- public state (the game reads/writes none of this directly, but the
  // wanted/playing distinction is part of the contract) ----
  bus: null, playing: false, timer: null,
  wanted: false,
  step: 0, bar: 0, nextTime: 0,
  level: 1, boss: false,

  // ---- internals ----

  _bossKey: '',         // last boss key seen on the live `boss` global
  _bossPhase: 0,        // last phase seen; a change is a transition, not a restart
  _fill: false,         // "play a crash + tom fill at the top of the next bar"
  _stab: false,         // "play a phase-change stab at the very next step"
  _errors: 0,           // scheduling exceptions swallowed (harness asserts 0)
  _base: 0.20,          // resting bus gain; voidbirth ducks and restores this

  // ------------------------------------------------------------------ set-up
  init: function () {
    if (!Sound.ready() || Music.bus) return;
    var c = Sound.ctx;
    // Deliberately well under the SFX bus — the track is a bed, not the focus.
    Music.bus = c.createGain();
    Music.bus.gain.value = Music._base;
    // A gentle lowpass sits the whole bed behind the gameplay sounds without
    // having to turn it down until it disappears.
    var lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 9500;
    Music.bus.connect(lp);
    lp.connect(Sound.musicBus || Sound.master);

    function g(v) { var n = c.createGain(); n.gain.value = v; n.connect(Music.bus); return n; }
    Music._v = { sub: g(1), bass: g(1), pad: g(1), lead: g(1), drum: g(1), arp: g(1) };
    Music._applyMix(Music._theme());
  },

  start: function () {
    Music.wanted = true;
    if (!Sound.ready() || !Music.bus) return;
    Music.playing = !Sound.muted;
    Music.step = 0; Music.bar = 0;
    Music._themeKey = ''; Music._bossKey = ''; Music._bossPhase = 0;
    Music._fill = false; Music._stab = false;
    Music.nextTime = Sound.ctx.currentTime + 0.08;
    if (Music.playing) Music._arm();

  stop: function () {
    Music.wanted = false;
    Music.playing = false;
    Music._disarm();
  },

  // Muting stops scheduling outright rather than only zeroing the output gain,
  // so a muted game does no audio work at all — the interval is torn down too.
  // Unmuting picks the track up where it was and rebases nextTime onto the
  // audio clock, so the silent gap is not scheduled as a backlog of notes all
  // landing at once.
  setMuted: function (m) {
    if (m) { Music.playing = false; Music._disarm(); return; }
    if (!Music.wanted || !Sound.ready() || !Music.bus) return;
    Music.playing = true;
    Music.nextTime = Sound.ctx.currentTime + 0.08;
    Music._arm();
  },

  setIntensity: function (lv) {
    Music.level = lv;
  },

  // A boss starting or ending is a transition: the bar count keeps running and
  // the next downbeat gets a crash fill. Nothing restarts.
  setBoss: function (b) {
    b = !!b;
    if (b !== Music.boss) Music._fill = true;
    Music.boss = b;
    if (!b) { Music._bossKey = ''; Music._bossPhase = 0; }

  _arm: function () {
    if (!Music.timer) Music.timer = setInterval(Music.tick, Music.TICK_MS);
  },
  _disarm: function () {
    if (Music.timer) { clearInterval(Music.timer); Music.timer = null; }

  // ------------------------------------------------------------- theme + time
  // One theme per band, so the track changes every ten levels in step with
  // the sky and the enemy roster. Past level 100 the bands cycle and the
  // music cycles with them — you are always somewhere, and somewhere always

  BAND_TRACKS: ['drift', 'belt', 'raider', 'coalition', 'rime', 'deep', 'hive', 'siege', 'silence', 'war'],

  _theme: function () {
    if (Music.boss) return Music.THEMES.boss;
    var lv = Music.level | 0;
    var band = RLCore.bandIndex(lv);
    var key = Music.BAND_TRACKS[band] || 'drift';
    return Music.THEMES[key] || Music.THEMES.drift;
  },

  _bossDef: function () {
    return Music.BOSSES[Music._bossKey] || Music.BOSSES.generic;
  },

  stepDur: function () {
    var th = Music._theme();
    var bpm = th.bpm;
    if (Music.boss) {
      bpm = Music._bossDef().bpm;
      // Each phase leans on the accelerator a little.
      bpm += Math.min(4, Math.max(0, Music._bossPhase - 1)) * 3;

  _liveBoss: function () {

  // same bar number always sounds identical — variation that reads as

  _h: function (a, b) {

    // worse than dropping it: it lands as one loud cluster.

    var root = th.root * Math.pow(2, shift / 12);

    var half = (th.key === 'war') && ((bar % 8) >= 6);

    // downbeat and lands a crash + tom fill there.

      Music._stabHit(t, root);

      Music._crash(t, 1.5, 0.30);

      Music._tom(t + dur * 3, root * 3, 0.20);

    // ---- drums -------------------------------------------------------------
    var k = kickP.charAt(step);
    if (k !== '.') Music._kick(t, k === 'x' ? 1 : 0.6, th.key === 'silence');
    var s = snareP.charAt(step);
    if (s !== '.') Music._snare(t, s === 'x' ? 1 : 0.55);
    var h = hatP.charAt(step);
    if (h !== '.') {
      var acc = 0.55 + Music._h(bar, step) * 0.35;
      Music._hat(t, h === 'x' ? acc : acc * 0.55, false);

    if (th.open && th.open.charAt(step) !== '.') Music._hat(t, 0.30, true);
